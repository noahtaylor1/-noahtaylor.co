  <style>
    .configurator-wrap { display:flex; flex-direction:column; }
    #canvas-container {
      width:100%; height:72vh; min-height:460px;
      background:#f2f1ed; cursor:grab; position:relative; user-select:none;
    }
    #canvas-container:active { cursor:grabbing; }
    #three-canvas { display:block; width:100%!important; height:100%!important; }
    .canvas-hint {
      position:absolute; bottom:14px; right:18px;
      font-size:11px; color:#c0bdb8; letter-spacing:0.06em;
      text-transform:uppercase; pointer-events:none;
    }
    .project-label { position:absolute; top:20px; left:28px; pointer-events:none; }
    .project-label h1 { font-size:20px; font-weight:400; letter-spacing:-0.01em; color:#1a1a1a; margin-bottom:3px; }
    .project-label p  { font-size:12px; color:#bbb; letter-spacing:0.03em; }
    .controls-bar { display:flex; border-bottom:1px solid #e5e5e5; flex-wrap:wrap; }
    .ctrl { flex:1; min-width:160px; padding:20px 32px; border-right:1px solid #e5e5e5; }
    .ctrl:last-child { border-right:none; }
    .ctrl-label {
      font-size:11px; text-transform:uppercase; letter-spacing:0.1em;
      color:#aaa; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
    }
    .ctrl-label span { font-size:14px; color:#1a1a1a; letter-spacing:0; text-transform:none; font-variant-numeric:tabular-nums; }
    input[type="range"] {
      width:100%; height:2px; appearance:none; background:#e0e0e0; outline:none; cursor:pointer; border-radius:2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance:none; width:14px; height:14px; border-radius:50%; background:#1a1a1a; cursor:pointer;
    }
    .cutsheet { padding:40px 48px 80px; }
    .cutsheet h2 { font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:#aaa; margin-bottom:24px; }
    .cut-table { width:100%; max-width:560px; border-collapse:collapse; }
    .cut-table th {
      font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:#aaa;
      font-weight:400; text-align:left; padding:0 20px 10px 0; border-bottom:1px solid #e5e5e5;
    }
    .cut-table td { padding:12px 20px 12px 0; border-bottom:1px solid #f2f2f2; font-size:14px; color:#333; }
    .tag-pill {
      display:inline-flex; align-items:center; justify-content:center;
      width:24px; height:24px; border-radius:50%; background:#111; color:#fff; font-size:10px; font-weight:600;
    }
    .divider-row td { border-top:1px solid #e5e5e5; border-bottom:none; padding-top:16px; color:#888; font-size:13px; }
    @media (max-width:768px) {
      .ctrl { padding:16px 20px; }
      .cutsheet { padding:28px 20px 60px; }
    }
  </style>

<div class="configurator-wrap">

    <canvas id="three-canvas"></canvas>
    <div class="project-label"><h1>Nodes</h1><p>Parametric Configurator</p></div>

  <div class="controls-bar">

    <div class="ctrl">
      <div class="ctrl-label">Width <span><span id="val-W">80</span> cm</span></div>

    </div>
    <div class="ctrl">
      <div class="ctrl-label">Height <span><span id="val-H">70</span> cm</span></div>

    </div>

  <div class="cutsheet">

<script>
// ─────────────────────────────────────────────────────────────────────────────
// TOPOLOGY — derived directly from the OBJ (Paint nodes only, Plaster dowels)
//
// Normalized positions (u,v,w) ∈ [0,1]³ from Paint node bounding box:
//   X: 228.7 → 249.8  (XR = 21.1)
//   Y: 294.1 → 309.9  (YR = 15.8)
//   Z: −247.7 → −226.7 (ZR = 21.0)
// ─────────────────────────────────────────────────────────────────────────────
const XMIN=228.7, XR=21.1, YMIN=294.1, YR=15.8, ZMIN=-247.7, ZR=21.0;

// id → {u, v, w}  — 11 Paint connector nodes from OBJ
const NODES = {};
[
  [7,  0.9194, 0.0063, 0.0905],  // bottom-right-back
  [8,  0.1137, 0.0316, 0.1048],  // bottom-left-back
  [9,  0.9100, 0.0000, 0.9190],  // bottom-right-front
  [10, 0.1137, 0.0506, 0.9286],  // bottom-left-front
  [11, 0.3412, 0.4937, 0.7095],  // mid crossing
  [12, 0.6872, 0.4557, 0.5524],  // mid crossing
  [13, 1.0000, 1.0000, 0.0000],  // top-right-back
  [14, 0.0047, 1.0000, 0.0095],  // top-left-back
  [15, 0.4455, 0.6013, 0.3048],  // mid crossing
  [16, 0.0000, 0.9747, 0.9762],  // top-left-front
  [40, 0.9905, 1.0000, 1.0000],  // top-right-front
].forEach(([id,u,v,w]) => { NODES[id] = {u,v,w}; });

// 23 Plaster dowel connections — read directly from OBJ component topology
// Each entry: [plasterIdx, nodeA, nodeB]
const LEGS = [
  [28,13, 7],   // vertical right-back
  [29,14, 8],   // vertical left-back
  [30,40, 9],   // vertical right-front
  [31,10,16],   // vertical left-front
];
const BRACES = [
  [17,10,11], [18, 8,11], [19, 9,12], [20,11,12],
  [21,15, 8], [22, 9,12], [23, 7,12], [24,11,10],
  [25, 8,15], [26, 7,15], [27,12,15], [32,15,14],
  [33,40,12], [34,16,11], [35,13,12], [36,13,15],
  [37,14,15], [38,12,40], [39,11,16],
];
const ALL_CONN = [...LEGS, ...BRACES];

// Build adjacency map: nodeId → Set of connected nodeIds
const ADJ = {};
for (const id of Object.keys(NODES)) ADJ[+id] = new Set();
for (const [,na,nb] of ALL_CONN) {
  ADJ[na].add(nb);
  ADJ[nb].add(na);
}

// ─────────────────────────────────────────────────────────────────────────────
// PHYSICAL DIMENSIONS  — FIXED, do not scale with L/W/H sliders
// Matching OBJ proportions: tube radius ≈ 6.9% of default span
// ─────────────────────────────────────────────────────────────────────────────
const TUBE_R  = 4.5;   // cm — dowel & arm stub radius
const NODE_R  = 9.0;   // cm — node core sphere (2× TUBE_R → large blobby MultiPipe knuckle)
const ARM_LEN = 1.5;   // cm — short arm stub; big sphere does the blob work

// ─────────────────────────────────────────────────────────────────────────────
// THREE.JS
// ─────────────────────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const canvas    = document.getElementById('three-canvas');

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0xf2f1ed);

const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 10000);

// Studio-quality lighting
const hemi = new THREE.HemisphereLight(0xfff8f0, 0xd0c8b8, 0.55);
scene.add(hemi);
const sun  = new THREE.DirectionalLight(0xfffaf5, 1.4);
sun.position.set(3, 5, 3);
sun.castShadow = true;
sun.shadow.mapSize.width  = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far  = 2000;
sun.shadow.camera.left = sun.shadow.camera.bottom = -300;
sun.shadow.camera.right = sun.shadow.camera.top = 300;
sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xd8eaff, 0.45);
fill.position.set(-3, 1, -2); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffeedd, 0.20);
rim.position.set(0, -1.5, -3); scene.add(rim);

// Materials — white 3D-printed nodes contrast against warm honey-wood dowels
const MAT_NODE  = new THREE.MeshLambertMaterial({ color: 0xf0ede8 });           // 3D-printed connector: clean warm white
const MAT_DOWEL = new THREE.MeshLambertMaterial({ color: 0xc8a96e });           // timber dowel: warm honey oak
const MAT_TOP   = new THREE.MeshLambertMaterial({ color: 0xddeeff, transparent:true, opacity:0.14, side:THREE.DoubleSide });

// ─────────────────────────────────────────────────────────────────────────────
// GEOMETRY HELPERS
// ─────────────────────────────────────────────────────────────────────────────
const _YUP = new THREE.Vector3(0, 1, 0);

// Cylinder from point A to point B, given radius and material
function cylAB(pA, pB, r, mat) {
  const d   = new THREE.Vector3().subVectors(pB, pA);
  const len = d.length();
  if (len < 0.01) return null;
  const geo  = new THREE.CylinderGeometry(r, r, len, 12, 1);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pA).addScaledVector(d.normalize(), len * 0.5);
  mesh.quaternion.setFromUnitVectors(_YUP, d);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

// ─────────────────────────────────────────────────────────────────────────────
// NODE POSITION
// ─────────────────────────────────────────────────────────────────────────────
function nodePos(id, L, W, H) {
  const n = NODES[id];
  return new THREE.Vector3((n.u - 0.5)*W, n.v*H, (n.w - 0.5)*L);
}

function allPositions(L, W, H) {
  const m = {};
  for (const id of Object.keys(NODES)) m[+id] = nodePos(+id, L, W, H);
  return m;
}

// ─────────────────────────────────────────────────────────────────────────────
// MULTIPIPE-STYLE NODE  — sphere core + same-radius arm stubs toward each connection
//
// Key: arm radius = TUBE_R exactly → seamless flush join with dowel.
//      sphere radius = NODE_R (1.28×) → bulges slightly, creating organic rounded knuckle.
//      Result mimics MultiPipe's smooth blob at multi-curve junctions.
// ─────────────────────────────────────────────────────────────────────────────
function buildNode(id, positions) {
  const group = new THREE.Group();
  const myPt  = positions[id];

  // Core sphere — same material as arms/dowel ends
  const core = new THREE.Mesh(new THREE.SphereGeometry(NODE_R, 20, 14), MAT_NODE);
  core.castShadow = true; core.receiveShadow = true;
  group.add(core);

  // One arm stub per connection — flares from sphere surface out to dowel-width tip.
  // radiusBottom (at sphere end) > radiusTop (at dowel end) → organic skirt merging into sphere blob.
  for (const nid of ADJ[id]) {
    const otherPt = positions[nid];
    if (!otherPt) continue;
    const dir = new THREE.Vector3().subVectors(otherPt, myPt).normalize();
    // Arm length: from sphere surface (NODE_R from centre) to ARM_LEN past that
    const armLen = ARM_LEN + NODE_R * 0.25;  // short stub that emerges from sphere
    const arm    = new THREE.Mesh(
      // top=tip (toward dowel) matches TUBE_R for flush join; bottom=base flares 1.5× for blob skirt
      new THREE.CylinderGeometry(TUBE_R, TUBE_R * 1.5, armLen, 14, 1),
      MAT_NODE
    );
    // Position: arm centre is (NODE_R + armLen*0.5) from node centre
    arm.position.copy(dir.clone().multiplyScalar(NODE_R + armLen * 0.5));
    arm.quaternion.setFromUnitVectors(_YUP, dir);
    arm.castShadow = true; arm.receiveShadow = true;
    group.add(arm);
  }

  group.position.copy(myPt);
  return group;
}

// Dowel endpoints: from arm tip of A toward B, to arm tip of B toward A
function dowelPts(na, nb, positions) {
  const pA  = positions[na];
  const pB  = positions[nb];
  const d   = new THREE.Vector3().subVectors(pB, pA);
  const len = d.length();
  if (len < 0.01) return null;
  d.normalize();
  const inset = NODE_R + ARM_LEN + NODE_R * 0.25;  // matches arm tip position from node centre
  if (len <= inset * 2 + 1) return null;   // skip near-zero dowels
  return [
    pA.clone().addScaledVector(d,  inset),
    pB.clone().addScaledVector(d, -inset),
  ];
}

// ─────────────────────────────────────────────────────────────────────────────
// SCENE MANAGEMENT
// ─────────────────────────────────────────────────────────────────────────────
const LIGHT_COUNT = 4;  // HemisphereLight + 3 DirectionalLights added above
let topMesh = null;

function clearScene() {
  while (scene.children.length > LIGHT_COUNT) {
    const obj = scene.children[LIGHT_COUNT];
    if (obj.geometry) obj.geometry.dispose();
    scene.remove(obj);
  }
  topMesh = null;
}

function buildScene(L, W, H) {
  const pos = allPositions(L, W, H);

  // Nodes (MultiPipe-style sphere + arms)
  for (const id of Object.keys(NODES)) {
    scene.add(buildNode(+id, pos));
  }

  // Dowel cylinders — only between arm tips (skip if too short)
  for (const [,na,nb] of ALL_CONN) {
    const pts = dowelPts(na, nb, pos);
    if (!pts) continue;
    const m = cylAB(pts[0], pts[1], TUBE_R, MAT_DOWEL);
    if (m) scene.add(m);
  }

  // Glass tabletop — follows top corners
  const topY = NODES[13].v * H;
  topMesh = new THREE.Mesh(new THREE.PlaneGeometry(W + 2, L + 2), MAT_TOP);
  topMesh.rotation.x = -Math.PI / 2;
  topMesh.position.set(0, topY, 0);
  scene.add(topMesh);
}

function updateScene(L, W, H) {
  // Full rebuild: arm directions re-aim on every LWH change (as in real Grasshopper)
  clearScene();
  buildScene(L, W, H);
  updateCamera(L, W, H);
  updateCutSheet(L, W, H);
}

// ─────────────────────────────────────────────────────────────────────────────
// CAMERA & ORBIT
// ─────────────────────────────────────────────────────────────────────────────
let theta=0.55, phi=1.05, camDist=240;
let camTarget = new THREE.Vector3(0, 30, 0);
let isDragging=false, lastMX=0, lastMY=0;

function updateCamera(L, W, H) {
  camDist  = Math.max(L, W, H) * 2.4;
  camTarget.set(0, H * 0.42, 0);
}
function applyCamera() {
  const x = camDist * Math.sin(phi) * Math.sin(theta);
  const y = camDist * Math.cos(phi);
  const z = camDist * Math.sin(phi) * Math.cos(theta);
  camera.position.set(camTarget.x+x, camTarget.y+y, camTarget.z+z);
  camera.lookAt(camTarget);
}

container.addEventListener('mousedown', e=>{ isDragging=true; lastMX=e.clientX; lastMY=e.clientY; });
window.addEventListener('mouseup', ()=>isDragging=false);
window.addEventListener('mousemove', e=>{
  if(!isDragging) return;
  theta -= (e.clientX-lastMX)*0.008;
  phi    = Math.max(0.08, Math.min(Math.PI-0.08, phi-(e.clientY-lastMY)*0.008));
  lastMX=e.clientX; lastMY=e.clientY;
});
container.addEventListener('wheel', e=>{
  e.preventDefault();
  camDist = Math.max(40, Math.min(900, camDist+e.deltaY*0.55));
},{passive:false});

let ltX=0, ltY=0;
container.addEventListener('touchstart', e=>{if(e.touches.length===1){ltX=e.touches[0].clientX;ltY=e.touches[0].clientY;}},{passive:true});
container.addEventListener('touchmove', e=>{
  if(e.touches.length===1){
    theta-=(e.touches[0].clientX-ltX)*0.01;
    phi=Math.max(0.08,Math.min(Math.PI-0.08,phi-(e.touches[0].clientY-ltY)*0.01));
    ltX=e.touches[0].clientX; ltY=e.touches[0].clientY;
  }
},{passive:true});

// ─────────────────────────────────────────────────────────────────────────────
// CUT SHEET
// ─────────────────────────────────────────────────────────────────────────────
const LEG_LABELS = ['A','B','C','D'];

function updateCutSheet(L, W, H) {
  const tbody = document.getElementById('cut-tbody');
  if (!tbody) return;
  const pos  = allPositions(L, W, H);
  const rows = [];

  LEGS.forEach(([,na,nb], i) => {
    const pts = dowelPts(na, nb, pos);
    const len = pts ? Math.round(pts[0].distanceTo(pts[1])) : 0;
    rows.push(`<tr>
      <td><span class="tag-pill">${LEG_LABELS[i]}</span></td>
      <td>Vertical leg</td><td>${len} cm</td><td>1</td></tr>`);
  });

  const bLens = BRACES
    .map(([,na,nb]) => { const p=dowelPts(na,nb,pos); return p ? p[0].distanceTo(p[1]) : 0; })
    .filter(l => l > 1);
  const bMin = Math.round(Math.min(...bLens));
  const bMax = Math.round(Math.max(...bLens));
  rows.push(`<tr>
    <td><span class="tag-pill" style="background:#666">—</span></td>
    <td>Diagonal brace</td><td>${bMin}–${bMax} cm</td><td>${BRACES.length}</td></tr>`);

  rows.push(`<tr class="divider-row">
    <td colspan="2">Total dowels</td><td colspan="2">${ALL_CONN.length}</td></tr>`);

  tbody.innerHTML = rows.join('');
}

// ─────────────────────────────────────────────────────────────────────────────
// RESIZE
// ─────────────────────────────────────────────────────────────────────────────
function onResize() {
  const w=container.clientWidth, h=container.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ─────────────────────────────────────────────────────────────────────────────
// RENDER LOOP
// ─────────────────────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  applyCamera();
  renderer.render(scene, camera);
})();

// ─────────────────────────────────────────────────────────────────────────────
// SLIDERS
// ─────────────────────────────────────────────────────────────────────────────
let curL=80, curW=80, curH=70;

['L','W','H'].forEach(axis => {
  const sl = document.getElementById('sl-'+axis);
  const vl = document.getElementById('val-'+axis);
  sl.addEventListener('input', () => {
    vl.textContent = sl.value;
    if(axis==='L') curL=+sl.value;
    if(axis==='W') curW=+sl.value;
    if(axis==='H') curH=+sl.value;
    updateScene(curL, curW, curH);
  });
});

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
buildScene(curL, curW, curH);
updateCamera(curL, curW, curH);
updateCutSheet(curL, curW, curH);
</script>
