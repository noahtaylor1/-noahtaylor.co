<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nodes Configurator — Noah Taylor</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    .configurator-wrap { display: flex; flex-direction: column; }

    #canvas-container {
      width: 100%;
      height: 70vh;
      min-height: 440px;
      background: #f9f8f6;
      cursor: grab;
      position: relative;
      user-select: none;
    }
    #canvas-container:active { cursor: grabbing; }
    #three-canvas { display: block; width: 100% !important; height: 100% !important; }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9f8f6;
      gap: 16px;
      font-size: 13px;
      color: #aaa;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      z-index: 10;
      transition: opacity 0.4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid #e0e0e0;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .canvas-hint {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 11px;
      color: #bbb;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .project-label {
      position: absolute;
      top: 20px;
      left: 28px;
      pointer-events: none;
    }
    .project-label h1 { font-size: 20px; font-weight: 400; letter-spacing: -0.01em; color: #1a1a1a; margin-bottom: 3px; }
    .project-label p  { font-size: 12px; color: #aaa; letter-spacing: 0.03em; }

    /* Controls */
    .controls-bar {
      display: flex;
      border-bottom: 1px solid #e5e5e5;
      flex-wrap: wrap;
    }
    .ctrl {
      flex: 1;
      min-width: 160px;
      padding: 20px 32px;
      border-right: 1px solid #e5e5e5;
    }
    .ctrl:last-child { border-right: none; }
    .ctrl-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #aaa;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ctrl-label span {
      font-size: 14px; color: #1a1a1a;
      letter-spacing: 0; text-transform: none;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%; height: 2px; appearance: none;
      background: #e0e0e0; outline: none; cursor: pointer; border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: #1a1a1a; cursor: pointer;
    }

    /* Cut sheet */
    .cutsheet { padding: 40px 48px 80px; }
    .cutsheet h2 {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.1em; color: #aaa; margin-bottom: 24px;
    }
    .cut-table { width: 100%; max-width: 540px; border-collapse: collapse; }
    .cut-table th {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #aaa; font-weight: 400; text-align: left;
      padding: 0 20px 10px 0; border-bottom: 1px solid #e5e5e5;
    }
    .cut-table td { padding: 13px 20px 13px 0; border-bottom: 1px solid #f2f2f2; font-size: 14px; color: #333; }
    .tag-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      background: #111; color: #fff; font-size: 11px; font-weight: 600;
    }
    .total-row td {
      border-bottom: none; border-top: 1px solid #e5e5e5;
      padding-top: 16px; color: #888; font-size: 13px;
    }

    @media (max-width: 768px) {
      .ctrl { padding: 16px 20px; }
      .cutsheet { padding: 28px 20px 60px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Noah Taylor</a>
  <ul class="nav-links">
    <li><a href="work.html">Work</a></li>
    <li><a href="index.html" class="active">Design Concepts</a></li>
    <li><a href="resume.html">Resume</a></li>
    <li><a href="https://www.linkedin.com/in/noah-taylor-364723183/" target="_blank" rel="noopener">LinkedIn ↗</a></li>
  </ul>
</nav>

<div class="configurator-wrap">
  <div id="canvas-container">
    <canvas id="three-canvas"></canvas>

    <div id="loading">
      <div class="spinner"></div>
      <span>Loading model</span>
    </div>

    <div class="project-label">
      <h1>Nodes</h1>
      <p>Parametric Configurator</p>
    </div>
    <div class="canvas-hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom</div>
  </div>

  <div class="controls-bar">
    <div class="ctrl">
      <div class="ctrl-label">Length <span><span id="val-L">120</span> cm</span></div>
      <input type="range" id="sl-L" min="50" max="240" value="120" step="1"/>
    </div>
    <div class="ctrl">
      <div class="ctrl-label">Width <span><span id="val-W">60</span> cm</span></div>
      <input type="range" id="sl-W" min="30" max="120" value="60" step="1"/>
    </div>
    <div class="ctrl">
      <div class="ctrl-label">Height <span><span id="val-H">75</span> cm</span></div>
      <input type="range" id="sl-H" min="30" max="120" value="75" step="1"/>
    </div>
  </div>

  <div class="cutsheet">
    <h2>Scaled Dimensions</h2>
    <table class="cut-table">
      <thead>
        <tr><th>Axis</th><th>Default</th><th>Current</th><th>Scale</th></tr>
      </thead>
      <tbody id="cut-tbody"></tbody>
    </table>
  </div>
</div>

<footer>© 2026 Noah Taylor &nbsp;·&nbsp;
  <a href="nodes.html" style="color:inherit;text-decoration:none;">← Back to Nodes</a>
</footer>

<script>
// ─── Renderer + Scene ─────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const canvas    = document.getElementById('three-canvas');
const loadingEl = document.getElementById('loading');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = false;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0xf9f8f6);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100000);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const key = new THREE.DirectionalLight(0xfff6e8, 0.95);
key.position.set(1, 2, 1.5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xe8f0ff, 0.4);
fill.position.set(-1.5, 0.5, -1);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.2);
rim.position.set(0, -1, -2);
scene.add(rim);

// ─── Materials ────────────────────────────────────────────────────────────
const MATS = {
  'Paint':               new THREE.MeshLambertMaterial({ color: 0xb07840 }),  // wood dowels
  'diffuse_0_0_0_255':   new THREE.MeshLambertMaterial({ color: 0x111111 }),  // black nodes
  'Plastic':             new THREE.MeshLambertMaterial({ color: 0xd0e4f0, transparent: true, opacity: 0.35, side: THREE.DoubleSide }), // glass top
  'Plaster':             new THREE.MeshLambertMaterial({ color: 0xe8e0d8 }),  // off-white elements
  '__default__':         new THREE.MeshLambertMaterial({ color: 0xcccccc }),
};

// ─── OBJ Parser ───────────────────────────────────────────────────────────
function parseOBJ(text) {
  const lines = text.split('\n');
  const pos   = [];   // raw flat positions [x,y,z, x,y,z, ...]

  // per-material: flat Float32Array builders
  const matArrays = {};
  let curMat = '__default__';

  for (let i = 0, n = lines.length; i < n; i++) {
    const line = lines[i];
    if (line.length < 2) continue;
    const c0 = line.charCodeAt(0);

    if (c0 === 118) {           // 'v'
      const c1 = line.charCodeAt(1);
      if (c1 === 32) {          // 'v ' — position
        let s = line.split(' ');
        pos.push(+s[1], +s[2], +s[3]);
      }
      // skip vt / vn — we'll compute normals ourselves
    } else if (c0 === 117) {    // 'u' — usemtl
      curMat = line.slice(7).trim();
      if (!matArrays[curMat]) matArrays[curMat] = [];
    } else if (c0 === 102) {    // 'f' — face
      if (!matArrays[curMat]) matArrays[curMat] = [];
      const arr = matArrays[curMat];
      const tokens = line.split(/\s+/);
      // Collect vertex indices (1-based), triangulate as fan
      const idxs = [];
      for (let k = 1; k < tokens.length; k++) {
        if (!tokens[k]) continue;
        const vi = (+tokens[k].split('/')[0] - 1) * 3;
        idxs.push(vi);
      }
      for (let j = 1; j < idxs.length - 1; j++) {
        const a = idxs[0], b = idxs[j], c = idxs[j + 1];
        arr.push(pos[a], pos[a+1], pos[a+2],
                 pos[b], pos[b+1], pos[b+2],
                 pos[c], pos[c+1], pos[c+2]);
      }
    }
  }

  return matArrays;
}

// ─── Build scene from parsed data ─────────────────────────────────────────
const modelGroup = new THREE.Group();
scene.add(modelGroup);

// Store default (base) extents
let BASE = { cx:0, cy:0, cz:0, sx:1, sy:1, sz:1 };
let curL = 120, curW = 60, curH = 75;

function buildScene(matArrays) {
  // Collect all vertices to compute bounding box
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity, minZ=Infinity, maxZ=-Infinity;

  const allPos = matArrays['Paint'] || matArrays[Object.keys(matArrays)[0]];
  for (let i = 0; i < allPos.length; i += 3) {
    const x = allPos[i], y = allPos[i+1], z = allPos[i+2];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
    if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
  }

  // Also scan all materials for bounding box
  for (const arr of Object.values(matArrays)) {
    for (let i = 0; i < arr.length; i += 3) {
      const x = arr[i], y = arr[i+1], z = arr[i+2];
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
  }

  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const cz = (minZ + maxZ) / 2;
  const rangeX = maxX - minX;
  const rangeY = maxY - minY;
  const rangeZ = maxZ - minZ;
  const maxRange = Math.max(rangeX, rangeY, rangeZ);
  const normalise = 100 / maxRange; // scale so largest dim = 100 units

  BASE = {
    cx, cy, cz,
    rangeX, rangeY, rangeZ,
    normalise,
    sx: 1, sy: 1, sz: 1,
  };

  // Build one mesh per material
  for (const [matName, arr] of Object.entries(matArrays)) {
    if (arr.length === 0) continue;
    const geo  = new THREE.BufferGeometry();
    const verts = new Float32Array(arr.length);
    // Centre and normalise verts
    for (let i = 0; i < arr.length; i += 3) {
      verts[i]   = (arr[i]   - cx) * normalise;
      verts[i+1] = (arr[i+1] - cy) * normalise;
      verts[i+2] = (arr[i+2] - cz) * normalise;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geo.computeVertexNormals();
    const mat = MATS[matName] || MATS['__default__'];
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.matName = matName;
    modelGroup.add(mesh);
  }

  // Camera: position to see full model
  const dist = 100 * 2.6;
  camR = dist;
  posCamera();
}

// ─── Parametric scale ─────────────────────────────────────────────────────
// We scale the model group along its principal axes.
// Y = height, X = length, Z = width (based on OBJ bounding box shape)
const DEFAULT_L = 120, DEFAULT_W = 60, DEFAULT_H = 75;

function applyScale() {
  modelGroup.scale.set(
    curL / DEFAULT_L,
    curH / DEFAULT_H,
    curW / DEFAULT_W
  );
  updateCutSheet();
}

function updateCutSheet() {
  document.getElementById('cut-tbody').innerHTML = `
    <tr>
      <td>Length (X)</td>
      <td style="color:#aaa">${DEFAULT_L} cm</td>
      <td>${curL} cm</td>
      <td style="color:#888;font-variant-numeric:tabular-nums">${(curL/DEFAULT_L).toFixed(2)}×</td>
    </tr>
    <tr>
      <td>Width (Z)</td>
      <td style="color:#aaa">${DEFAULT_W} cm</td>
      <td>${curW} cm</td>
      <td style="color:#888;font-variant-numeric:tabular-nums">${(curW/DEFAULT_W).toFixed(2)}×</td>
    </tr>
    <tr>
      <td>Height (Y)</td>
      <td style="color:#aaa">${DEFAULT_H} cm</td>
      <td>${curH} cm</td>
      <td style="color:#888;font-variant-numeric:tabular-nums">${(curH/DEFAULT_H).toFixed(2)}×</td>
    </tr>`;
}

// ─── Camera orbit ─────────────────────────────────────────────────────────
let theta = -0.5, phi = 0.82, camR = 260;
let autoSpin = true, dragging = false, lx = 0, ly = 0;

function posCamera() {
  camera.position.set(
    camR * Math.sin(phi) * Math.sin(theta),
    camR * Math.cos(phi),
    camR * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(0, 0, 0);
}

container.addEventListener('mousedown', e => {
  dragging = true; autoSpin = false;
  lx = e.clientX; ly = e.clientY; e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  theta += (e.clientX - lx) * 0.008;
  phi   -= (e.clientY - ly) * 0.008;
  phi = Math.max(0.05, Math.min(1.55, phi));
  lx = e.clientX; ly = e.clientY;
  posCamera();
});
window.addEventListener('mouseup', () => dragging = false);

container.addEventListener('touchstart', e => {
  dragging = true; autoSpin = false;
  lx = e.touches[0].clientX; ly = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (!dragging) return;
  theta += (e.touches[0].clientX - lx) * 0.01;
  phi   -= (e.touches[0].clientY - ly) * 0.01;
  phi = Math.max(0.05, Math.min(1.55, phi));
  lx = e.touches[0].clientX; ly = e.touches[0].clientY;
  posCamera();
}, { passive: true });
window.addEventListener('touchend', () => dragging = false);

container.addEventListener('wheel', e => {
  camR += e.deltaY * 0.4;
  camR = Math.max(40, Math.min(5000, camR));
  posCamera(); e.preventDefault();
}, { passive: false });

// ─── Sliders ──────────────────────────────────────────────────────────────
['sl-L','sl-W','sl-H'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    curL = +document.getElementById('sl-L').value;
    curW = +document.getElementById('sl-W').value;
    curH = +document.getElementById('sl-H').value;
    document.getElementById('val-L').textContent = curL;
    document.getElementById('val-W').textContent = curW;
    document.getElementById('val-H').textContent = curH;
    applyScale();
  });
});

// ─── Resize ───────────────────────────────────────────────────────────────
function onResize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

// ─── Render loop ──────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  if (autoSpin && !dragging) { theta += 0.003; posCamera(); }
  renderer.render(scene, camera);
}

// ─── Load OBJ ─────────────────────────────────────────────────────────────
onResize();
animate();
updateCutSheet();

fetch('nodes-table.obj')
  .then(r => r.text())
  .then(text => {
    const matArrays = parseOBJ(text);
    buildScene(matArrays);
    applyScale();
    loadingEl.classList.add('hidden');
  })
  .catch(err => {
    loadingEl.innerHTML = '<span style="color:#c00">Failed to load model</span>';
    console.error(err);
  });
</script>
</body>
</html>
