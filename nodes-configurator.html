<script>
// ─────────────────────────────────────────────────────────────────────────────
// TOPOLOGY — derived directly from the OBJ (Paint nodes only, Plaster dowels)
//
// Normalized positions (u,v,w) ∈ [0,1]³ from Paint node bounding box:
//   X: 228.7 → 249.8  (XR = 21.1)
//   Y: 294.1 → 309.9  (YR = 15.8)
//   Z: −247.7 → −226.7 (ZR = 21.0)
// ─────────────────────────────────────────────────────────────────────────────
const XMIN=228.7, XR=21.1, YMIN=294.1, YR=15.8, ZMIN=-247.7, ZR=21.0;

// id → {u, v, w}  — 11 Paint connector nodes from OBJ
const NODES = {};
[
  [7,  0.9194, 0.0063, 0.0905],  // bottom-right-back
  [8,  0.1137, 0.0316, 0.1048],  // bottom-left-back
  [9,  0.9100, 0.0000, 0.9190],  // bottom-right-front
  [10, 0.1137, 0.0506, 0.9286],  // bottom-left-front
  [11, 0.3412, 0.4937, 0.7095],  // mid crossing
  [12, 0.6872, 0.4557, 0.5524],  // mid crossing
  [13, 1.0000, 1.0000, 0.0000],  // top-right-back
  [14, 0.0047, 1.0000, 0.0095],  // top-left-back
  [15, 0.4455, 0.6013, 0.3048],  // mid crossing
  [16, 0.0000, 0.9747, 0.9762],  // top-left-front
  [40, 0.9905, 1.0000, 1.0000],  // top-right-front
].forEach(([id,u,v,w]) => { NODES[id] = {u,v,w}; });

// 23 Plaster dowel connections — read directly from OBJ component topology
// Each entry: [plasterIdx, nodeA, nodeB]
const LEGS = [
  [28,13, 7],   // vertical right-back
  [29,14, 8],   // vertical left-back
  [30,40, 9],   // vertical right-front
  [31,10,16],   // vertical left-front
];
const BRACES = [
  [17,10,11], [18, 8,11], [19, 9,12], [20,11,12],
  [21,15, 8], [23, 7,12],
  [26, 7,15], [27,12,15], [32,15,14],
  [33,40,12], [34,16,11], [35,13,12], [36,13,15],
  [37,14,15], [39,11,16],
];
// Deduplicate by sorted pair — removes any double legs from OBJ topology
const _seen = new Set();
const ALL_CONN = [...LEGS, ...BRACES].filter(([,a,b]) => {
  const k = Math.min(a,b)+'-'+Math.max(a,b);
  return _seen.has(k) ? false : (_seen.add(k), true);
});

// Build adjacency map: nodeId → Set of connected nodeIds
const ADJ = {};
for (const id of Object.keys(NODES)) ADJ[+id] = new Set();
for (const [,na,nb] of ALL_CONN) {
  ADJ[na].add(nb);
  ADJ[nb].add(na);
}

// ─────────────────────────────────────────────────────────────────────────────
// PHYSICAL DIMENSIONS
// Dowels are thicker than nodes (matching physical model)
// ─────────────────────────────────────────────────────────────────────────────
// All measurements in cm (1 inch = 2.54 cm)
const IN      = 2.54;          // 1 inch in cm
const BOX_W   = 1.00 * IN;     // 1"  — square dowel side
const NODE_R  = 0.75/2 * IN;   // ¾"  — node sphere diameter → radius
const BELL_R  = 0.50/2 * IN;   // ½"  — peg diameter → radius (fits inside dowel)
const BELL_L  = 0.90  * IN;    // peg depth from sphere centre → dowel face

// ─────────────────────────────────────────────────────────────────────────────
// THREE.JS
// ─────────────────────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const canvas    = document.getElementById('three-canvas');

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
renderer.outputEncoding      = THREE.sRGBEncoding;
renderer.toneMapping         = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.80;
renderer.shadowMap.enabled   = false;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0xf5f5f7);

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 10000);

// ── Studio lighting ─────────────────────────────────────────────────────────
// Warm sky hemisphere
// Balanced product lighting — no shadows
scene.add(new THREE.AmbientLight(0xffffff, 0.30));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(2, 4, 2.5);
scene.add(sun);
const soft = new THREE.DirectionalLight(0xdde4ff, 0.28);
soft.position.set(-2, 1.5, -1.5);
scene.add(soft);

// ── Clean minimal materials ──────────────────────────────────────────────────
const MAT_NODE  = new THREE.MeshStandardMaterial({
  color: 0xdddbd6, roughness: 0.30, metalness: 0.0
});
const MAT_DOWEL = new THREE.MeshStandardMaterial({
  color: 0xb8976a, roughness: 0.60, metalness: 0.0
});
const MAT_TOP = new THREE.MeshStandardMaterial({
  color: 0xe8f0f8, roughness: 0.04, metalness: 0.06,
  transparent: true, opacity: 0.55, side: THREE.DoubleSide
});


// ─────────────────────────────────────────────────────────────────────────────
// GEOMETRY HELPERS
// ─────────────────────────────────────────────────────────────────────────────
const _YUP = new THREE.Vector3(0, 1, 0);

// Square-section dowel from pA to pB
function boxAB(pA, pB, w, mat) {
  const d   = pB.clone().sub(pA);
  const len = d.length();
  if (len < 0.01) return null;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, len, w), mat);
  mesh.position.copy(pA).addScaledVector(d.normalize(), len * 0.5);
  mesh.quaternion.setFromUnitVectors(_YUP, d);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

// ─────────────────────────────────────────────────────────────────────────────
// NODE POSITION
// ─────────────────────────────────────────────────────────────────────────────
function nodePos(id, L, W, H) {
  const n = NODES[id];
  return new THREE.Vector3((n.u - 0.5)*W, n.v*H, (n.w - 0.5)*L);
}

function allPositions(L, W, H) {
  const m = {};
  for (const id of Object.keys(NODES)) m[+id] = nodePos(+id, L, W, H);
  return m;
}

// ─────────────────────────────────────────────────────────────────────────────
// BELL GEOMETRY — LatheGeometry with cubic bezier profile
//
// Profile: NODE_R (sphere equator) → BELL_R (peg tip, smaller)
// Horizontal G1 tangent at y=0 matches sphere normals — seamless blend.
// NODE_R > BELL_R: tapers inward like a real machined connector peg.
// ─────────────────────────────────────────────────────────────────────────────
function makeBellGeo() {
  const N = 30, pts = [];
  const P0 = [NODE_R, 0];
  const P1 = [NODE_R, BELL_L * 0.40]; // horizontal start — G1 with sphere
  const P2 = [BELL_R, BELL_L * 0.62]; // smoothly tapers inward
  const P3 = [BELL_R, BELL_L];
  for (let i = 0; i <= N; i++) {
    const t = i / N, mt = 1 - t;
    const r = mt**3*P0[0] + 3*mt**2*t*P1[0] + 3*mt*t**2*P2[0] + t**3*P3[0];
    const y = mt**3*P0[1] + 3*mt**2*t*P1[1] + 3*mt*t**2*P2[1] + t**3*P3[1];
    pts.push(new THREE.Vector2(r, y));
  }
  return new THREE.LatheGeometry(pts, 30);
}

// Shared geometries — built once, reused every scene rebuild (never disposed)
const GEO_SPHERE = new THREE.SphereGeometry(NODE_R, 24, 18);
const GEO_BELL   = makeBellGeo();

// ─────────────────────────────────────────────────────────────────────────────
// NODE — sphere + smooth LatheGeometry bell per arm
//
// Bell's y=0 sits at the sphere centre; LatheGeometry rotated so +Y = arm dir.
// Sphere equator (r=NODE_R) ↔ bell base (r=NODE_R, horizontal tangent) share
// the same circle with matching normals → perfectly smooth blend, no hard edge.
// ─────────────────────────────────────────────────────────────────────────────
// insets: {neighbourId → distance from sphere centre to beam face}
// Bell arm is stretched along Y to reach exactly that distance.
function buildNode(id, positions, insets) {
  const group = new THREE.Group();
  const myPt  = positions[id];

  const core = new THREE.Mesh(GEO_SPHERE, MAT_NODE);
  core.castShadow = true; core.receiveShadow = true;
  group.add(core);

  for (const nid of ADJ[id]) {
    const otherPt = positions[nid];
    if (!otherPt) continue;
    const dir   = new THREE.Vector3().subVectors(otherPt, myPt).normalize();
    const reach = insets[nid] ?? BELL_L;

    const bell  = new THREE.Mesh(GEO_BELL, MAT_NODE);
    bell.quaternion.setFromUnitVectors(_YUP, dir);
    bell.scale.y = reach / BELL_L;   // stretch bell to span sphere→beam face
    bell.castShadow = true; bell.receiveShadow = true;
    group.add(bell);
  }

  group.position.copy(myPt);
  return group;
}

// ─────────────────────────────────────────────────────────────────────────────
// PER-ARM INSET — clash-driven geometry
//
// For each arm leaving a node, find the minimum safe inset so its square box
// doesn't overlap any neighbouring arm's box. The safe distance is:
//   inset ≥ BOX_W·√2/2 / sin(θ)
// where θ is the angle between the two arm directions.
// The bell arm then stretches (scale.y) to fill the gap from sphere to beam face.
// ─────────────────────────────────────────────────────────────────────────────
function armInsets(id, positions) {
  const myPt = positions[id];
  const nids  = [...ADJ[id]].filter(n => positions[n]);
  const dirs  = Object.fromEntries(
    nids.map(n => [n, new THREE.Vector3().subVectors(positions[n], myPt).normalize()])
  );
  const result = {};
  for (const n of nids) {
    let inset = BELL_L;
    for (const n2 of nids) {
      if (n === n2) continue;
      const sinT = dirs[n].clone().cross(dirs[n2]).length();
      if (sinT < 0.08) continue;
      inset = Math.max(inset, (BOX_W * 0.55) / sinT);
    }
    // Hard cap: never exceed 40% of the distance to that neighbour
    const distToN = myPt.distanceTo(positions[n]);
    inset = Math.min(inset, distToN * 0.40, 1.5 * IN);
    result[n] = inset;
  }
  return result;
}

// ─────────────────────────────────────────────────────────────────────────────
// SCENE MANAGEMENT
// ─────────────────────────────────────────────────────────────────────────────
// Capture scene child count after all permanent objects (lights + targets + floor)
const SCENE_BASE = scene.children.length;
let topMesh = null;

const SHARED_GEOS = new Set([GEO_SPHERE, GEO_BELL]);
function clearScene() {
  while (scene.children.length > SCENE_BASE) {
    const obj = scene.children[SCENE_BASE];
    if (obj.isMesh && obj.geometry && !SHARED_GEOS.has(obj.geometry)) obj.geometry.dispose();
    if (obj.isGroup) obj.traverse(c => {
      if (c.geometry && !SHARED_GEOS.has(c.geometry)) c.geometry.dispose();
    });
    scene.remove(obj);
  }
  topMesh = null;
}

function buildScene(L, W, H) {
  const pos = allPositions(L, W, H);

  // 1 — Precompute clash-adjusted insets for every arm at every node
  const INSETS = {};
  for (const id of Object.keys(NODES)) INSETS[+id] = armInsets(+id, pos);

  // 2 — Nodes: bells stretch to fill sphere → beam face gap
  for (const id of Object.keys(NODES)) {
    scene.add(buildNode(+id, pos, INSETS[+id]));
  }

  // 3 — Dowels: start exactly where the bell tip ends at each node
  for (const [,na,nb] of ALL_CONN) {
    const pA  = pos[na], pB = pos[nb];
    const ab  = pB.clone().sub(pA);
    const len = ab.length();
    if (len < 0.01) continue;
    ab.normalize();
    const tA = INSETS[na][nb] ?? BELL_L;
    const tB = INSETS[nb][na] ?? BELL_L;
    if (len <= tA + tB + 0.1) continue;
    const m = boxAB(
      pA.clone().addScaledVector(ab,  tA),
      pB.clone().addScaledVector(ab, -tB),
      BOX_W, MAT_DOWEL
    );
    if (m) scene.add(m);
  }

  // Glass tabletop — 0.75" thick slab sitting on top of the frame
  const topY  = NODES[13].v * H;
  const topTh = 0.75 * IN;
  topMesh = new THREE.Mesh(
    new THREE.BoxGeometry(W + 4*IN, topTh, L + 4*IN),
    MAT_TOP
  );
  topMesh.position.set(0, topY + topTh * 0.5, 0);
  topMesh.castShadow = true; topMesh.receiveShadow = true;
  scene.add(topMesh);
}

function updateScene(L, W, H) {
  // Full rebuild: arm directions re-aim on every LWH change (as in real Grasshopper)
  clearScene();
  buildScene(L, W, H);
  updateCamera(L, W, H);
  updateCutSheet(L, W, H);
}

// ─────────────────────────────────────────────────────────────────────────────
// CAMERA & ORBIT
// ─────────────────────────────────────────────────────────────────────────────
let theta=0.55, phi=1.05, camDist=240;
let camTarget = new THREE.Vector3(0, 30, 0);
let isDragging=false, lastMX=0, lastMY=0;

function updateCamera(L, W, H) {
  camDist  = Math.max(L, W, H) * 2.4;
  camTarget.set(0, H * 0.42, 0);
}
function applyCamera() {
  const x = camDist * Math.sin(phi) * Math.sin(theta);
  const y = camDist * Math.cos(phi);
  const z = camDist * Math.sin(phi) * Math.cos(theta);
  camera.position.set(camTarget.x+x, camTarget.y+y, camTarget.z+z);
  camera.lookAt(camTarget);
}

container.addEventListener('mousedown', e=>{ isDragging=true; lastMX=e.clientX; lastMY=e.clientY; });
window.addEventListener('mouseup', ()=>isDragging=false);
window.addEventListener('mousemove', e=>{
  if(!isDragging) return;
  theta -= (e.clientX-lastMX)*0.008;
  phi    = Math.max(0.08, Math.min(Math.PI-0.08, phi-(e.clientY-lastMY)*0.008));
  lastMX=e.clientX; lastMY=e.clientY;
});
container.addEventListener('wheel', e=>{
  e.preventDefault();
  camDist = Math.max(40, Math.min(900, camDist+e.deltaY*0.55));
},{passive:false});

let ltX=0, ltY=0;
container.addEventListener('touchstart', e=>{if(e.touches.length===1){ltX=e.touches[0].clientX;ltY=e.touches[0].clientY;}},{passive:true});
container.addEventListener('touchmove', e=>{
  if(e.touches.length===1){
    theta-=(e.touches[0].clientX-ltX)*0.01;
    phi=Math.max(0.08,Math.min(Math.PI-0.08,phi-(e.touches[0].clientY-ltY)*0.01));
    ltX=e.touches[0].clientX; ltY=e.touches[0].clientY;
  }
},{passive:true});

// ─────────────────────────────────────────────────────────────────────────────
// CUT SHEET
// ─────────────────────────────────────────────────────────────────────────────
const LEG_LABELS = ['A','B','C','D'];

function updateCutSheet(L, W, H) {
  const tbody = document.getElementById('cut-tbody');
  if (!tbody) return;
  const pos = allPositions(L, W, H);
  const rows = [];

  const INS = {};
  for (const id of Object.keys(NODES)) INS[+id] = armInsets(+id, pos);

  // Returns exposed dowel length in inches (cm ÷ IN), or 0 if suppressed
  function lenIn(na, nb) {
    const ab  = pos[nb].clone().sub(pos[na]);
    const len = ab.length();
    const tA  = INS[na][nb] ?? BELL_L, tB = INS[nb][na] ?? BELL_L;
    return (len > tA + tB + 0.1) ? (len - tA - tB) / IN : 0;
  }

  // Legs — individual rows, labelled A–D
  LEGS.forEach(([,na,nb], i) => {
    const l = lenIn(na, nb);
    if (l < 0.1) return;
    rows.push(`<tr>
      <td><span class="tag-pill">${LEG_LABELS[i]}</span></td>
      <td>Vertical leg</td><td>${l.toFixed(2)}"</td><td>1</td></tr>`);
  });

  // Braces — one row per member
  let braceCount = 0;
  ALL_CONN.filter(c => !LEGS.includes(c)).forEach(([,na,nb]) => {
    const l = lenIn(na, nb);
    if (l < 0.1) return;
    braceCount++;
    rows.push(`<tr>
      <td><span class="tag-pill" style="background:#888;font-size:9px">B${String(braceCount).padStart(2,'0')}</span></td>
      <td>Diagonal brace</td><td>${l.toFixed(2)}"</td><td>1</td></tr>`);
  });

  const total = LEGS.length + braceCount;
  rows.push(`<tr class="divider-row">
    <td colspan="2">Total dowels</td><td colspan="2">${total}</td></tr>`);

  tbody.innerHTML = rows.join('');
}

// ─────────────────────────────────────────────────────────────────────────────
// RESIZE
// ─────────────────────────────────────────────────────────────────────────────
function onResize() {
  const w=container.clientWidth, h=container.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ─────────────────────────────────────────────────────────────────────────────
// RENDER LOOP
// ─────────────────────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  applyCamera();
  renderer.render(scene, camera);
})();

// ─────────────────────────────────────────────────────────────────────────────
// SLIDERS
// ─────────────────────────────────────────────────────────────────────────────
// Scene units = cm; sliders in inches — convert at boundary
let curL=24*IN, curW=24*IN, curH=18*IN;

function updateSliderFill(sl) {
  const pct = (sl.value - sl.min) / (sl.max - sl.min) * 100;
  sl.style.setProperty('--pct', pct + '%');
}
['L','W','H'].forEach(axis => {
  const sl = document.getElementById('sl-'+axis);
  updateSliderFill(sl);
  const vl = document.getElementById('val-'+axis);
  sl.addEventListener('input', () => {
    updateSliderFill(sl);
    vl.textContent = sl.value;
    if(axis==='L') curL = +sl.value * IN;
    if(axis==='W') curW = +sl.value * IN;
    if(axis==='H') curH = +sl.value * IN;
    updateScene(curL, curW, curH);
  });
});

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
buildScene(curL, curW, curH);
updateCamera(curL, curW, curH);
updateCutSheet(curL, curW, curH);
</script>
</body>
</html>
