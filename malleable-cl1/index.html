    v=>{ S.baseLayers=Math.round(v); }, v=>Math.round(v)+' \u00D7 '+(S.beadH*Math.round(v)).toFixed(1)+'mm');
  slider(s3,'Base pitch',0.6,6,.1, ()=>S.baseGap, v=>{ S.baseGap=v; },
    v=>Math.min(v,S.beadW).toFixed(1)+'mm \u00B7 '+(Math.min(v,S.beadW)*S.beadH).toFixed(2)+'mm\u00B2');
  slider(s3,'Relief',0,1,.05, ()=>S.relief, v=>{S.relief=v;}, v=> v<0.01 ? 'flat' : v.toFixed(2));
  slider(s3,'Shade',0,6,1, ()=>S.shade, v=>{S.shade=Math.round(v);}, v=> v<1 ? 'flat' : Math.round(v)+' steps');
  if(S.shade > 0){
    slider(s3,'Tone',0.1,1,.05, ()=>S.tone, v=>{S.tone=v;}, v=>v.toFixed(2));
    slider(s3,'Ambient',0,0.6,.02, ()=>S.ambient, v=>{S.ambient=v;}, v=>v.toFixed(2));
  }
  slider(s3,'Gap shade',0,1,.05, ()=>S.gap, v=>{S.gap=v;}, v=> v<0.02 ? 'off' : v.toFixed(2));
  check(s3,'Crease lines', ()=>S.edges, v=>{S.edges=v;});
  check(s3,'Hollow', ()=>S.hollow, v=>{S.hollow=v;});
  if(S.hollow) slider(s3,'Wall beads',1,4,1, ()=>S.wallBeads,
    v=>{ S.wallBeads=Math.round(v); S.wall=S.beadW*S.wallBeads*MM; },
    v=>Math.round(v)+' \u00D7 '+(S.beadW*Math.round(v)).toFixed(0)+'mm');
  check(s3,'Section', ()=>S.section, v=>{S.section=v;});
  if(S.section) slider(s3,'Cut at Z',-24,24,.5, ()=>S.secX, v=>{S.secX=v;}, v=>v.toFixed(1));
  check(s3,'Invert', ()=>S.invert, setInvert);
  slider(s3,'Quality',32,180,4, ()=>S.steps, v=>{S.steps=Math.round(v);}, v=>Math.round(v));
  panel.appendChild(s3);

  const s4 = el('div','sect'); s4.appendChild(el('h2',null,'Plate'));
  check(s4,'Grid', ()=>S.grid, v=>{S.grid=v;});
  slider(s4,'Module',3,12,1, ()=>S.module, v=>{S.module=v;}, v=>Math.round(v));
  ['cap1','cap2','cap3'].forEach((k,i) => {
    const inp = document.createElement('input');
    inp.className = 'txt'; inp.type = 'text'; inp.value = S[k];
    inp.setAttribute('aria-label','Caption '+(i+1));
    inp.oninput = () => { S[k] = inp.value; };
    s4.appendChild(inp);
  });
  panel.appendChild(s4);

  const s5 = el('div','sect'); s5.appendChild(el('h2',null,'Presets'));
  const pg = el('div','grid2');
  button(pg,'VASES', ()=>preset('vases'));
  button(pg,'TRAY', ()=>preset('tray'));
  button(pg,'BENCH', ()=>preset('bench'));
  button(pg,'ROW', ()=>preset('row'));
  button(pg,'CROSS', ()=>preset('cross'));
  button(pg,'NEST', ()=>preset('nest'));
  button(pg,'STEPS', ()=>preset('steps'));
  button(pg,'CLEAR', ()=>{ clearAll(); say('Cleared'); });
  s5.appendChild(pg);
  panel.appendChild(s5);

  const s6 = el('div','sect'); s6.appendChild(el('h2',null,'Export'));
  slider(s6,'Slice at Z',0,12,.5, ()=>S.sliceY, v=>{S.sliceY=v;}, v=>v.toFixed(1));
  slider(s6,'Trace',180,1200,20, ()=>S.traceRes, v=>{S.traceRes=Math.round(v);}, v=>Math.round(v));
  slider(s6,'Flow',2,60,.5, ()=>GC.flow, v=>{GC.flow=v;},
    v=>v.toFixed(1)+'mm\u00B3/s \u00B7 F'+Math.max(60,Math.round(60*v/beadArea())));
  slider(s6,'Nozzle',180,300,5, ()=>GC.nozzleTemp, v=>{GC.nozzleTemp=Math.round(v);}, v=>Math.round(v)+'\u00B0');
  slider(s6,'Bed',0,110,5, ()=>GC.bedTemp, v=>{GC.bedTemp=Math.round(v);}, v=>Math.round(v)+'\u00B0');
  slider(s6,'AMS slot',0,4,1, ()=>GC.ams, v=>{GC.ams=Math.round(v);},
    v=> Math.round(v) < 1 ? 'preloaded' : 'slot '+Math.round(v));
  const eg = el('div','grid2'); eg.style.marginTop = '7px';
  button(eg,'SAVE PNG', exportPNG);
  button(eg,'GCODE', exportGcode);
  button(eg,'PLAN SVG', exportPlan);
  button(eg,'SAVE JSON', ()=>download('malleable-cl1.json',
    new Blob([JSON.stringify({pots:S.pots, k:S.k}, null, 2)], {type:'application/json'})));
  button(eg,'COPY JSON', ()=>navigator.clipboard?.writeText(JSON.stringify({pots:S.pots,k:S.k}))
    .then(()=>say('Scene copied')).catch(()=>say('Copy blocked')));
  s6.appendChild(eg);
  s6.appendChild(el('p','hint','Gcode writes one spiral-vase file per pot, each centred on the bed: the base spirals out flat from the middle, then the wall climbs in one unbroken helix. Plan SVG cuts the field at the chosen height and traces the outline.'));
  panel.appendChild(s6);

  const s7 = el('div','sect'); s7.appendChild(el('h2',null,'Keys'));
  s7.appendChild(el('p','hint',
    'V C L X R H Z tools - 1 2 3 4 iso corners, 5 plan, 6 front - alt subtracts - shift-drag orbits - space-drag pans - scroll zooms - Cmd+Z undo - Cmd+D duplicate - F fits'));
  panel.appendChild(s7);
}

/* ══════════════════════════════════════════════════════════════════
   10 · PRESETS
   ══════════════════════════════════════════════════════════════════ */
function preset(name){
  snap(); S.pots = []; S.sel.clear();
  const add = (kind,x,z,dia,len,h,ang) => {
    const o = mkPot(kind,x,z);
    o.dia = dia; o.len = len||12; o.h = h; o.ang = ang||0;
    S.pots.push(o); return o;
  };
  if(name === 'vases'){
    /* Three of the standard vases, set close enough that each one presses
       its neighbours and the three share one foot. The whole point of the
       tool in one glance: a stamp, a clearance and a fillet. */
    S.k = 3.4;
    const r = 5.2;                              // 9.0 between centres
    add('circle', 0,          -r,      12, 0, 12);
    add('circle', r*0.866,  r*0.5,     12, 0,  9);
    add('circle',-r*0.866,  r*0.5,     12, 0, 10.5);
  } else if(name === 'tray'){     // long trough with cups hung off the front
    S.k = 3.4;
    add('pill',  0,-6, 12, 36, 9,  0);
    add('circle',-15, 5,  6, 0, 7);
    add('circle', -2, 8, 12, 0, 11);
    add('circle', 11, 5,  6, 0, 7);
    add('circle', 18, 1,  6, 0, 6.5);
  } else if(name === 'bench'){
    S.k = 3.0;
    add('pill',  0,-4, 12, 24, 8.5, 0);
    add('circle',-13, 5, 6, 0, 7);
    add('circle', 13, 5, 6, 0, 7);
    add('circle',  0, 7, 6, 0, 6);
  } else if(name === 'row'){
    S.k = 2.2;
    for(let i=0;i<4;i++) add('circle', -18+i*12, 0, i%2 ? 6 : 12, 0, 6.5+i*1.5);
  } else if(name === 'cross'){
    S.k = 4.0;
    add('pill', 0, 0, 12, 36, 9,  0);
    add('pill', 0, 0, 6,  24, 11, Math.PI/2);
    add('circle', 0, 0, 12, 0, 12);
  } else if(name === 'nest'){
    S.k = 5.0;
    add('pill',  0, 0, 12, 36, 10, 0);
    add('circle',-12, 0, 6, 0, 7);
    add('circle', 12, 0, 6, 0, 7);
    add('circle',  0, 0, 12, 0, 12);
  } else if(name === 'steps'){
    S.k = 2.6;
    add('pill', -8,-6, 6, 18, 6.5, 0.3);
    add('pill',  4, 0, 6, 24, 9,   0.3);
    add('circle',-18, 2, 12, 0, 8);
    add('circle', 17, 6, 12, 0, 11.5);
  }
  /* Stamp the whole arrangement so a preset opens pressed rather than
     blended. Smallest first: a small cup should press into a large trough,
     not be swallowed by it, and a pot is only pressed by older stamps. */
  const vol = o => {
    const k = skel(o);
    const segL = Math.hypot(k.bx-k.ax, k.bz-k.az);
    return (Math.PI*k.R*k.R + 2*k.R*segL) * o.h;
  };
  [...S.pots].sort((a,b) => vol(a) - vol(b)).forEach((o,i) => { o.seq = i+1; });
  S.stampN = S.pots.length;
  fitView();                       // re-aim at the new group
  snap(); sync(); say(name);
}

/* ══════════════════════════════════════════════════════════════════
   11 · LOOP
   ══════════════════════════════════════════════════════════════════ */
/* ── ONE WALL PER POT ───────────────────────────────────────────────
   Spiral vase mode prints one closed loop per layer, so a pot that its
   neighbours have cut into two pieces cannot be printed at all. The plan
   section of each pot is rasterised at a few heights and its pieces
   counted; if there is more than one, the biggest is kept and the rest
   are taken off by a single vertical plane that runs all the way to the
   ground, so nothing is left floating and every layer still closes.

   Costly enough that it runs when a drag ends rather than on every frame.
*/
/* Plan radius of a pot at a height, and of a stamp - which with air
   rights carries its widest section straight up and keeps cutting above
   its own rim. */
function radAt(o, y, asStamp){
  const k = skel(o);
  if(asStamp && !S.air && y > o.h) return -1;
  const t = Math.min(1, Math.max(0, y/o.h));
  let [r] = potR(t, k.R, o.tt, o.bt, o.belly);
  if(asStamp && S.air && t >= o.belly) r = k.R;
  return r;
}
/* Connectivity only needs the clean boolean - capsule in, capsules out -
   not the softened field, and the plain version is some fifty times
   quicker, which is what lets this run every time a drag ends. */
function vaseCuts(){
  const press = anyStamp();
  for(const o of S.pots){
    o.cutOn = false; o.cutNx = 0; o.cutNz = 0; o.cutC = 0;
    if(!S.oneWall || o.op !== 0 || !press) continue;
    const mySeq = o.seq || 0;
    const cutters = S.pots.filter(f => f !== o && f.op === 0 && (f.seq||0) > 0.5
                                    && (mySeq <= 0.5 || (f.seq||0) < mySeq));
    if(!cutters.length) continue;
    // one round stamp can only bite a crescent out of a convex pot
    if(cutters.length === 1 && cutters[0].kind === 'circle' && o.kind === 'circle') continue;
    const k = skel(o), ks = cutters.map(skel);
    const N = 44, pad = k.R*0.1 + 0.15;
    const x0 = Math.min(k.ax,k.bx)-k.R-pad, x1 = Math.max(k.ax,k.bx)+k.R+pad;
    const z0 = Math.min(k.az,k.bz)-k.R-pad, z1 = Math.max(k.az,k.bz)+k.R+pad;
    const sol = new Uint8Array(N*N), lab = new Int16Array(N*N), st = [];
    let best = null;
    for(const fy of [0.1, 0.3, 0.5, 0.7, 0.9]){
      const y = o.h*fy;
      const rP = radAt(o, y, false);
      const rS = cutters.map(f => radAt(f, y, true) + S.tol);
      for(let j=0;j<N;j++) for(let i=0;i<N;i++){
        const x = x0 + (x1-x0)*(i+0.5)/N, z = z0 + (z1-z0)*(j+0.5)/N;
        let v = segDist2(x,z, k.ax,k.az, k.bx,k.bz) < rP ? 1 : 0;
        if(v) for(let c=0;c<ks.length;c++){
          if(rS[c] < 0) continue;
          if(segDist2(x,z, ks[c].ax,ks[c].az, ks[c].bx,ks[c].bz) < rS[c]){ v = 0; break; }
        }
        sol[j*N+i] = v; lab[j*N+i] = -1;
      }
      let nc = 0; const areas = [];
      for(let c0=0;c0<N*N;c0++){
        if(!sol[c0] || lab[c0] >= 0) continue;
        let a = 0; st.length = 0; st.push(c0); lab[c0] = nc;
        while(st.length){
          const c = st.pop(); a++; const ci = c%N, cj = (c/N)|0;
          if(ci>0   && sol[c-1] && lab[c-1]<0){ lab[c-1]=nc; st.push(c-1); }
          if(ci<N-1 && sol[c+1] && lab[c+1]<0){ lab[c+1]=nc; st.push(c+1); }
          if(cj>0   && sol[c-N] && lab[c-N]<0){ lab[c-N]=nc; st.push(c-N); }
          if(cj<N-1 && sol[c+N] && lab[c+N]<0){ lab[c+N]=nc; st.push(c+N); }
        }
        areas.push(a); nc++;
      }
      if(nc < 2) continue;
      let keep = 0; for(let c=1;c<nc;c++) if(areas[c] > areas[keep]) keep = c;
      const drop = areas.reduce((t,a,c)=> c===keep ? t : t+a, 0);
      if(drop < 5) continue;                       // specks, not a split
      if(best && drop <= best.drop) continue;
      let kx=0,kz=0,kn=0, dx=0,dz=0,dn=0;
      for(let j=0;j<N;j++) for(let i=0;i<N;i++){
        const c = j*N+i; if(lab[c] < 0 || !sol[c]) continue;
        const x = x0 + (x1-x0)*(i+0.5)/N, z = z0 + (z1-z0)*(j+0.5)/N;
        if(lab[c] === keep){ kx+=x; kz+=z; kn++; } else { dx+=x; dz+=z; dn++; }
      }
      if(!kn || !dn) continue;
      kx/=kn; kz/=kn; dx/=dn; dz/=dn;
      let nx = dx-kx, nz = dz-kz;
      const L = Math.hypot(nx,nz); if(L < 1e-6) continue;
      nx/=L; nz/=L;
      /* Sit the plane in the clear gap between the piece kept and the
         pieces dropped, so the cut face lands in the space a neighbour
         has already taken rather than shaving the piece that stays. */
      let kMax=-1e9, dMin=1e9;
      for(let j=0;j<N;j++) for(let i=0;i<N;i++){
        const c = j*N+i; if(lab[c] < 0 || !sol[c]) continue;
        const x = x0 + (x1-x0)*(i+0.5)/N, z = z0 + (z1-z0)*(j+0.5)/N;
        const t = x*nx + z*nz;
        if(lab[c] === keep){ if(t > kMax) kMax = t; } else if(t < dMin) dMin = t;
      }
      best = { drop, nx, nz, c: dMin > kMax ? (kMax+dMin)*0.5 : Math.max(kMax, dMin) };
    }
    if(best){ o.cutOn = true; o.cutNx = best.nx; o.cutNz = best.nz; o.cutC = best.c; }
  }
}

function sync(){
  // selecting a pot makes it the stamp for good, so the press does not
  // evaporate (and the blend does not rush back in) the moment you click away
  /* Selecting a pot ranks it first among the stamps, so it always presses
     into everything else rather than only into whatever happens to be newer
     than it. Without this the press works or not depending on where the pot
     already sat in the order, which reads as the deform firing at random. */
  if(S.pressMode && S.sel.size){
    const picked = S.pots.filter(o => S.sel.has(o.id) && o.op === 0);
    if(picked.length){
      const rest = S.pots
        .filter(o => o.op === 0 && (o.seq > 0) && !S.sel.has(o.id))
        .sort((a,b) => a.seq - b.seq);
      picked.forEach((o,i) => { o.seq = i+1; });
      rest.forEach((o,i) => { o.seq = picked.length + i + 1; });
      S.stampN = picked.length + rest.length;
    }
  }
  if(!dragging) vaseCuts();        // too costly per frame; a drag ends in sync()
  buildPanel();
  document.getElementById('st-n').textContent = S.pots.length;
  /* Whether the whole group would go on the bed. The X1C is a 250 mm
     cube, and a nest that overruns it is worth knowing about before the
     slicer says so. */
  const fit = document.getElementById('st-fit');
  if(!S.pots.length){ fit.textContent = ''; }
  else {
    let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9,hi=0;
    for(const o of S.pots){ const k = skel(o);
      x0=Math.min(x0,Math.min(k.ax,k.bx)-k.R); x1=Math.max(x1,Math.max(k.ax,k.bx)+k.R);
      z0=Math.min(z0,Math.min(k.az,k.bz)-k.R); z1=Math.max(z1,Math.max(k.az,k.bz)+k.R);
      hi=Math.max(hi,o.h); }
    const w=(x1-x0)/MM, d=(z1-z0)/MM, h=hi/MM;
    const over = w>BUILD || d>BUILD || h>BUILD;
    fit.textContent = `${Math.round(w)}\u00D7${Math.round(d)}\u00D7${Math.round(h)}mm`
                    + (over ? ` \u00B7 over ${BUILD}` : '');
    fit.style.color = over ? 'var(--ink)' : 'var(--t3)';
    fit.style.fontWeight = over ? '600' : '400';
  }
}
function fitView(){
  if(!S.pots.length){ S.tx = 0; S.tz = 0; S.scale = 62; return; }
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9,hi=0;
  for(const o of S.pots){
    const k = skel(o), pad = k.R+3;
    x0=Math.min(x0,Math.min(k.ax,k.bx)-pad); x1=Math.max(x1,Math.max(k.ax,k.bx)+pad);
    z0=Math.min(z0,Math.min(k.az,k.bz)-pad); z1=Math.max(z1,Math.max(k.az,k.bz)+pad);
    hi = Math.max(hi, o.h);
  }
  /* Aim at the middle of the group in all three axes. Pointing at the
     floor left the pots sitting high in the frame with the empty plate
     under them. */
  S.tx = (x0+x1)/2; S.tz = (z0+z1)/2; S.ty = hi/2;
  const spread = S.view === 'front' ? Math.max(x1-x0, (hi+6)*1.9) : Math.max(x1-x0, z1-z0);
  S.scale = Math.max(16, Math.min(200, spread*1.35));
}
let prev = performance.now(), fAcc = 0, fN = 0;
const ease = (c,t,dt,tau) => c + (t-c)*(1 - Math.exp(-dt/tau));
function frame(t){
  const dt = Math.min(0.05, (t-prev)/1000) || 0.016;
  prev = t;
  fAcc += dt; fN++;
  if(fAcc > 0.5){
    document.getElementById('perf').textContent = Math.round(fN/fAcc)+' fps / '+S.pots.length+' pots';
    fAcc = 0; fN = 0;
  }
  resize();
  A.k     = ease(A.k,     S.k,     dt, 0.075);
  A.scale = ease(A.scale, S.scale, dt, 0.07);
  A.az    = ease(A.az,    S.az,    dt, 0.07);
  A.el    = ease(A.el,    S.el,    dt, 0.07);
  A.tx    = ease(A.tx,    S.tx,    dt, 0.07);
  A.tz    = ease(A.tz,    S.tz,    dt, 0.07);
  A.ty    = ease(A.ty,    S.ty,    dt, 0.07);
  A.pitch = ease(A.pitch, S.pitch, dt, 0.09);
  A.secX  = ease(A.secX,  S.secX,  dt, 0.08);
  draw();
  overlay();
  rulers();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════
   12 · KEYBOARD
   ══════════════════════════════════════════════════════════════════ */
const KEYMAP = { v:'select', c:'circle', l:'pill', x:'cut', r:'orbit', h:'hand', z:'zoom' };
addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if(e.code === 'Space'){ spaceDown = true; viewEl.style.cursor = 'grab'; e.preventDefault(); return; }
  if(e.metaKey || e.ctrlKey){
    const k = e.key.toLowerCase();
    if(k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if(k === 'd'){ e.preventDefault(); duplicateSel(); }
    else if(k === 'a'){ e.preventDefault(); S.sel = new Set(S.pots.map(o=>o.id)); sync(); }
    return;
  }
  const k = e.key.toLowerCase();
  if(KEYMAP[k]){ setTool(KEYMAP[k]); return; }
  if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteSel(); return; }
  if(e.key === '1'){ setView('sw'); return; }
  if(e.key === '2'){ setView('se'); return; }
  if(e.key === '3'){ setView('ne'); return; }
  if(e.key === '4'){ setView('nw'); return; }
  if(e.key === '5'){ setView('plan'); return; }
  if(e.key === '6'){ setView('front'); return; }
  if(k === 'f'){ fitView(); say('Fit'); return; }
  if(e.key === 'Escape'){ S.sel.clear(); sync(); return; }
  if(e.key === '['){ S.k = Math.max(0, S.k-0.4); buildOpts(); return; }
  if(e.key === ']'){ S.k = Math.min(12, S.k+0.4); buildOpts(); return; }
});
addEventListener('keyup', e => {
  if(e.code === 'Space'){ spaceDown = false; viewEl.style.cursor = CURSOR[S.tool] || 'crosshair'; }
});
document.getElementById('drawer').onclick = () => panel.classList.toggle('open');

/* ══════════════════════════════════════════════════════════════════
   13 · BOOT
   ══════════════════════════════════════════════════════════════════ */
resize();
document.documentElement.setAttribute('data-theme','light');
setTool('select');
setView('sw');
preset('vases');
fitView();
A.scale = S.scale; A.az = S.az; A.el = S.el; A.tx = S.tx; A.tz = S.tz; A.ty = S.ty; A.k = S.k;
snap(); sync(); buildOpts();
requestAnimationFrame(frame);

})();
</script>
