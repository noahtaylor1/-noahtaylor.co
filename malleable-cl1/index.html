<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malleable CL1 — Noah Taylor</title>
<style>
/* Same plate-and-chrome identity as Malleable: strictly achromatic, Helvetica,
   options bar over [rail | ruled viewport | inspector], status strip beneath. */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --chrome:#ffffff;
  --chrome-2:#f4f4f4;
  --chrome-3:#e9e9e9;
  --rule:rgba(0,0,0,.16);
  --rule-soft:rgba(0,0,0,.08);
  --t1:rgba(0,0,0,.92);
  --t2:rgba(0,0,0,.56);
  --t3:rgba(0,0,0,.34);
  --guide:rgba(0,0,0,.78);
  --sel:#000000;
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --nav-h:56px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#000000;--ink:#ffffff;--chrome:#0b0b0b;--chrome-2:#161616;--chrome-3:#232323;
  --rule:rgba(255,255,255,.18);--rule-soft:rgba(255,255,255,.09);
  --t1:rgba(255,255,255,.94);--t2:rgba(255,255,255,.58);--t3:rgba(255,255,255,.34);
  --guide:rgba(255,255,255,.82);--sel:#ffffff;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-top:var(--nav-h);background:var(--chrome);color:var(--t1);
  font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}

.site-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:30;
  display:flex;align-items:center;justify-content:space-between;padding:0 48px;
  background:var(--chrome);border-bottom:1px solid var(--rule);font-family:var(--font)}
.site-nav a{color:var(--t1);text-decoration:none;transition:color .15s var(--ease)}
.site-nav a:hover{color:var(--t3)}
.nav-logo{font-size:14px;font-weight:500;letter-spacing:.03em}
.nav-links{display:flex;gap:32px;list-style:none;margin:0;padding:0;font-size:13px;letter-spacing:.02em}
@media (max-width:900px) and (min-width:701px){.site-nav{padding:0 24px}.nav-links{gap:22px}}
@media (max-width:700px){.site-nav{padding:0 20px}.nav-links li:not(.keep){display:none}}

#app{display:grid;grid-template-columns:40px 1fr 264px;grid-template-rows:34px 1fr 24px;height:100%}

#opts{grid-column:1/4;grid-row:1;background:var(--chrome);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;padding:0 10px 0 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
#opts .tname{font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:10px;
  white-space:nowrap;flex:none;padding-right:12px;margin-right:12px;border-right:1px solid var(--rule);min-width:104px}
#opts .ogrp{display:flex;align-items:center;gap:7px;flex:none;padding-right:12px;margin-right:12px;
  border-right:1px solid var(--rule-soft);animation:fadein .18s var(--ease)}
#opts .ogrp:last-child{border-right:0}
@keyframes fadein{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
#opts label{font-size:10px;color:var(--t3);white-space:nowrap;text-transform:uppercase;letter-spacing:.18em}
#opts output{font-size:12px;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
#opts input[type=range]{width:84px}

#rail{grid-column:1;grid-row:2/4;background:var(--chrome);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;overflow-y:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.tool{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;flex:none;
  background:none;border-radius:2px;cursor:pointer;color:var(--t1);position:relative;
  transition:background .14s var(--ease),color .14s var(--ease)}
.tool svg{width:17px;height:17px;display:block;transition:transform .16s var(--ease)}
.tool:hover{background:var(--chrome-3)}
.tool:hover svg{transform:scale(1.08)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool[aria-pressed="true"] svg{transform:none}
.tool:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.rail-sep{width:18px;height:1px;background:var(--rule);margin:5px 0;flex:none}

#stage{grid-column:2;grid-row:2;display:grid;grid-template-columns:18px 1fr;grid-template-rows:18px 1fr;
  background:var(--chrome);min-width:0;min-height:0}
#corner{background:var(--chrome-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
#rulerH{border-bottom:1px solid var(--rule);background:var(--chrome-2);display:block;width:100%;height:100%}
#rulerV{border-right:1px solid var(--rule);background:var(--chrome-2);display:block;width:100%;height:100%}
#view{position:relative;overflow:hidden;touch-action:none;background:var(--paper);min-width:0;min-height:0}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#hint{position:absolute;left:12px;bottom:9px;font-size:11.5px;color:var(--t3);pointer-events:none;user-select:none}
#perf{position:absolute;right:12px;bottom:9px;font-size:11px;color:var(--t3);pointer-events:none;
  font-variant-numeric:tabular-nums}

#panel{grid-column:3;grid-row:2/4;background:var(--chrome);border-left:1px solid var(--rule);
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sect{border-bottom:1px solid var(--rule);padding:9px 11px}
.sect h2{margin:0 0 9px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);font-weight:400}
.row{display:flex;align-items:center;gap:7px;margin-bottom:5px;min-width:0}
.row:last-child{margin-bottom:0}
.row label{flex:0 0 72px;font-size:12px;color:var(--t2);min-width:0}
.row output{flex:0 0 34px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;height:14px;-webkit-appearance:none;appearance:none;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
input[type=range]::-moz-range-track{height:1px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;
  background:var(--ink);margin-top:-3.5px;cursor:pointer;transition:transform .12s var(--ease)}
input[type=range]::-moz-range-thumb{width:8px;height:8px;border:0;border-radius:50%;background:var(--ink);cursor:pointer}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.35)}
input[type=range]:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.seg{display:flex;flex:1;border:1px solid var(--rule);border-radius:2px;overflow:hidden;min-width:0}
.seg button{flex:1;min-width:0;padding:4px 2px;background:none;border:0;border-right:1px solid var(--rule);
  cursor:pointer;font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--t2);white-space:nowrap;
  transition:background .14s var(--ease),color .14s var(--ease)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:hover:not([aria-pressed="true"]){background:var(--chrome-3);color:var(--t1)}
.btn{padding:5px 7px;background:none;border:1px solid var(--rule);border-radius:2px;cursor:pointer;
  font-size:12px;font-weight:500;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;
  transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease)}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.pf{display:flex;gap:4px}
.pf button{flex:1;height:26px;display:grid;place-items:center;border:1px solid var(--rule);
  border-radius:2px;background:none;cursor:pointer;transition:background .14s var(--ease)}
.pf button svg{width:17px;height:17px}
.pf button:hover{background:var(--chrome-3)}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);cursor:pointer;padding:3px 0;user-select:none}
.chk input{appearance:none;-webkit-appearance:none;width:10px;height:10px;border:1px solid var(--rule);
  border-radius:1px;margin:0;flex:none;cursor:pointer;transition:background .14s var(--ease)}
.chk input:checked{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--chrome)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.txt{width:100%;background:none;border:0;border-bottom:1px solid var(--rule-soft);padding:4px 0;
  font-size:12px;letter-spacing:.06em;min-width:0;transition:border-color .14s var(--ease)}
.txt:focus{outline:none;border-bottom-color:var(--ink)}
.hint{font-size:11.5px;line-height:1.6;color:var(--t3);margin:7px 0 0}
#selnone{font-size:12px;color:var(--t3);line-height:1.6}

#status{grid-column:2;grid-row:3;border-top:1px solid var(--rule);background:var(--chrome);
  display:flex;align-items:center;gap:15px;padding:0 12px;font-size:11px;color:var(--t2);
  letter-spacing:.02em;overflow:hidden;white-space:nowrap}
#status b{font-weight:500;color:var(--t1)}
#status span{font-variant-numeric:tabular-nums}
#st-msg{color:var(--t1);transition:opacity .3s var(--ease)}
#drawer{display:none}

@media (max-width:880px){
  #app{grid-template-columns:1fr;grid-template-rows:34px 36px 1fr 24px}
  #opts{grid-column:1;grid-row:1;padding-left:max(12px,env(safe-area-inset-left,0px));
    padding-right:max(12px,env(safe-area-inset-right,0px))}
  #rail{grid-column:1;grid-row:2;flex-direction:row;border-right:0;border-bottom:1px solid var(--rule);
    padding:0 max(6px,env(safe-area-inset-left,0px));overflow-x:auto;overflow-y:hidden}
  .rail-sep{width:1px;height:18px;margin:0 4px}
  #stage{grid-column:1;grid-row:3}
  #status{grid-column:1;grid-row:4;padding-left:max(11px,env(safe-area-inset-left,0px));
    padding-right:max(11px,env(safe-area-inset-right,0px))}
  #panel{position:fixed;right:0;bottom:24px;top:calc(70px + var(--nav-h));width:min(248px,86vw);z-index:5;
    transform:translateX(102%);transition:transform .22s var(--ease);box-shadow:-8px 0 26px rgba(0,0,0,.18)}
  #panel.open{transform:none}
  #drawer{display:grid;place-items:center;position:fixed;right:10px;bottom:34px;z-index:6;
    width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);border:0;cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.3)}
  #drawer svg{width:17px;height:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <div id="opts"></div>
  <nav id="rail" aria-label="Tools"></nav>

  <div id="stage">
    <div id="corner"></div>
    <svg id="rulerH" aria-hidden="true"></svg>
    <svg id="rulerV" aria-hidden="true"></svg>
    <div id="view">
      <canvas id="gl"></canvas>
      <svg id="ov" aria-hidden="true"></svg>
      <div id="hint"></div>
      <div id="perf"></div>
    </div>
  </div>

  <aside id="panel" aria-label="Inspector"></aside>

  <div id="status">
    <span>X <b id="st-x">0</b></span>
    <span>Z <b id="st-z">0</b></span>
    <span><b id="st-view">ISO</b></span>
    <span>POTS <b id="st-n">0</b></span>
    <span id="st-fit"></span>
    <span id="st-msg"></span>
  </div>
</div>
<button id="drawer" aria-label="Toggle inspector"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h12M3 9h12M3 13h12"/></svg></button>

<script>
"use strict";
(() => {

/* ══════════════════════════════════════════════════════════════════
   1 · STATE  —  units are inches, matching the standard pot sizes
   ══════════════════════════════════════════════════════════════════ */
/* One scene unit is a centimetre. The standards below are therefore
   60 and 120 mm across and 120 to 240 mm long, which all fit the 250 mm
   cube with room to spare. */
const MM = 1/10;
const BUILD = 250;                     // mm, the X1C's cube, all three axes
const PLATE = { w:BUILD*0.1, d:BUILD*0.1 };   // the bed, in scene units
const DIA   = [6, 12];                 // 60 and 120 mm across
const LEN   = [12, 18, 24];            // 120, 180, 240 mm - 360 will not fit
let uid = 1;

const S = {
  pots:[], sel:new Set(), tool:'select',
  view:'sw', az:-0.62, el:0.52, tx:0, tz:0, scale:62,
  k:3.2, kernel:2, tol:0.12, press:0.5, swell:0, pressMode:true, stampN:0,
  persp:false, fov:0.61, ty:5,
  dia:12, len:24, h:9,
  tt:0.12, bt:0.42, belly:0.62,        // slight top taper, heavier base taper
  /* The modded X1C: a 3 mm wide bead laid 1.5 mm tall. The layer pitch,
     the wall and the rim radius all follow from it, and the base is a
     whole number of those layers so the spiral can start flat. */
  beadW:3, beadH:1.5, relief:0.4, wallBeads:1, baseLayers:1, baseGap:2,
  pitch:1.5/10, shade:4, tone:0.46, ambient:0.22, gap:0.5, fillet:1.5, air:true, stopSink:true, oneWall:true, edges:false, hollow:true, wall:3/10,
  section:false, secX:0,
  grid:false, module:6, snap:false, invert:false,
  steps:100, sliceY:4.5, traceRes:560,
  cap1:'MALLEABLE CL1', cap2:'coil pots', cap3:'nr.001'
};
const A = { k:S.k, scale:S.scale, az:S.az, el:S.el, tx:0, tz:0, ty:5, pitch:S.pitch, secX:0 };

let msgTimer = 0;
function say(t){
  const e = document.getElementById('st-msg');
  e.textContent = t; e.style.opacity = '1';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { e.style.opacity = '0'; }, 2400);
}
/* The fillet in scene units. Stated in millimetres and divided by the
   circular kernel's 0.604 so the number on the slider is the radius
   the corner actually has. */
const FILLET = () => S.fillet*MM/0.604;
/* Base thickness in scene units: a whole number of laid layers. */
const baseH = () => Math.max(1, Math.round(S.baseLayers)) * S.beadH * MM;
const nearest = (v, list) => list.reduce((a,b) => Math.abs(b-v) < Math.abs(a-v) ? b : a);

/* ══════════════════════════════════════════════════════════════════
   2 · POT MODEL
   A pot is a profile swept around a plan skeleton: a point for a
   circle, a segment for a pill. R is the widest radius; the profile
   narrows toward the rim and, more sharply, toward the foot.
   ══════════════════════════════════════════════════════════════════ */
function mkPot(kind, x, z){
  return { id:uid++, kind, x, z, ang:0,
           dia:S.dia, len:S.len, h:S.h,
           tt:S.tt, bt:S.bt, belly:S.belly, op:0, k:-1 };
}
function skel(o){
  const R = o.dia/2;
  if(o.kind === 'circle') return { ax:o.x, az:o.z, bx:o.x, bz:o.z, R };
  const s = Math.max(0, (o.len - o.dia)/2);
  const c = Math.cos(o.ang), si = Math.sin(o.ang);
  return { ax:o.x - c*s, az:o.z - si*s, bx:o.x + c*s, bz:o.z + si*s, R };
}
const blendOf = o => (o.k < 0 ? A.k : o.k);

/* THE OVERLAP STOP
   A pot may press into its neighbour, but not disappear into it. Past
   about four fifths of its own width the socket stops being a socket: the
   wall it is pressing into goes vertical and then undercut, the sliver
   left on the far side thins to nothing, and the coil path has no closed
   loop left to walk. So placement meets a wall first.

   Written as a gap between the two skeletons. A pot of radius Rm is f of
   its own width into one of radius Ro once the near side of Rm has passed
   Ro's surface by 2*f*Rm, that is once the skeletons close to
   Ro + Rm - 2*f*Rm. Both directions are checked, so the big pot cannot
   swallow the small one either. */
const MAX_SINK = 0.8;
function sinkGap(Rm, Ro){
  const s = 1 - 2*MAX_SINK;                      // -0.6 at four fifths
  return Math.max(Ro + s*Rm, Rm + s*Ro, 0);
}
/* Closest pair of points between two segments in plan. */
function segSeg(ax,az,bx,bz, cx,cz,dx,dz){
  const ux=bx-ax, uz=bz-az, vx=dx-cx, vz=dz-cz, wx=ax-cx, wz=az-cz;
  const a=ux*ux+uz*uz, b=ux*vx+uz*vz, c=vx*vx+vz*vz, d=ux*wx+uz*wz, e=vx*wx+vz*wz;
  const D=a*c-b*b;
  let t = (D < 1e-12) ? (c > 1e-12 ? e/c : 0)
                      : Math.max(0, Math.min(1, (a*e-b*d)/D));
  let sA = a > 1e-12 ? Math.max(0, Math.min(1, (b*t-d)/a)) : 0;
  t = c > 1e-12 ? Math.max(0, Math.min(1, (b*sA+e)/c)) : 0;
  return { px:ax+ux*sA, pz:az+uz*sA, qx:cx+vx*t, qz:cz+vz*t };
}
/* How much room is left over every pair: positive is clear, negative is
   too deep. The moved set is rigid, so it is only ever measured against
   the pots that stayed put. */
function sinkSlack(moving){
  const fixed = S.pots.filter(o => moving.indexOf(o) < 0);
  let slack = 1e9;
  for(const m of moving){
    const km = skel(m);
    for(const f of fixed){
      const kf = skel(f);
      const need = sinkGap(km.R, kf.R);
      if(need <= 0) continue;
      const cp = segSeg(km.ax,km.az,km.bx,km.bz, kf.ax,kf.az,kf.bx,kf.bz);
      slack = Math.min(slack, Math.hypot(cp.px-cp.qx, cp.pz-cp.qz) - need);
    }
  }
  return slack;
}
/* The wall. A drag travels as far along its own path as it legally can and
   then stops dead, rather than being shoved out to the nearest legal spot
   - projecting it out let one neighbour hand it to the next and flung the
   pot across the table. What is left of the motion is tried again on each
   axis alone, so a pot slides along the face it has met instead of
   sticking to it.

   The limit is measured against the slack the drag started with, never
   against zero, so a layout that already nests deeper than MAX_SINK stays
   draggable - it just cannot be pushed in any further. */
function dragClamped(base, dx, dz){
  const movers = base.map(b => b.o);
  const put = (fx,fz) => { for(const b of base){ b.o.x = b.x+fx; b.o.z = b.z+fz; } };
  put(0,0);
  const floor = Math.min(0, sinkSlack(movers)) - 1e-6;
  const ok = () => sinkSlack(movers) >= floor;
  put(dx,dz);
  if(!S.stopSink || ok()) return;
  let lo = 0, hi = 1;
  for(let i=0;i<16;i++){ const m=(lo+hi)/2; put(dx*m,dz*m); if(ok()) lo=m; else hi=m; }
  let cx = dx*lo, cz = dz*lo;
  for(const [ax,az] of [[dx*(1-lo),0],[0,dz*(1-lo)]]){
    if(Math.abs(ax)+Math.abs(az) < 1e-9) continue;
    let l=0, h=1;
    for(let i=0;i<12;i++){ const m=(l+h)/2; put(cx+ax*m, cz+az*m); if(ok()) l=m; else h=m; }
    cx += ax*l; cz += az*l;
  }
  put(cx,cz);
}
/* Turning a pill sweeps its skeleton through its neighbours, so the angle
   gets the same treatment along its own one dimension. */
function turnClamped(o, from, to){
  if(!S.stopSink) { o.ang = to; return; }
  o.ang = from;
  const floor = Math.min(0, sinkSlack([o])) - 1e-6;
  o.ang = to;
  if(sinkSlack([o]) >= floor) return;
  let lo=0, hi=1;
  for(let i=0;i<16;i++){ const m=(lo+hi)/2; o.ang = from + (to-from)*m;
    if(sinkSlack([o]) >= floor) lo=m; else hi=m; }
  o.ang = from + (to-from)*lo;
}
/* A pot that has just appeared has no legal place to fall back to, so this
   one does project to the nearest clear spot - bounded, and against the
   pots that were already there. */
function placeClear(moving){
  if(!S.stopSink || !moving.length) return;
  const fixed = S.pots.filter(o => moving.indexOf(o) < 0);
  if(!fixed.length) return;
  for(let pass=0; pass<4; pass++){
    let worst = 0;
    for(const m of moving){
      const km = skel(m);
      let bx=0, bz=0, deepest=0;
      for(const f of fixed){
        const kf = skel(f);
        const need = sinkGap(km.R, kf.R);
        if(need <= 0) continue;
        const cp = segSeg(km.ax,km.az,km.bx,km.bz, kf.ax,kf.az,kf.bx,kf.bz);
        let nx = cp.px-cp.qx, nz = cp.pz-cp.qz;
        const g = Math.hypot(nx,nz);
        if(g >= need || need-g <= deepest) continue;
        deepest = need-g;
        if(g < 1e-6){ const a = Math.atan2(km.az-kf.az, km.ax-kf.ax);
                      bx = Math.cos(a); bz = Math.sin(a); }
        else { bx = nx/g; bz = nz/g; }
      }
      if(deepest <= 0) continue;                 // only the worst, once a pass
      m.x += bx*deepest; m.z += bz*deepest;
      km.ax += bx*deepest; km.bx += bx*deepest;
      km.az += bz*deepest; km.bz += bz*deepest;
      worst = Math.max(worst, deepest);
    }
    if(worst < 1e-4) break;
  }
}
/* A stamp keeps its own shape and presses into everything else. The
   selection is a stamp by default, so moving a pot pushes its neighbours
   around live; op 3 makes a pot a stamp permanently. */
/* A stamp carries the order in which it was applied. A pot is deformed only
   by stamps older than itself, so pressing a second pot never wipes out the
   impression the first one already left — and nothing deforms both ways. */
const isStamp = o => (o.seq || 0) > 0;
const anyStamp = () => S.pots.some(isStamp);

/* profile radius at height fraction t, plus its slope — analytic, so the
   marcher gets a proper Lipschitz bound without extra samples */
function potR(t, R, tt, bt, belly){
  if(t < belly){
    const b = Math.max(belly, 1e-4), u = Math.min(1, Math.max(0, t/b));
    const r0 = R*(1-bt), s = u*u*(3-2*u);
    return [r0 + (R-r0)*s, (R-r0)*6*u*(1-u)/b];
  }
  const b = Math.max(1-belly, 1e-4), u = Math.min(1, Math.max(0, (t-belly)/b));
  const rT = R*(1-tt), s = u*u*(3-2*u);
  return [R + (rT-R)*s, (rT-R)*6*u*(1-u)/b];
}
function segDist2(px,pz, ax,az, bx,bz){
  const vx = bx-ax, vz = bz-az, wx = px-ax, wz = pz-az;
  const L2 = vx*vx + vz*vz;
  const t = L2 < 1e-9 ? 0 : Math.min(1, Math.max(0, (wx*vx + wz*vz)/L2));
  return Math.hypot(wx - vx*t, wz - vz*t);
}
function sdCavityJS(o, x, y, z, wall){
  const s = skel(o);
  const q = segDist2(x,z, s.ax,s.az, s.bx,s.bz);
  const t = Math.min(1, Math.max(0, y/o.h));
  const [r0, drdt] = potR(t, s.R, o.tt, o.bt, o.belly);
  const r = Math.max(r0 - wall, 0.02);
  const drdy = drdt/Math.max(o.h, 1e-4);
  return Math.max((q - r)/Math.sqrt(1 + drdy*drdy), baseH() - y);
}
function sdPotJS(o, x, y, z, sweep){
  const s = skel(o);
  const q = segDist2(x,z, s.ax,s.az, s.bx,s.bz);
  const t = Math.min(1, Math.max(0, y/o.h));
  let [r, drdt] = potR(t, s.R, o.tt, o.bt, o.belly);
  if(sweep && t >= o.belly){ r = s.R; drdt = 0; }
  const drdy = drdt/Math.max(o.h, 1e-4);
  const radial = (q - r)/Math.sqrt(1 + drdy*drdy);
  if(sweep){
    const ex = Math.max(radial,0), ey = Math.max(-y,0);
    return Math.min(Math.max(radial,-y),0) + Math.hypot(ex,ey);
  }
  const fr = Math.min(FILLET()*0.604, Math.min(S.wall*0.5, o.h*0.45));
  const tx = radial + fr, ty = (y - o.h) + fr;
  const dTop = Math.min(Math.max(tx,ty),0) + Math.hypot(Math.max(tx,0),Math.max(ty,0)) - fr;
  const dBot = Math.min(Math.max(radial,-y),0) + Math.hypot(Math.max(radial,0),Math.max(-y,0));
  return Math.max(dTop, dBot);
}
function sminK(a,b,k){
  if(k < 1e-4) return Math.min(a,b);
  if(S.kernel === 0){ const h = Math.max(0,Math.min(1,.5+.5*(b-a)/k)); return b+(a-b)*h - k*h*(1-h); }
  if(S.kernel === 1){ const kk = k*1.5, h = Math.max(kk-Math.abs(a-b),0)/kk; return Math.min(a,b) - h*h*h*kk/6; }
  const kk = k*0.604, ua = Math.max(kk-a,0), ub = Math.max(kk-b,0);
  return Math.max(kk, Math.min(a,b)) - Math.hypot(ua,ub);
}
const smaxK = (a,b,k) => -sminK(-a,-b,k);
function stampsJS(x,y,z, skip, mySeq){
  let d = 1e9;
  for(const o of S.pots){
    if(o === skip || !isStamp(o)) continue;
    if(mySeq > 0 && o.seq >= mySeq) continue;
    let sj = sdPotJS(o,x,y,z,S.air);
    if(o.cutOn) sj = Math.max(sj, x*o.cutNx + z*o.cutNz - o.cutC);
    d = sminK(d, sj, S.wall);                       // stamps merge, as on the GPU
  }
  return d;
}
function sceneJS(x,y,z){
  let d = 1e9;
  const press = anyStamp();
  for(const o of S.pots){
    let sOut = sdPotJS(o,x,y,z);
    let cav = S.hollow ? sdCavityJS(o,x,y,z,S.wall) : 1e9;
    const k = blendOf(o);
    let ke = isStamp(o) ? 0 : k;
    if(press && o.op === 0){
      const q = stampsJS(x,y,z,o,o.seq||0) - S.tol;
      const soft = Math.max(S.press*0.9, FILLET());
      {
        sOut = smaxK(sOut, -q, soft);
        if(S.hollow) cav = smaxK(cav, -(q - S.wall), soft);
        if(S.swell > 0.001){
          const lipW = 1.3 + S.swell*2.6;
          let lip = S.swell*0.26*Math.pow(Math.sin(Math.PI*Math.min(1, Math.max(0, q/lipW))), 1.6);
          if(S.hollow) lip = Math.min(lip, S.wall*0.6);
          sOut -= lip;
          if(S.hollow) cav -= lip;
        }
      }
      if(!isStamp(o)){
        const band = (1.3 + S.press*2.6) + k*1.2;
        const t2 = Math.min(1, Math.max(0, Math.max(q,0)/band));
        ke = k*t2*t2*(3-2*t2);
      }
    }
    const kRim = Math.min(FILLET(), (S.wall*0.5)/0.604);
    let s = S.hollow ? smaxK(sOut, -cav, kRim) : sOut;
    if(o.cutOn) s = Math.max(s, x*o.cutNx + z*o.cutNz - o.cutC);
    const kf = Math.max(ke, FILLET());
    if(o.op === 0) d = sminK(d,s,kf);
    else if(o.op === 1) d = smaxK(d,-s,kf);
    else d = smaxK(d,s,kf);
  }
  return d;
}

/* ══════════════════════════════════════════════════════════════════
   3 · WEBGL — orthographic sphere tracing
   No perspective and no lighting model: the form is read from its
   silhouette and from layer lines at the print pitch, so the result
   stays a drawing rather than a render.
   ══════════════════════════════════════════════════════════════════ */
const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true });

const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0.0,1.0); }`;

const FS = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget;
uniform float uScale;
uniform int uCount, uKernel, uSteps, uShade, uSection, uHollow, uEdges;
uniform float uPitch, uSecX, uWall, uTol, uPress, uSwell, uTone, uBead, uBeadVis, uAmb, uGap, uFillet, uBase;
uniform int uPersp, uAnyPress, uAir;
uniform vec3 uCamPos;
uniform float uK, uPix, uPixA, uStepK;
uniform sampler2D uData;
uniform vec3 uInk, uPaper;
out vec4 outColor;
bool gNoBead;          // occlusion reads the smooth form, not the ribs

float sminK(float a, float b, float k){
  if(k < 1e-4) return min(a,b);
  if(uKernel == 0){ float h = clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h) - k*h*(1.0-h); }
  if(uKernel == 1){ float kk = k*1.5; float h = max(kk-abs(a-b),0.0)/kk; return min(a,b) - h*h*h*kk/6.0; }
  float kk = k*0.604; vec2 u = max(vec2(kk-a, kk-b), 0.0);
  return max(kk, min(a,b)) - length(u);
}
float smaxK(float a, float b, float k){ return -sminK(-a,-b,k); }

float segDist2(vec2 p, vec2 a, vec2 b){
  vec2 v = b-a, w = p-a;
  float L2 = dot(v,v);
  float t = L2 < 1e-9 ? 0.0 : clamp(dot(w,v)/L2, 0.0, 1.0);
  return length(w - v*t);
}
void potR(float t, float R, float tt, float bt, float belly, bool sweep, out float r, out float drdt){
  if(t < belly){
    float b = max(belly, 1e-4), u = clamp(t/b, 0.0, 1.0);
    float r0 = R*(1.0-bt), s = u*u*(3.0-2.0*u);
    r = mix(r0, R, s); drdt = (R-r0)*6.0*u*(1.0-u)/b;
  } else if(sweep){
    r = R; drdt = 0.0;                           // widest section carries upward
  } else {
    float b = max(1.0-belly, 1e-4), u = clamp((t-belly)/b, 0.0, 1.0);
    float rT = R*(1.0-tt), s = u*u*(3.0-2.0*u);
    r = mix(R, rT, s); drdt = (rT-R)*6.0*u*(1.0-u)/b;
  }
}
/* sweep = the stamp's air rights: its widest section carried straight up
   with no top, so whatever it presses into cannot arch over it. The socket
   opens to the sky and the part lifts out instead of locking in. */
float sdPot(vec3 p, vec2 a, vec2 b, float R, float h, float tt, float bt, float belly, float inset, bool sweep){
  float q = segDist2(p.xz, a, b);
  float t = clamp(p.y/h, 0.0, 1.0);
  float r, drdt; potR(t, R, tt, bt, belly, sweep, r, drdt);
  r -= inset;
  float drdy = drdt/max(h, 1e-4);
  float radial = (q - r)*inversesqrt(1.0 + drdy*drdy);
  // every layer is a rounded bead standing proud of the wall; a stamp's
  // sweep stays smooth so the clearance is not cut by the ribs
  if(!sweep && !gNoBead && uBead > 1e-5)
    radial -= uBead*sin(3.14159265*fract(p.y/max(uPitch, 1e-4)));
  if(sweep){                                     // air rights: no top at all
    vec2 e = vec2(radial, -p.y);
    return min(max(e.x, e.y), 0.0) + length(max(e, 0.0));
  }
  /* The rim is the last bead laid, so it is round: half a bead across,
     which on an 8 mm wall is the 4 mm fillet exactly. The foot stays
     square - a first layer is squashed flat onto the bed, not rolled
     over - so only the top corner is eased. */
  float fr = min(uFillet*0.604, min(uWall*0.5, h*0.45));
  vec2 et = vec2(radial + fr, (p.y - h) + fr);
  float dTop = min(max(et.x, et.y), 0.0) + length(max(et, 0.0)) - fr;
  vec2 eb = vec2(radial, -p.y);
  float dBot = min(max(eb.x, eb.y), 0.0) + length(max(eb, 0.0));
  return max(dTop, dBot);
}
/* the cavity is the same profile stepped inward, floored at the wall
   thickness and left open at the rim */
float sdCavity(vec3 p, vec2 a, vec2 b, float R, float h, float tt, float bt, float belly, float wall){
  float q = segDist2(p.xz, a, b);
  float t = clamp(p.y/h, 0.0, 1.0);
  float r, drdt; potR(t, R, tt, bt, belly, false, r, drdt);
  r = max(r - wall, 0.02);
  float drdy = drdt/max(h, 1e-4);
  float radial = (q - r)*inversesqrt(1.0 + drdy*drdy);
  if(!gNoBead && uBead > 1e-5)                     // the bore is ribbed too
    radial -= uBead*sin(3.14159265*fract(p.y/max(uPitch, 1e-4)));
  /* The floor of the bore sits on top of the base, so everything below
     it is solid all the way to the middle - no bore reaching the bed,
     and nothing for the spiral to have to jump across. */
  return max(radial, uBase - p.y);
}

/* Solid outer envelope of the stamps, ignoring one pot. A receiving pot is
   deformed by this inflated by the clearance, so it takes the stamp's shape
   with a gap. Cavities are ignored on purpose: you clear the stamp's
   outside, not its inside. */
float stampsAt(vec3 p, int skip, float mySeq){
  float d = 1e9;
  bool sweep = uAir == 1;
  for(int j=0;j<96;j++){
    if(j >= uCount) break;
    if(j == skip) continue;
    vec4 C = texelFetch(uData, ivec2(j,2), 0);
    if(C.w < 0.5) continue;                      // only stamps press
    if(mySeq > 0.5 && C.w > mySeq - 0.5) continue;   // and only older ones
    vec4 A = texelFetch(uData, ivec2(j,0), 0);
    vec4 B = texelFetch(uData, ivec2(j,1), 0);
    /* The reject is only sound while the cylinder really holds the stamp.
       Air rights carry the widest section straight up with no top, so the
       cylinder is open above and only the floor caps it; capping it at the
       stamp's own height dropped stamps that were still carving, and the
       cut ended on a flat facet wherever the loop happened to drop one. */
    float vcap = sweep ? -p.y : max(-p.y, p.y - B.y);
    float bd = max(segDist2(p.xz, A.xy, A.zw) - B.x - uBead, vcap);
    if(bd > d) continue;
    vec4 Dj = texelFetch(uData, ivec2(j,3), 0);
    /* Stamps merge rather than meet. Two that almost touch would leave a
       membrane of nothing between their sockets - invisible to print and
       a flickering sheet on screen - so they join over a wall thickness
       and the socket becomes one. */
    float sj = sdPot(p, A.xy, A.zw, B.x, B.y, B.z, B.w, C.x, 0.0, sweep);
    // a half that has been cut away presses nothing
    if(Dj.w > 0.5) sj = max(sj, dot(p.xz, Dj.xy) - Dj.z);
    d = sminK(d, sj, uWall);
  }
  return d;
}

float scene(vec3 p){
  float d = 1e9;
  for(int i=0;i<96;i++){
    if(i >= uCount) break;
    vec4 A = texelFetch(uData, ivec2(i,0), 0);
    vec4 B = texelFetch(uData, ivec2(i,1), 0);
    vec4 C = texelFetch(uData, ivec2(i,2), 0);
    int op = int(C.y+0.5);
    float mySeq = C.w;
    bool stamp = mySeq > 0.5;
    float k = C.z;
    // bounding cylinder: cheap reject before the profile maths
    float bd = max(segDist2(p.xz, A.xy, A.zw) - B.x - uBead, max(-p.y, p.y - B.y));
    float pad = uAnyPress == 1 ? 1.4 : 0.4;      // the lip can grow the shape
    if(op == 0 && bd - d > k*1.6 + pad) continue;
    float sOut = sdPot(p, A.xy, A.zw, B.x, B.y, B.z, B.w, C.x, 0.0, false);
    float cav = uHollow == 1
      ? sdCavity(p, A.xy, A.zw, B.x, B.y, B.z, B.w, C.x, uWall) : 1e9;

    /* Blending is dropped only where a stamp is close enough to matter, and
       eased back in beyond that, so the rest of the scene keeps blending and
       nothing changes character when the selection moves. */
    float ke = stamp ? 0.0 : k;

    if(uAnyPress == 1){
      /* Deform the inner surface by the same amount as the outer, offset by
         the wall. Carving only the outside slices the shell open and leaves
         the wall hanging; carrying the cavity along keeps it closed and of
         even thickness as it flows around the stamp. */
      float o = stampsAt(p, i, mySeq) - uTol;
      /* No inside corner is ever sharper than the fillet. A nozzle laying
         an 8 mm bead cannot cut a knife edge into the wall it is passing,
         so the socket meets the wall on a radius whatever the press is
         set to - at zero press too, where this used to be a hard cut. */
      float soft = max(uPress*0.9, uFillet);
      {
        sOut = smaxK(sOut, -o, soft);
        if(uHollow == 1) cav = smaxK(cav, -(o - uWall), soft);
        if(uSwell > 0.001){
          float lipW = 1.3 + uSwell*2.6;
          float u = clamp(o/lipW, 0.0, 1.0);
          float lip = uSwell*0.26*pow(sin(3.14159265*u), 1.6);
          if(uHollow == 1) lip = min(lip, uWall*0.6);  // never thin the wall away
          sOut -= lip;
          if(uHollow == 1) cav -= lip;
        }
      }
      float band = (1.3 + uPress*2.6) + k*1.2;
      if(!stamp) ke = k*smoothstep(0.0, band, max(o, 0.0));
    }
    /* and the inner lip with it, so the two radii meet in the middle of
       the wall and the rim reads as one rolled bead rather than a tube */
    float kRim = min(uFillet, (uWall*0.5)/0.604);
    float s = uHollow == 1 ? smaxK(sOut, -cav, kRim) : sOut;
    /* One wall per pot. Where the neighbours have cut a pot into more
       than one piece, every piece but the biggest is taken off by a
       vertical plane that runs to the ground, so each layer closes as a
       single loop and the thing can be spiralled. */
    vec4 Dv = texelFetch(uData, ivec2(i,3), 0);
    if(Dv.w > 0.5) s = max(s, dot(p.xz, Dv.xy) - Dv.z);
    /* The fillet is a floor under every join, the plain union included.
       Stamps carry ke = 0 so they used to meet their host on a hard min,
       and the silhouette came to a point where the two crossed - the cusp
       no nozzle could ever lay. A circular arc of radius r only closes a
       gap narrower than (2-sqrt2)*r, which is 2.34 mm at four, so the
       clearance between nested pots stays open. */
    float kf = max(ke, uFillet);
    if(op == 0) d = sminK(d, s, kf);
    else if(op == 1) d = smaxK(d, -s, kf);
    else d = smaxK(d, s, kf);
  }
  if(uSection == 1) d = max(d, p.z - uSecX);
  return d;
}
float occlusion(vec3 p, vec3 n){
  /* Three taps is plenty once the result is posterised. They reach much
     further than one bead, so sampling the ribbed field would land each tap
     on a different rib and come back as speckle. */
  gNoBead = true;
  float occ = 0.0, sca = 1.0;
  for(int i=0;i<3;i++){
    float h = 0.12 + 1.15*float(i)/2.0;
    occ += (h - scene(p + n*h))*sca;
    sca *= 0.7;
  }
  gNoBead = false;
  return clamp(1.0 - 1.1*occ, 0.0, 1.0);
}
vec3 normalAt(vec3 p, float e){
  // smooth form only: a normal that follows every rib makes posterised
  // shading flip band to band and the wall turns to speckle
  gNoBead = true;
  vec2 h = vec2(1.0,-1.0)*0.5773*e;
  vec3 n = normalize(h.xyy*scene(p+h.xyy) + h.yyx*scene(p+h.yyx)
                   + h.yxy*scene(p+h.yxy) + h.xxx*scene(p+h.xxx));
  gNoBead = false;
  return n;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  vec3 ro, rd;
  if(uPersp == 1){
    ro = uCamPos;
    rd = normalize(uRight*uv.x + uUp*uv.y + uFwd*uK);
  } else {
    ro = uTarget + uRight*(uv.x*uScale) + uUp*(uv.y*uScale) - uFwd*180.0;
    rd = uFwd;
  }
  float px = uPix;

  float t = 0.0, minD = 1e9, minR = 1e9;
  bool hit = false;
  vec3 pos = ro;
  for(int i=0;i<256;i++){
    if(i >= uSteps) break;
    pos = ro + rd*t;
    float d = scene(pos);
    px = uPersp == 1 ? max(uPixA*t, 1e-4) : uPix;
    minD = min(minD, d);
    minR = min(minR, d/px);
    if(d < px*0.4){ hit = true; break; }
    t += max(d*uStepK, px*0.25);
    if(t > 900.0) break;
  }

  vec3 col = uPaper;
  if(hit){
    col = uInk;
    vec3 n = vec3(0.0);
    bool needN = uEdges == 1 || uShade > 0;
    if(needN) n = normalAt(pos, px*1.1);

    /* Posterised tone first, so it is the ground the line work sits on:
       a fixed number of flat steps from one side light, darkened where the
       form closes in on itself. Banding keeps it a drawing, not a render. */
    if(uShade > 0 && uTone > 0.001){
      float ndl = dot(n, normalize(vec3(-0.58, 0.54, 0.61)));
      float f = clamp(ndl, 0.0, 1.0);
      f *= mix(1.0, occlusion(pos, n), 0.55);
      /* The beads are lit analytically rather than through the normal, so
         they stay clean at any zoom: crown bright, seam dark, flattening to
         the mean once a bead is smaller than a pixel. */
      if(uPitch > 0.001){
        float ph = pos.y/uPitch;
        float crown = 0.5 + 0.5*cos(6.2831853*fract(ph));
        crown = mix(crown, 0.5, smoothstep(0.18, 0.5, fwidth(ph)));
        f *= 0.82 + 0.26*crown;
      }
      // an ambient floor, so the deepest tone is shadow and not a void
      f = uAmb + (1.0 - uAmb)*f;
      float steps = float(uShade);
      float q = clamp(floor(f*steps + 0.5)/steps, 0.0, 1.0);
      col = mix(uInk, uPaper, q*uTone);
    }
    /* The bead seams. Once they fall below a pixel they resolve to the
       average tone the ribbing would make rather than disappearing, so a
       print still reads as a print when the whole piece is in frame; where
       the relief is modelled the drawn seam steps back out of its way. */
    if(uPitch > 0.001){
      float ly = pos.y/uPitch;
      float w = fwidth(ly);
      float g = abs(fract(ly) - 0.5)/max(w, 1e-5);
      float sharp = 1.0 - smoothstep(0.18, 0.78, g);
      float cov = mix(sharp, 0.24, smoothstep(0.20, 0.55, w));
      cov *= 1.0 - uBeadVis*0.7;
      bool onCut = uSection == 1 && abs(pos.z - uSecX) < px*1.5;
      // the join between two beads sits in shadow; drawing it toward the
      // paper lit every seam white, which is what made overhangs glare
      if(!onCut) col = mix(col, uInk, cov*0.45);
    }
    // crease line where the surface folds — the rim, and where forms meet
    if(uEdges == 1){
      float cr = length(fwidth(n));
      float facing = abs(dot(n, rd));
      float e = smoothstep(0.45, 1.25, cr)*smoothstep(0.06, 0.28, facing);
      col = mix(col, uPaper, e*0.9);
    }
    if(uSection == 1 && abs(pos.z - uSecX) < px*1.5) col = uInk;   // poché the cut face
  } else {
    float cov = clamp(minR/0.8, 0.0, 1.0);
    col = mix(uInk, uPaper, cov);
    /* A ray that threads the clearance between two parts has passed close
       to both, so the slot is shaded instead of reading as a white seam. */
    if(uGap > 0.001){
      float near = clamp(minD/(uTol*4.0 + 0.2), 0.0, 1.0);
      near = near*near*(3.0 - 2.0*near);
      col = mix(col, mix(col, uInk, 0.55), uGap*(1.0 - near));
    }
  }
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

let prog, uni = {}, tex, texData = new Float32Array(96*4*4), ok = true;
function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
function initGL(){
  if(!gl){ ok = false; return; }
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  for(const n of ['uRes','uRight','uUp','uFwd','uTarget','uScale','uCount','uKernel','uSteps',
                  'uShade','uSection','uHollow','uEdges','uPitch','uSecX','uWall','uTol','uPress','uSwell','uTone','uBead','uAmb','uGap','uFillet','uBase',
                  'uPersp','uAnyPress','uAir','uBeadVis','uCamPos','uK','uPix','uPixA','uStepK','uData','uInk','uPaper'])
    uni[n] = gl.getUniformLocation(prog, n);
  gl.bindVertexArray(gl.createVertexArray());
  tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, 96, 4);
  gl.uniform1i(uni.uData, 0);
}
try { initGL(); } catch(e){ ok = false; console.error(e); }

function upload(){
  const n = Math.min(S.pots.length, 96);
  for(let i=0;i<n;i++){
    const o = S.pots[i], s = skel(o);
    let q = i*4;      texData[q]=s.ax; texData[q+1]=s.az; texData[q+2]=s.bx; texData[q+3]=s.bz;
    q = (96+i)*4;     texData[q]=s.R;  texData[q+1]=o.h;  texData[q+2]=o.tt;  texData[q+3]=o.bt;
    q = (192+i)*4;    texData[q]=o.belly; texData[q+1]=o.op; texData[q+2]=blendOf(o);
                      texData[q+3]=o.seq || 0;
    // the vase cut: keep dot(p.xz, n) <= c
    q = (288+i)*4;    texData[q]=o.cutNx||0; texData[q+1]=o.cutNz||0;
                      texData[q+2]=o.cutC||0; texData[q+3]=o.cutOn ? 1 : 0;
  }
  if(n) for(let r=0;r<4;r++) gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, r, n, 1, gl.RGBA, gl.FLOAT, texData, r*96*4);
  return n;
}
function themeColors(){
  const cs = getComputedStyle(document.documentElement);
  const toRGB = v => { v = v.trim();
    return v.startsWith('#') ? [parseInt(v.slice(1,3),16)/255, parseInt(v.slice(3,5),16)/255, parseInt(v.slice(5,7),16)/255]
                             : [0,0,0]; };
  return { ink: toRGB(cs.getPropertyValue('--ink')), paper: toRGB(cs.getPropertyValue('--paper')) };
}

/* ── camera basis ─────────────────────────────────────────────────── */
function basis(){
  const ce = Math.cos(A.el), se = Math.sin(A.el);
  const eye = [ce*Math.sin(A.az), se, ce*Math.cos(A.az)];        // target → camera
  const upRef = Math.abs(A.el) > 1.45 ? [0,0,-1] : [0,1,0];
  let rx = upRef[1]*eye[2] - upRef[2]*eye[1];
  let ry = upRef[2]*eye[0] - upRef[0]*eye[2];
  let rz = upRef[0]*eye[1] - upRef[1]*eye[0];
  let L = Math.hypot(rx,ry,rz) || 1; rx/=L; ry/=L; rz/=L;
  const ux = eye[1]*rz - eye[2]*ry, uy = eye[2]*rx - eye[0]*rz, uz = eye[0]*ry - eye[1]*rx;
  return { right:[rx,ry,rz], up:[ux,uy,uz], fwd:[-eye[0],-eye[1],-eye[2]], eye };
}
const viewEl = document.getElementById('view');
const ovEl = document.getElementById('ov');
let vw = 0, vh = 0;
function resize(){
  const r = viewEl.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  vw = r.width; vh = r.height;
  const w = Math.max(1, Math.round(r.width*dpr)), h = Math.max(1, Math.round(r.height*dpr));
  if(cvs.width !== w || cvs.height !== h){ cvs.width = w; cvs.height = h; }
  ovEl.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
}
function draw(){
  if(!ok) return;
  const b = basis(), c = themeColors(), n = upload();
  gl.viewport(0,0,cvs.width,cvs.height);
  gl.useProgram(prog);
  gl.uniform2f(uni.uRes, cvs.width, cvs.height);
  gl.uniform3fv(uni.uRight, b.right);
  gl.uniform3fv(uni.uUp, b.up);
  gl.uniform3fv(uni.uFwd, b.fwd);
  const ci = camInfo();
  gl.uniform3f(uni.uTarget, ci.tgt[0], ci.tgt[1], ci.tgt[2]);
  gl.uniform1f(uni.uScale, A.scale);
  gl.uniform1i(uni.uPersp, S.persp ? 1 : 0);
  gl.uniform1i(uni.uAnyPress, anyStamp() ? 1 : 0);
  gl.uniform1i(uni.uAir, S.air ? 1 : 0);
  gl.uniform3fv(uni.uCamPos, ci.persp ? ci.cam : ci.tgt);
  gl.uniform1f(uni.uK, ci.k);
  gl.uniform1f(uni.uPix, A.scale/Math.max(1,cvs.height));
  gl.uniform1f(uni.uPixA, 1/(ci.k*Math.max(1,cvs.height)));

  gl.uniform1i(uni.uCount, n);
  gl.uniform1i(uni.uKernel, S.kernel);
  /* Ribbing finer than a few pixels only turns into moire, so the relief
     fades out as the bead approaches the pixel and the drawn line takes
     over instead. */
  const pitchPx = (S.pitch*cvs.height)/Math.max(A.scale, 1e-4);
  const beadFade = Math.max(0, Math.min(1, (pitchPx - 2.5)/4));
  /* The stride shortens when beads or a press are live, so the same step
     count no longer reaches as far and the model turns translucent. Scale
     the budget by the stride instead of cutting it. */
  const stride = Math.min(anyStamp() && S.press > 0.001 ? 0.52 : 1.0,
                          S.relief > 0.01 && beadFade > 0 ? 0.45 : 1.0);
  const budget = Math.round((dragging ? S.steps*0.8 : S.steps)/stride);
  gl.uniform1i(uni.uSteps, Math.max(48, Math.min(256, budget)));
  gl.uniform1i(uni.uShade, S.shade);
  gl.uniform1i(uni.uSection, S.section ? 1 : 0);
  gl.uniform1i(uni.uHollow, S.hollow ? 1 : 0);
  gl.uniform1i(uni.uEdges, S.edges ? 1 : 0);
  gl.uniform1f(uni.uPitch, A.pitch);
  gl.uniform1f(uni.uSecX, A.secX);
  gl.uniform1f(uni.uWall, S.wall);
  /* The base is a whole number of layers so the spiral can run flat out
     from the middle and then climb into the wall without a step. */
  gl.uniform1f(uni.uBase, Math.max(1, Math.round(S.baseLayers)) * S.beadH * MM);
  gl.uniform1f(uni.uTol, S.tol);
  gl.uniform1f(uni.uPress, S.press);
  gl.uniform1f(uni.uSwell, S.swell);
  gl.uniform1f(uni.uTone, S.tone);
  gl.uniform1f(uni.uAmb, S.ambient);
  gl.uniform1f(uni.uGap, S.gap);
  /* The stated radius is the real one: the circular kernel's arc is
     0.604*k across, so the millimetres are divided back out. */
  gl.uniform1f(uni.uFillet, S.fillet*MM/0.604);
  gl.uniform1f(uni.uBead, S.relief*S.beadH*MM*0.45*beadFade);
  gl.uniform1f(uni.uBeadVis, S.relief > 0.01 ? beadFade : 0);
  gl.uniform1f(uni.uStepK, stride);
  gl.uniform3fv(uni.uInk, c.ink);
  gl.uniform3fv(uni.uPaper, c.paper);
  gl.clearColor(c.paper[0], c.paper[1], c.paper[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* One camera, two projections. k is the focal term: at distance k*scale a
   perspective frame covers the same height the orthographic one does, so
   switching projection keeps the framing and only changes the depth cue. */
function camInfo(){
  const b = basis();
  const tgt = [A.tx, A.ty, A.tz];
  const k = 0.5/Math.tan(S.fov*0.5);
  if(!S.persp) return { b, tgt, k, persp:false };
  const D = A.scale*k;
  return { b, tgt, k, persp:true, D,
           cam:[tgt[0]+b.eye[0]*D, tgt[1]+b.eye[1]*D, tgt[2]+b.eye[2]*D] };
}
function rayFor(sx,sy){
  const ci = camInfo(), b = ci.b;
  const ux = (sx - vw/2)/vh, uy = -(sy - vh/2)/vh;
  if(!ci.persp){
    return { o:[ ci.tgt[0] + b.right[0]*ux*A.scale + b.up[0]*uy*A.scale - b.fwd[0]*180,
                 ci.tgt[1] + b.right[1]*ux*A.scale + b.up[1]*uy*A.scale - b.fwd[1]*180,
                 ci.tgt[2] + b.right[2]*ux*A.scale + b.up[2]*uy*A.scale - b.fwd[2]*180 ],
             d: b.fwd };
  }
  const dx = b.right[0]*ux + b.up[0]*uy + b.fwd[0]*ci.k;
  const dy = b.right[1]*ux + b.up[1]*uy + b.fwd[1]*ci.k;
  const dz = b.right[2]*ux + b.up[2]*uy + b.fwd[2]*ci.k;
  const L = Math.hypot(dx,dy,dz) || 1;
  return { o: ci.cam, d:[dx/L, dy/L, dz/L] };
}
function worldToScreen(x,y,z){
  const ci = camInfo(), b = ci.b;
  if(!ci.persp){
    const rx = x-ci.tgt[0], ry = y-ci.tgt[1], rz = z-ci.tgt[2];
    const u = rx*b.right[0] + ry*b.right[1] + rz*b.right[2];
    const v = rx*b.up[0] + ry*b.up[1] + rz*b.up[2];
    return { x: u/A.scale*vh + vw/2, y: -v/A.scale*vh + vh/2 };
  }
  const rx = x-ci.cam[0], ry = y-ci.cam[1], rz = z-ci.cam[2];
  const c = rx*b.fwd[0] + ry*b.fwd[1] + rz*b.fwd[2];
  if(c < 0.05) return { x:-99999, y:-99999 };          // behind the camera
  const a = rx*b.right[0] + ry*b.right[1] + rz*b.right[2];
  const e = rx*b.up[0] + ry*b.up[1] + rz*b.up[2];
  return { x: (a/c*ci.k)*vh + vw/2, y: -(e/c*ci.k)*vh + vh/2 };
}
function screenToGround(sx,sy){
  const r = rayFor(sx,sy);
  if(Math.abs(r.d[1]) < 1e-4) return null;             // ray runs parallel to the floor
  const t = -r.o[1]/r.d[1];
  if(t <= 0) return null;                              // ground is behind the camera
  return { x: r.o[0] + r.d[0]*t, z: r.o[2] + r.d[2]*t };
}
const snapG = (p, invert) => {
  const on = S.snap !== !!invert;
  if(!on || !p) return p;
  const g = S.module/2;
  return { x: Math.round(p.x/g)*g, z: Math.round(p.z/g)*g };
};

/* ══════════════════════════════════════════════════════════════════
   4 · HISTORY + EDIT OPS
   ══════════════════════════════════════════════════════════════════ */
const hist = []; let histAt = -1;
function snap(){
  const j = JSON.stringify({ pots:S.pots, uid });
  if(hist[histAt] === j) return;
  hist.length = histAt+1; hist.push(j); histAt = hist.length-1;
  if(hist.length > 60){ hist.shift(); histAt--; }
}
function restore(i){
  if(i < 0 || i >= hist.length) return;
  const d = JSON.parse(hist[i]);
  S.pots = d.pots; uid = d.uid; S.sel.clear(); histAt = i; sync();
}
const undo = () => { restore(histAt-1); say('Undo'); };
const redo = () => { restore(histAt+1); say('Redo'); };

function remove(id){ S.pots = S.pots.filter(o => o.id !== id); S.sel.delete(id); }
function deleteSel(){ if(!S.sel.size) return; snap(); [...S.sel].forEach(remove); S.sel.clear(); sync(); }
function duplicateSel(){
  if(!S.sel.size) return; snap();
  const add = [];
  for(const id of S.sel){
    const o = S.pots.find(p => p.id === id); if(!o) continue;
    const c = JSON.parse(JSON.stringify(o)); c.id = uid++; c.x += 6; c.z += 6; add.push(c);
  }
  S.pots.push(...add); placeClear(add); S.sel = new Set(add.map(o => o.id)); sync();
}
function setOp(v){
  if(!S.sel.size){ say('Select a pot first'); return; }
  snap();
  for(const id of S.sel){
    const o = S.pots.find(p => p.id === id); if(!o) continue;
    if(v === 3){ if(!(o.seq > 0)) o.seq = ++S.stampN; o.op = 0; }
    else { o.op = v; if(v === 0) o.seq = 0; }
  }
  sync(); say(['Unite','Minus front','Intersect','Stamp'][v]);
}
function order(dir){
  if(!S.sel.size) return; snap();
  const picked = S.pots.filter(o => S.sel.has(o.id));
  const rest = S.pots.filter(o => !S.sel.has(o.id));
  S.pots = dir > 0 ? [...rest,...picked] : [...picked,...rest];
  sync();
}
function clearAll(){ snap(); S.pots = []; S.sel.clear(); sync(); }
/* Volume pick: sphere-trace the same field the shader draws, then attribute
   the hit to whichever pot's own surface is nearest. Works from any angle,
   so a pot can be grabbed by its body and not only by its footprint. */
function pickRay(sx, sy){
  if(!S.pots.length) return null;
  const r = rayFor(sx,sy);
  const eps = Math.max(0.01, A.scale/vh*0.5);
  let t = 0;
  for(let i=0;i<200;i++){
    const x = r.o[0] + r.d[0]*t, y = r.o[1] + r.d[1]*t, z = r.o[2] + r.d[2]*t;
    let d = sceneJS(x,y,z);
    if(S.section) d = Math.max(d, z - S.secX);
    if(d < eps){
      let best = null, bd = Infinity;
      for(const o of S.pots){
        const q = sdPotJS(o,x,y,z);
        if(q < bd){ bd = q; best = o.id; }
      }
      return best;
    }
    t += Math.max(d, eps*0.5);
    if(t > 900) break;
  }
  return null;
}
function pick(x,z){
  let best = null, bd = Infinity;
  for(const o of S.pots){
    const s = skel(o);
    const d = segDist2(x,z, s.ax,s.az, s.bx,s.bz) - s.R;
    if(d < bd){ bd = d; best = o.id; }
  }
  return bd < 1.2 ? best : null;
}

/* ══════════════════════════════════════════════════════════════════
   5 · POINTER
   ══════════════════════════════════════════════════════════════════ */
let drag = null, dragging = false, spaceDown = false, hoverG = null;

viewEl.addEventListener('pointerdown', e => {
  viewEl.setPointerCapture(e.pointerId);
  const r = viewEl.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const g = snapG(screenToGround(sx,sy), e.ctrlKey);
  dragging = true;

  if(e.button === 1 || spaceDown || S.tool === 'hand'){
    drag = { mode:'pan', sx, sy, tx:A.tx, tz:A.tz }; return;
  }
  if(e.button !== 0) return;
  if(S.tool === 'orbit' || e.shiftKey && S.tool === 'select'){
    drag = { mode:'orbit', sx, sy, az:S.az, el:S.el }; return;
  }
  if(S.tool === 'zoom'){
    S.scale = Math.max(12, Math.min(260, S.scale*(e.altKey ? 1.5 : 1/1.5)));
    return;
  }
  if(S.tool === 'select'){
    const id = pickRay(sx, sy) ?? (g ? pick(g.x, g.z) : null);
    if(id){
      if(e.shiftKey) S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
      else if(!S.sel.has(id)){ S.sel.clear(); S.sel.add(id); }
      if(g){
        drag = { mode:'move', g, start:[...S.sel].map(i => {
          const o = S.pots.find(p => p.id === i);
          return { o, x:o.x, z:o.z };
        })};
      }
      snap();
    } else {
      if(!e.shiftKey) S.sel.clear();
      drag = { mode:'orbit', sx, sy, az:S.az, el:S.el };   // empty space orbits
    }
    sync(); return;
  }
  if(!g){ say('Switch to a plan or iso view to place pots'); return; }

  switch(S.tool){
    case 'circle': case 'cut': {
      const o = mkPot('circle', g.x, g.z);
      o.op = (S.tool === 'cut' || e.altKey) ? 1 : 0;
      S.pots.push(o); S.sel.clear(); S.sel.add(o.id);
      drag = { mode:'place', o, g }; snap(); sync(); return;
    }
    case 'pill': {
      const o = mkPot('pill', g.x, g.z);
      o.op = e.altKey ? 1 : 0;
      S.pots.push(o); S.sel.clear(); S.sel.add(o.id);
      drag = { mode:'aim', o, g }; snap(); sync(); return;
    }
  }
});

viewEl.addEventListener('pointermove', e => {
  const r = viewEl.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const raw = screenToGround(sx,sy);
  const g = snapG(raw, e.ctrlKey);
  hoverG = raw;
  if(raw){
    document.getElementById('st-x').textContent = raw.x.toFixed(1);
    document.getElementById('st-z').textContent = raw.z.toFixed(1);
  }
  if(!drag) return;

  switch(drag.mode){
    case 'pan': {
      const b = basis();
      const dx = -(sx-drag.sx)/vh*A.scale, dy = (sy-drag.sy)/vh*A.scale;
      S.tx = drag.tx + b.right[0]*dx + b.up[0]*dy;
      S.tz = drag.tz + b.right[2]*dx + b.up[2]*dy;
      A.tx = S.tx; A.tz = S.tz;
      break;
    }
    case 'orbit': {
      S.az = drag.az + (sx-drag.sx)*0.008;
      S.el = Math.max(-1.50, Math.min(1.553, drag.el + (sy-drag.sy)*0.006));
      S.view = 'free';
      document.getElementById('st-view').textContent = 'FREE';
      break;
    }
    case 'move': {
      if(!g) break;
      const dx = g.x-drag.g.x, dz = g.z-drag.g.z;
      dragClamped(drag.start, dx, dz);
      break;
    }
    case 'place': { if(g){ drag.o.x = g.x; drag.o.z = g.z; placeClear([drag.o]); } break; }
    case 'aim': {
      if(!g) break;
      let a = Math.atan2(g.z-drag.g.z, g.x-drag.g.x);
      if(e.shiftKey) a = Math.round(a/(Math.PI/12))*(Math.PI/12);
      if(Math.hypot(g.x-drag.g.x, g.z-drag.g.z) > 0.6) turnClamped(drag.o, drag.o.ang, a);
      break;
    }
  }
});
function endDrag(){
  dragging = false;
  if(!drag) return;
  drag = null;
  snap(); sync();
}
viewEl.addEventListener('pointerup', endDrag);
viewEl.addEventListener('pointercancel', endDrag);
viewEl.addEventListener('pointerleave', () => { hoverG = null; });
viewEl.addEventListener('wheel', e => {
  e.preventDefault();
  S.scale = Math.max(12, Math.min(260, S.scale*Math.exp(e.deltaY*0.0014)));
}, { passive:false });

/* ══════════════════════════════════════════════════════════════════
   6 · OVERLAY + RULERS
   ══════════════════════════════════════════════════════════════════ */
const rhEl = document.getElementById('rulerH');
const rvEl = document.getElementById('rulerV');
const esc = t => String(t).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function rulers(){
  const rh = rhEl.getBoundingClientRect(), rv = rvEl.getBoundingClientRect();
  if(!rh.width || !rv.height) return;
  rhEl.setAttribute('viewBox', `0 0 ${rh.width} ${rh.height}`);
  rvEl.setAttribute('viewBox', `0 0 ${rv.width} ${rv.height}`);
  rhEl.style.color = 'var(--t1)'; rvEl.style.color = 'var(--t1)';
  if(S.view !== 'plan' && S.view !== 'front'){ rhEl.innerHTML = ''; rvEl.innerHTML = ''; return; }
  const H = rh.height, V = rv.width, step = S.module;
  let h = '', v = '';
  for(let x=-PLATE.w; x<=PLATE.w; x+=step){
    const p = worldToScreen(x, 0, S.view === 'plan' ? 0 : 0);
    if(p.x < -20 || p.x > rh.width+20) continue;
    h += `<path d="M${p.x.toFixed(1)} ${H*0.3}V${H}" stroke="currentColor" stroke-width="1" opacity=".5"/>`
       + `<text x="${p.x+3}" y="${H*0.62}" font-size="8.5" fill="currentColor" opacity=".55" font-family="var(--font)">${x}</text>`;
  }
  const vert = S.view === 'plan'
    ? (z => worldToScreen(0,0,z)) : (y => worldToScreen(0,y,0));
  for(let q=-PLATE.d; q<=PLATE.d; q+=step){
    if(S.view === 'front' && q < 0) continue;
    const p = vert(q);
    if(p.y < -20 || p.y > rv.height+20) continue;
    v += `<path d="M${V*0.3} ${p.y.toFixed(1)}H${V}" stroke="currentColor" stroke-width="1" opacity=".5"/>`
       + `<text x="${V*0.54}" y="${p.y-3}" font-size="8.5" fill="currentColor" opacity=".55" font-family="var(--font)" transform="rotate(-90 ${V*0.54} ${p.y-3})">${q}</text>`;
  }
  rhEl.innerHTML = h; rvEl.innerHTML = v;
}

function overlay(){
  let s = '';
  const hw = PLATE.w/2;                 // still frames the section plane

  /* No plate and no grid. The pots are the drawing; a rectangle of floor
     under them only told you where the origin was. */

  /* A selected pot is drawn as a ghost of its own profile — rings at a few
     heights plus a height stick — so it stays findable even when a nest has
     carved most of it away and there is nothing solid left to see. */
  for(const o of S.pots){
    if(!S.sel.has(o.id)) continue;

    const ux = Math.cos(o.ang), uz = Math.sin(o.ang), nx = -uz, nz = ux;

      let d = '';

        const th = i/48*Math.PI*2;
        const cx = Math.cos(th) >= 0 ? k.bx : k.ax, cz = Math.cos(th) >= 0 ? k.bz : k.az;
        const q = worldToScreen(cx + (Math.cos(th)*ux + Math.sin(th)*nx)*R, y,
                                cz + (Math.cos(th)*uz + Math.sin(th)*nz)*R);

      }
      return d+'Z';
    };

       through the pot read as a wireframe laid over the object rather than
       as a selection. */
    const foot = ring(Math.max(k.R, 0.3), 0.02);
    s += `<path d="${foot}" fill="none" stroke="var(--paper)" stroke-width="2.6" opacity=".75"/>`
       + `<path d="${foot}" fill="none" stroke="var(--guide)" stroke-width="1.1" stroke-dasharray="4 3" opacity=".9"/>`;
  }

  if(S.section && S.view !== 'front'){
    const a = worldToScreen(-hw, 0, A.secX), b = worldToScreen(hw, 0, A.secX);

    s += `<path d="M${a.x} ${a.y}L${b.x} ${b.y}L${b2.x} ${b2.y}L${a2.x} ${a2.y}Z" fill="var(--ink)" fill-opacity=".04" stroke="var(--guide)" stroke-width="1" stroke-dasharray="6 3"/>`;
  }

  // caption row, bottom left of the viewport
  s += `<g fill="var(--t3)" font-family="var(--font)" font-size="9" letter-spacing="1.4">`
     + `<text x="14" y="20">${esc(S.cap1)}</text>`
     + `<text x="14" y="32">${esc(S.cap2)} \u00B7 ${esc(S.cap3)}</text></g>`;
  ovEl.innerHTML = s;
}

/* ── ISO TRACING ────────────────────────────────────────────────────
   Marching squares over a horizontal slice, assembled into closed
   loops. Any inward offset of a shape is just an isoline of its field,
   so the same routine gives the outline, the bead centreline and every
   concentric pass of a base fill. */
function isoLoops(sample, x0, x1, z0, z1, res){
  const nx = Math.max(8, res);
  const nz = Math.max(8, Math.round(res*(z1-z0)/Math.max(x1-x0, 1e-6)));
  const dx = (x1-x0)/nx, dz = (z1-z0)/nz, W = nx+1;
  const g = new Float32Array(W*(nz+1));
  for(let j=0;j<=nz;j++){ const row = j*W, pz = z0+j*dz;
    for(let i=0;i<=nx;i++) g[row+i] = sample(x0+i*dx, pz); }
  /* A crossing always sits on one grid edge, so the edge is its name.
     Matching vertices by rounded coordinates instead let the same point,
     reached from two neighbouring cells by two different float
     expressions, read as two names, and every contour came apart into
     dozens of open scraps. */
  const HID = (i,j) => 2*(j*W+i), VID = (i,j) => 2*(j*W+i)+1;
  const pos = new Map();
  const at = (id) => pos.get(id);
  const ip = (a,b) => a/(a-b);
  const segs = [];
  for(let j=0;j<nz;j++) for(let i=0;i<nx;i++){
    const o = j*W+i, v0=g[o], v1=g[o+1], v2=g[o+W+1], v3=g[o+W];
    let c = 0;
    if(v0<0) c|=8; if(v1<0) c|=4; if(v2<0) c|=2; if(v3<0) c|=1;
    if(c === 0 || c === 15) continue;
    const E0 = () => { const id = HID(i,j);
      if(!pos.has(id)) pos.set(id, [x0+(i+ip(v0,v1))*dx, z0+j*dz]); return id; };
    const E1 = () => { const id = VID(i+1,j);
      if(!pos.has(id)) pos.set(id, [x0+(i+1)*dx, z0+(j+ip(v1,v2))*dz]); return id; };
    const E2 = () => { const id = HID(i,j+1);
      if(!pos.has(id)) pos.set(id, [x0+(i+ip(v3,v2))*dx, z0+(j+1)*dz]); return id; };
    const E3 = () => { const id = VID(i,j);
      if(!pos.has(id)) pos.set(id, [x0+i*dx, z0+(j+ip(v0,v3))*dz]); return id; };
    const push = (a,b) => segs.push([a,b]);
    switch(c){
      case 1: push(E3(),E2()); break;   case 2: push(E2(),E1()); break;
      case 3: push(E3(),E1()); break;   case 4: push(E0(),E1()); break;
      case 6: push(E0(),E2()); break;   case 7: push(E3(),E0()); break;
      case 8: push(E0(),E3()); break;   case 9: push(E0(),E2()); break;
      case 11: push(E0(),E1()); break;  case 12: push(E3(),E1()); break;
      case 13: push(E1(),E2()); break;  case 14: push(E3(),E2()); break;
      case 5: { const m=(v0+v1+v2+v3)/4;
        if(m<0){ push(E0(),E3()); push(E2(),E1()); } else { push(E0(),E1()); push(E3(),E2()); } break; }
      case 10: { const m=(v0+v1+v2+v3)/4;
        if(m<0){ push(E0(),E1()); push(E3(),E2()); } else { push(E0(),E3()); push(E2(),E1()); } break; }
    }
  }
  const map = new Map();
  segs.forEach((sg,i) => { for(const e of [0,1]){
    const k = sg[e]; if(!map.has(k)) map.set(k,[]); map.get(k).push({i,e}); }});

    used[i] = 1;
    const ids = [segs[i][0], segs[i][1]];
    for(const grow of [1,0]){
      while(true){
        const tip = grow ? ids[ids.length-1] : ids[0];
        const cands = map.get(tip) || [];
        let nxt = null;
        for(const c of cands) if(!used[c.i]){ nxt = c; break; }
        if(!nxt) break;
        used[nxt.i] = 1;
        const other = segs[nxt.i][1-nxt.e];
        if(grow) ids.push(other); else ids.unshift(other);
      }
    }
    if(ids.length < 4) continue;
    const line = ids.map(at);
    // close it when the walk came back to where it started
    if(ids[0] !== ids[ids.length-1]) line.push(line[0].slice());
    loops.push(line);
  }
  return loops;
}
/* plan outline: the whole field at the chosen height */
function planSVG(){
  if(!S.pots.length) return null;
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  for(const o of S.pots){
    const k = skel(o), pad = k.R + S.k + 2;
    x0 = Math.min(x0, Math.min(k.ax,k.bx)-pad); x1 = Math.max(x1, Math.max(k.ax,k.bx)+pad);
    z0 = Math.min(z0, Math.min(k.az,k.bz)-pad); z1 = Math.max(z1, Math.max(k.az,k.bz)+pad);
  }
  const y = S.sliceY;
  const loops = isoLoops((x,z) => sceneJS(x, y, z), x0, x1, z0, z1, S.traceRes);
  const f = v => Math.round(v*1000)/1000;
  const ds = loops.map(l => {
    let d = `M${f(l[0][0])} ${f(l[0][1])}`;
    for(let i=1;i<l.length;i++) d += `L${f(l[i][0])} ${f(l[i][1])}`;
    return d+'Z';
  });
  if(!ds.length) return null;
  const ink = S.invert ? '#ffffff' : '#000000', paper = S.invert ? '#000000' : '#ffffff';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f(x0)} ${f(z0)} ${f(x1-x0)} ${f(z1-z0)}" `
       + `width="${f(x1-x0)}" height="${f(z1-z0)}">`
       + `<rect x="${f(x0)}" y="${f(z0)}" width="${f(x1-x0)}" height="${f(z1-z0)}" fill="${paper}"/>`
       + `<path d="${ds.join('')}" fill="${ink}" fill-rule="evenodd"/></svg>`;
}
/* ══════════════════════════════════════════════════════════════════
   GCODE  —  one file per pot, spiral vase
   The base spirals out flat from the middle, then the wall climbs in a
   single unbroken helix: one loop a layer, Z ramped across the loop so
   there is never a seam or a travel move. Written in the dialect of the
   X1C files on this machine - absolute XYZ, M83 relative E, and E given
   as the volume of the bead laid, not a length of filament.
   ══════════════════════════════════════════════════════════════════ */
const GC = {
  bedTemp:80, nozzleTemp:220,          // as big jewl2 runs PLA through the fat nozzle
  travelF:30000, retractF:1800, retract:1.70,
  flow:9.3,                            // mm^3/s; these files run 7.9 to 9.3
  ams:1                                // AMS slot to claim and select; 0 feeds nothing

   carries only the material that spacing holds - otherwise closing the
   turns from 3 to 2mm would put half as much plastic again into the
   same floor. And a packed pass is a plain rectangle, not a bead with
   round sides: its neighbours are pressed against it, so the round ends
   that lineArea subtracts are not there. Spacing times layer is exactly
   the floor it has to fill. */

   layer away from the bed, so insetting it by a bead erases the base

   skeleton only, which is what an offset pass actually follows. */

  const mySeq = o.seq || 0;
  const cs = [];
  if(anyStamp() && o.op === 0)
    for(const f of S.pots){
      if(f === o || f.op !== 0 || (f.seq||0) <= 0.5) continue;
      if(mySeq > 0.5 && (f.seq||0) >= mySeq) continue;
      const r = radAt(f, y, true);
      if(r > 0) cs.push({ k:skel(f), r:r + S.tol });
    }

  return (x,z) => {
    let d = segDist2(x,z, k.ax,k.az, k.bx,k.bz) - rP;
    for(const c of cs)
      d = smaxK(d, -(segDist2(x,z, c.k.ax,c.k.az, c.k.bx,c.k.bz) - c.r), soft);

/* Ramer-Douglas-Peucker. The tracer returns a point every grid cell,

function simplify(line, tol){

    const vx=bx-ax, vz=bz-az, L2=vx*vx+vz*vz;

      const t = L2 > 1e-18 ? Math.max(0, Math.min(1, (px*vx+pz*vz)/L2)) : 0;
      const d = Math.hypot(px - vx*t, pz - vz*t);

    if(far < 0) continue;
    keep[far] = 1; stack.push([a,far], [far,b]);

const loopLen = l => { let t=0; for(let i=1;i<l.length;i++) t += Math.hypot(l[i][0]-l[i-1][0], l[i][1]-l[i-1][1]); return t; };

function orient(loop){

  for(let i=0;i<loop.length-1;i++) a += loop[i][0]*loop[i+1][1] - loop[i+1][0]*loop[i][1];

}
/* Restart a loop at the point on it nearest pt - the point ON it, cut
   into the edge where it falls, not the nearest corner it already had.
   Snapping to an existing vertex left a gap the length of one simplified
   segment, a couple of millimetres, and that gap was drawn: a little
   chord across the start of every layer, stacking up the wall as a
   seam. */
function startAt(loop, pt){
  const l = orient(loop);
  if(!pt) return l;
  const closed = Math.hypot(l[0][0]-l[l.length-1][0], l[0][1]-l[l.length-1][1]) < 1e-9;
  const body = closed ? l.slice(0,-1) : l.slice();
  const n = body.length;
  if(n < 3) return l;
  let bi=0, bd=1e9, bp=null;
  for(let i=0;i<n;i++){
    const a=body[i], b=body[(i+1)%n];
    const vx=b[0]-a[0], vz=b[1]-a[1], L2=vx*vx+vz*vz;
    const t = L2 > 1e-18 ? Math.max(0, Math.min(1, ((pt[0]-a[0])*vx + (pt[1]-a[1])*vz)/L2)) : 0;
    const px=a[0]+vx*t, pz=a[1]+vz*t;
    const d = Math.hypot(px-pt[0], pz-pt[1]);
    if(d < bd){ bd=d; bi=i; bp=[px,pz]; }

  for(let k=1;k<=n;k++) out.push(body[(bi+k)%n].slice());

/* Walk a closed loop at even steps, starting where it comes nearest pt.

   can be blended point for point. */
function resampleLoop(loop, n, startPt){
  const l = startAt(loop, startPt);
  const cum = [0];
  for(let i=1;i<l.length;i++) cum.push(cum[i-1] + Math.hypot(l[i][0]-l[i-1][0], l[i][1]-l[i-1][1]));
  const total = cum[cum.length-1];
  if(!(total > 1e-9)) return null;
  const out = [];
  let j = 0;
  for(let k=0;k<n;k++){
    const target = total*k/n;
    while(j < cum.length-2 && cum[j+1] < target) j++;
    const seg = cum[j+1]-cum[j];
    const t = seg > 1e-12 ? (target-cum[j])/seg : 0;
    out.push([l[j][0] + (l[j+1][0]-l[j][0])*t, l[j][1] + (l[j+1][1]-l[j][1])*t]);

/* The path for one pot, in scene units: [x, z, y] with y the height. */

  const base = baseH();

  const bx0 = Math.min(k.ax,k.bx)-k.R-pad, bx1 = Math.max(k.ax,k.bx)+k.R+pad;
  const bz0 = Math.min(k.az,k.bz)-k.R-pad, bz1 = Math.max(k.az,k.bz)+k.R+pad;
  const res = Math.max(160, Math.min(900, Math.round(S.traceRes*0.8)));

  let last = null;

     enough to be neighbouring passes. Anything further apart is a
     different island, and gets a real travel - retract, hop, rapid -
     rather than a line dragged across the pot. */
  const link = (l) => {
    const l2 = startAt(l, last);
    const jump = last ? Math.hypot(l2[0][0]-last[0], l2[0][1]-last[1]) : 0;
    path.push({x:l2[0][0], z:l2[0][1], y:null, travel: !last ? true : jump > step*1.6});

     from the pass it starts on to the pass outside it, so the radius
     grows smoothly all the way round instead of closing a circle and
     stepping out - which is what put a radial seam and a row of chevrons
     across the bottom. Where an inset breaks a crescent into two the
     blend has nothing to pair with, so those passes are laid on their

        }
        last = [B[0][0], B[0][1]];            // the turn lands on the next pass
        path.push({x:B[0][0], z:B[0][1], y:layer, travel:false});
        continue;
      }
    }
    for(const raw of here){                   // odd pass: lay it as its own loop
      const l = link(raw);
      path[path.length-1].y = layer;
      for(let i=1;i<l.length;i++) path.push({x:l[i][0], z:l[i][1], y:layer, travel:false});
      last = l[l.length-1];

  L.push('M83 ; relative extrusion');
  L.push('M201 X20000 Y20000 Z500 E5000');
  L.push('M203 X500 Y500 Z20 E30');
  L.push('M204 P20000 R5000 T20000');
  L.push('M205 X9.00 Y9.00 Z3.00 E2.50');
  L.push('M106 S0 ; fan off for the first layer');
  L.push('M140 S'+GC.bedTemp+' ; set bed temp');
  L.push('M104 S'+GC.nozzleTemp+' ; set nozzle temp');
  L.push('M190 S'+GC.bedTemp+' ; wait for bed');
  L.push('G28 ; home all axes');
  L.push('M975 S1 ; turn on vibration suppression');
  const A = Math.round(GC.ams);
  if(A > 0){
    /* The AMS dance, in the order the machine's own start gcode does it:
       approach the purge bay, claim the slot, select the tool so the feed
       mechanism actually turns, then release. */
    L.push('G1 X60 F12000 ; approach AMS purge bay');
    L.push('G1 Y245');
    L.push('G1 Y265 F3000');
    L.push('M620 M');
    L.push('M620 S'+A+'A ; claim AMS slot '+A);
    L.push('M109 S'+GC.nozzleTemp);
    L.push('G1 X120 F12000');
    L.push('G1 X20 Y50 F12000');
    L.push('G1 Y-3');
    L.push('T'+A+' ; tool-select, which triggers the physical feed');
    L.push('G1 X54 F12000');
    L.push('G1 Y265');
    L.push('M400');
    L.push('M621 S'+A+'A ; release AMS claim');
  }
  L.push('; bed leveling skipped for this print (no G29 emitted)');
  L.push('M109 S'+GC.nozzleTemp+' ; wait for nozzle temp');
  L.push('G92 E0');
  L.push('M975 S1 ; re-asserted before printing');
  L.push('G1 E-'+GC.retract.toFixed(2)+' F'+GC.retractF+' ; retract before prime move');
  L.push('G1 X18.000 Y1.000 Z'+(layerMM*0.6).toFixed(3)+' F'+GC.travelF+' ; prime line start');
  L.push('G1 E'+GC.retract.toFixed(2)+' F'+GC.retractF+' ; un-retract');
  L.push('G1 Z'+(layerMM*0.5).toFixed(3)+' F'+GC.travelF);
  /* Same prime as the machine's own files - full width of the bed, then
     a wipe across - at this bead's feed rather than their F300, which on
     a 3 mm bead would be twenty cubic millimetres a second. */
  L.push('G1 X239.000 E'+(area*221).toFixed(4)+' F'+F+' ; prime line leg 1');
  L.push('G1 Y12.000 E'+(area*11).toFixed(4)+' F'+Math.round(F/4)+' ; prime line leg 2 (wipe)');
  L.push('G92 E0');
  L.push('M204 S500 ; first-layer acceleration');
  let fanOn = false, prev = null, total = 0, lastPct = -1, travels = 0;
  const n = tp.path.length;
  for(let i=0;i<n;i++){
    const p = tp.path[i];
    if(p.travel){
      travels++;
      L.push('G1 E-'+GC.retract.toFixed(2)+' F'+GC.retractF+' ; retract');
      L.push('G1 Z'+(mm(p.y)+layerMM*2).toFixed(3)+' F'+GC.travelF+' ; hop');
      L.push('G1 X'+PX(p).toFixed(3)+' Y'+PY(p).toFixed(3)+' F'+GC.travelF+' ; travel');
      L.push('G1 Z'+mm(p.y).toFixed(3)+' F'+GC.travelF);
      L.push('G1 E'+GC.retract.toFixed(2)+' F'+GC.retractF+' ; un-retract');
      prev = p; continue;
    }
    if(!prev){ prev = p; continue; }
    const dx = mm(p.x-prev.x), dy = mm(p.z-prev.z), dzm = mm(p.y-prev.y);
    const seg = Math.hypot(dx,dy,dzm);
    if(seg < 1e-4){ prev = p; continue; }
    total += seg;
    // the acceleration stays where the first layer set it, as these files leave it
    if(!fanOn && p.y > baseH()){ L.push('M106 S255 ; part cooling fan'); fanOn = true; }
    const aHere = p.y <= bTop ? aBase : area;
    L.push('G1 X'+PX(p).toFixed(3)+' Y'+PY(p).toFixed(3)+' Z'+mm(p.y).toFixed(3)+' E'+(aHere*seg).toFixed(4)+' F'+F);
    const pct = Math.floor(i/n*100);
    if(pct !== lastPct && pct%5 === 0){ L.push('M73 P'+pct); lastPct = pct; }
    prev = p;
  }
  L.push('; travels: '+travels);
  L.push('M73 P100 R0');
  L.push('M106 S0 ; fan off');
  L.push('G1 E-'+GC.retract.toFixed(2)+' F'+GC.retractF+' ; final retract');
  const zTop = mm(tp.top);
  L.push('G1 Z'+(zTop+10).toFixed(3)+' F'+GC.travelF+' ; park -- raise 10.0mm straight up in place (no XY move)');
  L.push('M104 S0 ; nozzle off');
  L.push('M140 S0 ; bed off');
  L.push('M106 S0 ; fan off');
  L.push('M17 S');
  L.push('M17 Z0.4 ; lower Z motor current before the final clearing move');
  const zClear = Math.min(zTop + 100, BUILD - 5);
  L.push('G1 Z'+zClear.toFixed(3)+' F600 ; clear bed toward base of chamber');
  L.push('G1 Z'+(zClear-2).toFixed(3)+' ; back off 2mm to relieve binding');
  L.push('M400 P100');
  L.push('M17 R ; restore normal Z motor current');
  L.push('M84 ; disable motors');
  L.push('; path length '+total.toFixed(0)+'mm, '+(total*area/1000).toFixed(1)+'cm^3');
  return L.join('\n')+'\n';
}
function exportGcode(){
  if(!S.pots.length){ say('Nothing to slice'); return; }
  say('Slicing '+S.pots.length+' pot'+(S.pots.length>1?'s':'')+'...');
  setTimeout(() => {
    let made = 0;
    S.pots.forEach((o, i) => {
      setTimeout(() => {
        const g = potGcode(o, i);
        if(g){ made++;
          download('malleable-cl1-pot'+(i+1)+'.gcode', new Blob([g], {type:'text/plain'}));
        }
        if(i === S.pots.length-1)
          say(made ? made+' gcode file'+(made>1?'s':'')+' saved' : 'Nothing to slice');
      }, i*350);                        // staggered, or the browser blocks the batch
    });
  }, 16);
}
function exportPlan(){

    if(!svg){ say('Nothing to slice'); return; }
    download('malleable-cl1-plan.svg', new Blob([svg], { type:'image/svg+xml' }));
    say('Plan SVG saved at Z '+S.sliceY.toFixed(1));
  }, 16);
}

const optsEl = document.getElementById('opts');

const oGroup = () => { const g = el('div','ogrp'); optsEl.appendChild(g); return g; };

function oRange(grp, label, min, max, st, get, set, fmt){
  grp.appendChild(el('label',null,label));
  const r = document.createElement('input');
  r.type = 'range'; r.min = min; r.max = max; r.step = st; r.value = get();
  r.setAttribute('aria-label', label);
  const out = el('output',null,String((fmt||(v=>v))(get())));
  r.oninput = () => { set(parseFloat(r.value)); out.textContent = String((fmt||(v=>v))(parseFloat(r.value))); };
  r.onchange = () => snap();
  grp.append(r,out);
}
function oSeg(grp, label, opts, get, set, wide){
  if(label) grp.appendChild(el('label',null,label));
  const seg = el('div','seg');
  seg.style.width = (opts.length*(wide||40))+'px'; seg.style.flex = 'none';
  opts.forEach(([v,t]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t;
    b.setAttribute('aria-pressed', String(get() === v));
    b.onclick = () => { set(v); buildOpts(); buildPanel(); };
    seg.appendChild(b);
  });
  grp.appendChild(seg);
}
function buildOpts(){
  optsEl.innerHTML = '';
  const t = TOOLS.find(x => x && x[0] === S.tool);
  optsEl.appendChild(el('div','tname', t ? t[1] : S.tool));

  if(S.tool === 'circle' || S.tool === 'cut'){
    const g = oGroup();
    oSeg(g,'Dia',DIA.map(d=>[d,String(d)]), ()=>S.dia, v=>{S.dia=v;});
    oRange(g,'Height',6,12,.5, ()=>S.h, v=>{S.h=v;}, v=>v.toFixed(1));
  }
  if(S.tool === 'pill'){
    const g = oGroup();
    oSeg(g,'Width',DIA.map(d=>[d,String(d)]), ()=>S.dia, v=>{S.dia=v;});
    oSeg(g,'Length',LEN.map(l=>[l,String(l)]), ()=>S.len, v=>{S.len=v;});
    oRange(g,'Height',6,12,.5, ()=>S.h, v=>{S.h=v;}, v=>v.toFixed(1));
  }

  const g3 = oGroup();
  oSeg(g3,'Iso',[['sw','SW'],['se','SE'],['ne','NE'],['nw','NW']], ()=>S.view, setView, 40);
  oSeg(g3,'Ortho',[['plan','PLAN'],['front','FRONT']], ()=>S.view, setView, 46);
  oSeg(g3,'Proj',[[false,'ORTHO'],[true,'PERSP']], ()=>S.persp, v=>{ S.persp = v; say(v?'Perspective':'Orthographic'); }, 48);

  const g4 = oGroup();
  oRange(g4,'Layer',0.2,6,.1, ()=>S.beadH, v=>{ S.beadH=v; S.pitch=v*MM; }, v=>v.toFixed(2)+'mm');
  const sn = el('label','chk');
  const si = document.createElement('input');
  si.type = 'checkbox'; si.checked = S.snap;
  si.onchange = () => { S.snap = si.checked; };
  sn.append(si, document.createTextNode('Snap'));
  g4.appendChild(sn);
}

function slider(parent, label, min, max, st, get, set, fmt){

  r.oninput = () => { set(parseFloat(r.value)); out.textContent = String((fmt||(v=>v))(parseFloat(r.value))); };
  r.onchange = () => snap();
  row.append(r,out); parent.appendChild(row);
