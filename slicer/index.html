<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ginger Web Slicer -- nonplanar spiral</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font: 13px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #14171c; color: #cfd6e1; }
  #layout { display: flex; height: 100%; }
  #sidebar { width: 330px; min-width: 330px; display: flex; flex-direction: column;
    background: #1b1f26; border-right: 1px solid #2a3038; }
  #sidebar h1 { font-size: 15px; margin: 0; padding: 12px 14px 8px;
    color: #e8edf5; letter-spacing: 0.3px; }
  #sidebar h1 small { color: #7d8798; font-weight: normal; font-size: 11px; display: block; }
  #actions { padding: 8px 14px; display: flex; gap: 8px; }
  #actions button { flex: 1; padding: 8px 0; border: 0; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer; }
  #slicebtn { background: #2f81f7; color: #fff; }
  #slicebtn:disabled { background: #2a3038; color: #5a6372; cursor: default; }
  #exportbtn { background: #39c46d; color: #08110b; }
  #exportbtn:disabled { background: #2a3038; color: #5a6372; cursor: default; }
  #sendbtn { background: #d29922; color: #14171c; }
  #sendbtn:disabled { background: #2a3038; color: #5a6372; cursor: default; }
  #settings .row input[type=text] {
    width: 150px; background: #14171c; color: #e8edf5; border: 1px solid #303845;
    border-radius: 4px; padding: 3px 6px; font-size: 11px; }
  #filerow { padding: 0 14px 6px; }
  #filerow input { width: 100%; color: #7d8798; font-size: 12px; }
  #modelinfo, #stats { padding: 4px 14px; color: #9aa5b5; font-size: 12px; }
  #stats b { color: #e8edf5; }
  #settings { flex: 1; overflow-y: auto; padding: 4px 8px 20px; }
  #settings details { margin: 4px 0; border: 1px solid #262c35; border-radius: 6px;
    background: #20252d; }
  #settings summary { padding: 6px 10px; cursor: pointer; font-weight: 600;
    color: #aeb9ca; user-select: none; }
  #settings .row { display: flex; align-items: center; justify-content: space-between;
    padding: 3px 10px; gap: 8px; }
  #settings .row span { flex: 1; color: #9aa5b5; }
  #settings .row input[type=number], #settings .row select {
    width: 92px; background: #14171c; color: #e8edf5; border: 1px solid #303845;
    border-radius: 4px; padding: 3px 6px; font-size: 12px; }
  #settings .row input[type=checkbox] { width: 16px; height: 16px; }
  #main { flex: 1; position: relative; }
  #viewport { position: absolute; inset: 0; }
  #status { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 12px;
    background: rgba(20,23,28,0.85); color: #9aa5b5; font-size: 12px;
    border-top: 1px solid #2a3038; }
  #status.err { color: #ff7b72; }
  #dropzone { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; background: rgba(47,129,247,0.12);
    border: 3px dashed #2f81f7; font-size: 22px; color: #2f81f7;
    pointer-events: none; z-index: 5; }
  #dropzone.active { display: flex; }
  #viewtoggle { position: absolute; top: 12px; left: 12px; z-index: 4; display: none;
    background: rgba(27,31,38,0.9); border: 1px solid #2a3038; border-radius: 8px;
    overflow: hidden; }
  #viewtoggle button { background: transparent; color: #9aa5b5; border: 0;
    padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  #viewtoggle button.active { background: #2f81f7; color: #fff; }
  #movetoggle { position: absolute; top: 56px; left: 12px; z-index: 4; display: none;
    max-width: calc(100% - 24px); flex-wrap: wrap;
    background: rgba(27,31,38,0.9); border: 1px solid #2a3038; border-radius: 8px;
    overflow: hidden; }
  #movetoggle button { background: transparent; color: #9aa5b5; border: 0;
    padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  #movetoggle button.active { background: #d29922; color: #14171c; }
  #movetoggle button#botclipbtn.active { background: #2f81f7; color: #fff; }
  #movetoggle button#topclipbtn.active { background: #d29922; color: #14171c; }
  #animbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 40px;
    width: min(520px, 60%); display: none; align-items: center; gap: 10px; z-index: 4;
    background: rgba(27,31,38,0.9); border: 1px solid #2a3038; border-radius: 8px;
    padding: 8px 14px; }
  #animbar button { background: #2f81f7; color: #fff; border: 0; border-radius: 50%;
    width: 30px; height: 30px; font-size: 12px; cursor: pointer; flex: none; }
  #animbar input[type=range] { flex: 1; accent-color: #2f81f7; }
  #legend { position: absolute; top: 12px; right: 12px; width: 190px; display: none;
    background: rgba(27,31,38,0.9); border: 1px solid #2a3038; border-radius: 8px;
    padding: 10px 12px; font-size: 11px; z-index: 4; }
  #legendbar { height: 10px; border-radius: 5px; margin: 6px 0;
    background: linear-gradient(90deg, hsl(0,100%,50%), hsl(60,100%,50%),
      hsl(120,100%,50%), hsl(180,100%,50%), hsl(238,100%,50%)); }
  #legend .lbl { display: flex; justify-content: space-between; color: #9aa5b5; }
  #legend h3 { margin: 0; font-size: 12px; color: #e8edf5; }
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <h1>Ginger Web Slicer
      <small>nonplanar spiral &middot; open-top / open-bottom shells &middot; G1 gcode</small>
    </h1>
    <div id="actions">
      <button id="slicebtn" disabled>Slice</button>
      <button id="exportbtn" disabled>Export gcode</button>
      <button id="sendbtn" disabled title="Upload to the Ginger G1 via your print relay (Printer panel)">Send</button>
    </div>
    <div id="filerow"><input type="file" id="filein" accept=".fbx,.obj,.stl,.3dm"></div>
    <div id="modelinfo">No model loaded.</div>
    <div id="stats"></div>
    <div id="settings"></div>
  </div>
  <div id="main">
    <div id="viewport"></div>
    <div id="viewtoggle">
      <button data-mode="model">Model</button>
      <button data-mode="slice">Slice</button>
      <button data-mode="curve">Curve</button>
      <button data-mode="heat">Heat map</button>
    </div>
    <div id="movetoggle">
      <button id="movebtn" title="Drag the part around the bed (orbit is paused while on)">Move on bed</button>
      <button id="rotatebtn" title="Drag left/right to spin the part about its center (orbit is paused while on)">Rotate</button>
      <button id="botclipbtn" title="Drag up/down to move the bottom clipping plane. Everything below it is cut off -- how you give a rounded bottom a flat footprint.">Bottom plane</button>
      <button id="topclipbtn" title="Drag up/down to move the top clipping plane. Everything above it is cut off -- for a rim that came out a few mm off level.">Top plane</button>
    </div>
    <div id="animbar">
      <button id="animplay" title="Play / pause print animation">&#9654;</button>
      <input id="animslider" type="range" min="0" max="1000" value="1000">
    </div>
    <div id="legend">
      <h3>Heat map -- tight radii</h3>
      <div id="legendbar"></div>
      <div class="lbl"><span id="legendmin"></span></div>
      <div class="lbl"><span id="legendmax"></span></div>
      <div class="lbl" style="margin-top:4px">Red = tight turn radius (adjacent passes crowd together, heat builds up); blue = open curve, more room to cool.</div>
    </div>
    <div id="dropzone">Drop FBX / OBJ / STL / 3DM</div>
    <div id="status"></div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/fflate.min.js"></script>
<script src="vendor/NURBSUtils.js"></script>
<script src="vendor/NURBSCurve.js"></script>
<script src="vendor/FBXLoader.js"></script>
<script src="vendor/STLLoader.js"></script>
<script src="vendor/OBJLoader.js"></script>
<script src="vendor/fbxnurbs.js"></script>
<script src="vendor/rhino3dm.min.js"></script>
<script src="vendor/rhino3dm_wasm_b64.js"></script>
<!-- bump ?v= whenever slicer.js/app.js change, so browsers can't serve a
     stale cached copy (symptom: new buttons visible but doing nothing) -->
<script src="slicer.js?v=4dd03094"></script>
<script src="app.js?v=4dd03094"></script>
</body>
</html>
