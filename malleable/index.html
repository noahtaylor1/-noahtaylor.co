<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malleable — Noah Taylor</title>
<style>
/* Layout: options bar over [tool rail | ruled canvas | inspector], status strip beneath.
   Palette is strictly achromatic — every tone is black at some opacity over white, or the inverse. */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --chrome:#ffffff;
  --chrome-2:#f4f4f4;
  --chrome-3:#e9e9e9;
  --rule:rgba(0,0,0,.16);
  --rule-soft:rgba(0,0,0,.08);
  --t1:rgba(0,0,0,.92);
  --t2:rgba(0,0,0,.56);
  --t3:rgba(0,0,0,.34);
  --guide:rgba(0,0,0,.78);
  --sel:#000000;
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --nav-h:56px;
  color-scheme:light;
}
/* Light is the default on load; the Invert control opts into the dark set. */
:root[data-theme="dark"]{
  --paper:#000000;--ink:#ffffff;--chrome:#0b0b0b;--chrome-2:#161616;--chrome-3:#232323;
  --rule:rgba(255,255,255,.18);--rule-soft:rgba(255,255,255,.09);
  --t1:rgba(255,255,255,.94);--t2:rgba(255,255,255,.58);--t3:rgba(255,255,255,.34);
  --guide:rgba(255,255,255,.82);--sel:#ffffff;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--t1);font:13px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}

/* site nav — same geometry and link set as the rest of noahtaylor.co,
   coloured from this page's own tokens so it works in either theme */
body{padding-top:var(--nav-h)}
.site-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:30;
  display:flex;align-items:center;justify-content:space-between;padding:0 48px;
  background:var(--chrome);border-bottom:1px solid var(--rule);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.site-nav a{color:var(--t1);text-decoration:none;transition:color .15s var(--ease)}
.site-nav a:hover{color:var(--t3)}
.nav-logo{font-size:14px;font-weight:500;letter-spacing:.03em}
.nav-links{display:flex;gap:32px;list-style:none;margin:0;padding:0;font-size:13px;letter-spacing:.02em}
@media (max-width:900px) and (min-width:701px){.site-nav{padding:0 24px}.nav-links{gap:22px}}
@media (max-width:700px){.site-nav{padding:0 20px}.nav-links li:not(.keep){display:none}}

#app{display:grid;grid-template-columns:40px 1fr 264px;grid-template-rows:34px 1fr 24px;height:100%}

/* ── options bar ─────────────────────────────────────────── */
#opts{grid-column:1/4;grid-row:1;background:var(--chrome);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:0;padding:0 10px 0 12px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
#opts .tname{font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:10px;
  white-space:nowrap;flex:none;padding-right:12px;margin-right:12px;border-right:1px solid var(--rule);
  min-width:112px}
#opts .ogrp{display:flex;align-items:center;gap:7px;flex:none;padding-right:12px;margin-right:12px;
  border-right:1px solid var(--rule-soft);animation:fadein .18s var(--ease)}
#opts .ogrp:last-child{border-right:0}
@keyframes fadein{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
#opts label{font-size:10px;color:var(--t3);white-space:nowrap;text-transform:uppercase;letter-spacing:.18em}
#opts output{font-size:12px;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
#opts input[type=range]{width:88px}

/* ── tool rail ───────────────────────────────────────────── */
#rail{grid-column:1;grid-row:2/4;background:var(--chrome);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;overflow-y:auto;
  scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.tool{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;flex:none;
  background:none;border-radius:2px;cursor:pointer;color:var(--t1);position:relative;
  transition:background .14s var(--ease),color .14s var(--ease)}
.tool svg{width:17px;height:17px;display:block;transition:transform .16s var(--ease)}
.tool:hover{background:var(--chrome-3)}
.tool:hover svg{transform:scale(1.08)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool[aria-pressed="true"] svg{transform:none}
.tool:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.tool.grp::after{content:"";position:absolute;right:2px;bottom:2px;width:0;height:0;
  border-left:3px solid transparent;border-bottom:3px solid currentColor;opacity:.6}
.rail-sep{width:18px;height:1px;background:var(--rule);margin:5px 0;flex:none}

/* ── stage: rulers + view ────────────────────────────────── */
#stage{grid-column:2;grid-row:2;display:grid;grid-template-columns:18px 1fr;grid-template-rows:18px 1fr;
  background:var(--chrome);min-width:0;min-height:0}
#corner{background:var(--chrome-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
#rulerH{border-bottom:1px solid var(--rule);background:var(--chrome-2);display:block;width:100%;height:100%}
#rulerV{border-right:1px solid var(--rule);background:var(--chrome-2);display:block;width:100%;height:100%}
#view{position:relative;overflow:hidden;touch-action:none;background:var(--paper);min-width:0;min-height:0}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#hint{position:absolute;left:12px;bottom:9px;font-size:11.5px;color:var(--t3);pointer-events:none;
  user-select:none}
#perf{position:absolute;right:12px;bottom:9px;font-size:11px;color:var(--t3);pointer-events:none;
  font-variant-numeric:tabular-nums}

/* ── inspector ───────────────────────────────────────────── */
#panel{grid-column:3;grid-row:2/4;background:var(--chrome);border-left:1px solid var(--rule);
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sect{border-bottom:1px solid var(--rule);padding:9px 11px}
.sect h2{margin:0 0 9px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);font-weight:400}
.row{display:flex;align-items:center;gap:7px;margin-bottom:5px;min-width:0}
.row:last-child{margin-bottom:0}
.row label{flex:0 0 72px;font-size:12px;color:var(--t2);min-width:0}
.row output{flex:0 0 34px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;height:14px;-webkit-appearance:none;appearance:none;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
input[type=range]::-moz-range-track{height:1px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;
  background:var(--ink);margin-top:-3.5px;cursor:pointer;transition:transform .12s var(--ease)}
input[type=range]::-moz-range-thumb{width:8px;height:8px;border:0;border-radius:50%;background:var(--ink);cursor:pointer}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.35)}
input[type=range]:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.seg{display:flex;flex:1;border:1px solid var(--rule);border-radius:2px;overflow:hidden;min-width:0}
.seg button{flex:1;min-width:0;padding:4px 2px;background:none;border:0;border-right:1px solid var(--rule);
  cursor:pointer;font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--t2);white-space:nowrap;
  transition:background .14s var(--ease),color .14s var(--ease)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:hover:not([aria-pressed="true"]){background:var(--chrome-3);color:var(--t1)}
.btn{padding:5px 7px;background:none;border:1px solid var(--rule);border-radius:2px;cursor:pointer;
  font-size:12px;font-weight:500;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;
  transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease)}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.pf{display:flex;gap:4px}
.pf button{flex:1;height:26px;display:grid;place-items:center;border:1px solid var(--rule);
  border-radius:2px;background:none;cursor:pointer;transition:background .14s var(--ease)}
.pf button svg{width:17px;height:17px}
.pf button:hover{background:var(--chrome-3)}
.pf button:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);cursor:pointer;
  padding:3px 0;user-select:none}
.chk input{appearance:none;-webkit-appearance:none;width:10px;height:10px;border:1px solid var(--rule);
  border-radius:1px;margin:0;flex:none;cursor:pointer;transition:background .14s var(--ease)}
.chk input:checked{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--chrome)}
.chk input:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.txt{width:100%;background:none;border:0;border-bottom:1px solid var(--rule-soft);padding:4px 0;
  font-size:12px;letter-spacing:.06em;min-width:0;transition:border-color .14s var(--ease)}
.txt:focus{outline:none;border-bottom-color:var(--ink)}
.hint{font-size:11.5px;line-height:1.6;color:var(--t3);margin:7px 0 0}
#selnone{font-size:12px;color:var(--t3);line-height:1.6}

/* ── status ──────────────────────────────────────────────── */
#status{grid-column:2;grid-row:3;border-top:1px solid var(--rule);background:var(--chrome);
  display:flex;align-items:center;gap:15px;padding:0 12px;font-size:11px;color:var(--t2);
  letter-spacing:.02em;overflow:hidden;white-space:nowrap}
#status b{font-weight:500;color:var(--t1)}
#status span{font-variant-numeric:tabular-nums}
#st-msg{color:var(--t1);transition:opacity .3s var(--ease)}
#drawer{display:none}

@media (max-width:880px){
  #app{grid-template-columns:1fr;grid-template-rows:34px 36px 1fr 24px}
  #opts{grid-column:1;grid-row:1;padding-left:max(12px,env(safe-area-inset-left,0px));
    padding-right:max(12px,env(safe-area-inset-right,0px))}
  #rail{grid-column:1;grid-row:2;flex-direction:row;border-right:0;border-bottom:1px solid var(--rule);
    padding:0 max(6px,env(safe-area-inset-left,0px));overflow-x:auto;overflow-y:hidden}
  .rail-sep{width:1px;height:18px;margin:0 4px}
  #stage{grid-column:1;grid-row:3}
  #status{grid-column:1;grid-row:4;padding-left:max(11px,env(safe-area-inset-left,0px));
    padding-right:max(11px,env(safe-area-inset-right,0px))}
  #panel{position:fixed;right:0;bottom:24px;top:calc(70px + var(--nav-h));width:min(248px,86vw);z-index:5;
    transform:translateX(102%);transition:transform .22s var(--ease);
    box-shadow:-8px 0 26px rgba(0,0,0,.18)}
  #panel.open{transform:none}
  #drawer{display:grid;place-items:center;position:fixed;right:10px;bottom:34px;z-index:6;
    width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);border:0;
    cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  #drawer svg{width:17px;height:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div id="app">
  <div id="opts"></div>
  <nav id="rail" aria-label="Tools"></nav>

  <div id="stage">
    <div id="corner"></div>
    <svg id="rulerH" aria-hidden="true"></svg>
    <svg id="rulerV" aria-hidden="true"></svg>
    <div id="view">
      <canvas id="gl"></canvas>

    </div>

  <div id="status">
    <span>X <b id="st-x">0</b></span>
    <span>Y <b id="st-y">0</b></span>

<button id="drawer" aria-label="Toggle inspector"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h12M3 9h12M3 13h12"/></svg></button>

<script>
"use strict";
(() => {

/* ══════════════════════════════════════════════════════════════════
   1 · STATE
   S holds the targets the UI writes to. A holds eased values the
   renderer reads, so every parameter change glides instead of jumping.
   ══════════════════════════════════════════════════════════════════ */
const PLATE = { w:1200, h:750 };
let uid = 1;

const S = {
  objs:[], sel:new Set(), tool:'select',
  cam:{x:0,y:0}, zoom:0.62,
  k:48, kernel:2,              // 0 polynomial G1 · 1 cubic G2 · 2 circular arc
  mode:1, line:1.4, ghost:false, iso:0,
  grain:0.28, bite:0,
  grid:true, gridStep:50, snap:false, invert:false,
  brush:90,
  defR:46, profile:'uniform', dyn:0, smooth:0.5, nib:-0.6, fillet:0, taper:0.5,
  exportRes:620, exportGrid:false,
  cap1:'MALLEABLE', cap2:'series.006', cap3:'nr.013'
};
const A = { k:S.k, zoom:S.zoom, cx:0, cy:0, line:S.line, iso:0, grain:S.grain, bite:S.bite };

let msgTimer = 0;
function say(t){
  const e = document.getElementById('st-msg');
  e.textContent = t; e.style.opacity = '1';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { e.style.opacity = '0'; }, 2400);
}

/* ══════════════════════════════════════════════════════════════════
   2 · OBJECT MODEL
   ══════════════════════════════════════════════════════════════════ */
const P = (x,y,r) => ({ x, y, r:r||S.defR, dyn:1, ang:0 });

function mkCircle(x,y,r){ return { id:uid++, kind:'circle', op:0, k:-1, pts:[P(x,y,r)] }; }
function mkCapsule(x,y,x2,y2,r,r2){
  return { id:uid++, kind:'capsule', op:0, k:-1, pts:[P(x,y,r),P(x2,y2,r2)] };
}
function mkBox(x,y,w,h){ return { id:uid++, kind:'box', op:0, k:-1, w, h, rot:0, cr:6, pts:[P(x,y,0)] }; }
function mkRing(x,y,r,t){ const o = mkCircle(x,y,r); o.kind='ring'; o.t=t; return o; }
function mkStrand(x,y,r){ return { id:uid++, kind:'strand', op:0, k:-1, base:r, pts:[P(x,y,r)] }; }

const blendOf = o => (o.k < 0 ? A.k : o.k);

/* ── stroke character ──────────────────────────────────────────────
   Width at each sample = base x width-profile(t) x live dynamics
   (drawing speed and stylus pressure), then relaxed so the edge
   reads as a drawn line rather than a row of samples.               */
function profileAt(t){
  switch(S.profile){
    case 'uniform': return 1;
    case 'out':     return 1 - 0.90*t;
    case 'in':      return 0.10 + 0.90*t;
    case 'bulge':   return 0.30 + 0.70*Math.sin(Math.PI*t);
    default:        return Math.pow(Math.sin(Math.PI*t), 0.55);   // 'both'
  }
}
function applyProfile(o){
  const n = o.pts.length;
  if(!n) return;
  const base = o.base || S.defR;
  if(n === 1){ o.pts[0].r = Math.max(1.5, base*o.pts[0].dyn); return; }
  const cum = [0];
  for(let i=1;i<n;i++) cum[i] = cum[i-1] + Math.hypot(o.pts[i].x-o.pts[i-1].x, o.pts[i].y-o.pts[i-1].y);
  const total = cum[n-1] || 1;
  for(let i=0;i<n;i++){
    const p = o.pts[i];
    let f;
    if(S.profile === 'nib') f = (0.14 + 0.86*Math.abs(Math.sin(p.ang - S.nib))) * p.dyn;
    else f = profileAt(cum[i]/total) * p.dyn;
    p.r = Math.max(1.5, base*f);
  }
  const passes = Math.round(1 + S.smooth*5);
  for(let s=0;s<passes;s++){
    const prevR = o.pts.map(p => p.r);
    for(let i=1;i<n-1;i++) o.pts[i].r = (prevR[i-1] + prevR[i]*2 + prevR[i+1])/4;
  }
}

/* Thin out a freehand strand: Douglas-Peucker on position, keeping each
   surviving sample's dynamics. Fewer, longer cones = far fewer SDF
   evaluations per pixel, with no visible change to the drawn shape. */
function simplifyStrand(o){
  const n = o.pts.length;
  if(n < 4) return;
  const eps = Math.max(2.5, (o.base || S.defR)*0.14);
  const keep = new Uint8Array(n);
  keep[0] = keep[n-1] = 1;
  const stack = [[0, n-1]];
  while(stack.length){
    const [a,b] = stack.pop();
    if(b-a < 2) continue;
    const A0 = o.pts[a], B0 = o.pts[b];
    const ex = B0.x-A0.x, ey = B0.y-A0.y, L = Math.hypot(ex,ey) || 1e-9;
    let best = -1, bd = eps;
    for(let i=a+1;i<b;i++){
      const d = Math.abs((o.pts[i].x-A0.x)*ey - (o.pts[i].y-A0.y)*ex)/L;
      if(d > bd){ bd = d; best = i; }
    }
    if(best > 0){ keep[best] = 1; stack.push([a,best],[best,b]); }
  }
  o.pts = o.pts.filter((_,i) => keep[i]);
}

/* Run a Catmull-Rom spline through the simplified samples and walk it at
   an even spacing, carrying the width with it. Removes the facets left by
   hand jitter and by simplification, so the tube reads as one curve. */
function resampleStrand(o){
  const n = o.pts.length;
  if(n < 3) return;
  const spacing = Math.max(6, (o.base || S.defR)*0.40);
  const at = i => o.pts[Math.max(0, Math.min(n-1, i))];
  const out = [];
  for(let i=0;i<n-1;i++){
    const p0 = at(i-1), p1 = at(i), p2 = at(i+1), p3 = at(i+2);
    const steps = Math.max(1, Math.round(Math.hypot(p2.x-p1.x, p2.y-p1.y)/spacing));
    for(let j=0;j<steps;j++){
      const t = j/steps, t2 = t*t, t3 = t2*t;
      const x = 0.5*(2*p1.x + (-p0.x+p2.x)*t + (2*p0.x-5*p1.x+4*p2.x-p3.x)*t2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      const y = 0.5*(2*p1.y + (-p0.y+p2.y)*t + (2*p0.y-5*p1.y+4*p2.y-p3.y)*t2 + (-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      const q = P(x, y, p1.r);
      q.dyn = p1.dyn + (p2.dyn - p1.dyn)*t;
      q.ang = Math.atan2(p2.y-p1.y, p2.x-p1.x);
      out.push(q);
    }
  }
  const last = o.pts[n-1];
  const e = P(last.x, last.y, last.r); e.dyn = last.dyn; e.ang = last.ang;
  out.push(e);
  o.pts = out;
}

/* Round each interior corner of a polyline with a tangent arc, as Rhino's
   FilletCorners does. The radius is clamped so neighbouring fillets on a
   short segment cannot overrun one another. */
function filletPoly(v, r){
  const n = v.length;
  if(n < 3 || r <= 0.01) return v.map(q => ({ x:q.x, y:q.y }));
  const out = [{ x:v[0].x, y:v[0].y }];
  for(let i=1;i<n-1;i++){
    const a = v[i-1], b = v[i], c = v[i+1];
    let v1x = a.x-b.x, v1y = a.y-b.y, v2x = c.x-b.x, v2y = c.y-b.y;
    const l1 = Math.hypot(v1x,v1y) || 1e-6, l2 = Math.hypot(v2x,v2y) || 1e-6;
    v1x /= l1; v1y /= l1; v2x /= l2; v2y /= l2;
    const ang = Math.acos(Math.max(-1, Math.min(1, v1x*v2x + v1y*v2y)));
    if(ang < 0.03 || ang > Math.PI-0.03){ out.push({ x:b.x, y:b.y }); continue; }
    const half = Math.tan(ang/2);
    const t = Math.min(r/half, l1*0.5, l2*0.5);
    const rr = t*half;
    let bx = v1x+v2x, by = v1y+v2y;
    const bl = Math.hypot(bx,by) || 1e-6; bx /= bl; by /= bl;
    const dc = rr/Math.sin(ang/2);
    const cx = b.x + bx*dc, cy = b.y + by*dc;
    const p1x = b.x+v1x*t, p1y = b.y+v1y*t, p2x = b.x+v2x*t, p2y = b.y+v2y*t;
    let a1 = Math.atan2(p1y-cy, p1x-cx), a2 = Math.atan2(p2y-cy, p2x-cx);
    let d = a2-a1;
    while(d >  Math.PI) d -= 2*Math.PI;
    while(d < -Math.PI) d += 2*Math.PI;
    const steps = Math.max(2, Math.ceil(Math.abs(d)/0.22));
    for(let j=0;j<=steps;j++){
      const th = a1 + d*j/steps;
      out.push({ x:cx+Math.cos(th)*rr, y:cy+Math.sin(th)*rr });
    }
  }
  out.push({ x:v[n-1].x, y:v[n-1].y });
  return out;
}

/* Clamped uniform cubic B-spline through the control polygon — the curve
   passes through its first and last control point and is pulled by the
   rest, exactly like Rhino's control-point Curve. */
function bspline(ctrl, step){
  const n = ctrl.length;
  if(n < 3) return ctrl.map(q => ({ x:q.x, y:q.y }));
  const c = [ctrl[0], ctrl[0], ...ctrl, ctrl[n-1], ctrl[n-1]];
  const out = [];
  for(let i=0;i+3<c.length;i++){
    const p0 = c[i], p1 = c[i+1], p2 = c[i+2], p3 = c[i+3];
    const steps = Math.max(3, Math.min(40, Math.round(Math.hypot(p2.x-p1.x, p2.y-p1.y)/step)+3));
    for(let j=0;j<steps;j++){
      const t = j/steps, t2 = t*t, t3 = t2*t;
      const b0 = (-t3+3*t2-3*t+1)/6, b1 = (3*t3-6*t2+4)/6,
            b2 = (-3*t3+3*t2+3*t+1)/6, b3 = t3/6;
      out.push({ x:p0.x*b0+p1.x*b1+p2.x*b2+p3.x*b3,
                 y:p0.y*b0+p1.y*b1+p2.y*b2+p3.y*b3 });
    }
  }
  out.push({ x:ctrl[n-1].x, y:ctrl[n-1].y });
  return out;
}
function ptsFromCtrl(ctrl, mode, fillet, base){
  const raw = mode === 'curve' ? bspline(ctrl, Math.max(6, base*0.35))
                               : filletPoly(ctrl, fillet);
  return raw.map(q => P(q.x, q.y, base));
}
function rebuild(o){
  if(!o.ctrl) return;
  o.pts = ptsFromCtrl(o.ctrl, o.mode, o.fillet || 0, o.base || S.defR);
  applyProfile(o);
}

let prims = [];
function bound(p){
  if(p.t === 1){
    p.bcx = (p.ax+p.bx)/2; p.bcy = (p.ay+p.by)/2;
    p.brad = Math.hypot(p.bx-p.ax, p.by-p.ay)/2 + Math.max(p.az,p.aw);
  } else {
    p.bcx = p.ax; p.bcy = p.ay;
    p.brad = p.t === 2 ? Math.hypot(p.az,p.aw) + p.cz : (p.t === 3 ? p.az + p.aw : p.az);
  }
  return p;
}
function buildPrims(){
  prims = [];
  let oidx = 0;
  for(const o of S.objs){
    const k = blendOf(o), op = o.op, oi = oidx++;
    if(o.kind === 'circle'){
      const p = o.pts[0];
      prims.push(bound({ owner:o.id, oi, t:0, op, k, ax:p.x, ay:p.y, az:Math.max(.5,p.r), aw:0, bx:0, by:0, bz:0, cz:0 }));
    } else if(o.kind === 'ring'){
      const p = o.pts[0];
      prims.push(bound({ owner:o.id, oi, t:3, op, k, ax:p.x, ay:p.y, az:Math.max(.5,p.r), aw:Math.max(.5,o.t), bx:0, by:0, bz:0, cz:0 }));
    } else if(o.kind === 'box'){
      const p = o.pts[0];
      prims.push(bound({ owner:o.id, oi, t:2, op, k, ax:p.x, ay:p.y, az:Math.max(.5,o.w/2), aw:Math.max(.5,o.h/2),
                   bx:0, by:0, bz:o.rot, cz:Math.max(0,Math.min(o.cr, Math.min(o.w,o.h)/2)) }));
    } else {
      for(let i=0;i<o.pts.length-1;i++){
        const a = o.pts[i], b = o.pts[i+1];
        prims.push(bound({ owner:o.id, oi, t:1, op, k, ax:a.x, ay:a.y, az:Math.max(.5,a.r), aw:Math.max(.5,b.r),
                     bx:b.x, by:b.y, bz:0, cz:0 }));
      }
      if(o.pts.length === 1){
        const a = o.pts[0];
        prims.push(bound({ owner:o.id, oi, t:0, op, k, ax:a.x, ay:a.y, az:Math.max(.5,a.r), aw:0, bx:0, by:0, bz:0, cz:0 }));
      }
    }
  }
}

/* ══════════════════════════════════════════════════════════════════
   3 · SDF (CPU mirror of the shader, used for picking and export)
   ══════════════════════════════════════════════════════════════════ */
function sdRoundCone(px,py, ax,ay, bx,by, r1,r2){
  const bax=bx-ax, bay=by-ay, l2=bax*bax+bay*bay;
  if(l2 < 1e-7) return Math.hypot(px-ax,py-ay) - Math.max(r1,r2);
  const rr=r1-r2, a2=l2-rr*rr, il2=1/l2;
  const pax=px-ax, pay=py-ay;
  const y=pax*bax+pay*bay, z=y-l2;
  const qx=pax*l2-bax*y, qy=pay*l2-bay*y;
  const x2=qx*qx+qy*qy, y2=y*y*l2, z2=z*z*l2;
  const k=Math.sign(rr)*rr*rr*x2;
  if(Math.sign(z)*a2*z2 > k) return Math.sqrt(x2+z2)*il2 - r2;
  if(Math.sign(y)*a2*y2 < k) return Math.sqrt(x2+y2)*il2 - r1;
  return (Math.sqrt(Math.max(0,x2*a2*il2)) + y*rr)*il2 - r1;
}
function sdBox(px,py, cx,cy, hw,hh, rot, cr){
  const c=Math.cos(-rot), s=Math.sin(-rot), dx=px-cx, dy=py-cy;
  const qx=Math.abs(dx*c-dy*s)-hw+cr, qy=Math.abs(dx*s+dy*c)-hh+cr;
  return Math.min(Math.max(qx,qy),0) + Math.hypot(Math.max(qx,0),Math.max(qy,0)) - cr;
}
function primSd(p,x,y){
  switch(p.t){
    case 0: return Math.hypot(x-p.ax,y-p.ay) - p.az;
    case 1: return sdRoundCone(x,y,p.ax,p.ay,p.bx,p.by,p.az,p.aw);
    case 2: return sdBox(x,y,p.ax,p.ay,p.az,p.aw,p.bz,p.cz);
    default: return Math.abs(Math.hypot(x-p.ax,y-p.ay) - p.az) - p.aw;
  }
}
function sminK(a,b,k){
  if(k < 1e-4) return Math.min(a,b);
  if(S.kernel === 0){ const h=Math.max(0,Math.min(1,.5+.5*(b-a)/k)); return b+(a-b)*h - k*h*(1-h); }
  if(S.kernel === 1){ const kk=k*1.5, h=Math.max(kk-Math.abs(a-b),0)/kk; return Math.min(a,b) - h*h*h*kk/6; }
  const kk=k*0.604, ua=Math.max(kk-a,0), ub=Math.max(kk-b,0);
  return Math.max(kk, Math.min(a,b)) - Math.hypot(ua,ub);
}
const smaxK = (a,b,k) => -sminK(-a,-b,k);

function foldObj(d, od, op, k){
  if(op === 0) return sminK(d, od, k);
  if(op === 1) return smaxK(d, -od, k);
  return smaxK(d, od, k);
}
function fieldJS(x,y,list){
  let d = 1e9, od = 1e9, curOwner = -1, curOp = 0, curK = 0;
  for(let i=0;i<list.length;i++){
    const p = list[i];
    if(p.oi !== curOwner){
      if(curOwner >= 0) d = foldObj(d, od, curOp, curK);
      od = 1e9; curOwner = p.oi; curOp = p.op; curK = p.k;
    }
    if(p.op === 0 && Math.hypot(x-p.bcx, y-p.bcy) - p.brad - Math.min(d,od) > p.k*1.6 + 1) continue;
    od = Math.min(od, primSd(p,x,y));
  }
  if(curOwner >= 0) d = foldObj(d, od, curOp, curK);
  return d;
}

/* ══════════════════════════════════════════════════════════════════
   4 · WEBGL
   ══════════════════════════════════════════════════════════════════ */
const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true });

const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0.0,1.0); }`;

const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform vec2 uCam; uniform float uZoom;
uniform int uCount; uniform sampler2D uData;
uniform int uIdx[96]; uniform int uIdxN; uniform int uAll;
uniform float uLine; uniform int uMode; uniform float uIso; uniform int uGhost;
uniform int uKernel; uniform float uGrain; uniform float uBite;
uniform vec3 uInk; uniform vec3 uPaper;
out vec4 outColor;

float sminK(float a, float b, float k){
  if(k < 1e-4) return min(a,b);
  if(uKernel == 0){ float h = clamp(0.5+0.5*(b-a)/k, 0.0, 1.0); return mix(b,a,h) - k*h*(1.0-h); }
  if(uKernel == 1){ float kk = k*1.5; float h = max(kk-abs(a-b), 0.0)/kk; return min(a,b) - h*h*h*kk/6.0; }
  float kk = k*0.604; vec2 u = max(vec2(kk-a, kk-b), 0.0);
  return max(kk, min(a,b)) - length(u);
}
float smaxK(float a, float b, float k){ return -sminK(-a,-b,k); }

float sdRoundCone(vec2 p, vec2 a, vec2 b, float r1, float r2){
  vec2 ba=b-a; float l2=dot(ba,ba);
  if(l2 < 1e-7) return length(p-a)-max(r1,r2);
  float rr=r1-r2, a2=l2-rr*rr, il2=1.0/l2;
  vec2 pa=p-a; float y=dot(pa,ba); float z=y-l2;
  vec2 q=pa*l2-ba*y; float x2=dot(q,q);
  float y2=y*y*l2, z2=z*z*l2;
  float k=sign(rr)*rr*rr*x2;
  if(sign(z)*a2*z2 > k) return sqrt(x2+z2)*il2-r2;
  if(sign(y)*a2*y2 < k) return sqrt(x2+y2)*il2-r1;
  return (sqrt(max(0.0,x2*a2*il2))+y*rr)*il2-r1;
}
float sdBox(vec2 p, vec2 c, vec2 he, float rot, float cr){
  float s=sin(-rot), co=cos(-rot); vec2 d=p-c;
  vec2 q=abs(vec2(d.x*co-d.y*s, d.x*s+d.y*co))-he+cr;
  return min(max(q.x,q.y),0.0)+length(max(q,0.0))-cr;
}

float hash(vec2 p){ p = fract(p*vec2(127.31,311.7)); p += dot(p, p+34.56); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
             mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}

float gGhost;
float field(vec2 w){
  // Segments of one path are welded with a plain min: consecutive cones
  // already share an end sphere, so that is an exactly smooth tube. The
  // blend radius applies only BETWEEN objects — blending a stroke to
  // itself is what made it lumpy.
  float d = 1e9; gGhost = 1e9;
  float od = 1e9; int curOwner = -1; int curOp = 0; float curK = 0.0;
  int N = (uAll == 1) ? uCount : uIdxN;
  for(int t=0;t<1024;t++){
    if(t >= N) break;
    int i = (uAll == 1) ? t : uIdx[t];
    vec4 A = texelFetch(uData, ivec2(i,0), 0);
    vec4 B = texelFetch(uData, ivec2(i,1), 0);
    vec4 C = texelFetch(uData, ivec2(i,2), 0);
    int ty = int(C.x+0.5); int op = int(C.y+0.5); float k = B.w; int ow = int(C.w+0.5);

    if(ow != curOwner){
      if(curOwner >= 0){
        if(curOp == 0) d = sminK(d, od, curK);
        else if(curOp == 1) d = smaxK(d, -od, curK);
        else d = smaxK(d, od, curK);
      }
      od = 1e9; curOwner = ow; curOp = op; curK = k;
    }

    // conservative bounding-circle distance: the true SDF is never smaller.
    // If this shape is farther than the blend can reach, it cannot change d.
    float bd;
    if(ty == 1){ vec2 m = (A.xy+B.xy)*0.5;
                 bd = length(w-m) - (distance(A.xy,B.xy)*0.5 + max(A.z,A.w)); }
    else if(ty == 2) bd = length(w-A.xy) - (length(vec2(A.z,A.w)) + C.z);
    else if(ty == 3) bd = length(w-A.xy) - (A.z + A.w);
    else bd = length(w-A.xy) - A.z;
    if(uGhost == 0 && op == 0 && bd - min(d, od) > k*1.6 + 1.0) continue;

    float s;
    if(ty == 0) s = bd;
    else if(ty == 1) s = sdRoundCone(w, A.xy, B.xy, A.z, A.w);
    else if(ty == 2) s = sdBox(w, A.xy, vec2(A.z,A.w), B.z, C.z);
    else s = abs(length(w-A.xy) - A.z) - A.w;
    if(uGhost == 1) gGhost = min(gGhost, abs(s));
    od = min(od, s);
  }
  if(curOwner >= 0){
    if(curOp == 0) d = sminK(d, od, curK);
    else if(curOp == 1) d = smaxK(d, -od, curK);
    else d = smaxK(d, od, curK);
  }
  return d;
}

void main(){
  vec2 frag = vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y);
  vec2 w = (frag - uRes*0.5)/uZoom + uCam;
  float d = field(w);
  float ghost = gGhost;

  // ink bite: break the mathematically perfect edge by a sub-pixel amount
  if(uBite > 0.001){
    float n = vnoise(w*0.085) + 0.5*vnoise(w*0.26);
    d += (n/1.5 - 0.5) * uBite * 2.6;
  }

  float fw = max(fwidth(d), 1e-5);
  float px = 1.0/uZoom;
  float lw = uLine*px*0.5;

  vec3 col = uPaper;
  float inside = 1.0 - smoothstep(-fw, fw, d);

  if(uIso > 0.5){
    float t = abs(fract(d/uIso - 0.5) - 0.5)*uIso;
    float r = 1.0 - smoothstep(px*0.35, px*0.95, t);
    col = mix(col, mix(uPaper, uInk, 0.20), r*step(0.0, d));
  }
  if(uMode == 0){
    float line = 1.0 - smoothstep(lw-fw, lw+fw, abs(d));
    col = mix(col, uInk, line);
  } else {
    col = mix(col, uInk, inside);
    if(uMode == 2){
      float line = 1.0 - smoothstep(lw-fw, lw+fw, abs(d));
      col = mix(col, mix(uInk,uPaper,0.78), line*inside);
      col = mix(col, uInk, line*(1.0-inside));
    }
  }
  if(uGhost == 1){
    float gfw = max(fwidth(ghost), 1e-5);
    float gline = 1.0 - smoothstep(px*0.4, px*0.4+gfw, ghost);
    col = mix(col, inside > 0.5 ? mix(uInk,uPaper,0.58) : mix(uPaper,uInk,0.42), gline*0.9);
  }

  // paper tooth — faint achromatic grain over the whole plate
  if(uGrain > 0.001){
    float g = vnoise(frag*0.9)*0.6 + hash(frag)*0.4;
    col += (g - 0.5) * uGrain * 0.075;
  }
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

let prog, uni = {}, tex, texData = new Float32Array(1024*3*4), ok = true;
function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
function initGL(){
  if(!gl){ ok = false; return; }
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  for(const n of ['uRes','uCam','uZoom','uCount','uData','uLine','uMode','uIso','uGhost','uKernel','uGrain','uBite','uInk','uPaper','uIdx','uIdxN','uAll'])
    uni[n] = gl.getUniformLocation(prog, n);
  gl.bindVertexArray(gl.createVertexArray());
  tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, 1024, 3);
  gl.uniform1i(uni.uData, 0);
}
try { initGL(); } catch(e){ ok = false; console.error(e); }

function uploadPrims(){
  const n = Math.min(prims.length, 1024);
  if(!n) return 0;
  for(let i=0;i<n;i++){
    const p = prims[i];
    let o = i*4;        texData[o]=p.ax; texData[o+1]=p.ay; texData[o+2]=p.az; texData[o+3]=p.aw;
    o = (1024+i)*4;     texData[o]=p.bx; texData[o+1]=p.by; texData[o+2]=p.bz; texData[o+3]=p.k;
    o = (2048+i)*4;     texData[o]=p.t;  texData[o+1]=p.op; texData[o+2]=p.cz; texData[o+3]=p.oi;
  }
  for(let r=0;r<3;r++) gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, r, n, 1, gl.RGBA, gl.FLOAT, texData, r*1024*4);
  return n;
}
function setInvert(v){
  S.invert = v;
  document.documentElement.setAttribute('data-theme', v ? 'dark' : 'light');
}
function themeColors(){
  const cs = getComputedStyle(document.documentElement);
  const toRGB = v => {
    v = v.trim();
    if(v.startsWith('#')) return [parseInt(v.slice(1,3),16)/255, parseInt(v.slice(3,5),16)/255, parseInt(v.slice(5,7),16)/255];
    const m = v.match(/[\d.]+/g);
    return m ? [m[0]/255, m[1]/255, m[2]/255] : [0,0,0];
  };
  return { ink: toRGB(cs.getPropertyValue('--ink')),
           paper: toRGB(cs.getPropertyValue('--paper')) };
}

const viewEl = document.getElementById('view');
const ovEl = document.getElementById('ov');
let vw = 0, vh = 0;
function resize(){
  const r = viewEl.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  vw = r.width; vh = r.height;
  const w = Math.max(1, Math.round(r.width*dpr)), h = Math.max(1, Math.round(r.height*dpr));
  if(cvs.width !== w || cvs.height !== h){ cvs.width = w; cvs.height = h; }
  ovEl.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
}
/* Tiled rendering: the screen is cut into tiles and each tile is drawn
   with only the primitives whose bounding circle can reach it. A pixel in
   an empty corner then costs almost nothing, so the field stays fast as
   strokes pile up. Intersect primitives clip everything, so they are
   never culled. */
const TX = 8, TY = 6, MAXI = 96;
const idxBuf = new Int32Array(MAXI);
function draw(){
  if(!ok) return;
  gl.viewport(0,0,cvs.width,cvs.height);
  gl.useProgram(prog);
  const n = uploadPrims();
  const c = themeColors();
  const scale = cvs.width/Math.max(1,vw);
  gl.uniform2f(uni.uRes, cvs.width, cvs.height);
  gl.uniform2f(uni.uCam, A.cx, A.cy);
  gl.uniform1f(uni.uZoom, A.zoom*scale);
  gl.uniform1i(uni.uCount, n);
  gl.uniform1f(uni.uLine, A.line);
  gl.uniform1i(uni.uMode, S.mode);
  gl.uniform1f(uni.uIso, A.iso);
  gl.uniform1i(uni.uGhost, S.ghost ? 1 : 0);
  gl.uniform1i(uni.uKernel, S.kernel);
  gl.uniform1f(uni.uGrain, A.grain);
  gl.uniform1f(uni.uBite, A.bite);
  gl.uniform3fv(uni.uInk, c.ink);
  gl.uniform3fv(uni.uPaper, c.paper);
  gl.disable(gl.SCISSOR_TEST);
  gl.clearColor(c.paper[0], c.paper[1], c.paper[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if(!n) return;

  // small scenes are not worth splitting up
  if(n <= 8 || S.ghost){
    gl.uniform1i(uni.uAll, 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return;
  }
  const tw = vw/TX, th = vh/TY;
  const halfDiag = Math.hypot(tw, th)/2/A.zoom;
  gl.enable(gl.SCISSOR_TEST);
  for(let ty=0; ty<TY; ty++){
    for(let tx=0; tx<TX; tx++){
      const cxw = ((tx+0.5)*tw - vw/2)/A.zoom + A.cx;
      const cyw = ((ty+0.5)*th - vh/2)/A.zoom + A.cy;
      let cnt = 0, over = false;
      for(let i=0;i<n;i++){
        const p = prims[i];
        if(p.op !== 2 && Math.hypot(cxw-p.bcx, cyw-p.bcy) - p.brad - halfDiag > p.k*1.6 + 4) continue;
        if(cnt >= MAXI){ over = true; break; }
        idxBuf[cnt++] = i;
      }
      if(!over && cnt === 0) continue;
      const x0 = Math.floor(tx*cvs.width/TX), x1 = Math.ceil((tx+1)*cvs.width/TX);
      const yTop = Math.floor(ty*cvs.height/TY), yBot = Math.ceil((ty+1)*cvs.height/TY);
      gl.scissor(x0, cvs.height-yBot, x1-x0, yBot-yTop);
      if(over){ gl.uniform1i(uni.uAll, 1); }
      else { gl.uniform1i(uni.uAll, 0); gl.uniform1i(uni.uIdxN, cnt); gl.uniform1iv(uni.uIdx, idxBuf); }
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
  }
  gl.disable(gl.SCISSOR_TEST);
}

const toWorld = (sx,sy) => ({ x:(sx - vw/2)/A.zoom + A.cx, y:(sy - vh/2)/A.zoom + A.cy });
const toScreen = (wx,wy) => ({ x:(wx - A.cx)*A.zoom + vw/2, y:(wy - A.cy)*A.zoom + vh/2 });
function snapW(w, invert){
  const on = S.snap !== !!invert;
  if(!on) return w;
  const g = S.gridStep;
  return { x:Math.round(w.x/g)*g, y:Math.round(w.y/g)*g };
}


/* ══════════════════════════════════════════════════════════════════
   6 · HISTORY
   ══════════════════════════════════════════════════════════════════ */
const hist = []; let histAt = -1;
function snap(){
  const s = JSON.stringify({ objs:S.objs, uid });
  if(hist[histAt] === s) return;
  hist.length = histAt+1; hist.push(s); histAt = hist.length-1;
  if(hist.length > 60){ hist.shift(); histAt--; }
}
function restore(i){
  if(i < 0 || i >= hist.length) return;
  const d = JSON.parse(hist[i]);
  S.objs = d.objs; uid = d.uid;
  S.sel.clear(); histAt = i; sync();
}
const undo = () => { restore(histAt-1); say('Undo'); };
const redo = () => { restore(histAt+1); say('Redo'); };

/* ══════════════════════════════════════════════════════════════════
   7 · PICKING
   ══════════════════════════════════════════════════════════════════ */
function pickObject(wx,wy){
  let best = null, bd = Infinity;
  for(const p of prims){ const d = primSd(p,wx,wy); if(d < bd){ bd = d; best = p.owner; } }
  return bd < 10/A.zoom ? best : null;
}
function pickAnchor(wx,wy){
  const tol = 9/A.zoom;
  for(let i=S.objs.length-1;i>=0;i--){
    const o = S.objs[i];
    const list = o.ctrl || o.pts;
    for(let j=0;j<list.length;j++){
      if(Math.hypot(wx-list[j].x, wy-list[j].y) < tol)
        return { o, idx:j, type:o.ctrl ? 'ctrl' : 'point' };
    }
  }
  return null;
}
function pickHandle(wx,wy){
  const tol = 9/A.zoom;
  for(let i=S.objs.length-1;i>=0;i--){
    const o = S.objs[i];
    if(!S.sel.has(o.id)) continue;
    if(o.kind === 'circle' || o.kind === 'ring'){
      const p = o.pts[0];
      if(Math.hypot(wx-(p.x+p.r), wy-p.y) < tol) return { o, type:'radius' };
      if(o.kind === 'ring' && Math.hypot(wx-(p.x+p.r+o.t), wy-p.y) < tol) return { o, type:'thick' };
    } else if(o.kind === 'box'){
      const p = o.pts[0], c = Math.cos(o.rot), s = Math.sin(o.rot);
      const cx = p.x + (o.w/2)*c - (o.h/2)*s, cy = p.y + (o.w/2)*s + (o.h/2)*c;
      if(Math.hypot(wx-cx, wy-cy) < tol) return { o, type:'corner' };
      const rx = p.x + (o.w/2+26)*c, ry = p.y + (o.w/2+26)*s;
      if(Math.hypot(wx-rx, wy-ry) < tol) return { o, type:'rotate' };
    } else {
      const list = o.ctrl || o.pts;
      for(let j=0;j<list.length;j++){
        if(Math.hypot(wx-list[j].x, wy-list[j].y) < tol)
          return { o, type:o.ctrl ? 'ctrl' : 'point', idx:j };
      }
    }
  }
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   8 · POINTER
   ══════════════════════════════════════════════════════════════════ */
let drag = null, spaceDown = false, lastW = {x:0,y:0}, hoverW = {x:0,y:0}, hoverIn = false;

/* Polyline and control-point Curve share one click-to-place run, as in
   Rhino. ctrl holds the placed points; one extra point rides the cursor
   as the rubber band. The drawn geometry is rebuilt from ctrl each time,
   so the fillet and the spline preview live. */
let poly = null;
function polyStart(w, mode){
  const o = mkStrand(w.x, w.y, S.defR);
  o.mode = mode;
  o.fillet = mode === 'poly' ? S.fillet : 0;
  o.ctrl = [{ x:w.x, y:w.y }];
  S.objs.push(o); S.sel.clear(); S.sel.add(o.id);
  poly = { o, cur:{ x:w.x, y:w.y } };
  polyRebuild();
  snap(); sync();
}
function polyRebuild(){
  const o = poly.o;
  o.pts = ptsFromCtrl([...o.ctrl, poly.cur], o.mode, o.fillet, o.base || S.defR);
  applyProfile(o);
}
function polyMove(w, shift){
  if(!poly) return;
  const o = poly.o, m = o.ctrl.length;
  let tx = w.x, ty = w.y;
  if(shift && m >= 1){
    const a0 = o.ctrl[m-1];
    const q = Math.round(Math.atan2(ty-a0.y, tx-a0.x)/(Math.PI/12))*(Math.PI/12);
    const L = Math.hypot(tx-a0.x, ty-a0.y);
    tx = a0.x + Math.cos(q)*L; ty = a0.y + Math.sin(q)*L;
  }
  poly.cur = { x:tx, y:ty };
  polyRebuild();
}
function polyAdd(){
  if(!poly) return;
  const o = poly.o, first = o.ctrl[0], c = poly.cur;
  if(o.ctrl.length >= 3 && Math.hypot(c.x-first.x, c.y-first.y) < 12/A.zoom){
    o.ctrl.push({ x:first.x, y:first.y });
    polyFinish(true); say('Closed'); return;
  }
  o.ctrl.push({ x:c.x, y:c.y });
  polyRebuild();
}
function polyBack(){
  if(!poly || poly.o.ctrl.length < 2) return;
  poly.o.ctrl.pop();
  polyRebuild();
}
function polyFinish(){
  if(!poly) return;
  const o = poly.o;
  if(o.ctrl.length < 2) remove(o.id);
  else rebuild(o);
  poly = null;
  snap(); sync();
}
function polyAbort(){
  if(!poly) return;
  remove(poly.o.id); poly = null; sync(); say('Cancelled');
}

function dynFactor(e, speed){
  if(S.dyn <= 0) return 1;                               // Speed 0 = dead uniform
  let f = 1 - S.dyn*Math.min(1, speed/1.9);              // world units per ms
  if(e.pointerType === 'pen' && e.pressure > 0) f *= 0.22 + 1.56*e.pressure;
  return Math.max(0.06, Math.min(1.8, f));
}

viewEl.addEventListener('pointerdown', e => {
  viewEl.setPointerCapture(e.pointerId);
  const r = viewEl.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const raw = toWorld(sx,sy);
  const w = snapW(raw, e.ctrlKey);
  lastW = raw;

  if(e.button === 1 || spaceDown || (e.button === 0 && S.tool === 'hand')){
    drag = { mode:'pan', sx, sy, cam:{...S.cam} }; return;
  }
  if(e.button !== 0) return;
  const sub = e.altKey;

  switch(S.tool){
    case 'zoom': {
      const before = { x:(sx-vw/2)/S.zoom + S.cam.x, y:(sy-vh/2)/S.zoom + S.cam.y };
      S.zoom = Math.max(0.08, Math.min(8, S.zoom*(sub ? 1/1.6 : 1.6)));
      const after = { x:(sx-vw/2)/S.zoom + S.cam.x, y:(sy-vh/2)/S.zoom + S.cam.y };
      S.cam.x += before.x-after.x; S.cam.y += before.y-after.y;
      return;
    }
    case 'select': {
      const h = pickHandle(raw.x,raw.y);
      if(h && h.o){ drag = { mode:'handle', h, w }; snap(); return; }
      const id = pickObject(raw.x,raw.y);
      if(id){
        if(e.shiftKey) S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
        else if(!S.sel.has(id)){ S.sel.clear(); S.sel.add(id); }
        drag = { mode:'move', w:raw, start:[...S.sel].map(i => {
          const o = S.objs.find(x => x.id === i);
          return { o, pts:o.pts.map(p => ({x:p.x,y:p.y})),
                   ctrl:o.ctrl ? o.ctrl.map(p => ({x:p.x,y:p.y})) : null };
        })};
        snap();
      } else { if(!e.shiftKey) S.sel.clear(); drag = { mode:'marquee', a:raw, b:raw }; }
      sync(); return;
    }
    case 'direct': {
      const h = pickAnchor(raw.x,raw.y);
      if(h){
        S.sel.clear(); S.sel.add(h.o.id);
        drag = { mode:'handle', h:{ o:h.o, type:h.type, idx:h.idx }, w };
        snap();
      } else S.sel.clear();
      sync(); return;
    }
    case 'ellipse': case 'knife': {
      const o = mkCircle(w.x, w.y, 1);
      o.op = (S.tool === 'knife' || sub) ? 1 : 0;
      S.objs.push(o); S.sel.clear(); S.sel.add(o.id);
      drag = { mode:'size', o, c:w }; snap(); sync(); return;
    }
    case 'ring': {
      const o = mkRing(w.x, w.y, 1, 10); o.op = sub ? 1 : 0;
      S.objs.push(o); S.sel.clear(); S.sel.add(o.id);
      drag = { mode:'size', o, c:w }; snap(); sync(); return;
    }
    case 'polyline': case 'curve': {
      const mode = S.tool === 'curve' ? 'curve' : 'poly';
      if(!poly){ polyStart(w, mode); return; }
      polyMove(w, e.shiftKey);
      if(e.detail >= 2){ polyFinish(); return; }
      polyAdd();
      return;
    }
    case 'segment': {
      const o = mkCapsule(w.x, w.y, w.x+.1, w.y, S.defR, Math.max(1.5, S.defR*(1-S.taper)));
      o.op = sub ? 1 : 0;
      S.objs.push(o); S.sel.clear(); S.sel.add(o.id);
      drag = { mode:'segment', o, a:w }; snap(); sync(); return;
    }
    case 'rect': {
      const o = mkBox(w.x, w.y, 1, 1); o.op = sub ? 1 : 0;
      S.objs.push(o); S.sel.clear(); S.sel.add(o.id);
      drag = { mode:'rect', o, a:w }; snap(); sync(); return;
    }
    case 'pen': {
      const o = mkStrand(w.x, w.y, S.defR); o.op = sub ? 1 : 0;
      o.pts[0].dyn = dynFactor(e, 0);
      S.objs.push(o); S.sel.clear(); S.sel.add(o.id);
      drag = { mode:'pen', o, t:performance.now(), spd:0 }; snap(); sync(); return;
    }
    case 'width': drag = { mode:'width', dir: sub ? -1 : 1 }; snap(); return;
  }
});

viewEl.addEventListener('pointermove', e => {
  const r = viewEl.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const raw = toWorld(sx,sy);
  const w = snapW(raw, e.ctrlKey);
  hoverW = raw; hoverIn = true;
  document.getElementById('st-x').textContent = Math.round(raw.x);
  document.getElementById('st-y').textContent = Math.round(raw.y);
  if(poly) polyMove(w, e.shiftKey);
  if(!drag){ lastW = raw; return; }

  switch(drag.mode){
    case 'pan':
      S.cam.x = drag.cam.x - (sx-drag.sx)/A.zoom;
      S.cam.y = drag.cam.y - (sy-drag.sy)/A.zoom;
      A.cx = S.cam.x; A.cy = S.cam.y;              // panning stays 1:1
      break;
    case 'move': {
      let dx = raw.x-drag.w.x, dy = raw.y-drag.w.y;
      if(e.shiftKey){ if(Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
      for(const g of drag.start){
        g.o.pts.forEach((p,i) => { p.x = g.pts[i].x+dx; p.y = g.pts[i].y+dy; });
        if(g.ctrl) g.o.ctrl.forEach((p,i) => { p.x = g.ctrl[i].x+dx; p.y = g.ctrl[i].y+dy; });
      }
      break;
    }
    case 'marquee': drag.b = raw; break;
    case 'size': {
      const o = drag.o;
      o.pts[0].r = Math.max(2, Math.hypot(w.x-drag.c.x, w.y-drag.c.y));
      if(o.kind === 'ring') o.t = Math.max(2, o.pts[0].r*0.18);
      break;
    }
    case 'segment': {
      const o = drag.o, b = o.pts[1];
      let tx = w.x, ty = w.y;
      if(e.shiftKey){
        const a = Math.atan2(ty-drag.a.y, tx-drag.a.x);
        const q = Math.round(a/(Math.PI/8))*(Math.PI/8);
        const L = Math.hypot(tx-drag.a.x, ty-drag.a.y);
        tx = drag.a.x + Math.cos(q)*L; ty = drag.a.y + Math.sin(q)*L;
      }
      b.x = tx; b.y = ty;
      o.pts[0].r = S.defR;
      b.r = Math.max(1.5, S.defR*(1-S.taper));
      break;
    }
    case 'rect': {
      const o = drag.o;
      let ex = w.x, ey = w.y;
      if(e.shiftKey){
        const s = Math.max(Math.abs(ex-drag.a.x), Math.abs(ey-drag.a.y));
        ex = drag.a.x + (ex < drag.a.x ? -s : s);
        ey = drag.a.y + (ey < drag.a.y ? -s : s);
      }
      o.w = Math.max(3, Math.abs(ex-drag.a.x));
      o.h = Math.max(3, Math.abs(ey-drag.a.y));
      o.pts[0].x = (ex+drag.a.x)/2; o.pts[0].y = (ey+drag.a.y)/2;
      o.cr = Math.min(o.cr, Math.min(o.w,o.h)/2);
      break;
    }
    case 'pen': {
      const o = drag.o, last = o.pts[o.pts.length-1];
      const dist = Math.hypot(raw.x-last.x, raw.y-last.y);
      if(dist > Math.max(8, S.defR*0.5)){
        const now = performance.now();
        const dt = Math.max(1, now - drag.t);
        drag.spd = drag.spd*0.65 + (dist/dt)*0.35;
        drag.t = now;
        const p = P(raw.x, raw.y, S.defR);
        p.dyn = dynFactor(e, drag.spd);
        p.ang = Math.atan2(raw.y-last.y, raw.x-last.x);
        if(o.pts.length === 1) o.pts[0].ang = p.ang;
        o.pts.push(p);
        applyProfile(o);
      }
      break;
    }
    case 'handle': {
      const { o, type, idx } = drag.h;
      if(type === 'radius') o.pts[0].r = Math.max(2, Math.hypot(w.x-o.pts[0].x, w.y-o.pts[0].y));
      else if(type === 'thick') o.t = Math.max(1, Math.hypot(w.x-o.pts[0].x, w.y-o.pts[0].y) - o.pts[0].r);
      else if(type === 'point'){ const p = o.pts[idx]; p.x = w.x; p.y = w.y; }
      else if(type === 'ctrl'){ o.ctrl[idx].x = w.x; o.ctrl[idx].y = w.y; rebuild(o); }
      else if(type === 'corner'){
        const p = o.pts[0], c = Math.cos(-o.rot), s = Math.sin(-o.rot);
        const dx = w.x-p.x, dy = w.y-p.y;
        o.w = Math.max(4, Math.abs(dx*c-dy*s)*2);
        o.h = Math.max(4, Math.abs(dx*s+dy*c)*2);
        o.cr = Math.min(o.cr, Math.min(o.w,o.h)/2);
      } else if(type === 'rotate'){
        let a = Math.atan2(w.y-o.pts[0].y, w.x-o.pts[0].x);
        if(e.shiftKey) a = Math.round(a/(Math.PI/12))*(Math.PI/12);
        o.rot = a;
      }
      break;
    }
    case 'width': {
      const R = S.brush, R2 = R*R;
      for(const o of S.objs){
        if(o.kind === 'box'){
          const p = o.pts[0];
          if((p.x-raw.x)**2 + (p.y-raw.y)**2 < R2){
            o.w = Math.max(4, o.w*(1+0.03*drag.dir)); o.h = Math.max(4, o.h*(1+0.03*drag.dir));
          }
          continue;
        }
        for(const p of o.pts){
          const d2 = (p.x-raw.x)**2 + (p.y-raw.y)**2;
          if(d2 < R2){
            const f = 1 - Math.sqrt(d2)/R;
            p.r = Math.max(1.5, Math.min(600, p.r*(1 + 0.09*f*drag.dir)));
          }
        }
      }
      break;
    }
  }
  lastW = raw;
});
viewEl.addEventListener('pointerleave', () => { hoverIn = false; });

function endDrag(){
  if(!drag) return;
  if(drag.mode === 'marquee'){
    const x0 = Math.min(drag.a.x,drag.b.x), x1 = Math.max(drag.a.x,drag.b.x);
    const y0 = Math.min(drag.a.y,drag.b.y), y1 = Math.max(drag.a.y,drag.b.y);
    if(Math.abs(x1-x0) > 3 || Math.abs(y1-y0) > 3)
      for(const o of S.objs)
        if(o.pts.some(p => p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1)) S.sel.add(o.id);
  }
  if(drag.mode === 'size' && drag.o.pts[0].r < 3) remove(drag.o.id);
  if(drag.mode === 'pen'){ simplifyStrand(drag.o); resampleStrand(drag.o); applyProfile(drag.o); }
  drag = null;
  snap(); sync();
}
viewEl.addEventListener('pointerup', endDrag);
viewEl.addEventListener('pointercancel', endDrag);

viewEl.addEventListener('wheel', e => {
  e.preventDefault();
  const r = viewEl.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  if(e.ctrlKey || e.metaKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)){
    const before = { x:(sx-vw/2)/S.zoom + S.cam.x, y:(sy-vh/2)/S.zoom + S.cam.y };
    S.zoom = Math.max(0.08, Math.min(8, S.zoom*Math.exp(-e.deltaY*0.0016)));
    const after = { x:(sx-vw/2)/S.zoom + S.cam.x, y:(sy-vh/2)/S.zoom + S.cam.y };
    S.cam.x += before.x-after.x; S.cam.y += before.y-after.y;
  } else S.cam.x += e.deltaX/S.zoom;
}, { passive:false });

/* ══════════════════════════════════════════════════════════════════
   9 · EDIT OPS
   ══════════════════════════════════════════════════════════════════ */
function remove(id){ S.objs = S.objs.filter(o => o.id !== id); S.sel.delete(id); }
function deleteSel(){ if(!S.sel.size) return; snap(); [...S.sel].forEach(remove); S.sel.clear(); sync(); }
function duplicateSel(){
  if(!S.sel.size) return; snap();
  const add = [];
  for(const id of S.sel){
    const o = S.objs.find(x => x.id === id); if(!o) continue;
    const c = JSON.parse(JSON.stringify(o)); c.id = uid++;
    c.pts.forEach(p => { p.x += 24; p.y += 24; });
    add.push(c);
  }
  S.objs.push(...add); S.sel = new Set(add.map(o => o.id)); sync();
}
function setOp(v){
  if(!S.sel.size){ say('Select a path first'); return; }
  snap();
  for(const id of S.sel){ const o = S.objs.find(x => x.id === id); if(o) o.op = v; }
  sync(); say(['Unite','Minus front','Intersect'][v]);
}
function order(dir){
  if(!S.sel.size) return; snap();
  const picked = S.objs.filter(o => S.sel.has(o.id));
  const rest = S.objs.filter(o => !S.sel.has(o.id));
  S.objs = dir > 0 ? [...rest,...picked] : [...picked,...rest];
  sync();
}
function clearAll(){ snap(); S.objs = []; S.sel.clear(); sync(); }

/* ══════════════════════════════════════════════════════════════════
   10 · OVERLAY + RULERS
   ══════════════════════════════════════════════════════════════════ */
const rhEl = document.getElementById('rulerH');
const rvEl = document.getElementById('rulerV');
const esc = t => String(t).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function niceStep(){
  for(const s of [1,2,5,10,20,25,50,100,200,250,500,1000,2000]) if(s*A.zoom >= 56) return s;
  return 5000;
}
function rulers(){
  const step = niceStep(), minor = step/5;
  const rh = rhEl.getBoundingClientRect(), rv = rvEl.getBoundingClientRect();
  if(!rh.width || !rv.height) return;
  rhEl.setAttribute('viewBox', `0 0 ${rh.width} ${rh.height}`);
  rvEl.setAttribute('viewBox', `0 0 ${rv.width} ${rv.height}`);
  const H = rh.height, V = rv.width;

  let h = '';
  const wx0 = -vw/2/A.zoom + A.cx, wx1 = vw/2/A.zoom + A.cx;
  for(let x = Math.ceil(wx0/minor)*minor; x <= wx1; x += minor){
    const sx = ((x - A.cx)*A.zoom + vw/2).toFixed(1);
    const maj = Math.abs(x/step - Math.round(x/step)) < 1e-6;
    h += `<path d="M${sx} ${maj?H*0.30:H*0.62}V${H}" stroke="currentColor" stroke-width="1" opacity="${maj?.55:.3}"/>`;
    if(maj) h += `<text x="${+sx+3}" y="${H*0.6}" font-size="8.5" fill="currentColor" opacity=".55" font-family="var(--font)">${Math.round(x)}</text>`;
  }
  if(hoverIn) h += `<path d="M${((hoverW.x-A.cx)*A.zoom+vw/2).toFixed(1)} 0V${H}" stroke="currentColor" stroke-width="1"/>`;
  rhEl.innerHTML = h;
  rhEl.style.color = 'var(--t1)';

  let v = '';
  const wy0 = -vh/2/A.zoom + A.cy, wy1 = vh/2/A.zoom + A.cy;
  for(let y = Math.ceil(wy0/minor)*minor; y <= wy1; y += minor){
    const sy = ((y - A.cy)*A.zoom + vh/2).toFixed(1);
    const maj = Math.abs(y/step - Math.round(y/step)) < 1e-6;
    v += `<path d="M${maj?V*0.30:V*0.62} ${sy}H${V}" stroke="currentColor" stroke-width="1" opacity="${maj?.55:.3}"/>`;

   11 · SVG EXPORT

function traceContours(list, res){
  const hw = PLATE.w/2, hh = PLATE.h/2, pad = 2;
  const x0 = -hw-pad, y0 = -hh-pad, x1 = hw+pad, y1 = hh+pad;
  const nx = Math.max(16, Math.round(res));
  const ny = Math.max(16, Math.round(res*(y1-y0)/(x1-x0)));
  const dx = (x1-x0)/nx, dy = (y1-y0)/ny, W = nx+1;
  const g = new Float32Array(W*(ny+1));
  for(let j=0;j<=ny;j++){
    const py = y0+j*dy, row = j*W;
    for(let i=0;i<=nx;i++) g[row+i] = fieldJS(x0+i*dx, py, list);
  }
  const ip = (a,b) => a/(a-b);
  const segs = [];
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const o = j*W+i;
    const v0 = g[o], v1 = g[o+1], v2 = g[o+W+1], v3 = g[o+W];
    let c = 0;
    if(v0<0) c|=8; if(v1<0) c|=4; if(v2<0) c|=2; if(v3<0) c|=1;
    if(c === 0 || c === 15) continue;
    const X = x0+i*dx, Y = y0+j*dy;
    const E0 = () => [X+dx*ip(v0,v1), Y];
    const E1 = () => [X+dx, Y+dy*ip(v1,v2)];
    const E2 = () => [X+dx*ip(v3,v2), Y+dy];
    const E3 = () => [X, Y+dy*ip(v0,v3)];
    const push = (p,q) => segs.push([p,q]);
    switch(c){
      case 1: push(E3(),E2()); break;
      case 2: push(E2(),E1()); break;
      case 3: push(E3(),E1()); break;
      case 4: push(E0(),E1()); break;
      case 6: push(E0(),E2()); break;
      case 7: push(E3(),E0()); break;
      case 8: push(E0(),E3()); break;
      case 9: push(E0(),E2()); break;
      case 11: push(E0(),E1()); break;
      case 12: push(E3(),E1()); break;
      case 13: push(E1(),E2()); break;
      case 14: push(E3(),E2()); break;
      case 5: { const ctr = (v0+v1+v2+v3)/4;
        if(ctr < 0){ push(E0(),E3()); push(E2(),E1()); } else { push(E0(),E1()); push(E3(),E2()); } break; }
      case 10: { const ctr = (v0+v1+v2+v3)/4;
        if(ctr < 0){ push(E0(),E1()); push(E3(),E2()); } else { push(E0(),E3()); push(E2(),E1()); } break; }
    }
  }
  const key = p => p[0].toFixed(4)+','+p[1].toFixed(4);
  const map = new Map();
  segs.forEach((sg,i) => { for(const end of [0,1]){
    const k = key(sg[end]); if(!map.has(k)) map.set(k,[]); map.get(k).push({ i, end });
  }});
  const used = new Uint8Array(segs.length), loops = [];
  for(let i=0;i<segs.length;i++){
    if(used[i]) continue;
    used[i] = 1;
    const line = [segs[i][0], segs[i][1]];
    for(const grow of [1,0]){
      while(true){
        const tip = grow ? line[line.length-1] : line[0];
        const cands = map.get(key(tip)) || [];
        let nxt = null;
        for(const c of cands) if(!used[c.i]){ nxt = c; break; }
        if(!nxt) break;
        used[nxt.i] = 1;
        const other = segs[nxt.i][1-nxt.end];
        if(grow) line.push(other); else line.unshift(other);
      }
    }
    if(line.length > 3) loops.push(line);
  }
  return loops;
}
function rdp(pts, eps){
  if(pts.length < 3) return pts;
  const keep = new Uint8Array(pts.length);
  keep[0] = keep[pts.length-1] = 1;
  const stack = [[0, pts.length-1]];
  while(stack.length){
    const [a,b] = stack.pop();
    if(b-a < 2) continue;
    const [ax,ay] = pts[a], [bx,by] = pts[b];
    const ex = bx-ax, ey = by-ay, L = Math.hypot(ex,ey) || 1e-9;
    let best = -1, bd = eps;
    for(let i=a+1;i<b;i++){
      const d = Math.abs((pts[i][0]-ax)*ey - (pts[i][1]-ay)*ex)/L;
      if(d > bd){ bd = d; best = i; }
    }
    if(best > 0){ keep[best] = 1; stack.push([a,best],[best,b]); }
  }
  return pts.filter((_,i) => keep[i]);
}
function loopToPath(loop, eps){
  const closed = Math.hypot(loop[0][0]-loop[loop.length-1][0], loop[0][1]-loop[loop.length-1][1]) < eps*2;
  let pts = loop.slice();
  if(closed) pts.pop();
  pts = rdp(pts, eps);
  const n = pts.length;
  if(n < 3) return '';
  const at = i => pts[((i%n)+n)%n];
  const f = v => Math.round(v*100)/100;
  let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  const last = closed ? n : n-1;
  for(let i=0;i<last;i++){
    const p0 = at(i-1), p1 = at(i), p2 = at(i+1), p3 = at(i+2);
    d += `C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} `
       + `${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  if(closed) d += 'Z';
  return d;
}
function buildSVG(){
  buildPrims();
  if(!prims.length) return null;
  const res = S.exportRes;
  const loops = traceContours(prims, res);
  const eps = (PLATE.w/res)*0.55;
  const ds = loops.map(l => loopToPath(l, eps)).filter(Boolean);
  if(!ds.length) return null;
  const hw = PLATE.w/2, hh = PLATE.h/2;
  const ink = S.invert ? '#ffffff' : '#000000';
  const paper = S.invert ? '#000000' : '#ffffff';
  let g = '';
  if(S.exportGrid){
    let lines = '';
    for(let x=-hw; x<=hw+.5; x+=S.gridStep) lines += `<path d="M${x} ${-hh}V${hh}"/>`;
    for(let y=-hh; y<=hh+.5; y+=S.gridStep) lines += `<path d="M${-hw} ${y}H${hw}"/>`;
    g += `<g fill="none" stroke="${ink}" stroke-width="0.5" opacity="0.09">${lines}</g>`
       + `<rect x="${-hw}" y="${-hh}" width="${PLATE.w}" height="${PLATE.h}" fill="none" stroke="${ink}" stroke-width="1" opacity="0.22"/>`;
  }
  const dAll = ds.join('');
  g += S.mode === 0
    ? `<path d="${dAll}" fill="none" stroke="${ink}" stroke-width="${S.line}" fill-rule="evenodd" stroke-linejoin="round"/>`
    : `<path d="${dAll}" fill="${ink}" fill-rule="evenodd"/>`;
  if(S.exportGrid){
    g += `<g font-family="monospace" font-size="9" letter-spacing="1.4" fill="${ink}" opacity="0.4">`
       + `<text x="${-hw+16}" y="${hh-14}">${esc(S.cap1)}</text>`
       + `<text x="-40" y="${hh-14}">${esc(S.cap2)}</text>`
       + `<text x="70" y="${hh-14}">${esc(S.cap3)}</text></g>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-hw} ${-hh} ${PLATE.w} ${PLATE.h}" width="${PLATE.w}" height="${PLATE.h}">`
       + `<rect x="${-hw}" y="${-hh}" width="${PLATE.w}" height="${PLATE.h}" fill="${paper}"/>${g}</svg>`;
}
async function copyText(txt, label){
  try { await navigator.clipboard.writeText(txt); say(label+' copied'); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); say(label+' copied'); }
    catch { say('Copy blocked - see console'); console.log(txt); }
    ta.remove();
  }
}
function exportSVG(){
  say('Tracing contours...');
  setTimeout(() => {
    const svg = buildSVG();
    if(!svg){ say('Nothing to export'); return; }
    copyText(svg, 'SVG '+Math.round(svg.length/1024)+'kB');
  }, 16);
}
function exportPath(){
  setTimeout(() => {
    const svg = buildSVG();
    if(!svg){ say('Nothing to export'); return; }
    const m = svg.match(/ d="([^"]+)"/g);
    copyText(m ? m[m.length-1].slice(4,-1) : '', 'Path data');
  }, 16);
}

function preset(name){
  snap(); S.objs = []; S.sel.clear();
  if(name === 'tangent'){
    S.k = 64; S.kernel = 2;
    const c = (x,y,r) => S.objs.push(mkCircle(x,y,r));
    const cap = (x,y,x2,y2,r,r2) => S.objs.push(mkCapsule(x,y,x2,y2,r,r2));
    c(-30,-270,90);
    cap(-30,-270, 40,-20, 70, 46);
    cap(40,-20, 470,-10, 40, 95);
    cap(40,-20, -420,40, 36, 92);
    cap(40,-20, 20,250, 52, 96);
    c(20,250,96); c(-420,40,92); c(470,-10,95);
  } else if(name === 'cutaway'){
    S.k = 0;
    const b = mkBox(-40,0,420,300); b.cr = 0; S.objs.push(b);
    const h = mkCircle(90,0,135); h.op = 1; S.objs.push(h);
  } else if(name === 'stroke'){
    S.k = 26; S.profile = 'both';
    const st = mkStrand(-420,-120,16); st.base = 58;
    for(let i=1;i<=30;i++){
      const t = i/30;
      const p = P(-420 + t*840, -120 + Math.sin(t*4.2)*150, 16);
      p.dyn = 0.55 + 0.45*Math.sin(t*9);
      p.ang = Math.atan2(Math.cos(t*4.2)*0.75, 1);
      st.pts.push(p);
    }
    applyProfile(st); S.objs.push(st);
  } else if(name === 'orbit'){
    S.k = 54; S.kernel = 2;
    for(let i=0;i<7;i++){
      const a = i/7*Math.PI*2;
      S.objs.push(mkCircle(Math.cos(a)*230, Math.sin(a)*170, 48+(i%3)*18));
    }
    S.objs.push(mkCircle(0,0,70));
  }
  snap(); sync(); buildOpts(); say(name);
}

  const r = document.createElement('input');
  r.type = 'range'; r.min = min; r.max = max; r.step = st; r.value = get();
  r.setAttribute('aria-label', label);
  const out = el('output',null,String((fmt||(v=>v))(get())));
  r.oninput = () => { set(parseFloat(r.value)); out.textContent = String((fmt||(v=>v))(parseFloat(r.value))); };
  r.onchange = () => snap();
  grp.append(r,out);
}
function oSeg(grp, label, opts, get, set){
  if(label) grp.appendChild(el('label',null,label));
  const seg = el('div','seg'); seg.style.width = (opts.length*46)+'px'; seg.style.flex = 'none';
  opts.forEach(([v,t]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t;
    b.setAttribute('aria-pressed', String(get() === v));
    b.onclick = () => { set(v); buildOpts(); buildPanel(); };
    seg.appendChild(b);
  });
  grp.appendChild(seg);
}
const oGroup = () => { const g = el('div','ogrp'); optsEl.appendChild(g); return g; };

function reprofileSel(){
  for(const id of S.sel){
    const o = S.objs.find(x => x.id === id);
    if(o && o.kind === 'strand') applyProfile(o);
  }
}
function buildOpts(){
  optsEl.innerHTML = '';
  const t = TOOLS.find(x => x && x[0] === S.tool);
  optsEl.appendChild(el('div','tname', t ? t[1] : S.tool));

  const g1 = oGroup();
  oSeg(g1,'Continuity',[[0,'G1'],[1,'G2'],[2,'ARC']], ()=>S.kernel,
    v => { S.kernel = v; say(['Polynomial G1','Cubic G2','Circular arc'][v]); });
  oRange(g1,'Blend',0,160,1, ()=>S.k, v=>{S.k=v;}, v=>Math.round(v));

  if(S.tool === 'pen' || S.tool === 'segment' || S.tool === 'polyline' || S.tool === 'curve'){
    const g = oGroup();
    oSeg(g,'Profile',[['uniform','FLAT'],['both','LEAF'],['out','TAIL'],['bulge','BULB'],['nib','NIB']],
      ()=>S.profile, v=>{ S.profile = v; reprofileSel(); });
    oRange(g,'Width',4,200,1, ()=>S.defR, v=>{S.defR=v;}, v=>Math.round(v));
    if(S.tool === 'polyline')
      oRange(g,'Fillet',0,200,1, ()=>S.fillet,
        v => { S.fillet = v; if(poly){ poly.o.fillet = v; polyRebuild(); } }, v=>Math.round(v));
    if(S.tool === 'segment')
      oRange(g,'Taper',0,0.95,.01, ()=>S.taper, v=>{S.taper=v;}, v=>v.toFixed(2));
    if(S.tool === 'pen'){
      oRange(g,'Speed',0,0.95,.01, ()=>S.dyn, v=>{S.dyn=v;}, v=>v.toFixed(2));
      oRange(g,'Smooth',0,1,.02, ()=>S.smooth, v=>{S.smooth=v; reprofileSel();}, v=>v.toFixed(2));
      if(S.profile === 'nib')
        oRange(g,'Angle',-1.57,1.57,.02, ()=>S.nib, v=>{S.nib=v; reprofileSel();}, v=>Math.round(v*57)+'°');
    }
  }
  if(['ellipse','rect','ring','knife'].indexOf(S.tool) >= 0){
    const g = oGroup();
    oRange(g,'Size',4,300,1, ()=>S.defR, v=>{S.defR=v;}, v=>Math.round(v));
  }
  if(S.tool === 'width'){
    const g = oGroup();
    oRange(g,'Brush',20,320,5, ()=>S.brush, v=>{S.brush=v;}, v=>Math.round(v));
  }

  const g3 = oGroup();
  oSeg(g3,'Ink',[[0,'LINE'],[1,'SOLID'],[2,'BOTH']], ()=>S.mode, v=>{S.mode=v;});
  oRange(g3,'Grain',0,1,.02, ()=>S.grain, v=>{S.grain=v;}, v=>v.toFixed(2));
  oRange(g3,'Bite',0,2,.02, ()=>S.bite, v=>{S.bite=v;}, v=>v.toFixed(2));

  const g4 = oGroup();
  const sn = el('label','chk');
  const si = document.createElement('input');
  si.type = 'checkbox'; si.checked = S.snap;
  si.onchange = () => { S.snap = si.checked; };
  sn.append(si, document.createTextNode('Snap'));
  g4.appendChild(sn);
}

function slider(parent, label, min, max, st, get, set, fmt){
  const row = el('div','row');
  row.appendChild(el('label',null,label));
  const r = document.createElement('input');
  r.type = 'range'; r.min = min; r.max = max; r.step = st; r.value = get();
  r.setAttribute('aria-label', label);
  const out = el('output',null,String((fmt||(v=>v))(get())));
  r.oninput = () => { set(parseFloat(r.value)); out.textContent = String((fmt||(v=>v))(parseFloat(r.value))); };
  r.onchange = () => snap();
  row.append(r,out); parent.appendChild(row);
}
function segment(parent, label, opts, get, set){
  const row = el('div','row');
  if(label) row.appendChild(el('label',null,label));
  const seg = el('div','seg');
  opts.forEach(([v,t]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t;
    b.setAttribute('aria-pressed', String(get() === v));
    b.onclick = () => { set(v); sync(); };
    seg.appendChild(b);
  });
  row.appendChild(seg); parent.appendChild(row);
}
function check(parent, label, get, set){
  const l = el('label','chk');
  const i = document.createElement('input');
  i.type = 'checkbox'; i.checked = get();
  i.onchange = () => { set(i.checked); sync(); };
  l.append(i, document.createTextNode(label));
  parent.appendChild(l);
}
function button(parent, label, fn){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn'; b.textContent = label; b.onclick = fn;
  parent.appendChild(b);
}
const selObjs = () => S.objs.filter(o => S.sel.has(o.id));

function buildPanel(){
  panel.innerHTML = '';
  const sel = selObjs();

  const sp = el('div','sect'); sp.appendChild(el('h2',null,'Pathfinder'));
  const pf = el('div','pf');
  [['Unite','<rect x="2.5" y="2.5" width="9" height="9" fill="currentColor"/><rect x="6.5" y="6.5" width="9" height="9" fill="currentColor"/>'],
   ['Minus front','<rect x="2.5" y="2.5" width="9" height="9" fill="currentColor"/><rect x="6.5" y="6.5" width="9" height="9" fill="var(--chrome)" stroke="currentColor" stroke-width="1"/>'],
   ['Intersect','<rect x="2.5" y="2.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/><rect x="6.5" y="6.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/><rect x="6.5" y="6.5" width="5" height="5" fill="currentColor"/>']
  ].forEach(([title,svg],i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.title = title; b.setAttribute('aria-label', title);
    b.innerHTML = `<svg viewBox="0 0 18 18" aria-hidden="true">${svg}</svg>`;
    b.onclick = () => setOp(i);
    pf.appendChild(b);
  });
  sp.appendChild(pf);
  panel.appendChild(sp);

  const s1 = el('div','sect');
  s1.appendChild(el('h2',null,'Transform - '+sel.length+' selected'));
  if(!sel.length){
    s1.appendChild(el('div','','<div id="selnone">Nothing selected. Draw with a shape tool, or click a path with the Selection tool.</div>'));
  } else {
    const o = sel[0];
    slider(s1,'Blend',0,160,1, ()=> o.k < 0 ? S.k : o.k, v => sel.forEach(x => x.k = v), v=>Math.round(v));
    segment(s1,'Source',[['g','GLOBAL'],['l','LOCAL']], ()=> o.k<0 ? 'g' : 'l',
      v => { snap(); sel.forEach(x => x.k = v==='g' ? -1 : S.k); });
    if(o.kind === 'circle' || o.kind === 'ring')
      slider(s1,'Radius',2,420,1, ()=>o.pts[0].r, v=>sel.forEach(x=>{ if(x.pts[0]) x.pts[0].r = v; }), v=>Math.round(v));
    if(o.kind === 'ring')
      slider(s1,'Wall',1,120,1, ()=>o.t, v=>sel.forEach(x=>{ if(x.kind==='ring') x.t = v; }), v=>Math.round(v));
    if(o.kind === 'box'){
      slider(s1,'Width',4,900,1, ()=>o.w, v=>{o.w=v;}, v=>Math.round(v));
      slider(s1,'Height',4,900,1, ()=>o.h, v=>{o.h=v;}, v=>Math.round(v));
      slider(s1,'Fillet',0,160,1, ()=>o.cr, v=>{o.cr=Math.min(v,Math.min(o.w,o.h)/2);}, v=>Math.round(v));
      slider(s1,'Rotate',-180,180,1, ()=>o.rot*180/Math.PI, v=>{o.rot=v*Math.PI/180;}, v=>Math.round(v)+'°');
    }
    if(o.kind === 'strand'){
      slider(s1,'Width',4,240,1, ()=>o.base||S.defR,
        v => { o.base = v; o.ctrl ? rebuild(o) : applyProfile(o); }, v=>Math.round(v));
      if(o.mode === 'poly')
        slider(s1,'Fillet',0,200,1, ()=>o.fillet||0, v=>{ o.fillet = v; rebuild(o); }, v=>Math.round(v));
      segment(s1,'Profile',[['uniform','FLAT'],['both','LEAF'],['out','TAIL']],
        ()=>S.profile, v=>{ S.profile = v; applyProfile(o); buildOpts(); });
    }
    if(o.kind === 'capsule')
      slider(s1,'Taper',0,1,.01, ()=>1-(o.pts[1].r/Math.max(1,o.pts[0].r)),
        v=>{ o.pts[1].r = Math.max(1, o.pts[0].r*(1-v)); }, v=>v.toFixed(2));
    const g = el('div','grid2'); g.style.marginTop = '7px';
    button(g,'DUPLICATE', duplicateSel);
    button(g,'DELETE', deleteSel);
    button(g,'FRONT', ()=>order(1));
    button(g,'BACK', ()=>order(-1));
    s1.appendChild(g);
  }
  panel.appendChild(s1);

  const s2 = el('div','sect'); s2.appendChild(el('h2',null,'Appearance'));
  slider(s2,'Weight',0.4,6,.1, ()=>S.line, v=>{S.line=v;}, v=>v.toFixed(1));
  slider(s2,'Iso step',0,120,2, ()=>S.iso, v=>{S.iso=v;}, v=> v<1 ? 'off' : Math.round(v));
  check(s2,'Construction', ()=>S.ghost, v=>{S.ghost=v;});
  check(s2,'Invert', ()=>S.invert, setInvert);
  panel.appendChild(s2);

  const s5 = el('div','sect'); s5.appendChild(el('h2',null,'Plate'));
  check(s5,'Grid', ()=>S.grid, v=>{S.grid=v;});
  slider(s5,'Module',10,160,5, ()=>S.gridStep, v=>{S.gridStep=v;}, v=>Math.round(v));
  ['cap1','cap2','cap3'].forEach((k,i) => {
    const inp = document.createElement('input');
    inp.className = 'txt'; inp.type = 'text'; inp.value = S[k];
    inp.setAttribute('aria-label','Caption '+(i+1));
    inp.oninput = () => { S[k] = inp.value; };
    s5.appendChild(inp);
  });
  panel.appendChild(s5);

  const s6 = el('div','sect'); s6.appendChild(el('h2',null,'Presets'));
  const pg = el('div','grid2');
  button(pg,'TANGENT', ()=>preset('tangent'));
  button(pg,'CUTAWAY', ()=>preset('cutaway'));
  button(pg,'STROKE', ()=>preset('stroke'));
  button(pg,'ORBIT', ()=>preset('orbit'));
  s6.appendChild(pg);
  panel.appendChild(s6);

  const s7 = el('div','sect'); s7.appendChild(el('h2',null,'Export'));
  slider(s7,'Trace',180,1400,20, ()=>S.exportRes, v=>{S.exportRes=v;}, v=>Math.round(v));
  check(s7,'With grid', ()=>S.exportGrid, v=>{S.exportGrid=v;});
  const eg = el('div','grid2'); eg.style.marginTop = '7px';
  button(eg,'COPY SVG', exportSVG);
  button(eg,'COPY PATH', exportPath);
  button(eg,'SAVE JSON', ()=>copyText(JSON.stringify({objs:S.objs,k:S.k}), 'Scene'));
  button(eg,'CLEAR', ()=>{ clearAll(); say('Cleared'); });
  s7.appendChild(eg);
  s7.appendChild(el('p','hint','Export traces the live field and fits beziers, so the SVG matches what you see.'));
  panel.appendChild(s7);

  const s8 = el('div','sect'); s8.appendChild(el('h2',null,'Keys'));
  s8.appendChild(el('p','hint',
    'V A P \\ L M O W G C H Z tools - alt subtracts - shift constrains - space-drag pans - scroll zooms - Cmd+Z undo - Cmd+D duplicate - R runs physics - F fits - 1 2 3 ink mode'));
  panel.appendChild(s8);
}

/* ══════════════════════════════════════════════════════════════════
   15 · LOOP
   ══════════════════════════════════════════════════════════════════ */
function sync(){
  buildPanel();
  document.getElementById('st-n').textContent = S.objs.length;
}
function fitView(){
  if(!S.objs.length){ S.cam = {x:0,y:0}; S.zoom = Math.min(vw/(PLATE.w*1.08), vh/(PLATE.h*1.08)); return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const o of S.objs) for(const p of o.pts){
    const r = o.kind === 'box' ? Math.max(o.w,o.h)/2 : p.r+20;
    x0=Math.min(x0,p.x-r); x1=Math.max(x1,p.x+r);
    y0=Math.min(y0,p.y-r); y1=Math.max(y1,p.y+r);
  }
  S.cam = { x:(x0+x1)/2, y:(y0+y1)/2 };
  S.zoom = Math.max(0.08, Math.min(4, Math.min(vw/(x1-x0+80), vh/(y1-y0+80))));
}

let prev = performance.now(), fAcc = 0, fN = 0;
const ease = (cur, tgt, dt, tau) => cur + (tgt-cur)*(1 - Math.exp(-dt/tau));

function frame(t){
  const dt = Math.min(0.05, (t-prev)/1000) || 0.016;
  prev = t;
  fAcc += dt; fN++;
  if(fAcc > 0.5){
    document.getElementById('perf').textContent = Math.round(fN/fAcc)+' fps / '+prims.length+' prim';
    fAcc = 0; fN = 0;
  }
  resize();

  A.k     = ease(A.k,     S.k,     dt, 0.075);
  A.zoom  = ease(A.zoom,  S.zoom,  dt, 0.065);
  A.cx    = ease(A.cx,    S.cam.x, dt, 0.065);
  A.cy    = ease(A.cy,    S.cam.y, dt, 0.065);
  A.line  = ease(A.line,  S.line,  dt, 0.06);
  A.iso   = ease(A.iso,   S.iso,   dt, 0.09);
  A.grain = ease(A.grain, S.grain, dt, 0.09);
  A.bite  = ease(A.bite,  S.bite,  dt, 0.09);
  document.getElementById('st-z').textContent = Math.round(A.zoom*100)+'%';

  buildPrims();
  draw();
  overlay();
  rulers();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════
   16 · KEYBOARD
   ══════════════════════════════════════════════════════════════════ */
const KEYMAP = { v:'select', a:'direct', p:'pen', n:'polyline', e:'curve', '\\':'segment', l:'ellipse', m:'rect', o:'ring',
                 w:'width', c:'knife', h:'hand', z:'zoom' };
addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if(e.code === 'Space'){ spaceDown = true; viewEl.style.cursor = 'grab'; e.preventDefault(); return; }
  if(e.metaKey || e.ctrlKey){
    const k = e.key.toLowerCase();
    if(k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if(k === 'd'){ e.preventDefault(); duplicateSel(); }
    else if(k === 'a'){ e.preventDefault(); S.sel = new Set(S.objs.map(o => o.id)); sync(); }
    return;
  }
  const k = e.key.toLowerCase();
  if(KEYMAP[k]){ setTool(KEYMAP[k]); return; }
  if(e.key === 'Enter'){ e.preventDefault(); polyFinish(); return; }
  if(e.key === 'Delete' || e.key === 'Backspace'){
    e.preventDefault();
    if(poly) polyBack(); else deleteSel();
    return;
  }
  if(k === 'f'){ fitView(); say('Fit'); return; }
  if(e.key === 'Escape'){ if(poly) polyAbort(); else { S.sel.clear(); sync(); } return; }
  if(e.key === '['){ S.k = Math.max(0, S.k-6); buildOpts(); return; }
  if(e.key === ']'){ S.k = Math.min(160, S.k+6); buildOpts(); return; }
  if(e.key === '1'){ S.mode = 0; buildOpts(); return; }
  if(e.key === '2'){ S.mode = 1; buildOpts(); return; }
  if(e.key === '3'){ S.mode = 2; buildOpts(); return; }
});
addEventListener('keyup', e => {
  if(e.code === 'Space'){ spaceDown = false; viewEl.style.cursor = CURSOR[S.tool] || 'crosshair'; }
});
document.getElementById('drawer').onclick = () => panel.classList.toggle('open');

/* ══════════════════════════════════════════════════════════════════
   17 · BOOT
   ══════════════════════════════════════════════════════════════════ */
resize();
document.documentElement.setAttribute('data-theme','light');
setTool('select');
fitView();
A.zoom = S.zoom; A.cx = S.cam.x; A.cy = S.cam.y; A.k = S.k;
snap(); sync(); buildOpts();
requestAnimationFrame(frame);

})();
</script>
