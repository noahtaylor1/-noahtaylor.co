<!DOCTYPE html>
<html lang="en">
<head>

<title>Malleable PL1 — Noah Taylor</title>
<style>
/* Same plate-and-chrome identity as the rest of Malleable: achromatic,
   Helvetica, options bar over [rail | ruled viewport | inspector], a
   status strip beneath. */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --chrome:#ffffff;
  --chrome-2:#f4f4f4;
  --chrome-3:#e9e9e9;
  --rule:rgba(0,0,0,.16);
  --rule-soft:rgba(0,0,0,.08);
  --t1:rgba(0,0,0,.92);
  --t2:rgba(0,0,0,.56);
  --t3:rgba(0,0,0,.34);
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --nav-h:56px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-top:var(--nav-h);background:var(--chrome);color:var(--t1);
  font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}

.site-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:30;
  display:flex;align-items:center;justify-content:space-between;padding:0 48px;
  background:var(--chrome);border-bottom:1px solid var(--rule);font-family:var(--font)}
.site-nav a{color:var(--t1);text-decoration:none;transition:color .15s var(--ease)}
.site-nav a:hover{color:var(--t3)}
.nav-logo{font-size:14px;font-weight:500;letter-spacing:.03em}
.nav-links{display:flex;gap:32px;list-style:none;margin:0;padding:0;font-size:13px;letter-spacing:.02em}
@media (max-width:900px) and (min-width:701px){.site-nav{padding:0 24px}.nav-links{gap:22px}}
@media (max-width:700px){.site-nav{padding:0 20px}.nav-links li:not(.keep){display:none}}

#app{display:grid;grid-template-columns:40px 1fr 264px;grid-template-rows:34px 1fr 24px;height:100%}

#opts{grid-column:1/4;grid-row:1;background:var(--chrome);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;padding:0 10px 0 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
#opts .tname{font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:10px;
  white-space:nowrap;flex:none;padding-right:12px;margin-right:12px;border-right:1px solid var(--rule);min-width:104px}
#opts .ogrp{display:flex;align-items:center;gap:7px;flex:0 0 auto;min-width:0;padding-right:12px;margin-right:12px;
  border-right:1px solid var(--rule-soft);animation:fadein .18s var(--ease)}
#opts .ogrp:last-child{border-right:0}
@keyframes fadein{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
#opts label{font-size:10px;color:var(--t3);white-space:nowrap;text-transform:uppercase;letter-spacing:.18em}
#opts output{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* A slider is a rule with a bead on it - no colour anywhere, the same
   hairline and the same ink as everything else on the plate. */
input[type=range]{-webkit-appearance:none;appearance:none;background:none;height:14px;margin:0;
  accent-color:var(--ink);cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
input[type=range]::-moz-range-track{height:1px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;
  background:var(--ink);border:0;margin-top:-3.5px;cursor:pointer;transition:transform .12s var(--ease)}
input[type=range]::-moz-range-thumb{width:8px;height:8px;border:0;border-radius:50%;
  background:var(--ink);cursor:pointer}
input[type=range]::-moz-range-progress{height:1px;background:var(--rule)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.35)}
input[type=range]:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
#opts input[type=range]{flex:0 0 76px;width:76px;margin:0}
#opts .seg{flex:0 0 128px;height:24px}
#opts .seg button{padding:0 2px;font-size:10px;letter-spacing:.06em;text-transform:uppercase}

#rail{grid-column:1;grid-row:2/4;background:var(--chrome);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;overflow-y:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.tool{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;flex:none;
  background:none;border-radius:2px;cursor:pointer;color:var(--t1);position:relative;
  transition:background .14s var(--ease),color .14s var(--ease)}
.tool svg{width:17px;height:17px;display:block;transition:transform .16s var(--ease)}
.tool:hover{background:var(--chrome-3)}
.tool:hover svg{transform:scale(1.08)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool[aria-pressed="true"] svg{transform:none}
.tool:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.rail-sep{width:18px;height:1px;background:var(--rule);margin:5px 0;flex:none}

#stage{grid-column:2;grid-row:2;display:grid;grid-template-columns:18px 1fr;grid-template-rows:18px 1fr;
  background:var(--chrome);min-width:0;min-height:0}
#corner{background:var(--chrome-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
#rulerH{border-bottom:1px solid var(--rule);background:var(--chrome-2);display:block;width:100%;height:100%}
#rulerV{border-right:1px solid var(--rule);background:var(--chrome-2);display:block;width:100%;height:100%}
#view{position:relative;overflow:hidden;touch-action:none;background:var(--render-paper,var(--paper));
  min-width:0;min-height:0}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#hint{position:absolute;left:12px;bottom:9px;font-size:11.5px;color:var(--t3);pointer-events:none;
  user-select:none;max-width:70%}

#panel{grid-column:3;grid-row:2/4;background:var(--chrome);border-left:1px solid var(--rule);
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sect{border-bottom:1px solid var(--rule);padding:9px 11px}
.sect h2{margin:0 0 9px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);font-weight:400}
.row{display:flex;align-items:center;gap:7px;margin-bottom:5px;min-width:0}
.row:last-child{margin-bottom:0}
.row label{flex:1 1 auto;font-size:12px;color:var(--t2);min-width:0}
.num{flex:0 0 66px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;
  background:none;border:0;border-bottom:1px solid var(--rule-soft);padding:3px 0;
  -moz-appearance:textfield;cursor:ew-resize;transition:border-color .14s var(--ease)}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:none;border-bottom-color:var(--ink);cursor:text}
.unit{flex:0 0 20px;font-size:11px;color:var(--t3)}
.seg{display:flex;flex:1;border:1px solid var(--rule);border-radius:2px;overflow:hidden;min-width:0}
.seg button{flex:1;min-width:0;padding:4px 2px;background:none;border:0;border-right:1px solid var(--rule);
  cursor:pointer;font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--t2);white-space:nowrap;
  transition:background .14s var(--ease),color .14s var(--ease)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:hover:not([aria-pressed="true"]){background:var(--chrome-3);color:var(--t1)}
.btn{padding:5px 7px;background:none;border:1px solid var(--rule);border-radius:2px;cursor:pointer;
  font-size:12px;font-weight:500;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;
  transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease)}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.grid2{display:flex;gap:4px}
.hint{font-size:11.5px;line-height:1.6;color:var(--t3);margin:7px 0 0}

#status{grid-column:2;grid-row:3;border-top:1px solid var(--rule);background:var(--chrome);
  display:flex;align-items:center;gap:15px;padding:0 12px;font-size:11px;color:var(--t2);
  letter-spacing:.02em;overflow:hidden;white-space:nowrap}
#status b{font-weight:500;color:var(--t1)}
#status span{font-variant-numeric:tabular-nums}
#st-msg{color:var(--t1);transition:opacity .3s var(--ease);margin-left:auto}
#drawer{display:none}

@media (max-width:880px){
  #app{grid-template-columns:1fr;grid-template-rows:34px 36px 1fr 24px}
  #opts{grid-column:1;grid-row:1}
  #rail{grid-column:1;grid-row:2;flex-direction:row;border-right:0;border-bottom:1px solid var(--rule);
    padding:0 6px;overflow-x:auto;overflow-y:hidden}
  .rail-sep{width:1px;height:18px;margin:0 4px}
  #stage{grid-column:1;grid-row:3}
  #status{grid-column:1;grid-row:4}
  #panel{position:fixed;right:0;bottom:24px;top:calc(70px + var(--nav-h));width:min(248px,86vw);z-index:5;
    transform:translateX(102%);transition:transform .22s var(--ease);box-shadow:-8px 0 26px rgba(0,0,0,.18)}
  #panel.open{transform:none}
  #drawer{display:grid;place-items:center;position:fixed;right:10px;bottom:34px;z-index:6;
    width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);border:0;cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.3)}
  #drawer svg{width:17px;height:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <div id="opts"></div>

  <div id="stage">
    <div id="corner"></div>

<button id="drawer" aria-label="Inspector">
  <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5h12M3 9h12M3 13.5h12"/></svg>

<script>
"use strict";
(() => {

/* ══════════════════════════════════════════════════════════════════
   MALLEABLE PL1 — planter
   ------------------------------------------------------------------
   One obround wall, drawing in at a fixed draft, laid down in a
   single spiral with the 8 mm nozzle at 4 mm a layer. The three
   dimensions on the drawing are the handles: take hold of the circle
   and the corners move apart. The draft never changes - raising the
   height only carries the wall further along the angle it already
   had, which is why a tall one has a narrower mouth.

   Turn a face towards you and you are in elevation, and in elevation
   you can draw on it. A stroke is 4 mm wide and 4 mm deep, and it is
   not cut out of the wall afterwards: the path itself steps inward
   where the stroke goes, the way a pot takes a boolean, so the whole
   wall - inside and out - carries the drawing.

   One scene unit is one millimetre.
   ══════════════════════════════════════════════════════════════════ */

const NOZ    = 8;              // mm - the Ginger 8 mm nozzle, one bead is the wall
const LAYER  = 4;              // mm
const STROKE = 4;              // mm - the relief stroke, to start with
const SWMIN  = 2, SWMAX = 40;  // mm - and how far it may be taken
const DEPTH  = 4;              // mm - how far the wall moves. This one is fixed.
const BLEND  = 4;              // mm - the nozzle cannot turn a corner tighter than this
const DRAFT  = 7;              // degrees off plumb, and it stays there
const MAXMM  = 914.4;          // 36 inches, every axis
const FLOORT = 12;             // mm - three layers of floor
/* The floor is one concentric spiral, not a stack of rings: the pass
   steps in by six so each one lies two millimetres over the last. */
const FSTEP  = NOZ - 2;        // mm
const MINW   = 70;             // mm - the smallest the base may get
const RIMMIN = 60;             // mm - and the smallest the opening may close to
const BAKE_W = 2048, BAKE_H = 768;
const MAXSEG = 4096;

const RAD   = Math.PI/180;
/* Negative: the wall draws IN as it climbs, so the base is the widest
   thing and the 36 in stop is simply the figure on the drawing. Every
   layer steps inward over the one beneath it, which is the safe way
   round for a single-bead spiral. */
const SLOPE = -Math.tan(DRAFT*RAD);
const COS   = Math.cos(DRAFT*RAD);

const FACES = { F:{az:0,   name:'FRONT'},
                R:{az:90,  name:'RIGHT END'},
                B:{az:180, name:'BACK'},
                L:{az:270, name:'LEFT END'} };

const S = {
  L:420, W:200, H:160,          // the base, in mm - the figures on the drawing
  strokes:[],                   // [{pts:[{u,v}...], w, sunk}] - normalised to the skin
  sw:STROKE, sunk:true,         // what the next stroke will be made of
  tool:'orbit',
  face:null,                    // null is free 3D; otherwise 'F' 'R' 'B' 'L'
  az:45*RAD, el:35.264*RAD,     // the isometric is home
  scale:900, tx:0, ty:0, tz:70
};
const A = { az:S.az, el:S.el, scale:S.scale, tx:0, ty:0, tz:70 };

let msgTimer = 0;
function say(t){
  const e = document.getElementById('st-msg');
  e.textContent = t; e.style.opacity = '1';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { e.style.opacity = '0'; }, 2400);
}

/* ══════════════════════════════════════════════════════════════════
   1 · THE FORM
   The plan is a stadium: a straight run of 2a with a half-round of r
   on each end. Offsetting it outwards leaves the straight run exactly
   as long and only grows r - which is why a constant draft is simply
   r rising linearly with z, and why nothing about the shape changes
   when you pull the dimensions about.
   ══════════════════════════════════════════════════════════════════ */
const aOf  = () => Math.max(0, (S.L - S.W)/2);
const r0Of = () => S.W/2;
const rAt  = z => r0Of() + Math.min(Math.max(z,0), S.H)*SLOPE;
const perim = z => 2*Math.PI*rAt(z) + 4*aOf();
const rimL = () => S.L + 2*S.H*SLOPE;
const rimW = () => S.W + 2*S.H*SLOPE;
const layers = () => Math.max(1, Math.round(S.H/LAYER));
const inch = mm => (mm/25.4).toFixed(1);

/* Where a point sits on the skin: s is arc length round the plan AT
   THAT HEIGHT, measured from the bottom of the right-hand round, and
   it runs anticlockwise. Because r is linear in z, a line drawn
   straight up the wall is a straight line in (s,z) too - so the two
   coordinates are all the drawing ever needs. */
function coord(x, y, z){
  const a = aOf(), r = rAt(z), P = 2*Math.PI*r + 4*a;
  let s, face;
  if(x > a){
    s = (Math.atan2(y, x - a) + Math.PI/2)*r; face = 'R';
  } else if(x < -a){
    let psi = Math.atan2(y, x + a);
    if(psi < 0) psi += 2*Math.PI;
    s = Math.PI*r + 2*a + (psi - Math.PI/2)*r; face = 'L';
  } else if(y >= 0){
    s = Math.PI*r + (a - x); face = 'B';
  } else {
    s = 2*Math.PI*r + 2*a + (x + a); face = 'F';
  }
  return { s, P, face };
}
/* and back again - the point on the plan at arc length s, with the
   outward normal there, which is what the toolpath is built from. */
function atArc(s, r){
  const a = aOf();
  if(s < Math.PI*r){
    const psi = s/r - Math.PI/2;
    return { x:a + r*Math.cos(psi), y:r*Math.sin(psi), nx:Math.cos(psi), ny:Math.sin(psi) };
  }
  if(s < Math.PI*r + 2*a){
    return { x:a - (s - Math.PI*r), y:r, nx:0, ny:1 };
  }
  if(s < 2*Math.PI*r + 2*a){
    const psi = (s - Math.PI*r - 2*a)/r + Math.PI/2;
    return { x:-a + r*Math.cos(psi), y:r*Math.sin(psi), nx:Math.cos(psi), ny:Math.sin(psi) };
  }
  return { x:-a + (s - 2*Math.PI*r - 2*a), y:-r, nx:0, ny:-1 };
}

/* ── the drawing, in mm ────────────────────────────────────────────
   Strokes are kept normalised - (u round, v up) - so the drawing
   stays where you put it when the planter is resized. The metric is
   always millimetres: it is turned back into (s,z) against whatever
   the form is now, and the stroke is 4 mm wide at any size. */
/* Each stroke carries its own width and its own direction - in for a
   deboss, out for an emboss - so a drawing can hold both. */
function segsMM(){
  const out = [];
  for(const st of S.strokes){
    const p = st.pts, w = st.w || STROKE, sg = st.sunk === false ? -1 : 1;
    for(let i=1;i<p.length;i++){
      const z0 = p[i-1].v*S.H, z1 = p[i].v*S.H;
      out.push([ p[i-1].u*perim(z0), z0, p[i].u*perim(z1), z1, w, sg ]);
      if(out.length >= MAXSEG) return out;
    }
  }
  return out;
}
const smoothstep = (a,b,x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };

/* ══════════════════════════════════════════════════════════════════
   2 · GL — the skin is solved, the drawing is baked
   The wall itself is four numbers, so it is evaluated straight. The
   drawing can run to thousands of segments, which no ray march can
   walk at every step, so it is baked once into a field over (u,v) -
   round and up - and read back as a smooth surface.
   ══════════════════════════════════════════════════════════════════ */
const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true });

const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0.0,1.0); }`;

const BAKE_FS = `#version 300 es
precision highp float;
uniform sampler2D uSeg;
uniform int uSegN;
uniform vec2 uRes;
uniform float uA, uR0, uH, uTan, uBlend;
out vec4 outColor;
const float PI = 3.141592653589793;
/* Two numbers come out of here, not one: how much of the wall at this
   place is being pressed in, and how much of it is being pushed out.
   Each is the deepest any one stroke takes it, so strokes crossing do
   not pile up, and a drawing may hold both kinds at once. The profile
   is worked out here rather than later because every stroke has its
   own width, and once they are mixed a distance alone cannot say which
   width it should be read against. */
void main(){
  vec2 t = gl_FragCoord.xy/uRes;
  float z = t.y*uH;
  float r = uR0 + z*uTan;
  float P = 2.0*PI*r + 4.0*uA;
  float s = t.x*P;
  float din = 0.0, dout = 0.0;
  for(int i=0;i<4096;i++){
    if(i >= uSegN) break;
    vec4 g = texelFetch(uSeg, ivec2(i,0), 0);
    vec4 k = texelFetch(uSeg, ivec2(i,1), 0);   // x: the stroke's width. y: +1 in, -1 out.
    vec2 a = g.xy, b = g.zw;
    /* the seam is only a seam in the numbering - carry the segment
       round to whichever copy of itself lies nearest this texel */
    float shift = P*floor((s - (a.x+b.x)*0.5)/P + 0.5);
    a.x += shift; b.x += shift;
    float m = k.x*0.5 + uBlend + 2.0;
    if(s < min(a.x,b.x) - m || s > max(a.x,b.x) + m) continue;
    if(z < min(a.y,b.y) - m || z > max(a.y,b.y) + m) continue;
    vec2 pa = vec2(s,z) - a, ba = b - a;
    float h = clamp(dot(pa,ba)/max(dot(ba,ba),1e-6), 0.0, 1.0);
    float f = 1.0 - smoothstep(k.x*0.5, k.x*0.5 + uBlend, length(pa - ba*h));
    if(k.y > 0.0) din = max(din, f); else dout = max(dout, f);
  }
  outColor = vec4(din, dout, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget;
uniform float uScale, uPix;
uniform float uA, uR0, uH, uTan, uCos, uT, uFloor;
uniform float uG, uPitch, uRelief, uStepK, uStep;
uniform int uHasEmb, uSteps;
uniform sampler2D uEmb;
uniform vec3 uInk, uPaper;
/* uPaper is the ground and uInk the far end of the light, both of them
   the room's own tones. uMark is the other thing entirely: whatever a
   mark is made in on this page, which is black on paper and pale once a
   finish floods the plate. The print is lit between the two, and uDark
   says which way round that runs. */
uniform vec3 uMark;
uniform float uDark;
out vec4 outColor;
const float PI = 3.141592653589793;
/* A soft box high on the left and forward, a couple of metres off. It
   is a place, not a direction: its bearing and its strength both drift
   across a face the way they do in a room, and that drift is most of
   what separates a photograph from a render. The fill is the far wall,
   the sky term is the room overhead. */
const vec3  LDIR  = vec3(-0.4575, -0.5968, 0.6565);
const float LDIST = 2400.0;
const vec3  LFILL = vec3( 0.7000,  0.4200, 0.2500);
bool gSmooth = false;

float rAtZ(float z){ return uR0 + clamp(z, 0.0, uH)*uTan; }

/* round and up, the skin's own two coordinates */
vec2 skin(vec3 p){
  float z = clamp(p.z, 0.0, uH);
  float r = rAtZ(z);
  float P = 2.0*PI*r + 4.0*uA;
  float s;
  if(p.x > uA){
    s = (atan(p.y, p.x - uA) + PI*0.5)*r;
  } else if(p.x < -uA){
    float psi = atan(p.y, p.x + uA);
    if(psi < 0.0) psi += 2.0*PI;
    s = PI*r + 2.0*uA + (psi - PI*0.5)*r;
  } else if(p.y >= 0.0){
    s = PI*r + (uA - p.x);
  } else {
    s = 2.0*PI*r + 2.0*uA + (p.x + uA);
  }
  return vec2(s/P, z/uH);
}
/* how far the path steps off its line here - the boolean, taken on the
   toolpath rather than on the solid, so both faces carry it. Positive
   is into the wall, negative is proud of it. */
float emboss(vec3 p){
  if(uHasEmb == 0) return 0.0;
  vec2 e = textureLod(uEmb, skin(p), 0.0).rg;
  return uG*(e.x - e.y);
}
float planD(vec3 p){
  float r = rAtZ(p.z) - emboss(p);
  return length(p.xy - vec2(clamp(p.x, -uA, uA), 0.0)) - r;
}
/* the plain plan, with no drawing in it - what the floor's spiral is
   stepped off, since the floor carries no embossing */
float planFlat(vec3 p){
  return length(p.xy - vec2(clamp(p.x, -uA, uA), 0.0)) - rAtZ(p.z);
}
float sdForm(vec3 p){
  float d = planD(p);
  // every layer stands a little proud, the way a laid bead does
  if(!gSmooth && uRelief > 1e-5)
    d -= uRelief*sin(PI*fract(p.z/max(uPitch, 1e-4)));
  float wall  = max(max(d, -d - uT)*uCos, max(-p.z, p.z - uH));
  float floorS = max(d*uCos, max(-p.z, p.z - uFloor));
  return min(wall, floorS);
}
float occlusion(vec3 p, vec3 n){
  gSmooth = true;
  float occ = 0.0, sca = 1.0;
  for(int i=0;i<5;i++){
    float h = 1.5 + 9.0*float(i);
    occ += (h - sdForm(p + n*h))*sca/h;
    sca *= 0.78;
  }
  gSmooth = false;
  return clamp(1.0 - 0.34*occ, 0.0, 1.0);
}
vec3 normalAt(vec3 p, float e){
  gSmooth = true;
  vec2 h = vec2(1.0,-1.0)*0.5773*e;
  vec3 n = normalize(h.xyy*sdForm(p+h.xyy) + h.yyx*sdForm(p+h.yyx)
                   + h.yxy*sdForm(p+h.yxy) + h.xxx*sdForm(p+h.xxx));
  gSmooth = false;
  return n;
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  vec3 ro = uTarget + uRight*(uv.x*uScale) + uUp*(uv.y*uScale) - uFwd*3000.0;
  vec3 rd = uFwd;
  float px = uPix;
  float t = 0.0;
  bool hit = false;
  vec3 pos = ro;
  for(int i=0;i<320;i++){
    if(i >= uSteps) break;
    pos = ro + rd*t;
    float d = sdForm(pos);
    if(d < px*0.45){ hit = true; break; }
    t += max(d*uStepK, px*0.35);
    if(t > 9000.0) break;
  }
  // the ground is z = 0, solved rather than marched
  float tg = rd.z < -1e-6 ? (0.0 - ro.z)/rd.z : -1.0;
  bool onGround = tg > 0.0 && (!hit || tg < t);

  vec3 col = mix(uPaper, uInk, 0.075);
  if(onGround){
    vec3 g = ro + rd*tg;
    float dd = length(g.xy - vec2(clamp(g.x, -uA, uA), 0.0)) - uR0;
    col = mix(uPaper, uInk, 0.135);
    col = mix(col, mix(uPaper, uInk, 0.205), 1.0 - smoothstep(0.0, 190.0, max(dd, 0.0)));
    col = mix(col, mix(uPaper, uInk, 0.31),  1.0 - smoothstep(0.0,  34.0, max(dd, 0.0)));
    float fade = smoothstep(2600.0, 5200.0, length(g.xy));
    col = mix(col, mix(uPaper, uInk, 0.075), fade);
  } else if(hit){
    vec3 n = normalAt(pos, max(px*1.3, 0.55));
    float face = abs(n.z);
    vec3 lv = (uTarget + LDIR*LDIST) - pos;
    float ldist = length(lv);
    vec3 lgt = lv/ldist;
    float fall = clamp((LDIST*LDIST)/(ldist*ldist), 0.74, 1.26);
    /* wrapped well past the terminator, because a box that size does
       not end its light on a line */
    float key  = clamp(dot(n, lgt)*0.44 + 0.56, 0.0, 1.0)*fall;
    float fill = clamp(dot(n, LFILL)*0.40 + 0.60, 0.0, 1.0);
    float sky  = clamp(n.z*0.5 + 0.5, 0.0, 1.0);
    float f = key*0.64 + fill*0.12 + sky*0.20 + 0.03;
    f *= mix(1.0, occlusion(pos, n), 0.40);
    /* a matte print catches the room at a grazing angle */
    f += pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.5)*0.06;
    f = clamp(0.10 + 0.90*f, 0.0, 1.0);
    /* And the bead is round, so it is not only a line in the valley:
       the crest takes the light and the far side of it loses the light.
       Which way round that runs is the lamp's business. */
    if(uPitch > 0.001){
      float lz = pos.z/max(uPitch, 1e-4);
      float tz = fract(lz)*2.0 - 1.0;
      float fade = 1.0 - smoothstep(0.16, 0.50, fwidth(lz));
      f = clamp(f + tz*lgt.z*(1.0 - face)*fade*0.10, 0.0, 1.0);
    }
    /* On paper the print is white: full light is the sheet and the turn
       away is a grey. In a dark room it is the other way up - the print
       is the pale thing in it and the turn away goes to the floor. */
    col = mix(mix(uPaper, uMark, (1.0 - f)*0.56),
              mix(uMark, uInk,   (1.0 - f)*0.62), uDark);
    // and the layers, lit analytically so they stay clean at any zoom
    if(uPitch > 0.001 && face < 0.97){
      float ly = pos.z/uPitch;
      float w = fwidth(ly);
      float g = abs(fract(ly) - 0.5)/max(w, 1e-5);
      float sharp = 1.0 - smoothstep(0.18, 0.80, g);
      float cov = mix(sharp, 0.22, smoothstep(0.20, 0.55, w));
      col = mix(col, uInk, cov*0.13*(1.0 - face));
    }
    /* and the floor, which is one spiral worked concentrically out from
       the middle: the first pass runs half a bead in from the wall and
       every one after it steps out by uStep, so each lies two
       millimetres over the one before. The seam between two passes is
       what you see looking down into it. */
    if(uStep > 0.001 && face > 0.5 && abs(pos.z - uFloor) < 0.9){
      float q = (-planFlat(pos) - uT*0.5)/uStep;
      float w = fwidth(q);
      float g = abs(fract(q + 0.5) - 0.5)/max(w, 1e-5);
      float sharp = 1.0 - smoothstep(0.18, 0.80, g);
      float cov = mix(sharp, 0.22, smoothstep(0.20, 0.55, w));
      col = mix(col, uInk, cov*0.20*face);
    }
  }
  float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)))*43758.545);
  col += (grain - 0.5)/255.0;
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

let prog, bakeProg, uni = {}, bun = {}, embTex, segTex, fbo, ok = true;
const segData = new Float32Array(MAXSEG*8);

function compile(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
function link(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function initGL(){
  if(!gl){ ok = false; return; }
  if(!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float'))
    throw new Error('no float render target');
  prog = link(VS, FS);
  bakeProg = link(VS, BAKE_FS);
  for(const n of ['uRes','uRight','uUp','uFwd','uTarget','uScale','uPix','uA','uR0','uH','uTan',
                  'uCos','uT','uFloor','uG','uPitch','uRelief','uStepK','uStep',
                  'uHasEmb','uSteps','uEmb','uInk','uPaper','uMark','uDark'])
    uni[n] = gl.getUniformLocation(prog, n);
  for(const n of ['uSeg','uSegN','uRes','uA','uR0','uH','uTan','uBlend'])
    bun[n] = gl.getUniformLocation(bakeProg, n);
  gl.bindVertexArray(gl.createVertexArray());

  embTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, embTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, BAKE_W, BAKE_H);

  segTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, segTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, MAXSEG, 2);

  fbo = gl.createFramebuffer();
  gl.useProgram(prog);   gl.uniform1i(uni.uEmb, 0);
  gl.useProgram(bakeProg); gl.uniform1i(bun.uSeg, 1);
}
try { initGL(); } catch(e){ ok = false; console.error(e); }

let embN = 0, embDirty = true, lastBake = 0;
function bake(){
  if(!ok) return;
  const segs = segsMM();
  embN = Math.min(segs.length, MAXSEG);
  embDirty = false;
  if(!embN) return;
  for(let i=0;i<embN;i++){
    const g = segs[i], q = (MAXSEG+i)*4;
    segData[i*4] = g[0]; segData[i*4+1] = g[1]; segData[i*4+2] = g[2]; segData[i*4+3] = g[3];
    segData[q] = g[4]; segData[q+1] = g[5]; segData[q+2] = 0; segData[q+3] = 0;
  }
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, segTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, embN, 1, gl.RGBA, gl.FLOAT, segData, 0);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 1, embN, 1, gl.RGBA, gl.FLOAT, segData, MAXSEG*4);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, embTex, 0);
  gl.viewport(0, 0, BAKE_W, BAKE_H);
  gl.useProgram(bakeProg);
  gl.uniform1i(bun.uSegN, embN);
  gl.uniform2f(bun.uRes, BAKE_W, BAKE_H);
  gl.uniform1f(bun.uA, aOf());
  gl.uniform1f(bun.uR0, r0Of());
  gl.uniform1f(bun.uH, S.H);
  gl.uniform1f(bun.uTan, SLOPE);
  gl.uniform1f(bun.uBlend, BLEND);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* ══════════════════════════════════════════════════════════════════
   3 · CAMERA
   Orthographic throughout, because every view here is a drawing: the
   isometric is a drawing and so is each elevation.
   ══════════════════════════════════════════════════════════════════ */
function basisOf(az, el){
  const ce = Math.cos(el), se = Math.sin(el);
  const eye = [ce*Math.sin(az), -ce*Math.cos(az), se];          // target -> camera
  const fwd = [-eye[0], -eye[1], -eye[2]];
  let rx = fwd[1]*1 - fwd[2]*0, ry = fwd[2]*0 - fwd[0]*1, rz = 0;
  const L = Math.hypot(rx,ry,rz) || 1; rx/=L; ry/=L; rz/=L;
  const ux = ry*fwd[2] - rz*fwd[1], uy = rz*fwd[0] - rx*fwd[2], uz = rx*fwd[1] - ry*fwd[0];
  return { right:[rx,ry,rz], up:[ux,uy,uz], fwd, eye };
}
const basis = () => basisOf(A.az, A.el);
const viewEl = document.getElementById('view');
const ovEl = document.getElementById('ov');
let vw = 0, vh = 0;
function resize(){
  const r = viewEl.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  vw = r.width; vh = r.height;
  const w = Math.max(1, Math.round(r.width*dpr)), h = Math.max(1, Math.round(r.height*dpr));
  if(cvs.width !== w || cvs.height !== h){ cvs.width = w; cvs.height = h; }
  ovEl.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
}
function themeColors(){
  const cs = getComputedStyle(document.documentElement);
  const toRGB = v => { v = v.trim();
    return v.startsWith('#') ? [parseInt(v.slice(1,3),16)/255, parseInt(v.slice(3,5),16)/255, parseInt(v.slice(5,7),16)/255] : [0,0,0]; };
  /* Three colours, not two, because the sweep behind the print is not
     the room the plate is in. paper is the sweep, which is lit for a
     dark pigment and dim for a pale one; mark is whatever a mark made
     on that sweep is drawn in, which is not what a mark on the page is
     drawn in; and ink is the far end of the light, dark against either
     sweep, or the shadow under the print comes out brighter than the
     floor it falls on. dark says which way the sweep went. */
  const pick = (a, b) => { const v = cs.getPropertyValue(a).trim(); return v || cs.getPropertyValue(b); };
  return { ink:   toRGB(pick('--render-ink', '--ink')),
           paper: toRGB(pick('--render-paper', '--paper')),
           mark:  toRGB(pick('--render-mark', '--ink')),
           dark:  cs.getPropertyValue('--render-dark').trim() === '1' ? 1 : 0 };
}
function draw(){
  if(!ok) return;
  const b = basis(), c = themeColors();
  gl.viewport(0,0,cvs.width,cvs.height);
  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, embTex);
  gl.uniform2f(uni.uRes, cvs.width, cvs.height);
  gl.uniform3fv(uni.uRight, b.right);
  gl.uniform3fv(uni.uUp, b.up);
  gl.uniform3fv(uni.uFwd, b.fwd);
  gl.uniform3f(uni.uTarget, A.tx, A.ty, A.tz);
  gl.uniform1f(uni.uScale, A.scale);
  const px = A.scale/Math.max(1, cvs.height);
  gl.uniform1f(uni.uPix, px);
  gl.uniform1f(uni.uA, aOf());
  gl.uniform1f(uni.uR0, r0Of());
  gl.uniform1f(uni.uH, S.H);
  gl.uniform1f(uni.uTan, SLOPE);
  gl.uniform1f(uni.uCos, COS);
  gl.uniform1f(uni.uT, NOZ);
  gl.uniform1f(uni.uFloor, Math.min(FLOORT, S.H));
  gl.uniform1f(uni.uG, DEPTH);
  gl.uniform1f(uni.uStep, FSTEP);
  gl.uniform1i(uni.uHasEmb, embN ? 1 : 0);
  /* a rib finer than a couple of pixels is only moire, so the bead
     fades out as the layer approaches the pixel and the drawn seam
     carries it instead */
  const pitchPx = LAYER/Math.max(px, 1e-6);
  const fade = Math.max(0, Math.min(1, (pitchPx - 1.6)/3));
  const relief = 0.34*fade;
  gl.uniform1f(uni.uPitch, LAYER);
  gl.uniform1f(uni.uRelief, relief);
  /* the drawing steps the wall inward fast, so the field is not quite
     a distance any more - the march takes shorter strides for it */
  const stride = embN ? 0.55 : (relief > 1e-5 ? 0.70 : 0.95);
  gl.uniform1f(uni.uStepK, stride);
  gl.uniform1i(uni.uSteps, Math.max(64, Math.min(320, Math.round((dragging ? 150 : 210)/stride))));
  gl.uniform3fv(uni.uInk, c.ink);
  gl.uniform3fv(uni.uPaper, c.paper);
  gl.uniform3fv(uni.uMark, c.mark);
  gl.uniform1f(uni.uDark, c.dark);
  gl.clearColor(c.paper[0], c.paper[1], c.paper[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function rayFor(sx, sy){
  const b = basis();
  const ux = (sx - vw/2)/vh, uy = -(sy - vh/2)/vh;
  return { o:[ A.tx + b.right[0]*ux*A.scale + b.up[0]*uy*A.scale - b.fwd[0]*3000,
               A.ty + b.right[1]*ux*A.scale + b.up[1]*uy*A.scale - b.fwd[1]*3000,
               A.tz + b.right[2]*ux*A.scale + b.up[2]*uy*A.scale - b.fwd[2]*3000 ],
           d: b.fwd };
}
function worldToScreen(x, y, z){
  const b = basis();
  const rx = x-A.tx, ry = y-A.ty, rz = z-A.tz;
  const u = rx*b.right[0] + ry*b.right[1] + rz*b.right[2];
  const v = rx*b.up[0] + ry*b.up[1] + rz*b.up[2];
  return { x: u/A.scale*vh + vw/2, y: -v/A.scale*vh + vh/2 };
}
/* how many pixels one millimetre along a world direction covers */
function pxPer(axis){
  const b = basis();
  const u = (axis[0]*b.right[0] + axis[1]*b.right[1] + axis[2]*b.right[2])/A.scale*vh;
  const v = -(axis[0]*b.up[0] + axis[1]*b.up[1] + axis[2]*b.up[2])/A.scale*vh;
  return { x:u, y:v, n:u*u + v*v };
}

/* ── the same form again, on the processor, for picking and output ── */
function sdJS(p){
  const a = aOf(), z = p[2];
  const r = rAt(z);
  const qx = Math.min(Math.max(p[0], -a), a);
  const d = Math.hypot(p[0]-qx, p[1]) - r;
  const wall = Math.max(Math.max(d, -d - NOZ)*COS, Math.max(-z, z - S.H));
  const fl = Math.max(d*COS, Math.max(-z, z - Math.min(FLOORT, S.H)));
  return Math.min(wall, fl);
}
function cast(sx, sy){
  const r = rayFor(sx, sy);
  let t = 0;
  for(let i=0;i<180;i++){
    const p = [r.o[0]+r.d[0]*t, r.o[1]+r.d[1]*t, r.o[2]+r.d[2]*t];
    const d = sdJS(p);
    if(d < 0.35) return { p, t };
    t += Math.max(d*0.9, 0.3);
    if(t > 9000) break;
  }
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   4 · VIEW
   ══════════════════════════════════════════════════════════════════ */
function fitView(){
  const b = basisOf(S.az, S.el);     // where the view is going, not where it is
  const a = aOf(), rT = rAt(S.H), r0 = r0Of();
  const pts = [];
  for(const z of [0, S.H]){
    const r = z ? rT : r0;
    for(const sx of [-1,1]) for(const sy of [-1,1]) pts.push([sx*(a+r), sy*r, z]);
  }
  const cx = 0, cy = 0, cz = S.H*0.46;
  S.tx = cx; S.ty = cy; S.tz = cz;
  let mu = 1, mv = 1;
  for(const p of pts){
    const rx = p[0]-cx, ry = p[1]-cy, rz = p[2]-cz;
    mu = Math.max(mu, Math.abs(rx*b.right[0] + ry*b.right[1] + rz*b.right[2]));
    mv = Math.max(mv, Math.abs(rx*b.up[0] + ry*b.up[1] + rz*b.up[2]));
  }
  const aspect = Math.max(0.4, vw/Math.max(vh,1));
  S.scale = Math.max(2*mv, 2*mu/aspect)*1.42 + 60;
}
function goFace(f){
  S.face = f;
  /* take the shortest way round, so the planter turns the way you
     expect rather than unwinding the long way */
  let want = FACES[f].az*RAD;
  while(want - S.az >  Math.PI) want -= 2*Math.PI;
  while(want - S.az < -Math.PI) want += 2*Math.PI;
  S.az = want; S.el = 0;
  fitView(); setTool(S.tool); sync(); buildPanel();
}
/* Home is one particular pair of angles, and once you have turned away
   from them the view is not the isometric any more, whatever the
   button was last showing. */
function atIso(){
  let d = S.az - 45*RAD;
  d -= Math.round(d/(2*Math.PI))*2*Math.PI;
  return Math.abs(d) < 0.02 && Math.abs(S.el - 35.264*RAD) < 0.02;
}
function goIso(){
  S.face = null;
  let want = 45*RAD;
  while(want - S.az >  Math.PI) want -= 2*Math.PI;
  while(want - S.az < -Math.PI) want += 2*Math.PI;
  S.az = want; S.el = 35.264*RAD;
  fitView(); setTool(S.tool); sync(); buildPanel();
}

/* ══════════════════════════════════════════════════════════════════
   5 · HISTORY
   ══════════════════════════════════════════════════════════════════ */
let hist = [], hi = -1;
const stateNow = () => JSON.stringify({ L:S.L, W:S.W, H:S.H, strokes:S.strokes });
function snap(){
  const s = stateNow();
  if(hi >= 0 && hist[hi] === s) return;
  hist = hist.slice(0, hi+1); hist.push(s);
  if(hist.length > 60) hist.shift();
  hi = hist.length-1;
}
function restore(i){
  if(i < 0 || i >= hist.length) return;
  const o = JSON.parse(hist[i]);
  S.L = o.L; S.W = o.W; S.H = o.H; S.strokes = o.strokes;
  hi = i; embDirty = true; sync();
}
const undo = () => { if(hi > 0){ restore(hi-1); say('Undo'); } };
const redo = () => { if(hi < hist.length-1){ restore(hi+1); say('Redo'); } };

/* ══════════════════════════════════════════════════════════════════
   6 · THE DIMENSIONS ARE THE HANDLES
   ══════════════════════════════════════════════════════════════════ */
/* Thirty-six inches is the stop on all three, and the base is the
   widest thing, so the figures on the drawing ARE the stop. The one
   thing height is answerable to is the opening: the wall draws in all
   the way up, so a tall enough planter would close itself, and the
   height stops where the rim has 60 mm left. */
/* Length and width are not a bigger and a smaller: they are the two
   axes of the same plan, and when they meet, the plan is a circle. The
   one that is given way has to follow rather than stop dead, or a
   circle is a corner you cannot back out of - push the end of a circle
   in and the whole circle comes in with it, pull the side of one out
   and the whole circle goes out. */
function setDim(k, v){
  const want = v, draw = -2*SLOPE;       // mm the opening loses per mm of height
  const floorW = Math.max(MINW, Math.ceil(RIMMIN + S.H*draw));
  const top = Math.floor(MAXMM);
  if(k === 'H'){
    const lim = Math.min(MAXMM, (S.W - RIMMIN)/draw);
    S.H = Math.max(LAYER*3, Math.floor(Math.min(v, lim)/LAYER)*LAYER);
    if(want > S.H + LAYER) say(S.H*draw > S.W - RIMMIN - 1 ? 'the rim would close' : '36 in');
  } else if(k === 'L'){
    S.L = Math.max(floorW, Math.min(Math.round(v), top));
    if(S.W > S.L) S.W = S.L;
    if(want > S.L + 1) say('36 in');
    else if(want < S.L - 1) say(S.L > MINW ? 'the rim would close' : 'as small as it goes');
  } else {
    S.W = Math.max(floorW, Math.min(Math.round(v), top));
    if(S.L < S.W) S.L = S.W;
    if(want > S.W + 1) say('36 in');
    else if(want < S.W - 1) say(S.W > MINW ? 'the rim would close' : 'as small as it goes');
  }
  embDirty = true;
}
const DIMS = { L:{ label:'Length' }, W:{ label:'Width' }, H:{ label:'Height' } };

/* ══════════════════════════════════════════════════════════════════
   7 · POINTER
   ══════════════════════════════════════════════════════════════════ */
let drag = null, dragging = false, live = null, spaceDown = false;

function surfaceAt(sx, sy){
  const h = cast(sx, sy);
  if(!h) return null;
  const p = h.p, a = aOf();
  const qx = Math.min(Math.max(p[0], -a), a);
  const d = Math.hypot(p[0]-qx, p[1]) - rAt(p[2]);
  /* Allow for relief already standing here, or you could not draw over
     your own work - but not the whole wall, which is the inside face. */
  if(Math.abs(d) > DEPTH + 2.5) return null;
  const nx = (p[0]-qx), ny = p[1];
  const nl = Math.hypot(nx, ny) || 1;
  const b = basis();
  if((nx/nl)*(-b.fwd[0]) + (ny/nl)*(-b.fwd[1]) < 0.08) return null;   // turned away
  const z = Math.min(Math.max(p[2], 0), S.H);
  const c = coord(p[0], p[1], z);
  return { u:(c.s/c.P + 1) % 1, v:z/S.H, face:c.face, p };
}
/* The numbering of the way round starts somewhere, and where it starts
   is a seam nothing on the planter knows about. A stroke walking over
   it reads 0.999 and then 0.001, and the segment between those two is
   not a short step: it is the whole way round the pot at one height,
   which is the band that used to appear across every wall. Carry each
   point to the copy of itself nearest the last one and the seam stops
   being anywhere at all. */
function near(u, ref){ const d = u - ref; return ref + (d - Math.round(d)); }

/* ── taking hold of the thing itself ───────────────────────────────
   There are no figures to drag any more. A wall is its own handle:
   press on it and it comes with you, out along the way it faces, and
   the dimension it belongs to follows. Both sides move, so the wall
   under the hand travels exactly as far as the hand does. A surface
   lying flat - the rim, the floor - is the height.
   Press anywhere off the planter and you are turning it instead.    */
function normalJS(p){
  const e = 0.6;
  const dx = sdJS([p[0]+e,p[1],p[2]]) - sdJS([p[0]-e,p[1],p[2]]);
  const dy = sdJS([p[0],p[1]+e,p[2]]) - sdJS([p[0],p[1]-e,p[2]]);
  const dz = sdJS([p[0],p[1],p[2]+e]) - sdJS([p[0],p[1],p[2]-e]);
  const l = Math.hypot(dx,dy,dz) || 1;
  return [dx/l, dy/l, dz/l];
}
function grabAt(sx, sy){
  const h = cast(sx, sy);
  if(!h) return null;
  const p = h.p;
  const n = normalJS(p);
  const z = Math.min(Math.max(p[2], 0), S.H);
  const c = coord(p[0], p[1], z);
  /* The lip is one bead wide and would be a thread to aim at, so the
     top of the wall counts as the lip too - about ten pixels of it,
     whatever the zoom. Take hold of the rim and the planter grows. */
  const lip = 9*(A.scale/Math.max(vh,1));
  const flat = Math.abs(n[2]) > 0.55 || z > S.H - lip;
  /* Which dimension a wall belongs to is the way it faces, not which
     part of the plan it was cut from. On a circle the straight run has
     no length at all, so by region every point would be an end and the
     width would have no handle left anywhere on the planter. Which SIDE
     still comes from the plan, so the inside face of a wall moves the
     same way the outside of it does. */
  const g = flat
    ? { key:'H', axis:[0,0,1], gain:1 }
    : Math.abs(n[0]) >= Math.abs(n[1])
      ? { key:'L', axis:[p[0] >= 0 ? 1 : -1, 0, 0], gain:2 }
      : { key:'W', axis:[0, p[1] >= 0 ? 1 : -1, 0], gain:2 };
  /* A wall pointing straight at the camera has nowhere on the paper to
     be pulled to, so it is not a handle from here - turn first. */
  const b = basis();
  const head = Math.abs(g.axis[0]*b.fwd[0] + g.axis[1]*b.fwd[1] + g.axis[2]*b.fwd[2]);
  g.pull = head < 0.90;
  g.wall = !flat;
  g.face = c.face;
  g.p = p;
  return g;
}

viewEl.addEventListener('pointerdown', e => {
  if(e.button === 1 || spaceDown){
    drag = { kind:'pan', sx:e.clientX, sy:e.clientY, tx:S.tx, ty:S.ty, tz:S.tz };
    dragging = true; viewEl.setPointerCapture(e.pointerId); return;
  }
  if(e.button !== 0) return;
  const r = viewEl.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  viewEl.setPointerCapture(e.pointerId);

  if(S.tool === 'draw' && S.face){
    const s = surfaceAt(sx, sy);
    if(!s){ say('Draw on the wall facing you'); return; }
    live = { pts:[{u:s.u, v:s.v}], px:[[sx,sy]] };
    drag = { kind:'draw' }; dragging = true;
    return;
  }
  const g = grabAt(sx, sy);
  if(g && g.pull){
    drag = { kind:'pull', key:g.key, gain:g.gain, wall:g.wall, face:g.face,
             sx:e.clientX, sy:e.clientY, v0:S[g.key], pp:pxPer(g.axis), moved:0 };
  } else {
    drag = { kind:'orbit', sx:e.clientX, sy:e.clientY, az:S.az, el:S.el, moved:0,
             wall:!!(g && g.wall), face:g ? g.face : null };
  }
  dragging = true;
});

addEventListener('pointermove', e => {
  if(!drag) return;
  if(drag.kind === 'pull'){
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    if(drag.moved > 3){
      const pp = drag.pp;
      const world = pp.n > 1e-9 ? (dx*pp.x + dy*pp.y)/pp.n : 0;
      setDim(drag.key, drag.v0 + world*drag.gain);
      sync();
    }
    return;
  }
  if(drag.kind === 'pan'){
    const b = basis();
    const k = A.scale/Math.max(vh,1);
    const dx = -(e.clientX - drag.sx)*k, dy = (e.clientY - drag.sy)*k;
    S.tx = drag.tx + b.right[0]*dx + b.up[0]*dy;
    S.ty = drag.ty + b.right[1]*dx + b.up[1]*dy;
    S.tz = drag.tz + b.right[2]*dx + b.up[2]*dy;
    return;
  }
  if(drag.kind === 'orbit'){
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    if(drag.moved > 3){
      if(S.face){ S.face = null; sync(); }
      S.az = drag.az + dx*0.008;
      S.el = Math.max(-8*RAD, Math.min(86*RAD, drag.el + dy*0.006));
    }
    return;
  }
  if(drag.kind === 'draw' && live){
    const r = viewEl.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const last = live.px[live.px.length-1];
    if(Math.hypot(sx-last[0], sy-last[1]) < 2) return;
    const s = surfaceAt(sx, sy);
    if(!s) return;
    live.pts.push({ u:near(s.u, live.pts[live.pts.length-1].u), v:s.v });
    live.px.push([sx,sy]);
  }
});

addEventListener('pointerup', () => {
  if(!drag){ dragging = false; return; }
  /* A press that did not travel is not a pull - it is you saying you
     want to look at that wall. */
  if(drag.moved !== undefined && drag.moved <= 3 && drag.wall && drag.kind !== 'draw'){
    goFace(drag.face);
  }
  else if(drag.kind === 'pull'){ if(drag.moved > 3) snap(); }
  else if(drag.kind === 'draw' && live){
    if(live.pts.length > 1){
      S.strokes.push({ pts: simplify(live.pts), w: S.sw, sunk: S.sunk });
      embDirty = true; bake(); snap(); sync();
      say(S.strokes.length + (S.strokes.length === 1 ? ' stroke' : ' strokes'));
    }
    live = null;
  }
  drag = null; dragging = false;
  setCursor(); sync();
});

/* The pointer says what it is over before you press: a wall you can
   take hold of, or empty space you can turn the planter in. */
let hoverAt = 0;
viewEl.addEventListener('pointermove', e => {
  if(drag || spaceDown) return;
  const now = performance.now();
  if(now - hoverAt < 55) return;
  hoverAt = now;
  if(S.tool === 'draw' && S.face){ viewEl.style.cursor = 'crosshair'; return; }
  const r = viewEl.getBoundingClientRect();
  const g = grabAt(e.clientX - r.left, e.clientY - r.top);
  viewEl.style.cursor = !g ? 'grab' : g.pull ? (g.key === 'H' ? 'ns-resize' : 'move') : 'pointer';
});
/* Only the cursor goes back. Rebuilding the options bar here would
   throw away the very button you are on your way to press - the
   pointer leaves the viewport to get there. */
viewEl.addEventListener('pointerleave', () => { if(!drag) setCursor(); });

viewEl.addEventListener('wheel', e => {
  e.preventDefault();
  S.scale = Math.max(60, Math.min(6000, S.scale*Math.exp(e.deltaY*0.0014)));
}, { passive:false });

/* The hand wobbles; the nozzle does not. A stroke is thinned to the
   points that carry its shape, measured in millimetres on the skin. */
function simplify(pts){
  const mm = pts.map(q => ({ x:q.u*perim(q.v*S.H), y:q.v*S.H, u:q.u, v:q.v }));
  const n = mm.length;
  if(n < 3) return pts;
  const keep = new Uint8Array(n); keep[0] = keep[n-1] = 1;
  const st = [[0, n-1]], eps = 0.45;
  while(st.length){
    const [a,b] = st.pop();
    if(b <= a+1) continue;
    const ax=mm[a].x, ay=mm[a].y, ex=mm[b].x-ax, ey=mm[b].y-ay, L2=ex*ex+ey*ey;
    let far=-1, fd=eps;
    for(let i=a+1;i<b;i++){
      const px=mm[i].x-ax, py=mm[i].y-ay;
      const t = L2 > 1e-12 ? Math.max(0, Math.min(1, (px*ex+py*ey)/L2)) : 0;
      const d = Math.hypot(px-ex*t, py-ey*t);
      if(d > fd){ fd = d; far = i; }
    }
    if(far < 0) continue;
    keep[far] = 1; st.push([a,far],[far,b]);
  }
  const out = [];
  for(let i=0;i<n;i++) if(keep[i]) out.push({u:pts[i].u, v:pts[i].v});
  return out;
}

/* ══════════════════════════════════════════════════════════════════
   8 · RULERS + OVERLAY
   ══════════════════════════════════════════════════════════════════ */
const LADDER = [1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000];
function rulers(){
  const rh = document.getElementById('rulerH'), rv = document.getElementById('rulerV');
  const b = basis();
  const wpp = A.scale/Math.max(vh,1);
  let step = LADDER[LADDER.length-1];
  for(const s of LADDER) if(s/wpp >= 56){ step = s; break; }
  const ppu = 1/wpp;
  const o0 = A.tx*b.right[0] + A.ty*b.right[1] + A.tz*b.right[2];
  const o1 = A.tx*b.up[0]    + A.ty*b.up[1]    + A.tz*b.up[2];
  let h = '', k0 = Math.floor((o0 - vw/2*wpp)/step), k1 = Math.ceil((o0 + vw/2*wpp)/step);
  for(let k=k0;k<=k1;k++){
    const x = vw/2 + (k*step - o0)*ppu;
    if(x < -40 || x > vw + 40) continue;
    h += '<line x1="'+x.toFixed(1)+'" y1="11" x2="'+x.toFixed(1)+'" y2="18" stroke="rgba(0,0,0,.34)" stroke-width="1"/>';
    h += '<text x="'+(x+2.5).toFixed(1)+'" y="9" font-size="8.5" font-family="var(--font)" fill="rgba(0,0,0,.34)">'+(k*step)+'</text>';
  }
  rh.innerHTML = h;
  let v = '', m0 = Math.floor((o1 - vh/2*wpp)/step), m1 = Math.ceil((o1 + vh/2*wpp)/step);
  for(let k=m0;k<=m1;k++){
    const y = vh/2 - (k*step - o1)*ppu;
    if(y < -40 || y > vh + 40) continue;
    v += '<line x1="11" y1="'+y.toFixed(1)+'" x2="18" y2="'+y.toFixed(1)+'" stroke="rgba(0,0,0,.34)" stroke-width="1"/>';
    v += '<text x="9" y="'+(y-2.5).toFixed(1)+'" font-size="8.5" font-family="var(--font)" fill="rgba(0,0,0,.34)" text-anchor="end" transform="rotate(-90 9 '+(y-2.5).toFixed(1)+')">'+(k*step)+'</text>';
  }
  rv.innerHTML = v;
}

/* Nothing is drawn over the planter any more but the stroke in your
   hand while you are making it. The figures live in the options bar,
   and the handles are the walls themselves. */
function overlay(){
  let s = '';
  if(live && live.px.length > 1){
    const d = 'M' + live.px.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
    const w = Math.max(1.5, S.sw/(A.scale/Math.max(vh,1)));
    s = '<path d="'+d+'" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="'+w.toFixed(1)+'" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  ovEl.innerHTML = s;
}

/* ══════════════════════════════════════════════════════════════════
   9 · THE TOOLPATH
   One spiral, 4 mm a turn, the centre of the bead half a bead inside
   the skin - and wherever the drawing runs, the path steps in by as
   much as the stroke is deep. The drawing is not cut out of the wall;
   it is in the line the nozzle walks.
   ══════════════════════════════════════════════════════════════════ */
/* the same two numbers the bake works out, on the processor: how far
   in, how far out, and the step the path takes is the difference */
function embJS(s, z, segs, P){
  let din = 0, dout = 0;
  for(let i=0;i<segs.length;i++){
    const g = segs[i], w = g[4];
    const shift = P*Math.floor((s - (g[0]+g[2])*0.5)/P + 0.5);
    const ax = g[0]+shift, ay = g[1], bx = g[2]+shift, by = g[3];
    const m = w*0.5 + BLEND + 2;
    if(s < Math.min(ax,bx)-m || s > Math.max(ax,bx)+m) continue;
    if(z < Math.min(ay,by)-m || z > Math.max(ay,by)+m) continue;
    const vx = bx-ax, vy = by-ay, L2 = vx*vx+vy*vy;
    const t = L2 > 1e-9 ? Math.max(0, Math.min(1, ((s-ax)*vx + (z-ay)*vy)/L2)) : 0;
    const d = Math.hypot(s-ax-vx*t, z-ay-vy*t);
    const f = 1 - smoothstep(w/2, w/2 + BLEND, d);
    if(g[5] > 0){ if(f > din) din = f; } else if(f > dout) dout = f;
  }
  return DEPTH*(din - dout);
}
function loopAt(z, segs){
  const r = rAt(z), P = 2*Math.PI*r + 4*aOf();
  const n = Math.max(48, Math.round(P/4));
  const out = [];
  for(let i=0;i<=n;i++){
    const s = P*i/n;
    const q = atArc(Math.min(s, P - 1e-6), r);
    const back = embJS(s, z, segs, P) + NOZ/2;
    out.push([q.x - q.nx*back, q.y - q.ny*back]);
  }
  return out;
}
/* ── the floor, as one concentric spiral ───────────────────────────
   The plan offset inward by o is the same obround with the same
   straight run and a radius smaller by o, so a spiral is just that
   offset creeping on by one step every time round. It starts in the
   middle and works out, and the last turn finishes half a bead inside
   the wall - which is exactly where the wall's own spiral begins, so
   the nozzle never has to lift between the two.                      */
function floorSpiral(z){
  const r = rAt(z), a = aOf(), out = [];
  for(let o = NOZ/2; r - o > 0.5; o += FSTEP){
    const rr = r - o;
    const P0 = 2*Math.PI*rr + 4*a;
    const n = Math.max(16, Math.round(P0/4));
    for(let i=0;i<n;i++){
      const frac = i/n;
      const r2 = r - (o + FSTEP*frac);
      if(r2 <= 0) continue;
      const q = atArc(frac*(2*Math.PI*r2 + 4*a), r2);
      out.push([q.x, q.y]);
    }
  }
  out.reverse();                 // middle first, wall last
  return out;
}
function gcode(){
  const segs = segsMM();
  const FA = Math.PI*Math.pow(1.75/2, 2);
  const VWALL = NOZ*LAYER - LAYER*LAYER*(1 - Math.PI/4);   // mm3 of bead per mm
  const VFLOOR = FSTEP*LAYER;                              // a pass only owes its own step
  const EPMM = VWALL/FA, EFLR = VFLOOR/FA;
  const L = [];
  L.push('; MALLEABLE PL1');
  L.push('; base ' + S.L + ' x ' + S.W + ' mm, height ' + S.H + ' mm, rim ' +
         Math.round(rimL()) + ' x ' + Math.round(rimW()) + ' mm');
  L.push('; draft ' + DRAFT + ' deg, nozzle ' + NOZ + ' mm, layer ' + LAYER + ' mm, ' + layers() + ' layers');
  {
    const out = S.strokes.filter(s => s.sunk === false).length;
    const ws = [...new Set(S.strokes.map(s => s.w || STROKE))].sort((a,b) => a-b);
    L.push('; relief ' + S.strokes.length + ' strokes (' + (S.strokes.length - out) +
           ' debossed, ' + out + ' embossed), ' + DEPTH + ' mm off the wall' +
           (ws.length ? ', stroke ' + ws.join('/') + ' mm' : ''));
  }
  L.push('; floor: concentric spiral, ' + FSTEP + ' mm step, so each pass lies ' +
         (NOZ - FSTEP) + ' mm over the last');
  L.push('; no retraction anywhere. E is 1.75 mm filament: wall ' + EPMM.toFixed(3) +
         ' mm/mm (' + VWALL.toFixed(2) + ' mm3/mm), floor ' + EFLR.toFixed(3) +
         ' mm/mm (' + VFLOOR.toFixed(2) + ' mm3/mm). For a volumetric machine, multiply E by ' +
         FA.toFixed(3) + '.');
  L.push('G21'); L.push('G90'); L.push('M83');
  L.push('G92 E0');
  let px = null, py = null;
  const move = (x, y, z, rate) => {
    if(px === null){ L.push('G0 Z'+z.toFixed(3)); L.push('G0 X'+x.toFixed(3)+' Y'+y.toFixed(3)); }
    else {
      const e = Math.hypot(x-px, y-py)*(rate === undefined ? EPMM : rate);
      L.push('G1 X'+x.toFixed(3)+' Y'+y.toFixed(3)+' Z'+z.toFixed(3)+' E'+e.toFixed(4));
    }
    px = x; py = y;
  };
  const jump = (x, y, z) => {
    L.push('G0 X'+x.toFixed(3)+' Y'+y.toFixed(3)+' Z'+z.toFixed(3));
    px = x; py = y;
  };
  /* The floor. Each layer is one spiral, and they run alternately out
     and in so the end of one is where the next begins - an odd number
     of them finishes at the wall. */
  const nFloor = Math.max(1, Math.round(Math.min(FLOORT, S.H)/LAYER));
  for(let li=0; li<nFloor; li++){
    const z = (li+1)*LAYER;
    const sp = floorSpiral(z);
    if(li % 2) sp.reverse();                 // every other one comes back in
    if(!sp.length) continue;
    if(px === null) move(sp[0][0], sp[0][1], z);
    else if(Math.hypot(sp[0][0]-px, sp[0][1]-py) > NOZ) jump(sp[0][0], sp[0][1], z);
    for(let i=1;i<sp.length;i++) move(sp[i][0], sp[i][1], z, EFLR);
  }
  if(nFloor % 2 === 0){                      // ended in the middle; walk back out
    const z = nFloor*LAYER, sp = floorSpiral(z);
    if(sp.length) jump(sp[sp.length-1][0], sp[sp.length-1][1], z);
  }
  // and then one spiral, all the way up
  const z0 = nFloor*LAYER;
  const nLay = Math.max(1, Math.round((S.H - z0)/LAYER));
  for(let li=0; li<nLay; li++){
    const zA = z0 + li*LAYER;
    const loop = loopAt(zA + LAYER*0.5, segs);
    const n = loop.length - 1;
    for(let i=0;i<=n;i++){
      const z = zA + LAYER*i/n;
      if(li === 0 && i === 0) jump(loop[i][0], loop[i][1], z);
      else move(loop[i][0], loop[i][1], z);
    }
  }
  L.push('G0 Z'+(S.H+40).toFixed(1));
  L.push('; end');
  return L.join('\n');
}
function exportGcode(){
  say('Writing the path…');
  setTimeout(() => {
    const blob = new Blob([gcode()], { type:'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pl1-' + S.L + 'x' + S.W + 'x' + S.H + '.gcode';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    say('G-code out');
  }, 30);
}

/* ══════════════════════════════════════════════════════════════════
   10 · RAIL, OPTIONS, INSPECTOR
   ══════════════════════════════════════════════════════════════════ */
const sw = 'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"';
const I = {
  orbit:'<path d="M9 2.6l6.4 3.2v6.4L9 15.4 2.6 12.2V5.8z" ' + sw + '/><path d="M2.6 5.8L9 9l6.4-3.2M9 9v6.4" ' + sw + ' opacity=".45"/>',
  draw:'<path d="M3 15l1-3.4L11.6 4a1.6 1.6 0 012.3 2.3L6.4 14z" ' + sw + '/><path d="M10.4 5.2l2.4 2.4" ' + sw + '/>'
};
const TOOLS = [['orbit','Turn the planter','V'], null, ['draw','Relief','D']];
const railEl = document.getElementById('rail');
TOOLS.forEach(t => {
  if(!t){ railEl.appendChild(Object.assign(document.createElement('div'), { className:'rail-sep' })); return; }
  const [id,title,key] = t;
  const b = document.createElement('button');
  b.className = 'tool'; b.type = 'button'; b.title = title + '  (' + key + ')';
  b.dataset.tool = id; b.setAttribute('aria-label', title);
  b.innerHTML = '<svg viewBox="0 0 18 18" aria-hidden="true">' + I[id] + '</svg>';
  b.onclick = () => setTool(id);
  railEl.appendChild(b);
});
function setTool(id){
  S.tool = id;
  railEl.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === id)));
  setCursor(); buildOpts(); setHint();
}
function setCursor(){
  viewEl.style.cursor = (S.tool === 'draw' && S.face) ? 'crosshair' : 'grab';
}
function setHint(){
  document.getElementById('hint').textContent =
    S.tool === 'draw'
      ? (S.face ? 'Draw on the wall — ' + S.sw + ' mm wide, standing ' + DEPTH + ' mm ' +
                  (S.sunk ? 'into it' : 'proud of it')
                : 'Click a wall to turn it towards you, then draw on it')
      : 'Pull a wall to resize it — the rim for height — click a wall to square up — drag off the planter to turn it';
}
const optsEl = document.getElementById('opts');
const panel = document.getElementById('panel');
const el = (tag,cls,html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; };
function buildOpts(){
  optsEl.innerHTML = '';
  const t = TOOLS.find(x => x && x[0] === S.tool);
  optsEl.appendChild(el('div','tname', t ? t[1] : S.tool));
  /* The figures come first, because while a wall is moving under your
     hand this is the only place they are. */
  const g0 = el('div','ogrp');
  for(const k of ['L','W','H']){
    g0.appendChild(el('label',null, DIMS[k].label));
    const o = el('output',null,''); o.id = 'o-'+k; g0.appendChild(o);
  }
  optsEl.appendChild(g0);
  syncOpts();
  /* Nozzle, layer and draft never change, so on a narrow window they
     are the first things to go: a control you cannot reach is worse
     than a fact you already know. They are in the G-code header too. */
  const room = innerWidth - (S.tool === 'draw' ? 360 : 0);
  if(room >= 820){
    const g1 = el('div','ogrp');
    g1.append(el('label',null,'Nozzle'), el('output',null, NOZ + 'mm'),
              el('label',null,'Layer'),  el('output',null, LAYER + 'mm'));
    optsEl.appendChild(g1);
  }
  if(room >= 700){
    const g2 = el('div','ogrp');
    g2.append(el('label',null,'Draft'), el('output',null, DRAFT + '°'));
    optsEl.appendChild(g2);
  }
  if(S.tool === 'draw'){
    /* Which way the wall goes, and how wide the stroke is. The depth
       is not a choice: four millimetres is what the wall can give. */
    const g3 = el('div','ogrp');
    const seg = el('div','seg');
    for(const [lbl, sunk] of [['Emboss', false], ['Deboss', true]]){
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = lbl;
      b.setAttribute('aria-pressed', String(S.sunk === sunk));
      b.onclick = () => { S.sunk = sunk; buildOpts(); setHint(); };
      seg.appendChild(b);
    }
    g3.appendChild(seg);
    optsEl.appendChild(g3);
    const g4 = el('div','ogrp');
    g4.appendChild(el('label',null,'Stroke'));
    const r = document.createElement('input');
    r.type = 'range'; r.min = SWMIN; r.max = SWMAX; r.step = 1; r.value = S.sw;
    r.setAttribute('aria-label','Stroke width');
    const o = el('output',null, S.sw + 'mm');
    r.oninput = () => { S.sw = parseFloat(r.value); o.textContent = S.sw + 'mm'; setHint(); };
    g4.append(r, o, el('label',null,'Depth'), el('output',null, DEPTH + 'mm'));
    optsEl.appendChild(g4);
  }
}
function syncOpts(){
  for(const k of ['L','W','H']){
    const o = document.getElementById('o-'+k);
    if(o) o.textContent = S[k] + 'mm';
  }
}
function numRow(parent, key, unit){
  const row = el('div','row');
  row.appendChild(el('label',null, DIMS[key].label));
  const i = document.createElement('input');
  i.type = 'number'; i.className = 'num'; i.value = S[key]; i.id = 'n-' + key;
  i.setAttribute('aria-label', DIMS[key].label);
  let nd = null;
  i.addEventListener('pointerdown', e => {
    if(document.activeElement === i) return;
    e.preventDefault();
    nd = { x:e.clientX, v:S[key] };
    i.setPointerCapture(e.pointerId);
  });
  i.addEventListener('pointermove', e => {
    if(!nd) return;
    const dx = e.clientX - nd.x;
    if(Math.abs(dx) > 1){ nd.moved = true; setDim(key, nd.v + dx*(key==='H'?1:2)); sync(); }
  });
  i.addEventListener('pointerup', e => {
    if(nd && !nd.moved){ i.focus(); i.select(); } else if(nd){ snap(); fitView(); }
    nd = null;
  });
  const commit = () => { const v = parseFloat(i.value); if(isFinite(v)){ setDim(key, v); snap(); fitView(); } sync(); };
  i.addEventListener('change', commit);
  i.addEventListener('blur', commit);
  i.addEventListener('keydown', e => { if(e.key === 'Enter'){ i.blur(); } });
  row.append(i, el('span','unit', unit));
  parent.appendChild(row);
}
function sect(title){
  const s = el('div','sect');
  if(title) s.appendChild(el('h2',null,title));
  panel.appendChild(s);
  return s;
}
function button(parent, label, fn){
  const b = document.createElement('button');
  b.type='button'; b.className='btn'; b.textContent=label; b.onclick=fn;
  parent.appendChild(b);
}
/* Built once. A dimension dragged in here would pull the input out
   from under the hand if the panel redrew itself, so the figures and
   the notes are written back in place instead. */
function buildPanel(){
  panel.innerHTML = '';
  const s1 = sect('Size');
  numRow(s1,'L','mm'); numRow(s1,'W','mm'); numRow(s1,'H','mm');
  const h1 = el('p','hint',''); h1.id = 'h-size'; s1.appendChild(h1);

  const s2 = sect('View');
  const seg = el('div','seg'); seg.id = 'seg-view';
  const mk = (lbl, f) => {
    const b = document.createElement('button');
    b.type='button'; b.textContent=lbl; b.dataset.face = f || '';
    b.onclick = () => f ? goFace(f) : goIso();
    seg.appendChild(b);
  };
  mk('Iso', null); mk('F','F'); mk('R','R'); mk('B','B'); mk('L','L');
  const r2 = el('div','row'); r2.appendChild(seg); s2.appendChild(r2);
  const h2 = el('p','hint',''); h2.id = 'h-view'; s2.appendChild(h2);

  const s3 = sect('Relief');
  const g = el('div','grid2');
  button(g,'Undo', undo);
  button(g,'Clear', () => { if(!S.strokes.length) return; S.strokes = []; embDirty = true; bake(); snap(); sync(); say('Cleared'); });
  s3.appendChild(g);
  const h3 = el('p','hint',''); h3.id = 'h-emb'; s3.appendChild(h3);

  const s4 = sect('Out');
  const g2 = el('div','grid2');
  button(g2,'G-code', exportGcode);
  s4.appendChild(g2);
  syncPanel();
}
function syncPanel(){
  for(const k of ['L','W','H']){
    const i = document.getElementById('n-'+k);
    if(i && document.activeElement !== i) i.value = S[k];
  }
  const h1 = document.getElementById('h-size');
  if(h1) h1.innerHTML = 'Rim ' + Math.round(rimL()) + ' × ' + Math.round(rimW()) + ' mm &middot; ' +
    layers() + ' layers<br>' + inch(S.L) + ' × ' + inch(S.W) + ' × ' + inch(S.H) + ' in at the base';
  const seg = document.getElementById('seg-view');
  if(seg) seg.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.face ? S.face === b.dataset.face : (!S.face && atIso()))));
  const h2 = document.getElementById('h-view');
  if(h2) h2.textContent = S.face
    ? 'Square on to the ' + FACES[S.face].name.toLowerCase() + '. Drawing is on.'
    : 'Click a wall in the view to square up to it.';
  const h3 = document.getElementById('h-emb');
  if(h3){
    const out = S.strokes.filter(s => s.sunk === false).length;
    const inn = S.strokes.length - out;
    h3.innerHTML = S.strokes.length
      ? [inn ? inn + ' debossed' : '', out ? out + ' embossed' : ''].filter(Boolean).join(' &middot; ') +
        ' &middot; ' + DEPTH + ' mm'
      : 'Nothing drawn yet.';
  }
}

/* ══════════════════════════════════════════════════════════════════
   11 · SYNC + FRAME
   ══════════════════════════════════════════════════════════════════ */
function sync(){
  syncOpts();
  document.getElementById('st-rim').textContent = Math.round(rimL()) + ' × ' + Math.round(rimW()) + ' mm';
  document.getElementById('st-in').textContent =
    inch(S.L) + ' × ' + inch(S.W) + ' × ' + inch(S.H) + ' in';
  document.getElementById('st-layers').textContent = layers();
  document.getElementById('st-view').textContent =
    S.face ? FACES[S.face].name + ' ELEVATION' : atIso() ? 'ISOMETRIC' : 'FREE';
  syncPanel();
}
let prev = performance.now();
const ease = (c,t,dt,tau) => c + (t-c)*(1 - Math.exp(-dt/tau));
function frame(t){
  const dt = Math.min(0.05, (t-prev)/1000) || 0.016;
  prev = t;
  resize();
  const tau = (drag && drag.kind === 'orbit') ? 0.05 : 0.17;
  A.az = ease(A.az, S.az, dt, tau);
  A.el = ease(A.el, S.el, dt, tau);
  A.scale = ease(A.scale, S.scale, dt, 0.08);
  A.tx = ease(A.tx, S.tx, dt, 0.08);
  A.ty = ease(A.ty, S.ty, dt, 0.08);
  A.tz = ease(A.tz, S.tz, dt, 0.08);
  if(embDirty && S.strokes.length && t - lastBake > 110){ lastBake = t; bake(); }
  try{ draw(); overlay(); rulers(); }
  catch(err){ if(!frame.cried){ frame.cried = true; console.error(err); say('Something went wrong drawing that frame'); } }
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════
   12 · KEYBOARD
   ══════════════════════════════════════════════════════════════════ */
addEventListener('keydown', e => {
  const t = e.target || document.body;
  const tag = (t.tagName||'').toLowerCase();
  if(t.isContentEditable || tag === 'textarea' || (tag === 'input' && t.type !== 'checkbox' && t.type !== 'range')) {
    if(e.key === 'Escape') t.blur();
    return;
  }
  if(e.code === 'Space'){ spaceDown = true; viewEl.style.cursor = 'grab'; e.preventDefault(); return; }
  if(e.metaKey || e.ctrlKey){
    const k = e.key.toLowerCase();
    if(k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    return;
  }
  const k = e.key.toLowerCase();
  if(k === 'v'){ setTool('orbit'); return; }
  if(k === 'd'){ setTool('draw'); return; }
  if(k === 'f'){ fitView(); say('Fit'); return; }
  if(e.key === 'Escape'){ goIso(); return; }
});
addEventListener('keyup', e => {
  if(e.code === 'Space'){ spaceDown = false; setTool(S.tool); }
});
addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button');
  if(b) b.blur();
});
document.getElementById('drawer').onclick = () => panel.classList.toggle('open');
addEventListener('resize', () => { buildOpts(); });

/* ══════════════════════════════════════════════════════════════════
   13 · BOOT
   ══════════════════════════════════════════════════════════════════ */
resize();
document.documentElement.setAttribute('data-theme','light');
fitView();
A.scale = S.scale; A.tx = S.tx; A.ty = S.ty; A.tz = S.tz;
setTool('orbit');
buildPanel();
bake(); snap(); sync();
requestAnimationFrame(frame);

})();
</script>
