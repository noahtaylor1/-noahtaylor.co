<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lattice Filler</title>
<style>
  :root {
    --bg: #1c1e22; --panel: #26292f; --panel2: #2e323a;
    --text: #d7dae0; --dim: #8a9099; --accent: #4fc37f; --accent2: #5aa7e8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 -apple-system, "Helvetica Neue", sans-serif;
         background: var(--bg); color: var(--text); overflow: hidden; }
  #viewport { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; width: 280px;
           background: var(--panel); border: 1px solid #3a3f48; border-radius: 10px;
           padding: 14px 16px; z-index: 10; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  h1 { font-size: 15px; margin: 0 0 10px; }
  h1 small { color: var(--dim); font-weight: 400; font-size: 11px; }
  .row { margin: 9px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row label { color: var(--dim); }
  select, input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid #444a55;
    border-radius: 6px; padding: 4px 6px; width: 130px; font: inherit; }
  .dims { display: flex; gap: 4px; }
  .lever { display: flex; align-items: center; gap: 8px; width: 130px; }
  .lever input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .lever output { width: 26px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .dims input[type=number] { width: 46px; padding: 4px 4px; }
  input[type=checkbox] { accent-color: var(--accent); }
  button { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 7px;
           font: inherit; font-weight: 600; cursor: pointer;
           background: var(--panel2); color: var(--text); }
  button.primary { background: var(--accent); color: #10241a; }
  button.blue { background: var(--accent2); color: #0d2337; }
  button:disabled { opacity: .35; cursor: default; }
  #drop { border: 1.5px dashed #4a505c; border-radius: 8px; padding: 14px;
          text-align: center; color: var(--dim); cursor: pointer; }
  #drop.hover { border-color: var(--accent); color: var(--accent); }
  #status { margin-top: 10px; padding: 8px 10px; background: var(--panel2);
            border-radius: 7px; min-height: 34px; color: var(--dim);
            white-space: pre-line; font-size: 12px; }
  #bar { height: 4px; background: #3a3f48; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  #barFill { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .only-touch { display: none; }
  #sheetGrip { display: none; }
  #sheetPull { display: none; }

  /* ---- phones / small touch screens: controls become a bottom sheet ---- */
  @media (max-width: 700px), (pointer: coarse) and (max-width: 1024px) {
    .only-touch { display: inline; }
    .only-mouse { display: none; }
    #panel {
      top: auto; bottom: 0; left: 0; right: 0; width: auto;
      height: var(--sheet-h, 46vh); max-height: 92vh; padding: 0;
      border-width: 1px 0 0 0; border-radius: 14px 14px 0 0;
      display: flex; flex-direction: column;
      transition: height .22s cubic-bezier(.32,.72,0,1);
      touch-action: none;   /* the sheet handles its own drag gestures */
    }
    body.sheet-dragging #panel { transition: none; }
    /* grab area: the pill and the title bar both drag the sheet */
    #sheetPull { display: block; padding: 9px 0 3px; text-align: center;
                 cursor: grab; flex: 0 0 auto; }
    #sheetPull::before {
      content: ''; display: inline-block; width: 40px; height: 5px;
      border-radius: 3px; background: #545b68;
    }
    h1 {
      margin: 0; padding: 4px 16px 12px; border-bottom: 1px solid #3a3f48;
      display: flex; align-items: center; gap: 8px; cursor: grab;
      user-select: none; -webkit-user-select: none; font-size: 16px;
      flex: 0 0 auto;
    }
    h1 small { display: block; }
    #sheetGrip { display: block; margin-left: auto; color: var(--dim);
                 font-size: 18px; line-height: 1; transition: transform .2s; }
    body.sheet-closed #sheetGrip { transform: rotate(180deg); }
    #panelBody {
      flex: 1 1 auto; min-height: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain; touch-action: pan-y;
      padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    }
    /* 16px keeps iOS from zooming the page when a field is focused */
    select, input[type=number] { font-size: 16px; padding: 8px 8px; width: 45%; min-height: 42px; }
    .dims { flex: 1; }
    .dims input[type=number] { width: 100%; min-width: 0; padding: 8px 4px; text-align: center; }
    .row { margin: 12px 0; }
    .row label { flex: 1; }
    input[type=checkbox] { width: 24px; height: 24px; }
    .lever { width: 45%; }
    .lever input[type=range] { height: 30px; }
    .lever output { width: 30px; font-size: 16px; }
    button { min-height: 46px; margin-top: 10px; font-size: 15px; }
    #drop { padding: 18px 12px; }
    #status { font-size: 13px; }
  }

  /* landscape phones are wide and short — a side panel beats a bottom sheet */
  @media (pointer: coarse) and (max-height: 500px) and (orientation: landscape) {
    #panel {
      top: 0; bottom: 0; left: 0; right: auto;
      width: min(320px, 46vw); height: auto; max-height: none;
      border-radius: 0 14px 14px 0; border-width: 0 1px 0 0;
      padding-left: env(safe-area-inset-left, 0px);
    }
    #panelBody { padding-bottom: 16px; }
    #sheetPull { display: none; }
    body.sheet-closed #panelBody { display: none; }
    /* collapsed, the panel should shrink to its header, not stay full height */
    body.sheet-closed #panel { bottom: auto; width: auto; border-radius: 0 0 14px 0; }
  }
</style>
</head>
<body>
<div id="viewport"></div>
<div id="panel">
  <div id="sheetPull"></div>
  <h1 id="panelHead">Lattice Filler <small><span id="cellLabel">10</span> mm cells</small><span id="sheetGrip">⌄</span></h1>
  <div id="panelBody">
  <div id="drop"><span class="only-mouse">Drop a .3dm / .stl / .obj here<br>or click to browse</span><span class="only-touch">Tap to choose a<br>.3dm / .stl / .obj file</span></div>
  <input type="file" id="file" accept=".3dm,.stl,.obj" style="display:none">
  <div class="row"><label>Primitive</label><select id="prim">
    <option value="cube">Cube</option>
    <option value="cylinder">Cylinder</option>
    <option value="sphere">Sphere</option>
  </select></div>
  <div class="row"><label id="dimsLabel">W × D × H (mm)</label><span class="dims">
    <input type="number" id="dimA" value="100" min="10" step="10">
    <input type="number" id="dimB" value="100" min="10" step="10">
    <input type="number" id="dimC" value="100" min="10" step="10">
  </span></div>
  <button id="loadPrim">Load primitive</button>
  <div class="row"><label>Cell size (mm)</label><span class="lever">
    <input type="range" id="cell" min="4" max="40" step="1" value="10">
    <output id="cellOut">10</output>
  </span></div>
  <div class="row"><label>Taper cells (X/Y)</label><input type="checkbox" id="taper"></div>
  <div class="row" id="taperRow" hidden><label>Centre → edge (mm)</label><span class="dims">
    <input type="number" id="taperBig" value="20" min="3" max="60" step="1" title="cell size at the centre">
    <input type="number" id="taperSmall" value="6" min="2" max="60" step="1" title="cell size at the outer face">
  </span></div>
  <div class="row"><label>Lattice</label><select id="lattice"></select></div>
  <div class="row"><label>Cell edges</label><input type="checkbox" id="edges" checked></div>
  <div class="row"><label>Whole cells (flat sides)</label><input type="checkbox" id="wholeCells" checked></div>
  <div class="row"><label>Strut radius (mm)</label><input type="number" id="radius" value="0.8" min="0.2" max="4" step="0.1"></div>
  <div class="row"><label>Joint smoothing (mm)</label><input type="number" id="blend" value="2" min="0.1" max="4" step="0.1"></div>
  <div class="row"><label>Detail (voxel mm)</label><input type="number" id="detail" value="0.1" min="0.1" max="1.5" step="0.05"></div>
  <div class="row"><label>Show input</label><input type="checkbox" id="showInput" checked></div>
  <button id="generate" class="primary" disabled>Generate lattice</button>
  <button id="solid" class="blue" disabled>Build smooth mesh</button>
  <button id="export" disabled>Export STL</button>
  <div id="status">Load a model to begin.</div>
  <div id="bar"><div id="barFill"></div></div>
  </div>
</div>

<script>
  // ES modules don't load over file:// — the UI would render but do nothing
  if (location.protocol === 'file:') {
    addEventListener('DOMContentLoaded', () => {
      document.getElementById('status').textContent =
        'This page must be served over http, not opened as a file.\n' +
        'Run: python3 -m http.server 8741  (in this folder)\n' +
        'then open http://localhost:8741';
      document.getElementById('status').style.color = '#e8a75a';
    });
  }
</script>
<script src="vendor/rhino3dm.min.js"></script>
<script src="vendor/rhino3dm_wasm_b64.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
<script type="module" src="app.js?v=d387fbc8"></script>
</body>
</html>
