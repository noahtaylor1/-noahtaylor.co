<!DOCTYPE html>
<html lang="en">
<head>

<title>Malleable S1 — Noah Taylor</title>
<style>
/* Same plate-and-chrome identity as Malleable: strictly achromatic, Helvetica,
   options bar over [rail | ruled viewport | inspector], status strip beneath. */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --chrome:#ffffff;
  --chrome-2:#f4f4f4;
  --chrome-3:#e9e9e9;
  --rule:rgba(0,0,0,.16);
  --rule-soft:rgba(0,0,0,.08);
  --t1:rgba(0,0,0,.92);
  --t2:rgba(0,0,0,.56);
  --t3:rgba(0,0,0,.34);
  --guide:rgba(0,0,0,.78);
  --sel:#000000;
  --font:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --nav-h:56px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#000000;--ink:#ffffff;--chrome:#0b0b0b;--chrome-2:#161616;--chrome-3:#232323;
  --rule:rgba(255,255,255,.18);--rule-soft:rgba(255,255,255,.09);
  --t1:rgba(255,255,255,.94);--t2:rgba(255,255,255,.58);--t3:rgba(255,255,255,.34);
  --guide:rgba(255,255,255,.82);--sel:#ffffff;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-top:var(--nav-h);background:var(--chrome);color:var(--t1);
  font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}

.site-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:30;
  display:flex;align-items:center;justify-content:space-between;padding:0 48px;
  background:var(--chrome);border-bottom:1px solid var(--rule);font-family:var(--font)}
.site-nav a{color:var(--t1);text-decoration:none;transition:color .15s var(--ease)}
.site-nav a:hover{color:var(--t3)}
.nav-logo{font-size:14px;font-weight:500;letter-spacing:.03em}
.nav-links{display:flex;gap:32px;list-style:none;margin:0;padding:0;font-size:13px;letter-spacing:.02em}
@media (max-width:900px) and (min-width:701px){.site-nav{padding:0 24px}.nav-links{gap:22px}}
@media (max-width:700px){.site-nav{padding:0 20px}.nav-links li:not(.keep){display:none}}

#app{display:grid;grid-template-columns:40px 1fr 264px;grid-template-rows:34px 1fr 24px;height:100%}

#opts{grid-column:1/4;grid-row:1;background:var(--chrome);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;padding:0 10px 0 12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
#opts .tname{font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:10px;
  white-space:nowrap;flex:none;padding-right:12px;margin-right:12px;border-right:1px solid var(--rule);min-width:104px}
#opts .ogrp{display:flex;align-items:center;gap:7px;flex:0 1 auto;min-width:0;padding-right:12px;margin-right:12px;
  border-right:1px solid var(--rule-soft);animation:fadein .18s var(--ease)}
#opts .ogrp:last-child{border-right:0}
@keyframes fadein{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
#opts label{font-size:10px;color:var(--t3);white-space:nowrap;text-transform:uppercase;letter-spacing:.18em}
#opts output{font-size:12px;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
#opts input[type=range]{flex:0 1 84px;width:84px;min-width:38px}

#rail{grid-column:1;grid-row:2/4;background:var(--chrome);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;overflow-y:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.tool{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;flex:none;
  background:none;border-radius:2px;cursor:pointer;color:var(--t1);position:relative;
  transition:background .14s var(--ease),color .14s var(--ease)}
.tool svg{width:17px;height:17px;display:block;transition:transform .16s var(--ease)}
.tool:hover{background:var(--chrome-3)}
.tool:hover svg{transform:scale(1.08)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool[aria-pressed="true"] svg{transform:none}
.tool:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.rail-sep{width:18px;height:1px;background:var(--rule);margin:5px 0;flex:none}

#stage{grid-column:2;grid-row:2;display:grid;grid-template-columns:18px 1fr;grid-template-rows:18px 1fr;
  background:var(--chrome);min-width:0;min-height:0}
#corner{background:var(--chrome-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
#rulerH{border-bottom:1px solid var(--rule);background:var(--chrome-2);display:block;width:100%;height:100%}
#rulerV{border-right:1px solid var(--rule);background:var(--chrome-2);display:block;width:100%;height:100%}
#view{position:relative;overflow:hidden;touch-action:none;background:var(--paper);min-width:0;min-height:0}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#hint{position:absolute;right:12px;top:9px;font-size:11.5px;color:var(--t3);pointer-events:none;
  user-select:none;text-align:right;max-width:60%}
#perf{position:absolute;right:12px;top:27px;font-size:11px;color:var(--t3);pointer-events:none;
  font-variant-numeric:tabular-nums}

#panel{grid-column:3;grid-row:2/4;background:var(--chrome);border-left:1px solid var(--rule);
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sect{border-bottom:1px solid var(--rule);padding:9px 11px}
.sect h2{margin:0 0 9px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);font-weight:400}
.row{display:flex;align-items:center;gap:7px;margin-bottom:5px;min-width:0}
.row:last-child{margin-bottom:0}
.row label{flex:0 0 72px;font-size:12px;color:var(--t2);min-width:0}
.row output{flex:0 0 34px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;height:14px;-webkit-appearance:none;appearance:none;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
input[type=range]::-moz-range-track{height:1px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;
  background:var(--ink);margin-top:-3.5px;cursor:pointer;transition:transform .12s var(--ease)}
input[type=range]::-moz-range-thumb{width:8px;height:8px;border:0;border-radius:50%;background:var(--ink);cursor:pointer}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.35)}
input[type=range]:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.seg{display:flex;flex:1;border:1px solid var(--rule);border-radius:2px;overflow:hidden;min-width:0}
.seg button{flex:1;min-width:0;padding:4px 2px;background:none;border:0;border-right:1px solid var(--rule);
  cursor:pointer;font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--t2);white-space:nowrap;
  transition:background .14s var(--ease),color .14s var(--ease)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:hover:not([aria-pressed="true"]){background:var(--chrome-3);color:var(--t1)}
.btn{padding:5px 7px;background:none;border:1px solid var(--rule);border-radius:2px;cursor:pointer;
  font-size:12px;font-weight:500;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;
  transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease)}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.pf{display:flex;gap:4px}
.pf button{flex:1;height:26px;display:grid;place-items:center;border:1px solid var(--rule);
  border-radius:2px;background:none;cursor:pointer;transition:background .14s var(--ease)}
.pf button svg{width:17px;height:17px}
.pf button:hover{background:var(--chrome-3)}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);cursor:pointer;padding:3px 0;user-select:none}
.chk input{appearance:none;-webkit-appearance:none;width:10px;height:10px;border:1px solid var(--rule);
  border-radius:1px;margin:0;flex:none;cursor:pointer;transition:background .14s var(--ease)}
.chk input:checked{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--chrome)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.txt{width:100%;background:none;border:0;border-bottom:1px solid var(--rule-soft);padding:4px 0;
  font-size:12px;letter-spacing:.06em;min-width:0;transition:border-color .14s var(--ease)}
.txt:focus{outline:none;border-bottom-color:var(--ink)}
.hint{font-size:11.5px;line-height:1.6;color:var(--t3);margin:7px 0 0}
#selnone{font-size:12px;color:var(--t3);line-height:1.6}

#status{grid-column:2;grid-row:3;border-top:1px solid var(--rule);background:var(--chrome);
  display:flex;align-items:center;gap:15px;padding:0 12px;font-size:11px;color:var(--t2);
  letter-spacing:.02em;overflow:hidden;white-space:nowrap}
#status b{font-weight:500;color:var(--t1)}
#status span{font-variant-numeric:tabular-nums}
#st-msg{color:var(--t1);transition:opacity .3s var(--ease)}
#drawer{display:none}

@media (max-width:880px){
  #app{grid-template-columns:1fr;grid-template-rows:34px 36px 1fr 24px}
  #opts{grid-column:1;grid-row:1;padding-left:max(12px,env(safe-area-inset-left,0px));
    padding-right:max(12px,env(safe-area-inset-right,0px))}
  #rail{grid-column:1;grid-row:2;flex-direction:row;border-right:0;border-bottom:1px solid var(--rule);
    padding:0 max(6px,env(safe-area-inset-left,0px));overflow-x:auto;overflow-y:hidden}
  .rail-sep{width:1px;height:18px;margin:0 4px}
  #stage{grid-column:1;grid-row:3}
  #status{grid-column:1;grid-row:4;padding-left:max(11px,env(safe-area-inset-left,0px));
    padding-right:max(11px,env(safe-area-inset-right,0px))}
  #panel{position:fixed;right:0;bottom:24px;top:calc(70px + var(--nav-h));width:min(248px,86vw);z-index:5;
    transform:translateX(102%);transition:transform .22s var(--ease);box-shadow:-8px 0 26px rgba(0,0,0,.18)}
  #panel.open{transform:none}
  #drawer{display:grid;place-items:center;position:fixed;right:10px;bottom:34px;z-index:6;
    width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);border:0;cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.3)}
  #drawer svg{width:17px;height:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div id="app">
  <div id="opts"></div>
  <nav id="rail" aria-label="Tools"></nav>

  <div id="stage">
    <div id="corner"></div>
    <svg id="rulerH" aria-hidden="true"></svg>
    <svg id="rulerV" aria-hidden="true"></svg>
    <div id="view">
      <canvas id="gl"></canvas>
      <svg id="ov" aria-hidden="true"></svg>

      <div id="perf"></div>
    </div>
  </div>

  <aside id="panel" aria-label="Inspector"></aside>

  <div id="status">
    <span>X <b id="st-x">0</b></span>
    <span>Y <b id="st-y">0</b></span>
    <span><b id="st-view">ELEVATION</b></span>
    <span>RIBBONS <b id="st-n">0</b></span>

<button id="drawer" aria-label="Toggle inspector"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h12M3 9h12M3 13h12"/></svg></button>

<script>
"use strict";
(() => {

/* ══════════════════════════════════════════════════════════════════
   MALLEABLE S1 — ribbon shelves
   ------------------------------------------------------------------
   You draw a toolpath on the wall in elevation. The stroke is the real
   width of the material: two 3 mm beads laid side by side with a
   half-millimetre of overlap, so 5.5 mm across. The shelf is that
   path given depth off the wall, and the depth is the print height -
   it lies on the bed and climbs in one unbroken spiral, exactly the
   way the squiggle on the wall was made.

   One scene unit is one centimetre.
   ══════════════════════════════════════════════════════════════════ */
const MM = 1/10;
const BUILD = 250;                 // the X1C's cube, all three axes, in mm
const FIELD_N = 768;               // baked field, texels a side
const MAXRIB = 8;                  // ribbons the shader carries
const MAXSEG = 1400;               // segments one ribbon's path may hold
const PAD = 1.2;                   // units of empty field around a ribbon
let uid = 1;

const S = {
  ribs:[], sel:new Set(), tool:'curve',
  tx:0, ty:0, tz:5, scale:52,
  az:0, el:0,                      // the elevation is home; a tilt springs back to it
  bead:3, layer:1.5, lap:0.5,      // mm - the mod's fat nozzle
  depth:110,                       // mm off the wall, which is the print height
  blend:7, corner:16,              // mm
  inlet:0,                         // mm - air at the stop; zero and the two beads touch
  ortho:true, orthoTol:12, runMin:22, hold:false,
  /* One plane, the same at every zoom and whatever is on it. */
  wall:true, wallBox:[-4000,-4000,4000,4000],
  shade:0, tone:0.20, ambient:0.10, seam:0.45, edges:false, relief:0.30,
  roll:1.1, crown:0.22,
  steps:132, plate:true, invert:false, path:false,
  flow:9.3,
  cap1:'MALLEABLE', cap2:'ribbon.s1', cap3:'nr.001'
};
const A = { scale:52, az:0, el:0, tx:0, ty:0, tz:5, pitch:0.15 };

let msgTimer = 0;
function say(t){
  const e = document.getElementById('st-msg');
  e.textContent = t; e.style.opacity = '1';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { e.style.opacity = '0'; }, 2400);
}

/* ── the numbers the stroke is made of ─────────────────────────────
   Two beads, overlapped, is the wall. Everything else follows from it:
   the stroke you draw with, where the two passes run, and how far the
   toolpath sits inside the edge you see.                            */
const strokeMM = () => Math.max(S.bead, 2*S.bead - S.lap);   // 5.5 at the defaults
const halfW    = () => strokeMM()*MM/2;                      // units
const passOff  = () => (S.bead - S.lap)*MM/2;                // +-1.25 mm
const insetU   = () => S.bead*MM/2;                          // half a bead in from the edge
const blendR   = () => Math.min(S.blend, 16)*MM;             // the arc kernel's radius IS r
/* Far enough along the path that a neighbouring stretch is not just
   'the line itself' a moment earlier. Below this the blend would eat
   its own tail and fatten every straight. */
const gapS     = () => 2*(blendR() + halfW()) + 1.0;

/* ── the inlet ─────────────────────────────────────────────────────
   A spiral vase is one unbroken loop, so the profile it climbs has to
   be one unbroken loop too. A drawing that closes a void around itself
   is not: it is an outside and an island of inside, and no single line
   can trace both. The old answer was to splice them - run the line in
   along the shortest neck and straight back out a bead away, a seam
   doubled on itself, which is the pinch in the print.
   The honest answer is to cut. Take a slit out of the neck, the width
   of a bead or two, and the void is not enclosed any more: it is a bay
   off the outside, and one line walks in, round it and back out. The
   path jogs in and out where the slit is, and the slit is a feature -
   a notch you can see on the edge - not an artefact.                */
/* Zero clearance is the normal case: the two ends come to a kiss, and
   each lays its bead half a bead off its own face, so the two beads
   touch and nothing is laid twice.
   How the end is shaped matters more than how wide the gap is. Cut a
   slot of the stroke's own width clean across the arm and the ends
   are flat, with a blob of fillet at each corner. Cut it a stroke
   wider and give each end back a disc of the stroke's radius, and the
   end is a semicircle - which is how a drawn line ends. Two of those,
   kissing, leave a lens of air either side of the touch: the little
   opening, and the turn the path takes round it is the same turn it
   takes round the end of any line. */
const inletGap  = () => Math.max(0.05, S.inlet)*MM;   // a kiss is a hairline, never nothing
const inletHalf = () => inletGap()/2;
const MAXCUT = 8;
/* material MINUS the slot, PLUS the cap a stopped end is owed. The
   slot is lopsided on purpose: a stroke deep on the side that stops,
   so a disc fits inside it, and a hairline on the side that stays, so
   the crossing keeps the shape it had. */
function cutInlets(d, x, y, cuts){
  if(!cuts) return d;
  for(let i=0;i<cuts.length;i++){
    const c = cuts[i];
    const vx=c[2]-c[0], vy=c[3]-c[1], L=Math.hypot(vx,vy);
    if(!(L > 1e-9)) continue;
    const ex=vx/L, ey=vy/L, nx=-ey, ny=ex;
    const px=x-c[0], py=y-c[1];
    const u = px*ex + py*ey, q = px*nx + py*ny;
    d = Math.max(d, Math.min(Math.min(u, L-u), Math.min(q + c[8], c[9] - q)));
    if(c[10] > 0) d = Math.min(d, Math.hypot(x-c[4], y-c[5]) - c[10]);
    if(c[11] > 0) d = Math.min(d, Math.hypot(x-c[6], y-c[7]) - c[11]);
  }
  return d;
}

/* ══════════════════════════════════════════════════════════════════
   1 · CURVE WORK
   ══════════════════════════════════════════════════════════════════ */
/* The hand is not a way in here any more: a path is placed, not
   drawn, so the fairing that took the tremor out of a drawn line has
   nothing left to take it out of. */
function rdpKeep(v, eps){
  const n = v.length;
  if(n < 3) return v.map((_,i)=>i);
  const keep = new Uint8Array(n);
  keep[0] = keep[n-1] = 1;
  const st = [[0,n-1]];
  while(st.length){
    const [a,b] = st.pop();
    if(b <= a+1) continue;
    const ax=v[a].x, ay=v[a].y, ex=v[b].x-ax, ey=v[b].y-ay, L2=ex*ex+ey*ey;
    let far=-1, fd=eps;
    for(let i=a+1;i<b;i++){
      const px=v[i].x-ax, py=v[i].y-ay;
      const t = L2 > 1e-18 ? Math.max(0, Math.min(1, (px*ex+py*ey)/L2)) : 0;
      const d = Math.hypot(px-ex*t, py-ey*t);
      if(d > fd){ fd = d; far = i; }
    }
    if(far < 0) continue;
    keep[far] = 1; st.push([a,far],[far,b]);
  }
  const out = [];
  for(let i=0;i<n;i++) if(keep[i]) out.push(i);
  return out;
}
const rdp = (v, eps) => rdpKeep(v, eps).map(i => ({x:v[i].x, y:v[i].y}));
/* Round every interior corner with a tangent arc. The radius is clamped
   so two fillets on a short segment cannot overrun one another - which
   is also why a dense curve passes through this untouched. */
function filletPoly(v, r){
  const n = v.length;
  if(n < 3 || r <= 1e-4) return v.map(q => ({x:q.x, y:q.y}));
  const out = [{x:v[0].x, y:v[0].y}];
  for(let i=1;i<n-1;i++){
    const a=v[i-1], b=v[i], c=v[i+1];
    let v1x=a.x-b.x, v1y=a.y-b.y, v2x=c.x-b.x, v2y=c.y-b.y;
    const l1=Math.hypot(v1x,v1y)||1e-6, l2=Math.hypot(v2x,v2y)||1e-6;
    v1x/=l1; v1y/=l1; v2x/=l2; v2y/=l2;
    const ang = Math.acos(Math.max(-1, Math.min(1, v1x*v2x + v1y*v2y)));
    if(ang < 0.02 || ang > Math.PI-0.035){ out.push({x:b.x, y:b.y}); continue; }
    const half = Math.tan(ang/2);
    const t = Math.min(r/half, l1*0.5, l2*0.5);
    const rr = t*half;
    let bx=v1x+v2x, by=v1y+v2y;
    const bl=Math.hypot(bx,by)||1e-6; bx/=bl; by/=bl;
    const dc = rr/Math.sin(ang/2);
    const cx = b.x+bx*dc, cy = b.y+by*dc;
    const p1x=b.x+v1x*t, p1y=b.y+v1y*t, p2x=b.x+v2x*t, p2y=b.y+v2y*t;
    let a1 = Math.atan2(p1y-cy, p1x-cx), a2 = Math.atan2(p2y-cy, p2x-cx);
    let d = a2-a1;
    while(d >  Math.PI) d -= 2*Math.PI;
    while(d < -Math.PI) d += 2*Math.PI;
    const steps = Math.max(2, Math.ceil(Math.abs(d)/0.17));
    for(let j=0;j<=steps;j++){
      const th = a1 + d*j/steps;
      out.push({x:cx+Math.cos(th)*rr, y:cy+Math.sin(th)*rr});
    }
  }
  out.push({x:v[n-1].x, y:v[n-1].y});
  return out;
}
function densify(v, step){
  if(v.length < 2) return v.map(q => ({x:q.x,y:q.y}));
  const out = [{x:v[0].x, y:v[0].y}];
  for(let i=1;i<v.length;i++){
    const a=v[i-1], b=v[i];
    const L = Math.hypot(b.x-a.x, b.y-a.y);
    const k = Math.max(1, Math.round(L/step));
    for(let j=1;j<=k;j++) out.push({x:a.x+(b.x-a.x)*j/k, y:a.y+(b.y-a.y)*j/k});
  }
  return out;
}

/* ── orthogonal snap ───────────────────────────────────────────────
   A run long enough to have been meant - not a wobble - that falls
   within a few degrees of flat or plumb is pulled onto the axis. The
   chain has to stay joined while that happens, so the constraint and a
   weak spring back to where the hand actually went are relaxed against
   each other, and the last passes are constraint only, which is what
   makes the straights exactly straight.
   Corners are never squared off here: they are rounded afterwards.  */
function orthoSnap(v, tolDeg, runMinMM, straight, devMax){
  const n = v.length;
  const lock = new Array(Math.max(0,n-1)).fill(0);
  if(n < 2) return { p:v.map(q=>({x:q.x,y:q.y})), lock };
  const tol = tolDeg*Math.PI/180, runMin = runMinMM*MM;
  for(let i=0;i<n-1;i++){
    const dx=v[i+1].x-v[i].x, dy=v[i+1].y-v[i].y;
    if(Math.hypot(dx,dy) < runMin) continue;
    if(straight && straight[i] > devMax) continue;
    const a = Math.atan2(Math.abs(dy), Math.abs(dx));
    if(a < tol) lock[i] = 1;
    else if(a > Math.PI/2 - tol) lock[i] = 2;
  }
  if(!lock.some(Boolean)) return { p:v.map(q=>({x:q.x,y:q.y})), lock };
  const p = v.map(q=>({x:q.x,y:q.y})), home = v.map(q=>({x:q.x,y:q.y}));
  for(let it=0; it<90; it++){
    const pull = it < 55 ? 0.07 : 0;
    for(let i=0;i<n-1;i++){
      if(!lock[i]) continue;
      const a=p[i], b=p[i+1];
      if(lock[i] === 1){ const m=(a.y+b.y)/2; a.y=m; b.y=m; }
      else             { const m=(a.x+b.x)/2; a.x=m; b.x=m; }
    }
    if(pull) for(let i=0;i<n;i++){
      p[i].x += (home[i].x-p[i].x)*pull;
      p[i].y += (home[i].y-p[i].y)*pull;
    }
  }
  return { p, lock };
}

/* ══════════════════════════════════════════════════════════════════

function mkRib(raw, mode){
  const o = { id:uid++, raw:raw.map(q=>({x:q.x, y:q.y})), mode:mode||'curve',

  build(o);

}
/* ── control points ────────────────────────────────────────────────
   A degree-three B-spline on the points as placed: the curve is
   pulled towards them rather than threaded through them, which is
   what makes it fair, and it holds the first and last exactly, and
   leaves each end tangent to its first span. Fewer than four points
   and the degree comes down to what they can carry, so three points
   are a parabola and two are a line - the same thing Rhino does.
   Bring the last point back onto the first and it closes periodic,
   with no corner at the join. */

    U = []; for(let i=0;i<C.length+p+1;i++) U.push(i);
    lo = U[p]; hi = U[C.length];

    const m = n + p + 1;
    U = new Array(m);
    for(let i=0;i<=p;i++) U[i] = 0;
    for(let i=p+1;i<n;i++) U[i] = i - p;
    for(let i=n;i<m;i++) U[i] = n - p;
    lo = 0; hi = n - p;

    let a = p, b = N;
    while(b - a > 1){ const mid = (a+b) >> 1; if(U[mid] <= u) a = mid; else b = mid; }

      const a = den > 1e-12 ? (u - U[i])/den : 0;
      d[j] = { x:(1-a)*d[j-1].x + a*d[j].x, y:(1-a)*d[j-1].y + a*d[j].y };

}

const curveShut = v => v.length > 3 && Math.hypot(v[0].x - v[v.length-1].x, v[0].y - v[v.length-1].y) < 1e-6;

function ribSize(o){
  const h = halfW()/MM;
  return { w:(o.inner[2]-o.inner[0])/MM + 2*h, h:(o.inner[3]-o.inner[1])/MM + 2*h, d:o.depth };

function translate(o, dx, dy){
  for(const q of o.raw){ q.x += dx; q.y += dy; }
  for(const q of o.pts){ q.x += dx; q.y += dy; }
  for(const s of o.segs){ s.ax+=dx; s.ay+=dy; s.bx+=dx; s.by+=dy; }
  o.box[0]+=dx; o.box[2]+=dx; o.box[1]+=dy; o.box[3]+=dy;
  o.inner[0]+=dx; o.inner[2]+=dx; o.inner[1]+=dy; o.inner[3]+=dy;
  if(o.inlets) for(const c of o.inlets) for(let i=0;i<8;i+=2){ c[i]+=dx; c[i+1]+=dy; }

/* ── the field, on the CPU ─────────────────────────────────────────
   The same two-pass distance the GPU bakes, point by point, for the
   slicer. A uniform grid of segment buckets keeps it quick, and the
   search is capped: past thirty millimetres the answer is only ever
   'outside', and the contour never goes looking there.              */
/* How much of the blend two strands have earned. Running alongside,
   they are a scroll closing on itself and the fillet is the point: it
   carries one into the other instead of leaving a crease the nozzle
   cannot reach. Crossing, they are a knot, and a knot is two lines
   laid over each other - the one that loops back is not carried into
   the one it crosses, it meets it in a corner. The sine between them
   tells which, and the handover is soft so nothing snaps as a curve
   turns through it: whole below about twelve degrees, down to the
   knot's own by thirty.
   Down to, not away. A knot is a corner, but a corner taken to a
   point is one the nozzle cannot walk: the pass that turns into it
   has to come round inside the bead it has just laid. So the arms of
   a crossing keep a fillet of their own, small enough to read as a
   corner and wide enough that the turn is a turn. What stays sharp
   is the one place it should - where a stopped end kisses the strand
   it crossed, and carrying one into the other would weld shut the

const knotR = () => Math.min(blendR(), halfW()*0.8);

  for(let i=0;i<nx*ny;i++) bins[i] = [];

  const cj = y => Math.max(0, Math.min(ny-1, Math.floor((y-box[1])/cell)));

    for(const pr of parts){

      const fa = L > 1e-12 ? (pr[0]-s.s0)/L : 0, fb = L > 1e-12 ? (pr[1]-s.s0)/L : 1;
      out.push({ ax: s.ax + (s.bx-s.ax)*fa, ay: s.ay + (s.by-s.ay)*fa,
                 bx: s.ax + (s.bx-s.ax)*fb, by: s.ay + (s.by-s.ay)*fb,
                 s0: pr[0], s1: pr[1] });
    }
  }
  o.live = out;
  return out;
}
/* How far the loop has to be cut back before the end left standing
   is a kiss clear of the arms it crossed. Scanned rather than solved:
   a knot can be at any angle and the arms that bound it are whatever
   the hand drew. The strand just behind the cut is not counted - it
   is this same line, a moment earlier - so what the end measures
   itself against is the knot proper. */
function trimRun(o, s0, dir, need, lim){
  const skip = gapS();
  for(let t=0.02; t<=lim; t+=0.02){
    const lo = dir > 0 ? s0 : s0 - t - skip;
    const hi = dir > 0 ? s0 + t + skip : s0;
    const e = atS(o, s0 + dir*t);
    let d = 1e9;
    for(const g of o.segs){
      if(g.s1 > lo && g.s0 < hi) continue;
      const q = ptSegD(e[0], e[1], g.ax, g.ay, g.bx, g.by);
      if(q < d) d = q;
    }
    if(d >= need) return t;
  }
  return 0;
}
/* Both ends of the loop are candidates - stop it as it leaves the
   knot, or as it comes back - and the shorter stretch wins. Standing
   clear of the knot is not always enough on its own: where a third
   pass lies over the stretch being taken out, the notch fills itself
   back in, so each end also offers a stroke or two more in reserve.
   Which of them is taken is settled by marching the contour. */
function trimFor(o, N){
  const need = strokeMM()*MM + inletGap() + (o.open || 0);
  const span = N.sb - N.sa, st = strokeMM()*MM;
  const lim  = Math.min(span*0.45, st*8);
  const out = [];
  const ta = trimRun(o, N.sa,  1, need, lim);
  const tb = trimRun(o, N.sb, -1, need, lim);
  for(const g of [0, 0.25, 0.6, 1.2].map(v => v*st)){
    if(ta && ta + g <= lim) out.push([N.sa, N.sa + ta + g]);
    if(tb && tb + g <= lim) out.push([N.sb - tb - g, N.sb]);
  }
  out.sort((p, q) => (p[1]-p[0]) - (q[1]-q[0]));
  return out.slice(0, 6);
}
function nearestTo(P, q){
  let bi = -1, bd = 1e30;
  for(let i=0;i<P.length;i++){
    const dx = P[i][0]-q[0], dy = P[i][1]-q[1], d = dx*dx + dy*dy;
    if(d < bd){ bd = d; bi = i; }
  }
  return bi;
}
/* a to b, run a little past both ends so the slit breaks through */
function throughCut(a, b, ext){
  let dx = b[0]-a[0], dy = b[1]-a[1];
  const L = Math.hypot(dx, dy);
  if(!(L > 1e-6)) return null;
  dx /= L; dy /= L;
  return [a[0]-dx*ext, a[1]-dy*ext, b[0]+dx*ext, b[1]+dy*ext];
}
/* How many strands the slit severs, and where. One is what opens a
   void and leaves the drawing in one piece; two would cut a crossing
   clean in half and leave two drawings. */
function armsCut(c, segs){
  const ax=c[0], ay=c[1], bx=c[2]-ax, by=c[3]-ay;
  let k = 0, hit = null;
  for(const s of segs){
    const dx=s.bx-s.ax, dy=s.by-s.ay;
    const den = bx*dy - by*dx;
    if(Math.abs(den) < 1e-12) continue;
    const ex = s.ax-ax, ey = s.ay-ay;
    const t = (ex*dy - ey*dx)/den, u = (ex*by - ey*bx)/den;
    if(t < 0 || t > 1 || u < 0 || u > 1) continue;
    if(++k > 1) return { n:k };
    const L = Math.hypot(dx, dy) || 1;
    hit = { x:ax+bx*t, y:ay+by*t, tx:dx/L, ty:dy/L };
  }
  return { n:k, hit };
}
/* The cap: a disc of the stroke's radius on the strand's own
   centreline, set so its near edge stands exactly the clearance off
   the face opposite. The side the knot is on is left alone - that is
   what the end kisses. With no knot to speak of, both sides stop and
   both get a cap. Too oblique a crossing for a disc to cap it and the
   cut keeps the plain hairline. */
function capCut(c, segs, N, f0){
  const a = armsCut(c, segs);
  const h0 = inletHalf();
  const plain = c.concat([0, 0, 0, 0, h0, h0, 0, 0]);   // twelve: cut, two cap seats, then the four numbers
  if(a.n !== 1) return plain;
  const vx=c[2]-c[0], vy=c[3]-c[1], L=Math.hypot(vx,vy);
  if(!(L > 1e-9)) return null;
  const nx = -vy/L, ny = vx/L;
  const tn = a.hit.tx*nx + a.hit.ty*ny;
  if(Math.abs(tn) < 0.3) return plain;
  const h = halfW(), lo = h*0.8, hi = h*1.25;
  /* The disc has to be as big as the material it caps, or the corners
     the slot took off are not given back and the end is left with an
     ear. So fit it: sit it where its near edge stands the clearance
     off the opposite face, read how much room is there, and settle. */
  const fit = sign => {
    let r = h, P = [a.hit.x, a.hit.y], raw = h;
    for(let i=0;i<5;i++){
      const k = sign*(h0 + r)/tn;
      P = [a.hit.x + a.hit.tx*k, a.hit.y + a.hit.ty*k];
      raw = -f0(P[0], P[1]);
      const rr = Math.min(hi, Math.max(lo, raw));
      const done = Math.abs(rr - r) < 0.004;
      r = rr;
      if(done) break;
    }
    return { P, r, w:h0 + r };
  };
  /* Only a crossing earns a cap. A slit through a plain wall - a
     scroll sealed by its own blend - has no end to show, and widening
     it there only walks the slot into the next turn of the spiral. */
  if(!N) return plain;
  const qN = (N.x-c[0])*nx + (N.y-c[1])*ny;
  const K = fit(qN > 0 ? -1 : 1);                            // the side that stops
  return qN > 0 ? c.concat(K.P, K.P, [K.w, h0, 0, K.r])      // the knot is the + side: leave it
                : c.concat(K.P, K.P, [h0, K.w, K.r, 0]);
}
/* Contour the stroke as drawn. One loop and the drawing is already a
   single line. More than one and every loop after the first is a void.
   A void is nearly always shut by a crossing, and a crossing is the
   line lying over itself, so the honest way to open it is to stop the
   loop short as it leaves the knot - take the stretch out of the line
   and what is left ends in a round of the stroke, a kiss clear of the
   arms it crossed. Where nothing crosses - a scroll sealed by its own
   blend - there is no stretch to take, and the old slit through the
   wall stands in. Each void opened counts as outside for the next, so
   two in a row are reached one after another. */
function findInlets(o){
  o.inlets = null; o.gaps = null; o.live = null;
  if(o.segs.length < 2 || !touchesItself(o)) return null;
  const box = o.box, inset = insetU();
  const res = Math.max(64, Math.min(520, Math.round((box[2]-box[0])/0.15)));
  const march = () => {
    o.live = null;
    const f = fieldFn(o);
    return isoLoops((x,y) => f(x,y) + inset, box[0], box[2], box[1], box[3], res)
             .filter(l => l.length > 6 && loopLen(l) > passOff()*8);
  };
  let loops = march();
  if(loops.length < 2) return null;
  const nodes = selfNodes(o);
  /* Try the knots first, shortest stretch first, and keep only what
     actually brings the count down - a knot that borders no void has
     nothing to open, and taking a stretch out of it would only put a
     notch where none was wanted. */
  const gaps = [];
  o.gaps = gaps;
  let budget = 14;
  for(const N of nodes){
    if(loops.length < 2 || gaps.length >= MAXCUT || budget <= 0) break;
    for(const g of trimFor(o, N)){
      if(budget-- <= 0) break;
      gaps.push(g);
      const after = march();
      if(after.length < loops.length){ loops = after; break; }
      gaps.pop();
    }
  }
  if(!gaps.length) o.gaps = null;
  o.live = null;
  if(loops.length < 2) return null;

  const f0 = fieldFn(o);
  const segs = liveSegs(o);
  loops.sort((a,b) => loopLen(b) - loopLen(a));
  const ext = inset + 0.06;                    // past the inset contour and out through the face
  const reach = strokeMM()*MM + 2*blendR() + 2.0;   // a node this void actually borders
  const wide  = strokeMM()*MM + 4*blendR() + 6.0;   // and not so wide it is a gash
  const cuts = [];
  let M = resampleClosed(loops[0], 0.08);
  for(let q=1; q<loops.length && cuts.length < MAXCUT; q++){
    const B = resampleClosed(loops[q], 0.08);
    if(B.length < 4) continue;
    let cut = null, knot = null, best = 1e30;
    for(const N of nodes){
      const ia = nearestTo(B, [N.x, N.y]);
      if(ia < 0 || Math.hypot(B[ia][0]-N.x, B[ia][1]-N.y) > reach) continue;
      const a0 = B[ia];
      /* Open air near the node, nearest first. The nearest of all is
         often straight across the knot - two arms, which would leave
         two drawings - so walk out until one lands that severs a
         single arm, and that one is the shortest that can. */
      const near = [];
      for(let i=0;i<M.length;i+=3){
        const L = Math.hypot(M[i][0]-a0[0], M[i][1]-a0[1]);
        if(L <= wide && L < best) near.push([L, i]);
      }
      near.sort((p,q) => p[0]-q[0]);
      for(let k=0; k<near.length && k<300; k++){
        const c = throughCut(a0, M[near[k][1]], ext);
        if(!c || armsCut(c, segs).n !== 1) continue;
        best = near[k][0]; cut = c; knot = N; break;
      }
    }
    if(!cut){
      const [bi, bj] = nearestPair(M, B);
      cut = throughCut(M[bi], B[bj], ext);
    }
    if(!cut) continue;
    const done = capCut(cut, segs, knot, f0);
    if(done) cuts.push(done);
    M = M.concat(B);                           // joined now, so the next void may cut to either
  }
  o.inlets = cuts.length ? cuts : null;
  return o.inlets;
}
function ribField(o){
  if(!o.field){ findInlets(o); o.field = fieldFn(o); }
  return o.field;
}
function ribAt(x, y){
  for(let i=S.ribs.length-1;i>=0;i--){
    const o = S.ribs[i];
    if(x < o.inner[0]-0.4 || x > o.inner[2]+0.4 || y < o.inner[1]-0.4 || y > o.inner[3]+0.4) continue;
    if(ribField(o)(x,y) < 0.06) return o;
  }
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   3 · GL — a baked field per ribbon, then one sphere trace
   The path can run to a thousand segments, which no ray march can
   afford to walk at every step. So the two-dimensional field is baked
   once per ribbon into a square of texels and read back as a smooth
   surface; the third dimension is only the depth off the wall, which
   is a slab, and costs nothing.

const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl2', { antialias:false, alpha:false, preserveDrawingBuffer:true });

const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0.0,1.0); }`;

/* ── the bake ──────────────────────────────────────────────────────
   Pass one is the plain distance to the drawn path. Pass two looks for
   the nearest stretch of the SAME path that is far enough along it to
   count as a different stretch, and the two are joined with a circular
   arc. That is what blends a curve that loops back on itself: where a
   scroll comes round beside its own tail the two surfaces grow a
   fillet into each other instead of crossing.
   The arc kernel returns min() exactly once the two are more than its
   radius apart, so a straight run never fattens - and pass two is only
   run at all where it could change the answer.                      */
const BAKE_FS = `#version 300 es
precision highp float;
uniform sampler2D uSeg;
uniform int uSegN;
uniform vec4 uBox;
uniform float uN, uHalf, uKR, uGap, uKnot, uCapS;
uniform vec4 uStop[8];    // the stretches taken out of the line
uniform int uStopN;
uniform vec4 uCut[8];     // the slot, end to end
uniform vec4 uCap[8];     // the two cap centres
uniform vec4 uCutK[8];    // (depth one side, depth the other, cap r, cap r)
uniform int uCutN;
out vec4 outColor;
/* How far apart two strands are along the line that is left. */
float sepS(float a, float b){
  float lo = min(a,b), hi = max(a,b), d = hi - lo;
  for(int i=0;i<uStopN;i++) d -= max(min(hi, uStop[i].y) - max(lo, uStop[i].x), 0.0);
  return d;
}
/* Is this strand the cap of a stopped end? Nothing is carried into
   one of those, or the kiss welds shut. */
bool atEnd(float u){
  for(int i=0;i<uStopN;i++)
    if(abs(u - uStop[i].x) < uCapS || abs(u - uStop[i].y) < uCapS) return true;
  return false;
}
void main(){
  vec2 uv = gl_FragCoord.xy/uN;
  vec2 p = mix(uBox.xy, uBox.zw, uv);
  float d1 = 1e9, s1 = 0.0;
  vec2 e1 = vec2(1.0, 0.0);
  for(int i=0;i<uSegN;i++){
    vec4 G = texelFetch(uSeg, ivec2(i,0), 0);
    vec2 v = G.zw - G.xy, w = p - G.xy;
    float L2 = dot(v,v);
    float t = L2 < 1e-12 ? 0.0 : clamp(dot(w,v)/L2, 0.0, 1.0);
    float d = length(w - v*t);
    if(d < d1){ d1 = d; vec4 L = texelFetch(uSeg, ivec2(i,1), 0); s1 = mix(L.x, L.y, t);
                e1 = L2 < 1e-12 ? e1 : v*inversesqrt(L2); }
  }
  float a = d1 - uHalf;
  float o = a;
  if(uKR > 1e-5 && a < uKR){
    float d2 = 1e9, s2 = 0.0;
    vec2 e2 = e1;
    for(int i=0;i<uSegN;i++){
      vec4 G = texelFetch(uSeg, ivec2(i,0), 0);
      vec2 v = G.zw - G.xy, w = p - G.xy;
      float L2 = dot(v,v);
      float t = L2 < 1e-12 ? 0.0 : clamp(dot(w,v)/L2, 0.0, 1.0);
      float d = length(w - v*t);
      if(d >= d2) continue;

      e2 = L2 < 1e-12 ? e2 : v*inversesqrt(L2);

       own small fillet in it, so the turn is still a turn. */
    float b = d2 - uHalf;
    float kr = (atEnd(s1) || atEnd(s2)) ? 0.0
             : uKR - (uKR - min(uKR, uKnot))
                     *smoothstep(0.20, 0.50, abs(e1.x*e2.y - e1.y*e2.x));

      vec2 u = max(vec2(kr-a, kr-b), 0.0);
      o = max(kr, min(a,b)) - length(u);
    }

     end is owed, so it finishes the way a drawn line finishes */
  for(int i=0;i<uCutN;i++){
    vec4 c = uCut[i], K = uCutK[i], P = uCap[i];
    vec2 v = c.zw - c.xy;
    float L = length(v);
    if(L < 1e-9) continue;
    vec2 e = v/L, nn = vec2(-e.y, e.x), w = p - c.xy;
    float u = dot(w,e), q = dot(w,nn);
    o = max(o, min(min(u, L-u), min(q + K.x, K.y - q)));
    if(K.z > 0.0) o = min(o, length(p - P.xy) - K.z);
    if(K.w > 0.0) o = min(o, length(p - P.zw) - K.w);
  }
  /* Green is the plain distance to the nearest strand, before any of
     that: what the bead itself is doing, with no fillet in it. The
     crown across the stroke is read from here, so where two strands
     cross you see the two of them cross - not a plateau standing in
     the middle of the knot where the blended field runs deep. */
  outColor = vec4(o, a, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
precision highp sampler2DArray;
uniform vec2 uRes;
uniform vec3 uRight, uUp, uFwd, uTarget;

vec2 fieldAt(int i, vec2 p){
  vec4 b = uBox[i];

function uncap(o){
  const h0 = inletHalf();
  for(const c of o.inlets){ c[8]=h0; c[9]=h0; c[10]=0; c[11]=0; }
  o.field = fieldFn(o); o.dirty = true; o.tp = null;
}
function ribbonToolpath(o, plain){
  if(o.segs.length < 2) return null;
  const f = ribField(o), inset = insetU(), box = o.box;
  const res = Math.max(96, Math.min(1600, Math.round((box[2]-box[0])/0.08)));
  let loops = isoLoops((x,y) => f(x,y) + inset, box[0], box[2], box[1], box[3], res)
                .filter(l => l.length > 6)
                .map(l => refineLoop(simplifyLoop(l, 0.005), f, inset))
                .filter(l => loopLen(l) > passOff()*8);
  if(!loops.length) return null;
  loops.sort((a,b) => loopLen(b) - loopLen(a));
  /* With the slits cut there is normally nothing left to splice: the
     voids are bays off the outside and the contour is already one
     loop. The splice stays as a backstop for anything the cut missed. */
  const st = stitchLoops(loops);
  let loop = st.bridges ? simplifyLoop(st.loop, 0.005) : st.loop;
  /* A cap is a nicety; one unbroken line is not. Where giving an end
     its round would walk the path back into itself - two stops at one
     knot, or a knot too tight to hold a disc - take the caps off and
     settle for the hairline. */
  if(!plain && capped(o) && selfGap(loop) < (strokeMM()*MM - 2*insetU())*0.65){
    uncap(o);
    return ribbonToolpath(o, true);
  }
  /* And the same bargain at a stop. A kiss is a nicety; a wall laid
     clear of its own bead is not. Where the round end sits so close
     to the strand it stops against that the two passes crowd, give
     the stop another half millimetre of air and look again. */
  if(!plain && o.gaps && (o.open || 0) < 0.2
     && selfGap(loop) < (strokeMM()*MM - 2*insetU())*0.72){
    o.open = (o.open || 0) + 0.05;
    o.inlets = null; o.gaps = null; o.live = null; o.field = null; o.tp = null; o.dirty = true;
    return ribbonToolpath(o, plain);
  }
  loop = startAt(loop, [o.pts[0].x, o.pts[0].y]);
  const layerU = S.layer*MM;
  const laps = Math.max(2, Math.round(o.depth/S.layer));
  const L = loopLen(loop) || 1;
  const path = [];
  for(const p of loop) path.push({ x:p[0], y:p[1], z:layerU });     // one flat lap down
  for(let k=1;k<laps;k++){
    const z0 = k*layerU;
    let acc = 0;
    for(let i=1;i<loop.length;i++){
      acc += Math.hypot(loop[i][0]-loop[i-1][0], loop[i][1]-loop[i-1][1]);
      path.push({ x:loop[i][0], y:loop[i][1], z:z0 + layerU*(acc/L) });
    }
  }
  return { path, loop, top:laps*layerU, laps, bridges:st.bridges,
           inlets:(o.inlets||[]).length, loops:loops.length, len:L };
}
const GC = { bedTemp:80, nozzleTemp:220, travelF:30000, retractF:1800, retract:1.70, ams:1 };

/* The line the nozzle walks: one closed loop, switchbacks and all.
   Kept on the ribbon, because contouring it is not a per-frame job. */
function ribPath(o){
  if(!o.tp){
    const t = ribbonToolpath(o);
    o.tp = t ? t.loop.map(p => ({ x:p[0], y:p[1] })) : [];
  }
  return o.tp.length ? o.tp : null;
}
function ribbonGcode(o, idx){
  const tp = ribbonToolpath(o);
  if(!tp) return null;
  const mm = u => u/MM;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const p of tp.loop){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
  const cx=(x0+x1)/2, cy=(y0+y1)/2, B=BUILD/2;
  const half = S.bead/2;
  const PX = p => B + mm(p.x - cx), PY = p => B + mm(p.y - cy);
  const area = passArea(), F = printFeed();
  const w = mm(x1-x0)+S.bead, d = mm(y1-y0)+S.bead, h = mm(tp.top);
  const L = [];
  L.push('; Malleable S1 - ribbon shelf ' + (idx+1) + ' of ' + S.ribs.length);
  L.push('; Mode: SPIRAL VASE | Nozzle mod: ' + S.bead.toFixed(1) + 'mm bead | Bambu Lab X1 Carbon');
  L.push('; The drawn stroke is ' + strokeMM().toFixed(1) + 'mm across: two ' + S.bead.toFixed(1)
       + 'mm beads overlapped by ' + S.lap.toFixed(1) + 'mm.');
  L.push('; One closed loop a lap carries both of them - out along one side at +'
       + (passOff()/MM).toFixed(2) + 'mm, round the cap, back at -' + (passOff()/MM).toFixed(2) + 'mm.');
  L.push('; bead ' + S.bead.toFixed(1) + ' x ' + S.layer.toFixed(2) + 'mm, pair lays '
       + lineArea(strokeMM()).toFixed(3) + 'mm^2 so each pass is ' + area.toFixed(3)
       + 'mm^2, flow capped at ' + S.flow + 'mm^3/s -> F' + F);
  L.push('; ' + tp.laps + ' laps, lap length ' + mm(tp.len).toFixed(0) + 'mm, footprint '
       + w.toFixed(1) + ' x ' + d.toFixed(1) + 'mm, shelf projects ' + h.toFixed(1) + 'mm off the wall');
  if(tp.inlets) L.push('; the drawing closes ' + tp.inlets + ' void' + (tp.inlets>1?'s':'')
       + ' - each is opened to the outside by a ' + S.inlet.toFixed(1)
       + 'mm slit, so the profile is one loop with no doubled wall: the path jogs in, '
       + 'round the bay and back out');
  if(tp.bridges) L.push('; WARNING: ' + tp.bridges + ' void' + (tp.bridges>1?'s':'')
       + ' could not be opened by a slit and had to be spliced with a doubled crossing '
       + (passOff()*2/MM).toFixed(2) + 'mm wide');
  if(w > BUILD || d > BUILD || h > BUILD) L.push('; WARNING: this shelf does not fit the ' + BUILD + 'mm cube');
  L.push('G90 ; absolute positioning');
  L.push('G21 ; mm units');
  L.push('M83 ; relative extrusion');
  L.push('M201 X20000 Y20000 Z500 E5000');
  L.push('M203 X500 Y500 Z20 E30');
  L.push('M204 P20000 R5000 T20000');
  L.push('M205 X9.00 Y9.00 Z3.00 E2.50');
  L.push('M106 S0 ; fan off for the first layer');
  L.push('M140 S' + GC.bedTemp + ' ; set bed temp');
  L.push('M104 S' + GC.nozzleTemp + ' ; set nozzle temp');
  L.push('M190 S' + GC.bedTemp + ' ; wait for bed');
  L.push('G28 ; home all axes');
  L.push('M975 S1 ; turn on vibration suppression');
  const AM = Math.round(GC.ams);
  if(AM > 0){
    L.push('G1 X60 F12000 ; approach AMS purge bay');
    L.push('G1 Y245');
    L.push('G1 Y265 F3000');
    L.push('M620 M');
    L.push('M620 S' + AM + 'A ; claim AMS slot ' + AM);
    L.push('M109 S' + GC.nozzleTemp);
    L.push('G1 X120 F12000');
    L.push('G1 X20 Y50 F12000');
    L.push('G1 Y-3');
    L.push('T' + AM + ' ; tool-select, which triggers the physical feed');
    L.push('G1 X54 F12000');
    L.push('G1 Y265');
    L.push('M400');
    L.push('M621 S' + AM + 'A ; release AMS claim');
  }
  L.push('; bed leveling skipped for this print (no G29 emitted)');
  L.push('M109 S' + GC.nozzleTemp + ' ; wait for nozzle temp');
  L.push('G92 E0');
  L.push('M975 S1 ; re-asserted before printing');
  L.push('G1 E-' + GC.retract.toFixed(2) + ' F' + GC.retractF + ' ; retract before prime move');
  L.push('G1 X18.000 Y1.000 Z' + (S.layer*0.6).toFixed(3) + ' F' + GC.travelF + ' ; prime line start');
  L.push('G1 E' + GC.retract.toFixed(2) + ' F' + GC.retractF + ' ; un-retract');
  L.push('G1 Z' + (S.layer*0.5).toFixed(3) + ' F' + GC.travelF);
  L.push('G1 X239.000 E' + (lineArea(S.bead)*221).toFixed(4) + ' F' + F + ' ; prime line leg 1');
  L.push('G1 Y12.000 E' + (lineArea(S.bead)*11).toFixed(4) + ' F' + Math.round(F/4) + ' ; prime line leg 2 (wipe)');
  L.push('G92 E0');
  L.push('M204 S500 ; first-layer acceleration');
  const first = tp.path[0];
  L.push('G1 X' + PX(first).toFixed(3) + ' Y' + PY(first).toFixed(3) + ' Z' + (S.layer*3).toFixed(3) + ' F' + GC.travelF + ' ; to the start of the loop');
  L.push('G1 Z' + mm(first.z).toFixed(3) + ' F' + GC.travelF);
  let fanOn = false, prev = first, total = 0, lastPct = -1;
  const n = tp.path.length;
  for(let i=1;i<n;i++){
    const p = tp.path[i];
    const ddx = mm(p.x-prev.x), ddy = mm(p.y-prev.y), ddz = mm(p.z-prev.z);
    const seg = Math.hypot(ddx, ddy, ddz);
    if(seg < 1e-4){ prev = p; continue; }
    total += seg;
    if(!fanOn && p.z > S.layer*1.5*MM){ L.push('M106 S255 ; part cooling fan'); fanOn = true; }
    L.push('G1 X' + PX(p).toFixed(3) + ' Y' + PY(p).toFixed(3) + ' Z' + mm(p.z).toFixed(3)
         + ' E' + (area*seg).toFixed(4) + ' F' + F);
    const pct = Math.floor(i/n*100);
    if(pct !== lastPct && pct%5 === 0){ L.push('M73 P' + pct); lastPct = pct; }
    prev = p;
  }
  L.push('; travels: 0');
  L.push('M73 P100 R0');
  L.push('M106 S0 ; fan off');
  L.push('G1 E-' + GC.retract.toFixed(2) + ' F' + GC.retractF + ' ; final retract');
  const zTop = mm(tp.top);
  L.push('G1 Z' + (zTop+10).toFixed(3) + ' F' + GC.travelF + ' ; park -- raise 10.0mm straight up in place (no XY move)');
  L.push('M104 S0 ; nozzle off');
  L.push('M140 S0 ; bed off');
  L.push('M106 S0 ; fan off');
  L.push('M17 S');
  L.push('M17 Z0.4 ; lower Z motor current before the final clearing move');
  const zClear = Math.min(zTop + 100, BUILD - 5);
  L.push('G1 Z' + zClear.toFixed(3) + ' F600 ; clear bed toward base of chamber');
  L.push('G1 Z' + (zClear-2).toFixed(3) + ' ; back off 2mm to relieve binding');
  L.push('M400 P100');
  L.push('M17 R ; restore normal Z motor current');
  L.push('M84 ; disable motors');
  L.push('; path length ' + total.toFixed(0) + 'mm, ' + (total*area/1000).toFixed(1) + 'cm^3');
  return L.join('\n') + '\n';
}
function exportGcode(){
  if(!S.ribs.length){ say('Nothing to slice'); return; }
  say('Slicing ' + S.ribs.length + ' shelf' + (S.ribs.length>1?'s':'') + '...');
  setTimeout(() => {
    let made = 0;
    S.ribs.forEach((o, i) => {
      setTimeout(() => {
        const g = ribbonGcode(o, i);
        if(g){ made++; download('malleable-s1-shelf' + (i+1) + '.gcode', new Blob([g], {type:'text/plain'})); }
        if(i === S.ribs.length-1) say(made ? made + ' gcode file' + (made>1?'s':'') + ' saved' : 'Nothing to slice');
      }, i*350);
    });
  }, 16);
}
/* The elevation as drawn, at full size: the outline of every stroke,
   which is the thing you would trace on the wall. */
function exportSVG(){
  if(!S.ribs.length){ say('Nothing to draw'); return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, body='';
  for(const o of S.ribs){
    const f = ribField(o), b = o.box;
    const res = Math.max(96, Math.min(1200, Math.round((b[2]-b[0])/0.1)));
    for(const l of isoLoops(f, b[0], b[2], b[1], b[3], res)){
      if(l.length < 6) continue;
      const s = simplifyLoop(l, 0.008);
      body += '<path d="M' + s.map(p => (p[0]/MM).toFixed(2) + ' ' + (-p[1]/MM).toFixed(2)).join('L') + 'Z"/>';
      for(const p of s){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,-p[1]); y1=Math.max(y1,-p[1]); }
    }
  }
  if(!body){ say('Nothing to draw'); return; }
  const m = 1;
  const X=(x0/MM)-m*10, Y=(y0)/MM-m*10, W=(x1-x0)/MM+m*20, H=(y1-y0)/MM+m*20;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W.toFixed(1) + 'mm" height="' + H.toFixed(1)
    + 'mm" viewBox="' + X.toFixed(1) + ' ' + Y.toFixed(1) + ' ' + W.toFixed(1) + ' ' + H.toFixed(1) + '">'
    + '<g fill="none" stroke="#000" stroke-width="0.4" fill-rule="evenodd">' + body + '</g></svg>';
  download('malleable-s1-elevation.svg', new Blob([svg], {type:'image/svg+xml'}));
  say('Elevation SVG saved at full size');
}

  const b = sect('Path');
  slider(b,'Blend',0,16,0.5, ()=>S.blend, v=>{S.blend=v; markAll();}, v=>v.toFixed(1)+'mm');
  slider(b,'Corner',0,45,1, ()=>S.corner, v=>{S.corner=v; rebuildAll(); markAll();}, v=>v+'mm');
  check(b,'Snap near-orthogonal runs', ()=>S.ortho, v=>{S.ortho=v; rebuildAll(); markAll();});
  if(S.ortho){
    slider(b,'Angle',3,25,1, ()=>S.orthoTol, v=>{S.orthoTol=v; rebuildAll(); markAll();}, v=>v+'°');
    slider(b,'Min run',8,60,1, ()=>S.runMin, v=>{S.runMin=v; rebuildAll(); markAll();}, v=>v+'mm');
  }
  b.appendChild(el('div','hint','A blend joins a curve to itself where it runs back alongside itself, so a scroll grows a fillet instead of a crease; where it crosses itself outright it is left alone, and the two strands meet in a corner. Corners are always rounded, snapped or not.'));

  const i = sect('Inlet');
  slider(i,'Clearance',0,14,0.5, ()=>S.inlet, v=>{S.inlet=v; markAll();}, v=>v ? v.toFixed(1)+'mm' : 'touching');
  const forced = S.ribs.reduce((t,o) => Math.max(t, o.open || 0), 0);
  const stop = S.ribs.reduce((t,o) => t + ((ribField(o), o.gaps) || []).length, 0);
  const cut  = S.ribs.reduce((t,o) => t + (o.inlets || []).length, 0);
  i.appendChild(el('div','hint', stop || cut
    ? [ stop ? stop + ' loop' + (stop>1?'s':'') + ' stopped short at the crossing that closed the void: '
             + 'the stretch comes out of the drawn line, so what is left ends in a semicircle of the '
             + 'stroke, the way a drawn line ends, a kiss clear of the arms it crossed.' : '',
        cut ? cut + ' slit' + (cut>1?'s':'') + ' cut through the wall, where nothing crosses and there '
            + 'was no stretch of line to take.' : '',
        forced ? 'One stop was opened a further ' + (forced/MM).toFixed(1) + 'mm: any closer and the two '
               + 'passes crowd each other where they pass.' : '' ].filter(Boolean).join(' ')
    : 'Nothing drawn here closes a void, so every profile is already one line. Loop a path back on '
      + 'itself and the void it traps gets opened at the crossing.'));

  const c = sect('Wall');
  slider(c,'Bead',1.5,8,0.1, ()=>S.bead, v=>{S.bead=v; markAll();}, v=>v.toFixed(1)+'mm');
  slider(c,'Layer',0.4,3,0.05, ()=>S.layer, v=>{S.layer=v;}, v=>v.toFixed(2)+'mm');
  slider(c,'Overlap',0,2,0.05, ()=>S.lap, v=>{S.lap=v; markAll();}, v=>v.toFixed(2)+'mm');
  c.appendChild(el('div','hint','Stroke ' + strokeMM().toFixed(1) + 'mm · two passes at ±'
    + (passOff()/MM).toFixed(2) + 'mm · ' + passArea().toFixed(2) + 'mm² each · F' + printFeed()));

  const d = sect('View');
  slider(d,'Bands',0,8,1, ()=>S.shade, v=>{S.shade=v;}, v=>v ? String(v) : 'off');
  slider(d,'Tone',0,1,0.02, ()=>S.tone, v=>{S.tone=v;}, v=>v.toFixed(2));
  slider(d,'Ambient',0,0.6,0.02, ()=>S.ambient, v=>{S.ambient=v;}, v=>v.toFixed(2));
  slider(d,'Seam',0,1,0.05, ()=>S.seam, v=>{S.seam=v;}, v=>v.toFixed(2));
  slider(d,'Relief',0,1.6,0.05, ()=>S.relief, v=>{S.relief=v;}, v=>v.toFixed(2));
  slider(d,'Roll',0,2.4,0.05, ()=>S.roll, v=>{S.roll=v;}, v=>v.toFixed(2)+'mm');
  slider(d,'Crown',0,0.6,0.02, ()=>S.crown, v=>{S.crown=v;}, v=>v.toFixed(2)+'mm');
  check(d,'Wall plane', ()=>S.wall, v=>{S.wall=v;});
  check(d,'Crease lines', ()=>S.edges, v=>{S.edges=v;});
  check(d,'Toolpath only', ()=>S.path, v=>{S.path=v;});
  check(d,'Build volume', ()=>S.plate, v=>{S.plate=v;});
  check(d,'Hold the view', ()=>S.hold, v=>{S.hold=v; if(!v){ S.az = 0; S.el = 0; } });
  check(d,'Dark', ()=>S.invert, setInvert);

  const e = sect('Export');
  const g2 = el('div','grid2'); e.appendChild(g2);
  button(g2,'GCODE', exportGcode);
  button(g2,'SVG', exportSVG);
  const g3 = el('div','grid2'); e.appendChild(g3);
  button(g3,'PNG', exportPNG);
  button(g3,'Fit', () => { fitView(); say('Fit'); });
  e.appendChild(el('div','hint','One file a shelf. The drawing is the toolpath: it lies on the bed and the depth off the wall is the print height, climbing in one unbroken spiral.'));

  const f = sect('Start');
  const g5 = el('div','grid2'); f.appendChild(g5);
  button(g5,'Clear', clearAll);
  f.appendChild(el('div','hint','Place the shelf with the control points or the line tool. The drawing is the part.'));

  const g = sect('Caption');
  [['cap1',S.cap1],['cap2',S.cap2],['cap3',S.cap3]].forEach(([k,v]) => {
    const i = document.createElement('input');
    i.className='txt'; i.value=v; i.oninput = () => { S[k] = i.value; };
    g.appendChild(i);
  });
}

/* ══════════════════════════════════════════════════════════════════
   10 · SYNC + FRAME
   ══════════════════════════════════════════════════════════════════ */
function fitView(){
  if(!S.ribs.length){ S.tx=0; S.ty=0; S.tz=5; S.scale=52; return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,dm=0;
  for(const o of S.ribs){
    x0=Math.min(x0,o.inner[0]); x1=Math.max(x1,o.inner[2]);
    y0=Math.min(y0,o.inner[1]); y1=Math.max(y1,o.inner[3]);
    dm = Math.max(dm, o.depth*MM);
  }
  S.tx=(x0+x1)/2; S.ty=(y0+y1)/2; S.tz=dm/2;
  S.scale = Math.max(10, Math.min(260, Math.max(x1-x0, (y1-y0)*1.25) + 6));
}
function sync(){
  document.getElementById('st-n').textContent = S.ribs.length;
  let over = 0;
  for(const o of S.ribs){ const s = ribSize(o); if(s.w>BUILD || s.h>BUILD || s.d>BUILD) over++; }
  document.getElementById('st-fit').textContent = over ? over + ' OVER ' + BUILD + 'mm' : '';
  buildPanel();
}
let prev = performance.now(), fAcc = 0, fN = 0;
const ease = (c,t,dt,tau) => c + (t-c)*(1 - Math.exp(-dt/tau));
function frame(t){
  const dt = Math.min(0.05, (t-prev)/1000) || 0.016;
  prev = t;
  fAcc += dt; fN++;
  if(fAcc > 0.5){
    document.getElementById('perf').textContent = Math.round(fN/fAcc) + ' fps / ' + S.ribs.length + ' shelves';
    fAcc = 0; fN = 0;
  }
  resize();
  /* Off axis the view follows the hand; let go and it takes its time
     coming back to the elevation, which is where the drawing lives. */
  const tau = (drag && drag.kind === 'tilt') ? 0.05 : 0.20;
  A.az = ease(A.az, S.az, dt, tau);
  A.el = ease(A.el, S.el, dt, tau);
  A.scale = ease(A.scale, S.scale, dt, 0.07);
  A.tx = ease(A.tx, S.tx, dt, 0.07);
  A.ty = ease(A.ty, S.ty, dt, 0.07);
  A.tz = ease(A.tz, S.tz, dt, 0.07);
  A.pitch = ease(A.pitch, S.layer*MM, dt, 0.09);
  const off = Math.hypot(A.az, A.el) > 0.012;
  document.getElementById('st-view').textContent = off ? 'OFF AXIS' : 'ELEVATION';
  try{ draw(); overlay(); rulers(); }
  catch(err){ if(!frame.cried){ frame.cried = true; console.error(err); say('Something went wrong drawing that frame'); } }
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════
   11 · KEYBOARD
   ══════════════════════════════════════════════════════════════════ */
const KEYMAP = { v:'select', c:'curve', l:'line', r:'tilt', h:'hand', z:'zoom' };
// keys a focused range / checkbox / button is entitled to keep for itself
const WIDGET_KEYS = new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
                             'Home','End','PageUp','PageDown','Enter',' ','Spacebar']);
addEventListener('keydown', e => {
  const t    = e.target || document.body;
  const tag  = (t.tagName||'').toLowerCase();
  const type = (t.type||'').toLowerCase();
  // a slider, a tickbox or a button holds focus after you click it - only a text
  // field has any claim on a letter key, so only a text field stops a shortcut
  const widget = tag === 'button' ||
                 (tag === 'input' && (type === 'range' || type === 'checkbox' || type === 'radio'));
  if(t.isContentEditable || tag === 'textarea' || (tag === 'input' && !widget)) return;
  if(widget && WIDGET_KEYS.has(e.key)) return;
  if(e.code === 'Space'){ spaceDown = true; viewEl.style.cursor = 'grab'; e.preventDefault(); return; }
  if(e.metaKey || e.ctrlKey){
    const k = e.key.toLowerCase();
    if(k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if(k === 'd'){ e.preventDefault(); duplicateSel(); }
    else if(k === 'a'){ e.preventDefault(); S.sel = new Set(S.ribs.map(o=>o.id)); sync(); }
    return;
  }
  if(e.key === 'Enter'){ if(poly){ e.preventDefault(); polyFinish(); } return; }
  if(e.key === 'Escape'){ if(poly){ poly = null; sync(); } else { S.sel.clear(); sync(); } return; }
  if(e.key === 'Delete' || e.key === 'Backspace'){
    e.preventDefault();
    if(poly && poly.pts.length > 1){ poly.pts.pop(); return; }
    deleteSel(); return;
  }
  const k = e.key.toLowerCase();
  if(KEYMAP[k]){ setTool(KEYMAP[k]); return; }
  if(k === 'f'){ fitView(); say('Fit'); return; }
});
addEventListener('keyup', e => {
  if(e.code === 'Space'){ spaceDown = false; viewEl.style.cursor = CURSOR[S.tool] || 'crosshair'; }
});
addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button, input[type=checkbox]');
  if(b) b.blur();            // so Space and Enter go back to the drawing, not to the last thing clicked
});
document.getElementById('drawer').onclick = () => panel.classList.toggle('open');

/* ══════════════════════════════════════════════════════════════════
   12 · BOOT
   ══════════════════════════════════════════════════════════════════ */
resize();
document.documentElement.setAttribute('data-theme','light');
setTool('curve');
fitView();
A.scale = S.scale; A.tx = S.tx; A.ty = S.ty; A.tz = S.tz; A.pitch = S.layer*MM;
snap(); sync(); buildOpts();


requestAnimationFrame(frame);

})();
</script>
