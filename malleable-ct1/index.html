// @end
function sweep(solid, along, halfLen){
  const wx = solid + PIPE, wy = along - Math.max(halfLen - PIPE, 0);
  return Math.min(Math.max(wx, wy), 0) + Math.hypot(Math.max(wx,0), Math.max(wy,0)) - PIPE;
}
function deckJS(p, zc){
  return sweep(pathDeck(p[1], p[2], zc), Math.abs(p[0]), S.Lx*0.5);
}
function legsJS(p){
  const qx = (S.Lx*0.5 + JOINT + PIPE) - Math.abs(p[0]);
  const d = pathLeg(qx, p[2], zShelf());
  return sweep(d, Math.abs(p[1]), Math.max(S.Ly*0.5 + LEGDEEP*0.5, 0));
}
function sdJS(p){
  return Math.min(legsJS(p), Math.min(deckJS(p, zTop()), deckJS(p, zShelf())));
}
function normalJS(p){
  const e = 0.6;
  const dx = sdJS([p[0]+e,p[1],p[2]]) - sdJS([p[0]-e,p[1],p[2]]);
  const dy = sdJS([p[0],p[1]+e,p[2]]) - sdJS([p[0],p[1]-e,p[2]]);
  const dz = sdJS([p[0],p[1],p[2]+e]) - sdJS([p[0],p[1],p[2]-e]);
  const l = Math.hypot(dx,dy,dz) || 1;
  return [dx/l, dy/l, dz/l];
}

/* ══════════════════════════════════════════════════════════════════
   3 · CAMERA
   ══════════════════════════════════════════════════════════════════ */
function basisOf(az, el){
  const ce = Math.cos(el), se = Math.sin(el);
  const eye = [ce*Math.sin(az), -ce*Math.cos(az), se];
  const fwd = [-eye[0], -eye[1], -eye[2]];
  let rx = fwd[1], ry = -fwd[0], rz = 0;
  const L = Math.hypot(rx,ry,rz) || 1; rx/=L; ry/=L; rz/=L;
  const ux = ry*fwd[2] - rz*fwd[1], uy = rz*fwd[0] - rx*fwd[2], uz = rx*fwd[1] - ry*fwd[0];
  return { right:[rx,ry,rz], up:[ux,uy,uz], fwd, eye };
}
const basis = () => basisOf(A.az, A.el);
const viewEl = document.getElementById('view');
const ovEl = document.getElementById('ov');
let vw = 0, vh = 0, fitted = false;
function resize(){
  const r = viewEl.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  vw = r.width; vh = r.height;
  const w = Math.max(1, Math.round(r.width*dpr)), h = Math.max(1, Math.round(r.height*dpr));
  if(cvs.width !== w || cvs.height !== h){ cvs.width = w; cvs.height = h; }
  ovEl.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
  /* The first fit has to wait for the viewport to have a size. Opened
     into a pane that is still laying itself out - or a narrow one on a
     phone - the figures are there but the paper is not, and the table
     is framed against nothing. Frame it again the moment there is
     something to frame it in. */
  if(!fitted && vw > 1 && vh > 1){
    fitted = true;
    fitView();
    A.scale = S.scale; A.tx = S.tx; A.ty = S.ty; A.tz = S.tz;
  }
}
function themeColors(){
  const cs = getComputedStyle(document.documentElement);
  const toRGB = v => { v = v.trim();
    return v.startsWith('#') ? [parseInt(v.slice(1,3),16)/255, parseInt(v.slice(3,5),16)/255, parseInt(v.slice(5,7),16)/255] : [0,0,0]; };
  /* The page's ink is whatever a mark is made in, which goes pale the
     moment a finish floods the plate. The render's ink is the far end
     of the light and has to stay the dark one, or the shadow under the
     part comes out brighter than the floor. When a finish is on, tint.js
     hands us a second pair for exactly that. */
  const pick = (a, b) => { const v = cs.getPropertyValue(a).trim(); return v || cs.getPropertyValue(b); };
  return { ink: toRGB(pick('--render-ink', '--ink')), paper: toRGB(pick('--render-paper', '--paper')) };
}
function draw(){
  if(!ok) return;
  const b = basis(), c = themeColors();
  gl.viewport(0,0,cvs.width,cvs.height);
  gl.useProgram(prog);
  gl.uniform2f(uni.uRes, cvs.width, cvs.height);
  gl.uniform3fv(uni.uRight, b.right);
  gl.uniform3fv(uni.uUp, b.up);
  gl.uniform3fv(uni.uFwd, b.fwd);
  gl.uniform3f(uni.uTarget, A.tx, A.ty, A.tz);
  gl.uniform1f(uni.uScale, A.scale);
  const px = A.scale/Math.max(1, cvs.height);
  gl.uniform1f(uni.uPix, px);
  gl.uniform1f(uni.uLx, S.Lx);
  gl.uniform1f(uni.uLy, S.Ly);
  gl.uniform1f(uni.uH, S.H);
  gl.uniform1f(uni.uZt, zTop());
  gl.uniform1f(uni.uZs, zShelf());
  /* a rib finer than a couple of pixels is only moire, so the bead
     fades out as the layer approaches the pixel */
  const pitchPx = LAYER/Math.max(px, 1e-6);
  const fade = clamp((pitchPx - 1.6)/3, 0, 1);
  const relief = 0.34*fade;
  gl.uniform1f(uni.uPitch, LAYER);
  gl.uniform1f(uni.uRelief, relief);
  const stride = relief > 1e-5 ? 0.72 : 0.88;
  gl.uniform1f(uni.uStepK, stride);
  gl.uniform1i(uni.uSteps, Math.max(64, Math.min(320, Math.round((dragging ? 170 : 240)/stride))));
  gl.uniform3fv(uni.uInk, c.ink);
  gl.uniform3fv(uni.uPaper, c.paper);
  gl.uniform4fv(uni.uMat, finMat(S.col));
  gl.clearColor(c.paper[0], c.paper[1], c.paper[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function rayFor(sx, sy){
  const b = basis();
  const ux = (sx - vw/2)/vh, uy = -(sy - vh/2)/vh;
  return { o:[ A.tx + b.right[0]*ux*A.scale + b.up[0]*uy*A.scale - b.fwd[0]*4000,
               A.ty + b.right[1]*ux*A.scale + b.up[1]*uy*A.scale - b.fwd[1]*4000,
               A.tz + b.right[2]*ux*A.scale + b.up[2]*uy*A.scale - b.fwd[2]*4000 ],
           d: b.fwd };
}
function cast(sx, sy){
  const r = rayFor(sx, sy);
  let t = 0;
  for(let i=0;i<200;i++){
    const p = [r.o[0]+r.d[0]*t, r.o[1]+r.d[1]*t, r.o[2]+r.d[2]*t];
    const d = sdJS(p);
    if(d < 0.4) return { p, t };
    t += Math.max(d*0.85, 0.4);
    if(t > 12000) break;
  }
  return null;
}
function pxPer(axis){
  const b = basis();
  const u = (axis[0]*b.right[0] + axis[1]*b.right[1] + axis[2]*b.right[2])/A.scale*vh;
  const v = -(axis[0]*b.up[0] + axis[1]*b.up[1] + axis[2]*b.up[2])/A.scale*vh;
  return { x:u, y:v, n:u*u + v*v };
}

/* ══════════════════════════════════════════════════════════════════
   4 · VIEW
   ══════════════════════════════════════════════════════════════════ */
/* Whether the view is where the person put it or where we last put
   it. Turning the phone, or the address bar sliding away, changes the
   paper under a framing we chose - so re-frame it, unless they have
   zoomed or panned since, in which case leave their view alone. */
let userFramed = false;
function fitView(){
  userFramed = false;
  const b = basisOf(S.az, S.el);
  const hx = S.Lx/2 + JOINT + LEGT, hy = S.Ly/2;
  const cz = S.H*0.52;
  S.tx = 0; S.ty = 0; S.tz = cz;
  let mu = 1, mv = 1;
  for(const sx of [-1,1]) for(const sy of [-1,1]) for(const z of [0, S.H]){
    const rx = sx*hx, ry = sy*hy, rz = z - cz;
    mu = Math.max(mu, Math.abs(rx*b.right[0] + ry*b.right[1] + rz*b.right[2]));
    mv = Math.max(mv, Math.abs(rx*b.up[0] + ry*b.up[1] + rz*b.up[2]));
  }
  const aspect = Math.max(0.4, vw/Math.max(vh,1));
  S.scale = Math.max(2*mv, 2*mu/aspect)*1.34 + 90;
}
function turnTo(az, el){
  let want = az;
  while(want - S.az >  Math.PI) want -= 2*Math.PI;
  while(want - S.az < -Math.PI) want += 2*Math.PI;
  S.az = want; S.el = el;
  fitView(); sync();
}
function goFace(f){ S.face = f; S.plan = false; turnTo(FACES[f].az*RAD, 0); }
function goPlan(){ S.face = null; S.plan = true; turnTo(S.az, 89*RAD); }
function atIso(){
  let d = S.az - 45*RAD;
  d -= Math.round(d/(2*Math.PI))*2*Math.PI;
  return Math.abs(d) < 0.02 && Math.abs(S.el - 35.264*RAD) < 0.02;
}
function goIso(){ S.face = null; S.plan = false; turnTo(45*RAD, 35.264*RAD); }

/* ══════════════════════════════════════════════════════════════════
   5 · HISTORY
   ══════════════════════════════════════════════════════════════════ */
let hist = [], hi = -1;
const stateNow = () =>
  JSON.stringify({ H:S.H, Lx:S.Lx, Ly:S.Ly, drop:S.drop, col:S.col });
function snap(){
  const s = stateNow();
  if(hi >= 0 && hist[hi] === s) return;
  hist = hist.slice(0, hi+1); hist.push(s);
  if(hist.length > 60) hist.shift();
  hi = hist.length-1;
}
function restore(i){
  if(i < 0 || i >= hist.length) return;
  const o = JSON.parse(hist[i]);
  S.H = o.H; S.Lx = o.Lx; S.Ly = o.Ly; S.drop = o.drop;
  if(o.col !== S.col){
    S.col = o.col || null;
    if(window.Finish) window.Finish.set(S.col);
  }
  hi = i; sync();
}
const undo = () => { if(hi > 0){ restore(hi-1); say('Undo'); } };
const redo = () => { if(hi < hist.length-1){ restore(hi+1); say('Redo'); } };

/* ══════════════════════════════════════════════════════════════════
   6 · THE TABLE IS THE HANDLE
   Four figures, each of them a surface you can take hold of. The
   loops stop at 12 and 48 inches both ways, the legs the same, and
   the shelf runs in a window: never closer than six inches under the
   top's centreline, never lower than two inches off the floor.
   ══════════════════════════════════════════════════════════════════ */
/* What the trade settles on, in inches. A coffee table sits a couple
   under the seat beside it; a side table comes up level with the arm;
   a desk is the 29-30 everything is built to; dining is 30; a console
   is hall height and shallow at 18 deep.

   The shelf is given as a height off the floor, which is how anyone
   thinks about it - except where a chair has to go under, and then it
   is given as a drop below the top instead ('top'), because what
   matters there is that it is tucked up out of the way. A shelf four
   inches off the floor stops a chair ever reaching the table. */
const PRESETS = [
  ['Coffee',  17,   48, 24,  5],
  ['Side',    24,   20, 20,  8],
  ['Desk',    29.5, 48, 24,  6, 'top'],
  ['Dining',  30,   48, 36,  6, 'top'],
  ['Console', 31,   48, 18, 12]
];
/* where the preset wants the shelf, as a height off the floor */
const presetShelf = p => p[5] === 'top' ? zTop() - p[4]*IN : p[4]*IN;
function applyPreset(p){
  S.H  = clamp(p[1]*IN, HMIN, HMAX);
  S.Lx = clamp(p[2]*IN, LMIN, LMAX);
  S.Ly = clamp(p[3]*IN, LMIN, LMAX);
  S.drop = clamp(zTop() - presetShelf(p), DROPMIN, dropMax());
  snap(); fitView(); sync();
  say(p[0] + ' · ' + p[1] + ' × ' + p[2] + ' × ' + p[3] + ' in');
}
const presetOn = p =>
  Math.abs(S.H - p[1]*IN) < 0.7 && Math.abs(S.Lx - p[2]*IN) < 0.7 &&
  Math.abs(S.Ly - p[3]*IN) < 0.7 && Math.abs(zShelf() - presetShelf(p)) < 0.7;

const DIMS = {
  H:  { label:'Height' },
  Lx: { label:'Length' },
  Ly: { label:'Depth'  },
  Z:  { label:'Shelf'  }
};
function setDim(k, v){
  if(k === 'H'){
    S.H = clamp(v, HMIN, HMAX);
    if(v > S.H + 0.5) say('48 in');
    else if(v < S.H - 0.5) say('12 in');
    /* the legs got shorter under the shelf; it cannot stay where it was */
    const d = clamp(S.drop, DROPMIN, dropMax());
    if(Math.abs(d - S.drop) > 0.01){ S.drop = d; say('the shelf came up with the top'); }
  } else if(k === 'Lx' || k === 'Ly'){
    S[k] = clamp(v, LMIN, LMAX);
    if(v > S[k] + 0.5) say('48 in');
    else if(v < S[k] - 0.5) say('12 in');
  } else {
    /* the shelf is given as a height off the floor and kept as a drop
       below the top, so raising the table lifts the shelf with it */
    const want = zTop() - v;
    S.drop = clamp(want, DROPMIN, dropMax());
    if(want < DROPMIN - 0.5) say('the shelf keeps 6 in under the top');
    else if(want > dropMax() + 0.5) say('the shelf stops 2 in off the floor');
  }
}
const dimVal = k => k === 'Z' ? zShelf() : S[k];

/* ══════════════════════════════════════════════════════════════════
   7 · POINTER
   ══════════════════════════════════════════════════════════════════ */
let drag = null, dragging = false, spaceDown = false;

/* which piece the hand is on, and so which figure comes with it: a
   face that looks sideways belongs to the loop it is the edge of, a
   face that looks up or down belongs to whatever is resting on it -
   the top carries the legs, the shelf only carries itself. */
function grabAt(sx, sy){
  const h = cast(sx, sy);
  if(!h) return null;
  const p = h.p, n = normalJS(p);
  const dLeg = legsJS(p), dTop = deckJS(p, zTop()), dShelf = deckJS(p, zShelf());
  const part = (dShelf < dTop && dShelf < dLeg) ? 'shelf' : (dTop < dLeg ? 'top' : 'leg');
  const ax = Math.abs(n[0]), ay = Math.abs(n[1]), az = Math.abs(n[2]);
  let g;
  if(az >= ax && az >= ay){
    g = part === 'shelf'
      ? { key:'Z',  axis:[0,0,1], gain:1, faceKey:null }
      : { key:'H',  axis:[0,0,1], gain:1, faceKey:null };
  } else if(ax >= ay){
    g = { key:'Lx', axis:[p[0] >= 0 ? 1 : -1, 0, 0], gain:2, faceKey:p[0] >= 0 ? 'R' : 'L' };
  } else {
    g = { key:'Ly', axis:[0, p[1] >= 0 ? 1 : -1, 0], gain:2, faceKey:p[1] >= 0 ? 'B' : 'F' };
  }
  /* a face pointing straight at the camera has nowhere on the paper
     to be pulled to, so it is not a handle from here - turn first */
  const b = basis();
  const head = Math.abs(g.axis[0]*b.fwd[0] + g.axis[1]*b.fwd[1] + g.axis[2]*b.fwd[2]);
  g.pull = head < 0.90;
  g.part = part;
  g.p = p;
  return g;
}

viewEl.addEventListener('pointerdown', e => {
  if(e.button === 1 || spaceDown){
    drag = { kind:'pan', sx:e.clientX, sy:e.clientY, tx:S.tx, ty:S.ty, tz:S.tz };
    dragging = true; viewEl.setPointerCapture(e.pointerId); return;
  }
  if(e.button !== 0) return;
  const r = viewEl.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  viewEl.setPointerCapture(e.pointerId);
  const g = grabAt(sx, sy);
  if(g && g.pull){
    drag = { kind:'pull', key:g.key, gain:g.gain, faceKey:g.faceKey, part:g.part,
             sx:e.clientX, sy:e.clientY, v0:dimVal(g.key), pp:pxPer(g.axis), moved:0 };
  } else {
    drag = { kind:'orbit', sx:e.clientX, sy:e.clientY, az:S.az, el:S.el, moved:0,
             on:!!g, faceKey:g ? g.faceKey : null };
  }
  dragging = true;
});

addEventListener('pointermove', e => {
  if(!drag) return;
  if(drag.kind === 'pull'){
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    if(drag.moved > 3){
      const pp = drag.pp;
      const world = pp.n > 1e-9 ? (dx*pp.x + dy*pp.y)/pp.n : 0;
      setDim(drag.key, drag.v0 + world*drag.gain);
      sync();
    }
    return;
  }
  if(drag.kind === 'pan'){
    userFramed = true;
    const b = basis();
    const k = A.scale/Math.max(vh,1);
    const dx = -(e.clientX - drag.sx)*k, dy = (e.clientY - drag.sy)*k;
    S.tx = drag.tx + b.right[0]*dx + b.up[0]*dy;
    S.ty = drag.ty + b.right[1]*dx + b.up[1]*dy;
    S.tz = drag.tz + b.right[2]*dx + b.up[2]*dy;
    return;
  }
  if(drag.kind === 'orbit'){
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    if(drag.moved > 3){
      if(S.face || S.plan){ S.face = null; S.plan = false; sync(); }
      S.az = drag.az + dx*0.008;
      S.el = clamp(drag.el + dy*0.006, -8*RAD, 88*RAD);
    }
    return;
  }
});

addEventListener('pointerup', () => {
  if(!drag){ dragging = false; return; }
  /* a press that did not travel is not a pull - it is you saying you
     want to look at that face square on */
  if(drag.moved !== undefined && drag.moved <= 3 && (drag.kind === 'pull' ? true : drag.on)){
    if(drag.faceKey) goFace(drag.faceKey); else goPlan();
  }
  else if(drag.kind === 'pull'){ if(drag.moved > 3) snap(); }
  drag = null; dragging = false;
  setCursor(); sync();
});

let hoverAt = 0;
viewEl.addEventListener('pointermove', e => {
  if(drag || spaceDown) return;
  const now = performance.now();
  if(now - hoverAt < 55) return;
  hoverAt = now;
  const r = viewEl.getBoundingClientRect();
  const g = grabAt(e.clientX - r.left, e.clientY - r.top);
  viewEl.style.cursor = !g ? 'grab' : g.pull ? pullCursor(g.axis) : 'pointer';
});
viewEl.addEventListener('pointerleave', () => { if(!drag) setCursor(); });
viewEl.addEventListener('wheel', e => {
  e.preventDefault();
  userFramed = true;
  S.scale = clamp(S.scale*Math.exp(e.deltaY*0.0014), 120, 9000);
}, { passive:false });
/* The pointer should say which way a face will travel, not just that
   it travels. One glyph - a bar for the face with the axis drawn
   through it - turned to lie along the way that face actually moves on
   the paper, which depends on where the table is turned to. Carries a
   white backing so it reads on the plate and on the shadow alike. */
const curves = new Map();
function pullCursor(axis){
  const pp = pxPer(axis);
  if(pp.n < 1e-9) return 'pointer';
  let a = Math.atan2(pp.y, pp.x)*180/Math.PI;
  a = ((a % 180) + 180) % 180;                 // the glyph reads the same both ways
  const key = Math.round(a/5)*5;
  let c = curves.get(key);
  if(!c){
    const g = '<path d="M16 5v22"/>' +
              '<path d="M10 16H3.4M6.4 12.8 3.2 16l3.2 3.2"/>' +
              '<path d="M22 16h6.6M25.6 12.8 28.8 16l-3.2 3.2"/>';
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">' +
      '<g transform="rotate(' + key + ' 16 16)" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
      '<g stroke="#fff" stroke-width="3.6" opacity=".9">' + g + '</g>' +
      '<g stroke="#000" stroke-width="1.5">' + g + '</g></g></svg>';
    c = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '") 16 16, move';
    curves.set(key, c);
  }
  return c;
}
function setCursor(){ viewEl.style.cursor = 'grab'; }

/* ══════════════════════════════════════════════════════════════════
   8 · RULERS
   ══════════════════════════════════════════════════════════════════ */
const LADDER = [1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000];
function rulers(){
  const rh = document.getElementById('rulerH'), rv = document.getElementById('rulerV');
  const b = basis();
  const wpp = A.scale/Math.max(vh,1);
  let step = LADDER[LADDER.length-1];
  for(const s of LADDER) if(s/wpp >= 56){ step = s; break; }
  const ppu = 1/wpp;
  const o0 = A.tx*b.right[0] + A.ty*b.right[1] + A.tz*b.right[2];
  const o1 = A.tx*b.up[0]    + A.ty*b.up[1]    + A.tz*b.up[2];
  let h = '', k0 = Math.floor((o0 - vw/2*wpp)/step), k1 = Math.ceil((o0 + vw/2*wpp)/step);
  for(let k=k0;k<=k1;k++){
    const x = vw/2 + (k*step - o0)*ppu;
    if(x < -40 || x > vw + 40) continue;
    h += '<line x1="'+x.toFixed(1)+'" y1="11" x2="'+x.toFixed(1)+'" y2="18" stroke="rgba(0,0,0,.34)" stroke-width="1"/>';
    h += '<text x="'+(x+2.5).toFixed(1)+'" y="9" font-size="8.5" font-family="var(--font)" fill="rgba(0,0,0,.34)">'+(k*step)+'</text>';
  }
  rh.innerHTML = h;
  let v = '', m0 = Math.floor((o1 - vh/2*wpp)/step), m1 = Math.ceil((o1 + vh/2*wpp)/step);
  for(let k=m0;k<=m1;k++){
    const y = vh/2 - (k*step - o1)*ppu;
    if(y < -40 || y > vh + 40) continue;
    v += '<line x1="11" y1="'+y.toFixed(1)+'" x2="18" y2="'+y.toFixed(1)+'" stroke="rgba(0,0,0,.34)" stroke-width="1"/>';
    v += '<text x="9" y="'+(y-2.5).toFixed(1)+'" font-size="8.5" font-family="var(--font)" fill="rgba(0,0,0,.34)" text-anchor="end" transform="rotate(-90 9 '+(y-2.5).toFixed(1)+')">'+(k*step)+'</text>';
  }
  rv.innerHTML = v;
}

/* ══════════════════════════════════════════════════════════════════
   9 · OUT
   A front elevation, drawn the way the part was drawn: the two legs,
   the two tubes between them, and the figures off to the side.
   ══════════════════════════════════════════════════════════════════ */
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function savePNG(){
  draw();
  cvs.toBlob(b => { if(b){ download('malleable-ct1.png', b); say('PNG out'); } }, 'image/png');
}
/* ── The sheet's palette ────────────────────────────────────────────
   The page goes a muted wash of the chosen pigment; the sheet goes the
   other way and floods the whole thing with the room that pigment is
   sitting in - a deep, nearly black version of the same hue, so the
   part is the only thing on the page at full strength. Raw gets the
   same sheet in grey, because a drawing with no finish on it still
   needs a ground to sit on. */
function sheetPal(hex){
  if(!hex) return {
    bg:'#121214', pool:'#1c1c20', part:'#d8d8dc', top:'#ececf0', side:'#b4b4bb',
    end:'#90909a', line:'#f4f4f6', dim:'#a2a2ab', text:'#f4f4f6', faint:'#6a6a74',
    name:'Raw' };
  const r = parseInt(hex.slice(1,3),16)/255,
        g = parseInt(hex.slice(3,5),16)/255,
        b = parseInt(hex.slice(5,7),16)/255;
  const sm = (x, a, b) => { const t = Math.max(0, Math.min(1, (x-a)/(b-a))); return t*t*(3-2*t); };
  /* the pigment's apparent lightness, not its hsl one - a saturated
     blue at 31% reads nearly black and has to be treated as such */
  const okL = (R, G, B) => {
    const f = u => u <= 0.04045 ? u/12.92 : Math.pow((u+0.055)/1.055, 2.4);
    R = f(R); G = f(G); B = f(B);
    return 0.2104542553*Math.cbrt(0.4122214708*R + 0.5363325363*G + 0.0514459929*B)
         + 0.7936177850*Math.cbrt(0.2119034982*R + 0.6806995451*G + 0.1073969566*B)
         - 0.0040720468*Math.cbrt(0.0883024619*R + 0.2817188376*G + 0.6299787005*B);
  };
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2, d = mx - mn;
  let h = 0, sa = 0;
  if(d > 1e-6){
    sa = d/(1 - Math.abs(2*l - 1));
    h = mx === r ? ((g-b)/d + (g < b ? 6 : 0)) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4;
    h *= 60;
  }
  const S0 = sa*100;                       // the pigment's own saturation
  const SC = Math.min(S0, 72);             // and a cooled one, for the chrome
  const hsl = (sv, lv) => 'hsl(' + h.toFixed(1) + ',' + Math.max(sv,0).toFixed(1) +
                          '%,' + Math.min(Math.max(lv,0),100).toFixed(1) + '%)';
  /* The sheet is the same room as the plate, worked out the same way:
     the ground goes opposite the part in value, so a dark pigment is
     drawn dark on a pale sheet and a pale one pale on a dim sheet. */
  const hsl2rgb = (sv, lv) => {
    const S = Math.max(sv,0)/100, L = Math.min(Math.max(lv,0),100)/100;
    const C = (1 - Math.abs(2*L - 1))*S, hh = ((h % 360) + 360) % 360;
    const X = C*(1 - Math.abs((hh/60) % 2 - 1)), M = L - C/2;
    const t = hh < 60 ? [C,X,0] : hh < 120 ? [X,C,0] : hh < 180 ? [0,C,X]
            : hh < 240 ? [0,X,C] : hh < 300 ? [X,0,C] : [C,0,X];
    return [t[0]+M, t[1]+M, t[2]+M];
  };
  const okLhsl = (sv, lv) => okL(...hsl2rgb(sv, lv));
  const fL    = okL(Math.min(1, r*0.732), Math.min(1, g*0.732), Math.min(1, b*0.732));
  const light = fL < 0.56;
  const tgt   = light ? Math.min(Math.max(fL + 0.30, 0.80), 0.88)
                      : Math.min(Math.max(fL - 0.40, 0.28), 0.42);
  const RS = SC*0.14;
  let lo = 0, hi = 100;
  for(let i=0;i<22;i++){ const mid=(lo+hi)/2; if(okLhsl(RS, mid) < tgt) lo=mid; else hi=mid; }
  const SL = (lo + hi)/2;                  // the room
  const ML = light ? 14 : 95;              // and what a mark on it is made in
  /* the part keeps its own lightness - it is the one thing on the sheet
     at full strength - and the faces are spread either side of it */
  const DL = Math.min(Math.max(l*100, 12), 88);
  return {
    bg:   hsl(RS, SL),
    pool: hsl(RS*0.8, light ? SL - 4 : SL + 5),
    part: hsl(S0, DL),
    top:  hsl(S0*0.94, Math.min(DL + 10, 96)),
    side: hsl(S0, DL - 2),
    end:  hsl(S0*1.00, Math.max(DL - 12, 4)),
    line: hsl(SC*0.20, ML),
    dim:  hsl(SC*0.18, light ? 34 : 64),
    text: hsl(SC*0.16, ML),
    faint:hsl(SC*0.20, light ? 42 : 48)
  };
}

/* ── The sheet ──────────────────────────────────────────────────────
   A photograph of the part, the front elevation with its figures, and
   an isometric - each centred in its own panel, and the figures given
   room to stand off the drawing instead of crowding it.
   ══════════════════════════════════════════════════════════════════ */
function elevationSVG(){
  const pal  = sheetPal(S.col);
  const name = (typeof finName === 'function') ? finName(S.col) : 'Raw';
  const OA   = S.Lx + (JOINT + LEGT)*2;                 // over the legs
  const legD = Math.max(S.Ly + LEGDEEP, 10);            // the leg is set in

  const W = 2200, M = 110, GAP = 84;
  const rowA = { y:176, h:700 };
  const rowB = { y:rowA.y + rowA.h + 96, h:560 };
  const H    = rowB.y + rowB.h + 118;
  const cw   = (W - M*2 - GAP)/2;

  const F  = 'font-family="Helvetica Neue,Helvetica,Arial,sans-serif"';
  const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const text = (x, y, t, size, fill, opt) =>
    '<text ' + F + ' x="' + (+x).toFixed(1) + '" y="' + (+y).toFixed(1) + '" font-size="' + size +
    '" fill="' + fill + '"' + (opt || '') + '>' + t + '</text>';

  /* No pixel size on the root, only the box the sheet is drawn in. A
     viewer handed 2200 by 1650 pixels shows you 2200 by 1650 pixels and
     leaves you panning around it; handed a ratio, every one of them
     fits the sheet to the window instead, and Illustrator still opens
     an artboard the size of the viewBox. */
  let s = '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ' +
          'viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="100%" ' +
          'preserveAspectRatio="xMidYMid meet">';
  // the flood
  s += '<rect width="100%" height="100%" fill="' + pal.bg + '"/>';

  /* ── the heading ── */
  s += text(M, 92, 'MALLEABLE CT1', 46, pal.text, ' letter-spacing="5" font-weight="500"');
  s += text(M, 132, esc(name.toUpperCase()), 24, pal.faint, ' letter-spacing="7"');

  /* ── 1 · the photograph ──────────────────────────────────────────
     The canvas as it stands, pasted on the sheet. It brings its own
     light ground with it, which is the point: a print sitting on a
     table, not a cut-out. */
  const sx = W - M - 470;                  // the figures keep the right margin
  const cardW = sx - M - 92;               // and the photograph takes the rest
  try {
    draw();
    /* A canvas can be a retina one and the sheet does not need that
       many pixels. It goes out as a photograph rather than a PNG
       because the render is dithered at the last step, and dither is
       exactly the thing lossless compression cannot do anything with -
       the same picture costs five megabytes one way and three hundred
       kilobytes the other. */
    const MAXPX = 1600;
    let src = cvs;
    if(cvs.width > MAXPX){
      src = document.createElement('canvas');
      src.width = MAXPX;
      src.height = Math.max(1, Math.round(cvs.height*MAXPX/cvs.width));
      const g2 = src.getContext('2d');
      g2.imageSmoothingQuality = 'high';
      g2.drawImage(cvs, 0, 0, src.width, src.height);
    }
    const url = src.toDataURL('image/jpeg', 0.92);
    /* The card is the same size whatever shape the viewport is, and the
       picture sits inside it - the ground it brings with it is the same
       dark room the sheet is, so the two meet without a seam. */
    /* The card is cut to the picture's own proportions rather than the
       picture being letterboxed into the card: a band of flat colour
       beside a photograph is a seam however carefully it is matched,
       because the encoder will not hand back the exact tone it was
       given. No band, no seam. */
    const ar = cvs.width/Math.max(cvs.height, 1);
    let iw = cardW, ih = cardW/ar;
    if(ih > rowA.h){ ih = rowA.h; iw = rowA.h*ar; }
    const iy = rowA.y + (rowA.h - ih)/2;
    const box = ' x="' + M + '" y="' + iy.toFixed(1) + '" width="' + iw.toFixed(1) +
                '" height="' + ih.toFixed(1) + '"';
    s += '<image' + box + ' preserveAspectRatio="none" href="' + url + '" xlink:href="' + url + '"/>';
    s += '<rect' + box + ' rx="10" fill="none" stroke="' + pal.faint + '" stroke-width="1"/>';
  } catch(e){}

  /* ── the figures, alongside ── */
  let sy = rowA.y + 54;
  const spec = [
    ['HEIGHT',          inch(S.H) + ' in',        Math.round(S.H) + ' mm'],
    ['WIDTH',           inch(S.Lx) + ' in',       Math.round(S.Lx) + ' mm'],
    ['DEPTH',           inch(S.Ly) + ' in',       Math.round(S.Ly) + ' mm'],
    ['OVER THE LEGS',   inch(OA) + ' in',         Math.round(OA) + ' mm'],
    ['CLEAR UNDER TOP', inch(clearUnder()) + ' in', Math.round(clearUnder()) + ' mm'],
    ['SHELF DROP',      inch(S.drop) + ' in',     Math.round(S.drop) + ' mm'],
    ['LAYERS',          layers() + '',            LAYER.toFixed(1) + ' mm pitch']
  ];
  for(const [k, v, m] of spec){
    s += text(sx, sy, k, 19, pal.faint, ' letter-spacing="3"');
    s += text(sx, sy + 38, v, 34, pal.text);
    s += text(sx + 190, sy + 38, m, 22, pal.dim);
    s += '<line x1="' + sx + '" y1="' + (sy + 62) + '" x2="' + (sx + 420) + '" y2="' + (sy + 62) +
         '" stroke="' + pal.faint + '" stroke-width="1" opacity="0.45"/>';
    sy += 92;
  }

  /* ── the two panels ── */
  const cellL = { x:M, y:rowB.y, w:cw, h:rowB.h };
  const cellR = { x:M + cw + GAP, y:rowB.y, w:cw, h:rowB.h };
  for(const c of [cellL, cellR])
    s += '<rect x="' + c.x + '" y="' + c.y + '" width="' + c.w + '" height="' + c.h +
         '" rx="10" fill="' + pal.pool + '"/>';

  /* Centre a drawing in its panel: the extent handed in is everything
     that has to fit, the figures included, so nothing can run off. */
  const fit = (ext, c, pad) => {
    const k = Math.min((c.w - pad*2)/Math.max(ext[2]-ext[0], 1e-6),
                       (c.h - pad*2)/Math.max(ext[3]-ext[1], 1e-6));
    return { k, ox:c.x + c.w/2 - (ext[0]+ext[2])/2*k, oy:c.y + c.h/2 - (ext[1]+ext[3])/2*k };
  };

  /* ── 2 · the front elevation ─────────────────────────────────────
     Model x across, model z up. The figures stand a good way off the
     part - a dimension crowding the thing it measures is the quickest
     way to make a drawing look careless. */
  const big  = Math.max(S.H, OA);
  const DIMG = big*0.125;                // part to witness line
  const TXTG = big*0.085;                // witness line to its figure
  const eExt = [-OA/2 - DIMG - TXTG, -big*0.05, OA/2 + DIMG + TXTG, S.H + DIMG + TXTG];
  const LBL = 40;                        // the strip the view's name sits in
  const ef = fit(eExt, { x:cellL.x, y:cellL.y, w:cellL.w, h:cellL.h - LBL }, 38);
  const EX = x => ef.ox + ef.k*x;
  const EY = z => ef.oy + ef.k*(S.H - z);

  const ln = 'fill="' + pal.part + '" stroke="' + pal.line + '" stroke-width="' + (1.9).toFixed(2) + '"';
  const hair = 'fill="none" stroke="' + pal.line + '" stroke-width="1" opacity="0.5"';
  const box = (x0, z0, x1, z1, rx, attr) =>
    '<rect x="' + EX(x0).toFixed(2) + '" y="' + EY(z1).toFixed(2) +
    '" width="' + ((x1-x0)*ef.k).toFixed(2) + '" height="' + ((z1-z0)*ef.k).toFixed(2) +
    '" rx="' + (rx*ef.k).toFixed(2) + '" ' + attr + '/>';

  // the ground
  s += '<line x1="' + EX(-OA/2 - DIMG*0.3).toFixed(2) + '" y1="' + EY(0).toFixed(2) +
       '" x2="' + EX(OA/2 + DIMG*0.3).toFixed(2) + '" y2="' + EY(0).toFixed(2) +
       '" stroke="' + pal.faint + '" stroke-width="1.5"/>';
  // the two deck tubes, seen on their long side
  for(const zc of [zTop(), zShelf()])
    s += box(-S.Lx/2, zc - DECKT*0.5, S.Lx/2, zc + DECKT*0.5, PIPE, ln);
  // the legs, standing outboard with every edge round
  for(const sgn of [-1, 1]){
    const x0 = sgn > 0 ? S.Lx/2 + JOINT : -(S.Lx/2 + JOINT + LEGT);
    s += box(x0, 0, x0 + LEGT, S.H, RLEG + PIPE, ln);
    // the bore you look straight into from the front
    s += box(x0 + PIPE*2, PIPE*2, x0 + LEGT - PIPE*2, S.H - PIPE*2, 0.5, hair);
  }

  /* the figures */
  const dim = (x1, y1, x2, y2, label, tx2, ty, vert) => {
    const a = 11;
    let d = '<g stroke="' + pal.dim + '" stroke-width="1.4" fill="' + pal.dim + '">';
    d += '<line x1="' + x1.toFixed(2) + '" y1="' + y1.toFixed(2) + '" x2="' + x2.toFixed(2) +
         '" y2="' + y2.toFixed(2) + '"/>';
    if(vert){
      d += '<path d="M' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' l' + (-a/2) + ' ' + a + ' h' + a + ' z" stroke="none"/>';
      d += '<path d="M' + x2.toFixed(2) + ' ' + y2.toFixed(2) + ' l' + (-a/2) + ' ' + (-a) + ' h' + a + ' z" stroke="none"/>';
    } else {
      d += '<path d="M' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' l' + a + ' ' + (-a/2) + ' v' + a + ' z" stroke="none"/>';
      d += '<path d="M' + x2.toFixed(2) + ' ' + y2.toFixed(2) + ' l' + (-a) + ' ' + (-a/2) + ' v' + a + ' z" stroke="none"/>';
    }
    d += '</g>';
    d += text(tx2, ty, label, 27, pal.text,
              ' text-anchor="middle"' + (vert ? ' transform="rotate(-90 ' + tx2.toFixed(1) + ' ' + ty.toFixed(1) + ')"' : ''));
    return d;
  };
  const wl = EX(-OA/2 - DIMG), wr = EX(OA/2 + DIMG), wb = EY(-DIMG);
  s += dim(wl, EY(S.H), wl, EY(0), inch(S.H) + ' in', wl - 16, (EY(S.H)+EY(0))/2, true);
  s += dim(wr, EY(zShelf()), wr, EY(0), inch(zShelf()) + ' in', wr + 34, (EY(zShelf())+EY(0))/2, true);
  s += dim(EX(-S.Lx/2), wb, EX(S.Lx/2), wb, inch(S.Lx) + ' in', EX(0), wb + 42, false);
  s += text(cellL.x + cellL.w/2, cellL.y + cellL.h - 24, 'FRONT ELEVATION', 19, pal.faint,
            ' letter-spacing="5" text-anchor="middle"');

  /* ── 3 · the isometric ───────────────────────────────────────────
     True isometric, 30 degrees each way, drawn back to front: the far
     leg, the shelf, the top, the near leg. Three tones - the room
     overhead on the top face, and the two sides falling away from the
     light, which is where the left one is. */
  const C30 = Math.cos(Math.PI/6);
  const iu = (x, y) => (x - y)*C30;
  const iv = (x, y, z) => (x + y)*0.5 - z;
  const X0 = -OA/2, X1 = OA/2, Y0 = -S.Ly/2, Y1 = S.Ly/2, Z1 = S.H;
  const gz = Math.max(S.H, OA)*0.14;     // how far the figures stand off
  const bx = [X0, X1], byy = [Y0, Y1 + gz*1.4], bz = [-gz*1.4, Z1];
  let ie = [1e9, 1e9, -1e9, -1e9];
  for(const x of bx) for(const y of byy) for(const z of bz){
    const u = iu(x,y), v = iv(x,y,z);
    ie = [Math.min(ie[0],u), Math.min(ie[1],v), Math.max(ie[2],u), Math.max(ie[3],v)];
  }
  const jf = fit(ie, { x:cellR.x, y:cellR.y, w:cellR.w, h:cellR.h - LBL }, 50);
  const PU = (x,y) => jf.ox + jf.k*iu(x,y);
  const PV = (x,y,z) => jf.oy + jf.k*iv(x,y,z);
  const poly = (pts, fill) => '<path d="M' + pts.map(p => PU(p[0],p[1]).toFixed(2) + ' ' +
      PV(p[0],p[1],p[2]).toFixed(2)).join(' L') + ' Z" fill="' + fill + '" stroke="' + pal.line +
      '" stroke-width="1.1" stroke-linejoin="round"/>';
  /* +y lands on the left of the picture and +x on the right, so the
     left face takes the lighter of the two sides. */
  const isoBox = (x0,y0,z0, x1,y1,z1) =>
    poly([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]], pal.side) +   // left
    poly([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]], pal.end) +    // right
    poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]], pal.top);     // top
  const ld = legD/2, dy = S.Ly/2, zt = zTop(), zs = zShelf();
  // far leg, shelf, top, near leg
  s += isoBox(-(S.Lx/2 + JOINT + LEGT), -ld, 0, -(S.Lx/2 + JOINT), ld, S.H);
  s += isoBox(-S.Lx/2, -dy, zs - DECKT/2, S.Lx/2, dy, zs + DECKT/2);
  s += isoBox(-S.Lx/2, -dy, zt - DECKT/2, S.Lx/2, dy, zt + DECKT/2);
  s += isoBox(S.Lx/2 + JOINT, -ld, 0, S.Lx/2 + JOINT + LEGT, ld, S.H);

  /* The figures lie down with the axis they measure - one standing
     upright on an isometric reads as a label, not as a dimension. The
     x line runs off at thirty degrees, the y line at thirty the other
     way, and height is the one direction that is still vertical. */
  const iline = (p, q, w, op) =>
    '<line x1="' + PU(p[0],p[1]).toFixed(2) + '" y1="' + PV(p[0],p[1],p[2]).toFixed(2) +
    '" x2="' + PU(q[0],q[1]).toFixed(2) + '" y2="' + PV(q[0],q[1],q[2]).toFixed(2) +
    '" stroke="' + pal.dim + '" stroke-width="' + w + '"' + (op || '') + '/>';
  const itick = (p, d) => {
    const t = 8, x = PU(p[0],p[1]), y = PV(p[0],p[1],p[2]);
    return '<line x1="' + (x - d[0]*t).toFixed(2) + '" y1="' + (y - d[1]*t).toFixed(2) +
           '" x2="' + (x + d[0]*t).toFixed(2) + '" y2="' + (y + d[1]*t).toFixed(2) +
           '" stroke="' + pal.dim + '" stroke-width="1.8"/>';
  };
  const idim = (a, b, wa, wb, label, rot, d) => {
    let o = iline(wa, a, 1, ' opacity="0.55"') + iline(wb, b, 1, ' opacity="0.55"');
    o += iline(a, b, 1.4) + itick(a, d) + itick(b, d);
    const mx = (PU(a[0],a[1]) + PU(b[0],b[1]))/2, my = (PV(a[0],a[1],a[2]) + PV(b[0],b[1],b[2]))/2;
    o += text(mx, my, label, 23, pal.text, ' dy="-13" text-anchor="middle" transform="rotate(' +
              rot + ' ' + mx.toFixed(1) + ' ' + my.toFixed(1) + ')"');
    return o;
  };
  const K = 0.866025;
  // over the legs, along x, below the part
  s += idim([X0, Y1, -gz], [X1, Y1, -gz], [X0, Y1, 0], [X1, Y1, 0],
            inch(OA) + ' in', 30, [-0.5, K]);
  // the depth, along y, meeting it at the near corner
  s += idim([X1, Y0, -gz], [X1, Y1, -gz], [X1, Y0, 0], [X1, Y1, 0],
            inch(S.Ly) + ' in', -30, [-0.5, -K]);
  // and the height, which is the one line that stays upright
  s += idim([X0, Y1 + gz, 0], [X0, Y1 + gz, Z1], [X0, Y1, 0], [X0, Y1, Z1],
            inch(S.H) + ' in', -90, [1, 0]);

  s += text(cellR.x + cellR.w/2, cellR.y + cellR.h - 24, 'ISOMETRIC', 19, pal.faint,
            ' letter-spacing="5" text-anchor="middle"');

  /* ── the footer ── */
  s += text(M, H - 50, Math.round(S.H) + ' &#215; ' + Math.round(S.Lx) + ' &#215; ' + Math.round(S.Ly) +
            ' mm &#183; ' + layers() + ' layers at ' + LAYER.toFixed(1) + ' mm &#183; ' + esc(name),
            22, pal.dim);
  s += text(W - M, H - 50, 'noahtaylor.co', 22, pal.faint, ' text-anchor="end"');
  s += '</svg>';
  return s;
}
function saveSVG(){
  download("malleable-ct1-sheet.svg", new Blob([elevationSVG()], { type:'image/svg+xml' }));
  say('Sheet out');
}

/* ══════════════════════════════════════════════════════════════════
   10 · OPTIONS + INSPECTOR
   ══════════════════════════════════════════════════════════════════ */
const optsEl = document.getElementById('opts');
const panel = document.getElementById('panel');
const el = (tag,cls,html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; };

function buildOpts(){
  optsEl.innerHTML = '';
  optsEl.appendChild(el('div','tname','Malleable CT1'));
  /* the figures come first, because while a leg is moving under your
     hand this is the only place they are */
  const g0 = el('div','ogrp');
  for(const k of ['H','Lx','Ly','Z']){
    g0.appendChild(el('label',null, DIMS[k].label));
    const o = el('output',null,''); o.id = 'o-'+k; g0.appendChild(o);
  }
  optsEl.appendChild(g0);
  syncOpts();
}
function syncOpts(){
  for(const k of ['H','Lx','Ly','Z']){
    const o = document.getElementById('o-'+k);
    if(o) o.textContent = inch(dimVal(k)) + '"';
  }
}
function numRow(parent, key){
  const row = el('div','row');
  row.appendChild(el('label',null, DIMS[key].label));
  const i = document.createElement('input');
  i.type = 'number'; i.className = 'num'; i.step = '0.1'; i.id = 'n-' + key;
  i.value = inch(dimVal(key));
  i.setAttribute('aria-label', DIMS[key].label);
  let nd = null;
  i.addEventListener('pointerdown', e => {
    if(document.activeElement === i) return;
    e.preventDefault();
    nd = { x:e.clientX, v:dimVal(key) };
    i.setPointerCapture(e.pointerId);
  });
  i.addEventListener('pointermove', e => {
    if(!nd) return;
    const dx = e.clientX - nd.x;
    if(Math.abs(dx) > 1){ nd.moved = true; setDim(key, nd.v + dx*1.27); sync(); }
  });
  i.addEventListener('pointerup', () => {
    if(nd && !nd.moved){ i.focus(); i.select(); } else if(nd){ snap(); fitView(); }
    nd = null;
  });
  const commit = () => { const v = parseFloat(i.value); if(isFinite(v)){ setDim(key, v*IN); snap(); fitView(); } sync(); };
  i.addEventListener('change', commit);
  i.addEventListener('blur', commit);
  i.addEventListener('keydown', e => { if(e.key === 'Enter') i.blur(); });
  row.append(i, el('span','unit','in'));
  parent.appendChild(row);
  /* and the same figure as a rule with a bead on it, for a thumb or a
     mouse that would rather sweep than type */
  const sl = document.createElement('input');
  sl.type = 'range'; sl.step = '1'; sl.id = 's-' + key;
  sl.setAttribute('aria-label', DIMS[key].label);
  sl.addEventListener('input', () => { setDim(key, parseFloat(sl.value)); sync(); });
  sl.addEventListener('change', () => { snap(); fitView(); });
  const sr = el('div','slrow'); sr.appendChild(sl);
  parent.appendChild(sr);
}
/* what each slider may run between - the shelf's window moves with the
   height, so it is set every time rather than once */
function slRange(key){
  if(key === 'H')  return [HMIN, HMAX];
  if(key === 'Z')  return [FOOT, Math.max(FOOT, zTop() - DROPMIN)];
  return [LMIN, LMAX];
}
function sect(title){
  const s = el('div','sect');
  if(title) s.appendChild(el('h2',null,title));
  panel.appendChild(s);
  return s;
}
function button(parent, label, fn){
  const b = document.createElement('button');
  b.type='button'; b.className='btn'; b.textContent=label; b.onclick=fn;
  parent.appendChild(b);
}
function buildPanel(){
  panel.innerHTML = '';
  const s0 = sect('Type');
  const gp = el('div','gridw'); gp.id = 'seg-preset';
  for(const p of PRESETS){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.textContent = p[0]; b.dataset.name = p[0];
    b.onclick = () => applyPreset(p);
    gp.appendChild(b);
  }
  s0.appendChild(gp);
  const s1 = sect('Size');
  numRow(s1,'H'); numRow(s1,'Lx'); numRow(s1,'Ly'); numRow(s1,'Z');
  const h1 = el('p','hint',''); h1.id = 'h-size'; s1.appendChild(h1);

  const sf = sect('Finish');
  const swg = el('div','swg'); swg.id = 'swatches';
  FIN.forEach((c, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw' + (c.hex ? '' : ' raw');
    b.dataset.i = i; b.title = c.name;
    b.setAttribute('aria-label', c.name);
    if(c.hex) b.style.background = c.hex;
    b.onclick = () => setFinish(c.hex);
    swg.appendChild(b);
  });
  sf.appendChild(swg);
  const hf = el('p','hint',''); hf.id = 'h-fin'; sf.appendChild(hf);

  const s2 = sect('View'); s2.classList.add('wide');
  const seg = el('div','seg'); seg.id = 'seg-view';
  const mk = (lbl, fn, tag) => {
    const b = document.createElement('button');
    b.type='button'; b.textContent=lbl; b.dataset.tag = tag; b.onclick = fn;
    seg.appendChild(b);
  };
  mk('Iso', goIso, 'iso');
  mk('Front', () => goFace('F'), 'F');
  mk('End', () => goFace('R'), 'R');
  mk('Plan', goPlan, 'plan');
  const r2 = el('div','row'); r2.appendChild(seg); s2.appendChild(r2);
  const h2 = el('p','hint',''); h2.id = 'h-view'; s2.appendChild(h2);

  const s3 = sect('Out'); s3.classList.add('wide');
  const g2 = el('div','grid2');
  button(g2,'Sheet', saveSVG);
  button(g2,'PNG', savePNG);
  s3.appendChild(g2);
  s3.appendChild(el('p','hint','Read off the reference toolpath. A ' + (PIPE*2) +
    ' mm pipe on every curve, stacked at ' + LAYER + ' mm. Deck loop ' + DECKSP +
    ' mm across (' + DECKT + ' over), leg loop ' + LEGSP + ' mm (' + LEGT +
    ' over). Return ' + RETL + ' mm off the run.<br><br>' +
    'Each piece prints as a wall on edge, and the legs stand the opposite way to the sheets: ' +
    'the bead climbs through the depth of a leg and along the length of a sheet.'));
  syncPanel();
}
function syncPanel(){
  for(const k of ['H','Lx','Ly','Z']){
    const i = document.getElementById('n-'+k);
    if(i && document.activeElement !== i) i.value = inch(dimVal(k));
    const sl = document.getElementById('s-'+k);
    if(sl){
      const [lo, hi] = slRange(k);
      sl.min = lo.toFixed(1); sl.max = hi.toFixed(1);
      if(document.activeElement !== sl) sl.value = dimVal(k).toFixed(1);
    }
  }
  const gp = document.getElementById('seg-preset');
  if(gp) gp.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(presetOn(PRESETS.find(p => p[0] === b.dataset.name)))));
  const h1 = document.getElementById('h-size');
  if(h1) h1.innerHTML = Math.round(S.H) + ' &times; ' + Math.round(S.Lx) + ' &times; ' + Math.round(S.Ly) +
    ' mm &middot; ' + inch(S.Lx + (JOINT + LEGT)*2) + ' in over the legs<br>' + inch(clearUnder()) +
    ' in clear under the top &middot; shelf ' + inch(S.drop) + ' in down &middot; ' + layers() + ' layers';
  const swg = document.getElementById('swatches');
  if(swg) swg.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', String(FIN[+b.dataset.i].hex === S.col)));
  const hf = document.getElementById('h-fin');
  if(hf) hf.textContent = S.col
    ? finName(S.col) + ' throughout, legs and all - and the whole site goes the room it is standing in.'
    : 'No pigment - the print as it comes off the machine, on paper.';
  const seg = document.getElementById('seg-view');
  if(seg) seg.querySelectorAll('button').forEach(b => {
    const t = b.dataset.tag;
    b.setAttribute('aria-pressed', String(
      t === 'iso' ? (!S.face && !S.plan && atIso()) : t === 'plan' ? S.plan : S.face === t));
  });
  const h2 = document.getElementById('h-view');
  if(h2) h2.textContent = S.plan ? 'Looking down on the loops.'
    : S.face ? 'Square on to the ' + FACES[S.face].name.toLowerCase() + '.'
    : 'Click any face in the view to square up to it.';
}
/* how much room there is between the shelf and the underside of the top */
const clearUnder = () => (zTop() - DECKT*0.5) - (zShelf() + DECKT*0.5);

/* ══════════════════════════════════════════════════════════════════
   11 · SYNC + FRAME
   ══════════════════════════════════════════════════════════════════ */
function setHint(){
  if(glErr){ document.getElementById('hint').textContent =
    'The view could not be built here: ' + glErr; return; }
  if(innerWidth <= 880){
    document.getElementById('hint').textContent =
      'Pull the table to resize it — drag off it to turn.';
    return;
  }
  document.getElementById('hint').textContent =
    'Pull a leg to make it longer — a sheet\'s edge to make it deeper — the top to raise the table — the shelf to move it. Drag off the table to turn it.';
}
function sync(){
  syncOpts();
  document.getElementById('st-in').textContent =
    inch(S.H) + ' × ' + inch(S.Lx) + ' × ' + inch(S.Ly) + ' in';
  document.getElementById('st-mm').textContent =
    Math.round(S.H) + ' × ' + Math.round(S.Lx) + ' × ' + Math.round(S.Ly) + ' mm';
  document.getElementById('st-shelf').textContent =
    inch(zShelf()) + ' in up, ' + inch(clearUnder()) + ' in clear';
  document.getElementById('st-view').textContent =
    S.plan ? 'PLAN' : S.face ? FACES[S.face].name + ' ELEVATION' : atIso() ? 'ISOMETRIC' : 'FREE';
  syncPanel();
}
let prev = performance.now();
const ease = (c,t,dt,tau) => c + (t-c)*(1 - Math.exp(-dt/tau));
function frame(t){
  const dt = Math.min(0.05, (t-prev)/1000) || 0.016;
  prev = t;
  resize();
  const tau = (drag && drag.kind === 'orbit') ? 0.05 : 0.17;
  A.az = ease(A.az, S.az, dt, tau);
  A.el = ease(A.el, S.el, dt, tau);
  A.scale = ease(A.scale, S.scale, dt, 0.08);
  A.tx = ease(A.tx, S.tx, dt, 0.08);
  A.ty = ease(A.ty, S.ty, dt, 0.08);
  A.tz = ease(A.tz, S.tz, dt, 0.08);
  try{ draw(); rulers(); }
  catch(err){ if(!frame.cried){ frame.cried = true; console.error(err); say('Something went wrong drawing that frame'); } }
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════════
   12 · KEYBOARD
   ══════════════════════════════════════════════════════════════════ */
addEventListener('keydown', e => {
  const t = e.target || document.body;
  const tag = (t.tagName||'').toLowerCase();
  if(t.isContentEditable || tag === 'textarea' || (tag === 'input' && t.type !== 'checkbox' && t.type !== 'range')){
    if(e.key === 'Escape') t.blur();
    return;
  }
  if(e.code === 'Space'){ spaceDown = true; viewEl.style.cursor = 'grab'; e.preventDefault(); return; }
  if(e.metaKey || e.ctrlKey){
    if(e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    return;
  }
  const k = e.key.toLowerCase();
  if(k === 'f'){ fitView(); say('Fit'); return; }
  if(k === 'p'){ goPlan(); return; }
  if(e.key === 'Escape'){ goIso(); return; }
});
addEventListener('keyup', e => { if(e.code === 'Space'){ spaceDown = false; setCursor(); } });
addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button');
  if(b) b.blur();
});
document.getElementById('drawer').onclick = () => panel.classList.toggle('open');
let reflow = 0;
addEventListener('resize', () => {
  buildOpts(); setHint();
  clearTimeout(reflow);
  reflow = setTimeout(() => { resize(); if(!userFramed) fitView(); sync(); }, 140);
});

/* ══════════════════════════════════════════════════════════════════
   13 · BOOT
   ══════════════════════════════════════════════════════════════════ */
resize();
document.documentElement.setAttribute('data-theme','light');
fitView();
A.scale = S.scale; A.tx = S.tx; A.ty = S.ty; A.tz = S.tz;
buildOpts();
buildPanel();
setHint(); setCursor();
snap(); sync();
requestAnimationFrame(frame);

})();
</script>
